ют допустимых переходов и владельца решения.\u003c/p\u003e\u003cp\u003eКомпенсация — новая бизнес-операция, а не откат времени. Освобождение резерва может быть почти симметрично резервированию, возврат денег может идти несколько дней, а уже переданную посылку нельзя отменить сменой поля. Некоторые шаги необратимы или требуют человека. Поэтому порядок шагов выбирают с учётом риска: где возможно, необратимый эффект откладывают до проверки условий. У каждой компенсации есть собственные идентификатор, повторы, срок и состояние ошибки.\u003c/p\u003e\u003cp\u003eПри оркестрации явный координатор знает шаг, срок и следующий переход. Это облегчает разбор, но требует устойчивого состояния координатора. При хореографии сервисы реагируют на события без единого управляющего компонента. Она может уменьшить прямую связанность, но длинный процесс легко становится скрытым циклом реакций. Для небольшой команды «Северного маршрута» явный процесс заказа понятнее. Выбор определяется прозрачностью ответственности, а не стремлением убрать любой центральный блок со схемы.\u003c/p\u003e"},{"title":"CQRS и event sourcing отвечают на разные вопросы","html":"\u003cp\u003eCQRS разделяет модель команд, изменяющих состояние, и модель запросов, удобную для чтения. Можно хранить заказ обычными строками PostgreSQL и строить отдельную проекцию «мои доставки». Это уже осмысленное разделение без отдельной базы и без журнала всех исторических событий. Причина — разная форма работы: команда проверяет инварианты, экран собирает данные из нескольких источников. Цена — поддержка дополнительной модели и, при асинхронном обновлении, отставание.\u003c/p\u003e\u003cp\u003eEvent sourcing делает последовательность доменных событий источником состояния. Текущее состояние восстанавливают применением фактов, например OrderPlaced и DeliveryAssigned. Это полезно при ценности истории решений и потребности в новых проекциях, но усложняет изменение схем событий, исправление ошибок, удаление чувствительных данных и воспроизведение старого поведения. Наличие audit log или Kafka рядом с обычной таблицей не означает event sourcing. Важен вопрос: что является авторитетной записью и из чего восстанавливается состояние.\u003c/p\u003e\u003cp\u003eПроекция должна знать версию или позицию применённого источника, чтобы замечать пропуски и корректно перестраиваться. Replay не должен снова списывать деньги: восстановление модели чтения отделяют от исполнения внешних команд. После подтверждения заказа клиент может временно не увидеть его в списке. Решения включают показ результата команды, ожидание нужной версии проекции или чтение авторитетного состояния для конкретного заказа. Это выбор пользовательской согласованности, а не доказательство, что CQRS «теряет данные».\u003c/p\u003e"},{"title":"CDC переносит изменения, а не объясняет их","html":"\u003cp\u003eCDC, change data capture, извлекает изменения базы для других систем. В PostgreSQL logical decoding интерпретирует журнал предварительной записи WAL и выдаёт изменения в понятной потребителю форме. Debezium может читать такие изменения и направлять записи outbox через Event Router. Здесь различаются транспорт и смысл: изменение строки orders само по себе ещё не говорит, произошло ли подтверждение, техническое исправление или миграция. Специальный outbox позволяет приложению зафиксировать доменное событие явно.\u003c/p\u003e\u003cp\u003eЗапуск CDC требует согласовать начальный snapshot, снимок данных, и последующий поток, следить за позицией чтения, доступом к журналу и сохранностью логов. Отставший replication slot способен удерживать WAL и наращивать диск. Удаление слота для освобождения места может потерять точку продолжения и потребовать нового снимка. Поэтому «мы просто включили CDC» означает новую эксплуатационную обязанность. Изменение схемы таблицы может затронуть потребителей, даже если публичный API не менялся.\u003c/p\u003e\u003cp\u003eOutbox через polling проще для небольшого объёма: relay захватывает порцию записей, публикует и помечает результат. Нужно избегать долгих блокировок и сохранять порядок там, где он важен. CDC снижает необходимость сканировать таблицу и подходит существующей платформе потоков, но вводит дополнительные компоненты. Ни один способ не отменяет повторы, совместимость события и корректность конечного эффекта. Архитектор выбирает минимальную цепочку, для которой команда умеет доказать восстановление после каждого окна падения.\u003c/p\u003e"},{"title":"Не путать повтор события с исправлением факта","html":"\u003cp\u003eЕсли в платеже ошибочно указали сумму в копейках как рубли, повторная публикация прежнего события не исправит смысл. Требуется явная корректировка с новой идентичностью, связью с исходным фактом и правилами применения. Подмена содержимого под прежним event_id опасна: часть потребителей уже запомнила идентификатор и пропустит «исправленный» вариант, другая часть применит его впервые.\u003c/p\u003e\u003cp\u003eПоэтому событие после публикации рассматривается как неизменяемый контракт. Исправление данных, отмена и компенсирующая операция получают собственный смысл. При этом не всякое исправление требует нового доменного события: техническая перестройка проекции может быть локальной. Различие определяется тем, меняется ли бизнес-факт или только его представление. Этот вопрос помогает не превратить поток в шум из всех SQL-обновлений и одновременно не потерять важную историю решений.\u003c/p\u003e"}],"workedExample":{"title":"Разбор: курьер не найден после оплаты","html":"\u003cp\u003eЗаказ №820 имеет резерв R20 на 30 минут и банковскую авторизацию A20 на 3200 рублей. Это учебные параметры. Оркестратор сохраняет шаг DeliveryRequested и идентификатор процесса S20. Запрос перевозчику несёт стабильный ключ D20. Через минуту перевозчик возвращает окончательный отказ: доступного транспорта нет. Процесс не просто ставит cancelled, а начинает компенсации с отдельными записями ReleaseReservation:R20 и VoidAuthorization:A20.\u003c/p\u003e\u003cp\u003eОсвобождение резерва фиксируется вместе с outbox-событием в базе склада. Банковская отмена авторизации уходит через адаптер; ответ теряется. S20 переходит в compensation_pending, потому что заказ уже не будет доставлен, но финансовое завершение ещё неизвестно. Пользователь видит отмену доставки и отдельно статус денег. Слияние этих статусов в один зелёный cancelled скрывало бы незавершённую обязанность перед клиентом.\u003c/p\u003e\u003cp\u003eRelay публикует ReleaseReservation дважды после своего падения. Получатель применяет событие и inbox в одной транзакции; повтор не увеличивает доступный остаток второй раз. Одновременно запоздалое событие DeliveryAssigned приходит после отказа. Координатор сверяет идентификатор попытки и версию процесса, не возобновляет отменённый заказ и отправляет отмену назначения как новую команду. Если перевозчик уже физически забрал груз, автоматический сценарий уступает исключению: прежний план компенсации больше не соответствует миру.\u003c/p\u003e\u003cp\u003eЧерез пять минут запрос состояния подтверждает отмену A20. Координатор закрывает денежную компенсацию и сохраняет доказательство внешнего результата. Проекция клиентского списка отстаёт на восемь секунд: она показывает прежнее «ищем курьера». Для открытого заказа API читает актуальный процесс либо ждёт нужную версию, а не отправляет повторное назначение ради совпадения экранов. Вся история восстанавливается из текущих таблиц и журнала переходов; это saga плюс CQRS-проекция, но не обязательно event sourcing. Для приёмки команда проверяет каждое окно между commit, publish, ack и внешним эффектом, а также повтор старого события после завершения компенсации.\u003c/p\u003e"},"expedition":{"world":"inventory","title":"Экспедиция: билет на последний спектакль","html":"\u003cp\u003eБилетная система продаёт конкретное место. В отличие от взаимозаменяемого товара, альтернативный экземпляр в той же партии может не существовать. Резерв имеет срок, а авторизация платежа может завершиться после него. Если место уже досталось другому, поздний успех нельзя исправить восстановлением исходного заказа. Нужен отказ в выдаче билета и денежная компенсация с понятным обещанием покупателю.\u003c/p\u003e\u003cp\u003eSaga здесь особенно зависит от порядка необратимых шагов. Пока место лишь удерживается, его можно освободить. После выпуска и проверки билета на входе компенсация продажи уже не возвращает событие назад. У системы есть граница, после которой автоматическая отмена недопустима. Она должна быть представлена состоянием и политикой, а не скрытым условием в обработчике. Внешние партнёры распространения добавляют свои подтверждения и задержки.\u003c/p\u003e\u003cp\u003eПереносится outbox для надёжного распространения факта продажи и отдельная проекция плана зала. Но план — витрина: последнюю проверку уникальности места выполняет авторитетная транзакция. Отставшая проекция может показать свободное место, однако не имеет права продать его второй раз. Event sourcing может дать богатую историю, но не заменяет инвариант эксклюзивного права на место. У этой экспедиции главное отличие от доставки — уникальность ресурса и жёсткая граница физического исполнения.\u003c/p\u003e","transfer":["Outbox и локальная атомарность","Компенсация как новая операция"],"distinct":["Незаменимое место","Необратимость после прохода"]},"diagrams":[{"title":"Data layout: атомарность outbox ограничена базой","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eОдна транзакция фиксирует два намеренных факта\u003c/text\u003e\u003crect x=\"25\" y=\"65\" width=\"445\" height=\"225\" rx=\"12\" fill=\"#f1f5f9\" stroke=\"#64748b\" stroke-dasharray=\"7 5\"/\u003e\u003ctext x=\"45\" y=\"98\" font-family=\"system-ui,sans-serif\" font-size=\"19\" fill=\"#203047\" text-anchor=\"start\"\u003ePostgreSQL · один COMMIT\u003c/text\u003e\u003crect x=\"50\" y=\"125\" width=\"170\" height=\"105\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"64\" y=\"153\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eorders\u003c/text\u003e\u003ctext x=\"64\" y=\"178\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003e820 · paid · v12\u003c/text\u003e\u003crect x=\"265\" y=\"125\" width=\"180\" height=\"105\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"279\" y=\"153\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eoutbox\u003c/text\u003e\u003ctext x=\"279\" y=\"178\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eE820 · paid\u003c/text\u003e\u003crect x=\"535\" y=\"125\" width=\"200\" height=\"105\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"549\" y=\"153\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eRelay\u003c/text\u003e\u003ctext x=\"549\" y=\"178\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003epolling или CDC\u003c/text\u003e\u003crect x=\"535\" y=\"325\" width=\"200\" height=\"70\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"549\" y=\"353\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eBroker\u003c/text\u003e\u003ctext x=\"549\" y=\"378\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eE820, возможно повтор\u003c/text\u003e\u003cline x1=\"445\" y1=\"177\" x2=\"535\" y2=\"177\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"535.0,177.0 527.1,181.3 527.1,172.7\" fill=\"#51657a\"/\u003e\u003cline x1=\"635\" y1=\"230\" x2=\"635\" y2=\"325\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"635.0,325.0 630.7,317.1 639.3,317.1\" fill=\"#51657a\"/\u003e\u003ctext x=\"35\" y=\"345\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eRollback: нет обоих изменений\u003c/text\u003e\u003ctext x=\"35\" y=\"385\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eCommit: состояние + намерение есть\u003c/text\u003e\u003ctext x=\"35\" y=\"425\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#b45309\" text-anchor=\"start\"\u003eВнешняя публикация — за границей\u003c/text\u003e","caption":"Orders и outbox записываются одной транзакцией. Relay находится за её границей и может повторить E820 после падения. CDC — способ переноса, а доменный смысл уже записан приложением."},{"title":"Failure flow: компенсации имеют собственный исход","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eSaga: отменённая доставка ещё не закрыла деньги\u003c/text\u003e\u003crect x=\"30\" y=\"75\" width=\"320\" height=\"75\" rx=\"10\" fill=\"#dcfce7\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"44\" y=\"103\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eРезерв R20\u003c/text\u003e\u003ctext x=\"44\" y=\"128\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eсоздан\u003c/text\u003e\u003crect x=\"405\" y=\"75\" width=\"320\" height=\"75\" rx=\"10\" fill=\"#dcfce7\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"419\" y=\"103\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eАвторизация A20\u003c/text\u003e\u003ctext x=\"419\" y=\"128\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eсоздана\u003c/text\u003e\u003crect x=\"220\" y=\"205\" width=\"320\" height=\"75\" rx=\"10\" fill=\"#fee2e2\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"234\" y=\"233\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eДоставка D20\u003c/text\u003e\u003ctext x=\"234\" y=\"258\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eокончательный отказ\u003c/text\u003e\u003crect x=\"30\" y=\"335\" width=\"320\" height=\"75\" rx=\"10\" fill=\"#dcfce7\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"44\" y=\"363\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eОсвободить R20\u003c/text\u003e\u003ctext x=\"44\" y=\"388\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eкомпенсация успешна\u003c/text\u003e\u003crect x=\"405\" y=\"335\" width=\"320\" height=\"75\" rx=\"10\" fill=\"#fff3cd\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"419\" y=\"363\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eОтменить A20\u003c/text\u003e\u003ctext x=\"419\" y=\"388\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eответ потерян · pending\u003c/text\u003e\u003cline x1=\"350\" y1=\"112\" x2=\"405\" y2=\"112\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"405.0,112.0 397.1,116.3 397.1,107.7\" fill=\"#51657a\"/\u003e\u003cline x1=\"565\" y1=\"150\" x2=\"470\" y2=\"205\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"470.0,205.0 474.7,197.3 479.0,204.8\" fill=\"#51657a\"/\u003e\u003cline x1=\"275\" y1=\"280\" x2=\"190\" y2=\"335\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"190.0,335.0 194.3,327.1 199.0,334.3\" fill=\"#51657a\"/\u003e\u003cline x1=\"475\" y1=\"280\" x2=\"565\" y2=\"335\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"565.0,335.0 556.0,334.6 560.5,327.2\" fill=\"#51657a\"/\u003e","caption":"После отказа доставки запускаются две новые операции. Локальный резерв освобождён, банковская отмена ещё выясняется. Отмена заказа не доказывает финансового завершения, а компенсация не является возвратом времени."}],"decision":{"prompt":"Как связать оплату с продолжением заказа?","options":[{"title":"Таблицы заказа, outbox и явный координатор","consequence":"Намерение не теряется при commit; процесс виден","tradeoff":"Повторы, компенсации и эксплуатация relay"},{"title":"Event sourcing для заказа и отдельные проекции","consequence":"История становится источником состояния","tradeoff":"Сложнее эволюция событий, replay и удаление данных"},{"title":"Синхронный процесс с таблицей шагов и сверкой","consequence":"Простая начальная реализация при малом числе партнёров","tradeoff":"Нельзя держать одну транзакцию на весь процесс; нужны восстановления"}],"recommended":0,"explanation":"Текущая боль — щель публикации и длинный процесс. История как источник состояния пока не даёт достаточной дополнительной выгоды."},"exercise":{"prompt":"Найдите ошибку: replay проекции вызывает RefundPayment.","model":"\u003cp\u003eПерестройка чтения не должна повторять внешние эффекты. RefundPayment — команда отдельного процесса с устойчивым идентификатором и правом исполнения, а не побочный эффект чтения истории.\u003c/p\u003e","rubric":["Разделены проекция и исполнение","Указана граница внешнего эффекта"]},"checkpoint":[{"question":"Что гарантирует outbox при правильной локальной транзакции?","options":["Совместную фиксацию состояния и намерения публикации","Одну физическую доставку брокером","Атомарный возврат денег в банке"],"answer":0,"explanation":"Relay и банк остаются отдельными системами, где возможны повторы и неопределённость."},{"question":"Можно ли использовать CQRS без event sourcing?","options":["Да, команды меняют обычные таблицы, чтение имеет отдельную модель","Нет, модель чтения обязательно восстанавливается из неизменяемого журнала","Да, но обязательно требуются две физически разные базы"],"answer":0,"explanation":"CQRS разделяет модели взаимодействия, event sourcing определяет источник состояния."}],"sources":[{"title":"Debezium, Outbox Event Router, stable documentation","url":"https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html"},{"title":"PostgreSQL, Logical Decoding Concepts","url":"https://www.postgresql.org/docs/current/logicaldecoding-explanation.html"},{"title":"Martin Fowler, CQRS, 14 июля 2011","url":"https://martinfowler.com/bliki/CQRS.html"},{"title":"Martin Fowler, Event Sourcing, 12 декабря 2005","url":"https://martinfowler.com/eaaDev/EventSourcing.html"}],"wordCount":1556},{"id":"ch-13","arc":4,"title":"Каталог уже не найти: индекс отбирает, ранжирование решает","briefing":"«Северный маршрут» объединяет каталоги нескольких поставщиков. Точный фильтр работает, но покупатель пишет «тёплая куртка ребёнку», делает опечатки и ждёт полезной выдачи. Источник истины заказа остаётся прежним.","goals":["Понять инвертированный индекс и воронку поиска","Отделять релевантность от бизнес-доступности","Выбирать модели хранения по запросам и цене изменений"],"sections":[{"title":"Почему индекс по названию не решает поиск","html":"\u003cp\u003eОбычный B-tree помогает найти значение или диапазон в порядке ключа. Поиск по смыслу текста решает другую задачу: запрос и документ нужно привести к сопоставимому представлению. Нормализация регистра, выделение токенов, морфология и словари превращают фразы в набор лексем. Инвертированный индекс связывает лексему со списком документов, где она встречается. Чтобы найти куртку, не требуется читать каждое название: система пересекает или объединяет подходящие списки.\u003c/p\u003e\u003cp\u003eОднако нормализация принимает продуктовые решения. Артикул AB-120 нельзя бездумно разбить как обычную фразу; «без сахара» нельзя трактовать так, чтобы отрицание исчезло. Синонимы помогают найти «пуховик» по запросу «куртка», но слишком широкий словарь показывает нерелевантное. У одного каталога нужны отдельные анализаторы для названия, описания, бренда и артикула. Проверка анализатора на реальных примерах важнее числа подключённых технологий.\u003c/p\u003e\u003cp\u003ePostgreSQL умеет полнотекстовое представление и специализированные индексы; небольшой каталог не обязан сразу переезжать в отдельный поисковый кластер. Усложнение оправдано конкретными требованиями: качество подсказок, устойчивое исправление опечаток, сложные фасеты, отдельное масштабирование чтения и независимая настройка ранжирования. Название NoSQL не объясняет ни качество поиска, ни стоимость обновления индекса. Сначала нужно понять тип запроса, затем выбрать подходящий механизм.\u003c/p\u003e"},{"title":"Воронка: дешёвая полнота, затем дорогая точность","html":"\u003cp\u003eПоиск обычно состоит из нескольких ступеней. Сначала относительно дешёвый механизм извлекает много кандидатов, чтобы не потерять полезные документы. Затем ранжирование упорядочивает их, используя больше признаков. Последний дорогой этап может учитывать контекст пользователя и выдачи. Если правильный товар не прошёл первый фильтр, умная финальная модель его не воскресит. Поэтому качество отбора и качество порядка измеряют отдельно.\u003c/p\u003e\u003cp\u003eУ «Северного маршрута» первый этап находит документы по тексту и обязательным ограничениям региона. Дешёвый скоринг учитывает совпадение названия, бренда и базовую популярность. Более дорогой этап для небольшого списка добавляет срок доставки, цену относительно категории и доступность поставщика. Это учебная конструкция, а не описание чужой системы. У каждого этапа есть бюджет времени, объём кандидатов и запасной режим при недоступности дополнительных признаков.\u003c/p\u003e\u003cp\u003eРеальный материал AvitoTech от 30 сентября 2024 года показывает многоступенчатую воронку: извлечение кандидатов, более дешёвое ранжирование, более тяжёлый следующий этап и учёт продвижения. Публикация также подчёркивает несколько интересов выдачи, включая интерес продавцов. Это датированный разбор конкретной задачи объявлений, не готовая архитектура нашего магазина и не утверждение о текущем устройстве Авито. Переносим сам принцип распределения вычислительной цены по воронке, а не чужие численные пороги.\u003c/p\u003e"},{"title":"Релевантность не равна продаже","html":"\u003cp\u003eТовар может идеально соответствовать тексту и быть недоступным по адресу. Поэтому обязательные ограничения отделяют от мягких предпочтений. Нельзя компенсировать отсутствие доставки высоким рейтингом. При этом жёсткий ранний фильтр по устаревшему остатку способен скрыть доступный товар. Команда решает, какие данные достаточно свежи для отбора и какие нужно подтвердить перед обещанием. Поисковый индекс — производная модель, а не финальный арбитр последнего экземпляра.\u003c/p\u003e\u003cp\u003eРанжирование объединяет неоднородные признаки. Популярность склонна усиливать уже популярное, свежесть помогает новым товарам, цена без нормализации по категории даёт странные сравнения. Если обучать модель только кликам, она может продвигать привлекательные карточки с плохим исполнением. «Северный маршрут» смотрит не только клики, но и успешные заказы, отмены из-за наличия, время до выбора и повторные формулировки запроса. Одна итоговая метрика не раскрывает причин ухудшения.\u003c/p\u003e\u003cp\u003eЕсть граница между бизнес-правилом и моделью. Платное продвижение должно иметь понятные ограничения релевантности, иначе краткосрочная выручка разрушит доверие к поиску. Объяснимые правила особенно полезны до накопления качественных данных. Для старта достаточно взвешенного ранга с явными коэффициентами и тестовым набором запросов. ML вводят, когда можно измерить преимущество и поддерживать обучение, а не ради обязательной «умности» каталога.\u003c/p\u003e"},{"title":"Индекс — копия, которую придётся перестроить","html":"\u003cp\u003eИзменение товара доходит до поискового представления асинхронно. Outbox или CDC из предыдущей главы переносит обновление, но не устраняет отставание. Событие получает product_id и версию. Если старое обновление пришло после нового, индекс не должен вернуть старую цену или воскресить удалённый товар. Удаление тоже факт, который нельзя потерять; маркер удаления (tombstone) и политика хранения версий требуют согласования с возможностью поздних сообщений.\u003c/p\u003e\u003cp\u003eСмена анализатора часто требует перестройки всего индекса: уже записанные лексемы не изменятся сами. Безопасный путь — построить новую версию рядом, загрузить снимок, догнать изменения, сравнить качество и переключить alias, псевдоним рабочего индекса, или маршрутизацию. Понадобятся дополнительное место и контроль нагрузки на источник. Переключение до догонки создаёт видимые исчезновения. Откат возможен, пока старая версия получает совместимые изменения и не утрачена её полезность.\u003c/p\u003e\u003cp\u003eПагинация также зависит от модели. При меняющемся ранге обычный offset может пропускать или повторять товары между страницами. Курсор со стабильным порядком и снимком выдачи улучшает предсказуемость, но требует срока жизни состояния и политики устаревания. Для витрины допустимы некоторые изменения, для выгрузки всех товаров клиенту нужна полнота. Один endpoint редко одинаково хорошо обслуживает интерактивный поиск и массовый экспорт.\u003c/p\u003e"},{"title":"NoSQL — набор компромиссов по доступу","html":"\u003cp\u003eДокументная модель хранит удобный агрегат товара с вложенными атрибутами, если его обычно читают целиком. Цена — дублирование общих данных и сложные изменения по множеству документов. Key-value модель быстро возвращает объект по известному ключу, но сама по себе не решает произвольные фильтры. Wide-column модель подходит запросам по заранее выбранным ключам и диапазонам, но требует проектировать размещение под доступ. Важно отличать wide-column от аналитического columnar-хранения: первое организует доступ вокруг ключей и групп связанных значений, второе физически группирует значения столбцов ради сканирования и агрегации. Сходство названий не делает Cassandra заменой аналитическому хранилищу. Поисковый индекс ориентирован на текст и ранжирование. Эти возможности не взаимозаменяемы одним переключателем SQL/NoSQL.\u003c/p\u003e\u003cp\u003eУ товара могут быть несколько представлений: авторитетные сведения в реляционной базе, поисковый документ в индексе и быстрая карточка в кэше. Это оправдано разными запросами, если есть ясное происхождение, версия и способ пересборки каждой копии. Если команда не может восстановить индекс из источника, копия незаметно стала вторым источником истины. Исправление данных только в поиске исчезнет при следующей перестройке и создаст труднообъяснимое расхождение.\u003c/p\u003e\u003cp\u003eОперационная цена включает резервные копии, обновления, мониторинг, тестирование анализаторов, место для перестройки и навыки дежурных. Для учебного каталога из двадцати тысяч товаров, при данном профиле запросов и подтверждённом измерениями бюджете задержки, PostgreSQL с полнотекстовым индексом и продуманным словарём может быть достаточен. Число товаров не является универсальным порогом. При сложных фильтрах и независимой нагрузке отдельный движок может выиграть. Решение должно иметь критерий пересмотра: измеренная задержка, качество запросов, отставание и стоимость поддержки. Масштаб в документах — лишь одна из осей.\u003c/p\u003e\u003cp\u003eГрафовая модель делает отношения самостоятельными объектами. Для «Северного маршрута» это мог бы быть обход цепочки «поставщик — склад — зона — перевозчик», поиск зависимостей или взаимосвязанных участников риска. В property graph, графе со свойствами, узлы и связи имеют атрибуты; traversal, обход, последовательно следует по разрешённым связям. Преимущество возникает, когда именно многозвенные отношения являются частым запросом. Цена — контроль глубины и объёма обхода, работа с высокосвязными узлами и отдельная модель согласованности при копировании данных. Графовая база не ускоряет автоматически любую связь и не заменяет текстовый ranking или транзакцию последнего товара. Для простого отношения заказа и строк обычная реляционная схема остаётся естественным выбором.\u003c/p\u003e"},{"title":"Тестовый запрос должен иметь объяснение","html":"\u003cp\u003eНабор оценки поиска хранит не только формулировку, но и причину, по которой результат считается хорошим. Для «куртка 128» это категория и размер, для артикула — точное совпадение, для «подарок завтра» — возможность исполнения в срок. Без объяснений очередное изменение словаря может улучшить среднюю оценку, незаметно разрушив важный сценарий. Редкие запросы тоже заслуживают отдельной выборки: именно там обычно мало данных для автоматического обучения.\u003c/p\u003e\u003cp\u003eПоведенческие логи смещены прежней выдачей. Товар, который никогда не показывали, не мог собрать клики, а высокая позиция сама повышает вероятность клика. Поэтому сравнение сырого CTR разных позиций не доказывает качество товара. Для стартового продукта полезна сочетанная проверка: экспертная разметка, анализ неудачных сессий и осторожный эксперимент. Это не заменяет моделирование, а даёт модели измеримую цель и ограничивает самоусиливающиеся ошибки.\u003c/p\u003e"}],"workedExample":{"title":"Разбор: «куртка 128» в новом регионе","html":"\u003cp\u003eВ каталоге 80 тысяч товаров, но по запросу «куртка 128» в новом регионе 60% показанных карточек нельзя заказать. Это учебная ситуация. Команда сначала подозревает ранжирование, затем разделяет этапы. Текстовый отбор находит 2400 документов, из них 600 относятся к детской одежде, 180 имеют размер 128, а только 45 обслуживают адрес. Дорогая модель, запущенная до проверки региона, тратила бюджет на заведомо невозможные варианты.\u003c/p\u003e\u003cp\u003eНовый конвейер сначала сохраняет полноту текстового отбора, затем применяет обязательные ограничения категории, размера и зоны. Из доступных кандидатов дешёвый ранг отбирает 100, дорогой этап получает фактический срок доставки для лучших 30. Если сервис ETA недоступен, применяется заранее определённый запасной ранг по региональному SLA, а интерфейс не обещает точное время. Артикулы обрабатываются отдельно: точное совпадение артикула получает собственный путь, чтобы морфология не ломала его.\u003c/p\u003e\u003cp\u003eОстаток обновляется с задержкой до 20 секунд. Поэтому число в поиске считается ориентиром. При добавлении в корзину можно уточнить доступность, а окончательное право на единицу выдаёт транзакционный резерв. Для товаров с крайне малым запасом команда снижает видимость либо показывает «подтвердим наличие» — это продуктовая цена устаревания. Попытка делать синхронный запрос остатков для всех 2400 документов разрушила бы задержку и перегрузила склад.\u003c/p\u003e\u003cp\u003eЧтобы проверить изменение, команда собирает набор из 200 запросов с опечатками, артикулами, размерами и неоднозначными категориями. Люди оценивают релевантность верхних позиций, система считает долю пустых выдач и отмен из-за наличия. После ограниченного запуска растёт число завершённых заказов при прежней задержке; одних кликов недостаточно. Новая версия анализатора строится рядом со старой, получает те же обновления и переключается после догонки. Разбор показывает: проблема решилась сочетанием модели данных, воронки и честной свежести, а не заменой базы по модному ярлыку.\u003c/p\u003e"},"expedition":{"world":"search","title":"Экспедиция: поиск работы","html":"\u003cp\u003eУ площадки вакансий запрос «аналитик без опыта удалённо» содержит несколько намерений. «Без опыта» — не просто отдельные слова, а ограничение требований; «удалённо» — формат работы; «аналитик» охватывает разные профессии. Документ вакансии меняется реже наличия товара, но закрытая вакансия должна достаточно быстро исчезнуть. Иначе полезный по тексту результат становится источником разочарования.\u003c/p\u003e\u003cp\u003eЗдесь в выдаче встречаются интересы кандидата и работодателя. Популярная вакансия может собрать много кликов, но почти не давать подходящих откликов. Ранжирование по кликам способно ухудшить подбор обеим сторонам. Нужны метрики содержательного контакта и ограничения на устаревшие, повторные или нерелевантные объявления. Продвижение допустимо внутри прозрачных условий качества, а не как отмена запроса кандидата.\u003c/p\u003e\u003cp\u003eИз доставки переносятся инвертированный индекс, многоступенчатая воронка, версия документа и отдельная проверка статуса при действии. Меняется бизнес-смысл окончательного подтверждения: отклик не резервирует вакансию эксклюзивно, и ресурс не расходуется единицами. Поэтому транзакция последнего товара не копируется буквально. Подход к поиску переносим, а модель конкуренции и успеха заново выводим из предметной области. Это помогает избежать системы, которая технически быстро ищет, но оптимизирует неправильный результат.\u003c/p\u003e","transfer":["Воронка и проверка релевантности","Производный индекс с версиями"],"distinct":["Двусторонний рынок","Нет эксклюзивного резерва вакансии"]},"diagrams":[{"title":"Data funnel: полнота раньше дорогого ranking","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eВоронка тратит дорогие вычисления на малый список\u003c/text\u003e\u003crect x=\"40\" y=\"70\" width=\"680\" height=\"80\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"54\" y=\"98\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eТекст + обязательные ограничения\u003c/text\u003e\u003ctext x=\"54\" y=\"123\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003e80 000 документов → 2400 кандидатов\u003c/text\u003e\u003crect x=\"100\" y=\"175\" width=\"560\" height=\"80\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"114\" y=\"203\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eРегион, категория, размер\u003c/text\u003e\u003ctext x=\"114\" y=\"228\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003e2400 → 180 → 45 доступных\u003c/text\u003e\u003crect x=\"175\" y=\"280\" width=\"410\" height=\"80\" rx=\"10\" fill=\"#dcfce7\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"189\" y=\"308\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eДешёвый и дорогой ранг\u003c/text\u003e\u003ctext x=\"189\" y=\"333\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eтекст, срок, цена, исполнение\u003c/text\u003e\u003cline x1=\"380\" y1=\"150\" x2=\"380\" y2=\"175\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"380.0,175.0 375.7,167.1 384.3,167.1\" fill=\"#51657a\"/\u003e\u003cline x1=\"380\" y1=\"255\" x2=\"380\" y2=\"280\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"380.0,280.0 375.7,272.1 384.3,272.1\" fill=\"#51657a\"/\u003e\u003ctext x=\"45\" y=\"420\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#b45309\" text-anchor=\"start\"\u003eНет кандидата в первом этапе → поздний ранг его не восстановит\u003c/text\u003e","caption":"Числа иллюстрируют учебный каталог, а не Авито. Жёсткие условия отделены от мягкого ранга. В зависимости от запроса этап может иметь меньше ста кандидатов; бюджеты не требуют искусственно дополнять список."},{"title":"Topology: новая версия индекса без пустого окна","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eПерестройка анализатора рядом с рабочей версией\u003c/text\u003e\u003crect x=\"25\" y=\"175\" width=\"190\" height=\"75\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"39\" y=\"203\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eИсточник товаров\u003c/text\u003e\u003ctext x=\"39\" y=\"228\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eверсии + удаления\u003c/text\u003e\u003crect x=\"295\" y=\"75\" width=\"185\" height=\"75\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"309\" y=\"103\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eИндекс v1\u003c/text\u003e\u003ctext x=\"309\" y=\"128\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eобслуживает поиск\u003c/text\u003e\u003crect x=\"295\" y=\"300\" width=\"185\" height=\"75\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"309\" y=\"328\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eИндекс v2\u003c/text\u003e\u003ctext x=\"309\" y=\"353\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003esnapshot + догон\u003c/text\u003e\u003crect x=\"555\" y=\"175\" width=\"180\" height=\"75\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"569\" y=\"203\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eAlias поиска\u003c/text\u003e\u003ctext x=\"569\" y=\"228\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003ev1 → v2\u003c/text\u003e\u003cline x1=\"215\" y1=\"205\" x2=\"295\" y2=\"112\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"295.0,112.0 293.1,120.8 286.6,115.2\" fill=\"#51657a\"/\u003e\u003cline x1=\"215\" y1=\"225\" x2=\"295\" y2=\"337\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"295.0,337.0 286.9,333.1 293.9,328.1\" fill=\"#51657a\"/\u003e\u003cline x1=\"480\" y1=\"112\" x2=\"555\" y2=\"197\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"555.0,197.0 546.5,193.9 553.0,188.2\" fill=\"#51657a\"/\u003e\u003cline x1=\"480\" y1=\"337\" x2=\"555\" y2=\"225\" stroke=\"#15803d\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003cpolygon points=\"555.0,225.0 554.2,234.0 547.0,229.2\" fill=\"#15803d\"/\u003e\u003ctext x=\"285\" y=\"245\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eСначала догнать, затем переключить\u003c/text\u003e\u003ctext x=\"30\" y=\"420\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eСтарая версия остаётся пригодной для отката ограниченное время\u003c/text\u003e","caption":"Новый анализатор получает снимок и текущие изменения с версиями. Переключение разрешено после догонки и проверки качества. Пунктир — будущий маршрут, а не одновременная случайная выдача из двух индексов."}],"decision":{"prompt":"Как развивать поиск каталога?","options":[{"title":"PostgreSQL FTS и словари под запросы","consequence":"Мало новых компонентов","tradeoff":"Меньше готовых возможностей сложного поиска"},{"title":"Отдельный поисковый индекс с версионированным обновлением","consequence":"Гибкая настройка и независимое чтение","tradeoff":"Отставание, перестройка и эксплуатация копии"},{"title":"Специализированный внешний поиск как услуга","consequence":"Быстрый старт сложных функций","tradeoff":"Стоимость, зависимость и требования к данным"}],"recommended":0,"explanation":"Для первого региона сначала измеряем предел полнотекстового поиска и качество словаря. При выросшем объёме требований второй вариант становится обоснованным следующим шагом."},"exercise":{"prompt":"Почему повышение точности последнего ранжирования не исправляет потерю нужного товара?","model":"\u003cp\u003eПоследний этап видит только кандидатов, оставшихся после отбора. Нужно отдельно исследовать полноту первого этапа и ошибки жёстких фильтров, а не лишь коэффициенты финального ранга.\u003c/p\u003e","rubric":["Разделены отбор и ранг","Названа возможная ошибка фильтра"]},"checkpoint":[{"question":"Какой источник решает продажу последней единицы?","options":["Авторитетный транзакционный резерв","Поисковый индекс с хорошим ranking","Первый результат кэша"],"answer":0,"explanation":"Поиск может отставать и предназначен для обнаружения, а не эксклюзивного права."},{"question":"Зачем версия в обновлении поискового документа?","options":["Не дать позднему старому событию затереть новое","Увеличить релевантность по умолчанию","Заменить резервные копии"],"answer":0,"explanation":"Порядок доставки между системами не всегда совпадает с порядком изменений."}],"sources":[{"title":"PostgreSQL 16, Preferred Index Types for Text Search: GIN и GiST","url":"https://www.postgresql.org/docs/16/textsearch-indexes.html"},{"title":"PostgreSQL, Full Text Search: анализ и ранжирование","url":"https://www.postgresql.org/docs/current/textsearch.html"},{"title":"Илья Валяев, AvitoTech, «Как работает поисковое ранжирование для миллионов объявлений Авито», 30.09.2024","url":"https://habr.com/ru/companies/avito/articles/846832/"},{"title":"MongoDB, Data Modeling: доступ совместно читаемых данных и embedding/referencing","url":"https://www.mongodb.com/docs/manual/data-modeling/"},{"title":"Apache Cassandra 5.0, Data Modeling Introduction: query-driven модель","url":"https://cassandra.apache.org/doc/latest/cassandra/developing/data-modeling/intro.html"},{"title":"Neo4j, Graph database concepts: property graph, узлы и отношения","url":"https://neo4j.com/docs/getting-started/appendix/graphdb-concepts/"}],"wordCount":1640},{"id":"ch-14","arc":4,"title":"На карте появился курьер: координата ещё не прибытие","briefing":"Поиск нашёл товар. Теперь «Северный маршрут» показывает курьера на карте и обещает время доставки. Близость по координатам оказалась плохим предсказателем проезда через реку.","goals":["Различать геометрическую близость и дорожное время","Понимать пространственный индекс и его точную проверку","Проектировать свежесть координат и неопределённость ETA"],"sections":[{"title":"Координата имеет систему отсчёта и возраст","html":"\u003cp\u003eТочка на карте — это не просто два числа. Нужно знать систему координат, порядок осей, время наблюдения, точность и происхождение. Широта и долгота в градусах не являются расстоянием в метрах; один градус долготы имеет разную длину на разных широтах. Ошибка порядка longitude/latitude может дать формально допустимую, но географически неверную точку. Поэтому контракт координаты важен не меньше контракта суммы и валюты у платежа.\u003c/p\u003e\u003cp\u003eУ PostGIS geometry использует единицы выбранной системы координат, а geography предназначена для географических расстояний с метрическими аргументами соответствующих функций. Для локальной задачи подходит корректно выбранная проекция, для большого покрытия может быть удобна geography. Выбор зависит от операций и цены расчёта. Нельзя исправить неверную модель добавлением индекса: быстрый запрос по градусам останется семантически неверным, если радиус задумывался в метрах.\u003c/p\u003e\u003cp\u003eМобильный телефон измеряет положение с шумом и может передавать его позже. Поэтому reported_at устройства отделяют от received_at сервера. Номер последовательности помогает не заменить свежую точку поздним пакетом, но не делает часы телефона доверенными. Точность в 80 метров означает иной уровень уверенности, чем точность в 5 метров. Карта должна показывать устаревание, а алгоритм назначения — ограничивать использование старых данных. Движущийся маркер не доказывает свежую связь с курьером.\u003c/p\u003e"},{"title":"Пространственный индекс отсекает лишнее","html":"\u003cp\u003eБез индекса запрос «все курьеры в радиусе трёх километров» вычисляет расстояние для каждой записи. Пространственный индекс организует области так, чтобы сначала отбросить заведомо далёкие объекты. В PostGIS GiST поддерживает такую предварительную фильтрацию для индексируемых пространственных условий. Функция ST_DWithin объединяет проверку близости с возможностью использовать индекс. Наличие обычного B-tree на бинарном значении геометрии не заменяет эту структуру.\u003c/p\u003e\u003cp\u003eПредварительная область — не окончательный ответ. Bounding box, ограничивающий прямоугольник, может пересекаться с радиусом, хотя точка находится за окружностью. Поэтому после дешёвого отбора выполняется точная геометрическая проверка. Такой двухступенчатый ход похож на поиск каталога: сначала полнота кандидатов с небольшой ценой, потом более точная оценка. Ограничение важно для чтения плана запроса: большое число отброшенных повторной проверкой строк показывает свойства данных и фильтра, а не обязательно ошибку базы.\u003c/p\u003e\u003cp\u003eЧастое обновление координат тоже стоит денег: нужно менять индекс, записывать журнал и обслуживать очистку старых версий строк. Иногда полезно отдельно хранить последнее положение для оперативной задачи и более редкую историю пути для аналитики. Но последняя точка не должна терять версию, а история требует срока хранения и контроля доступа. Проектирование геоданных включает скорость записи и приватность, а не только красивую карту.\u003c/p\u003e"},{"title":"Дорожный граф отвечает на другой вопрос","html":"\u003cp\u003eПрямая дистанция полезна, чтобы быстро найти кандидатов, но курьер едет по дорогам. Дорожный граф представляет допустимые перемещения рёбрами и узлами; ограничения поворотов, направление движения и вид транспорта меняют доступность маршрута. Велосипед, автомобиль и пеший курьер не обязаны иметь один граф. Две точки по разные стороны реки могут быть в пятистах метрах по прямой и в пятнадцати минутах пути через мост.\u003c/p\u003e\u003cp\u003eRouting вычисляет допустимый путь и его стоимость. ETA, estimated time of arrival, оценивает время прибытия, учитывая путь, текущее и ожидаемое состояние движения, режим транспорта, подход к подъезду и рабочие остановки. Длина пути — только один фактор. Курьер может находиться возле клиента, но заканчивать выдачу предыдущего заказа. Тогда ETA должна включать оставшуюся работу, иначе «ближайший» окажется недоступным.\u003c/p\u003e\u003cp\u003eДля сотен кандидатов полный запрос маршрута каждому слишком дорог. Сначала пространственный отбор сокращает множество, затем оценка по дорожным областям или дешёвой модели выделяет лучших, затем точный routing уточняет несколько вариантов. Кэш маршрутов требует ключа по направлению, времени и режиму: A→B не всегда эквивалентно B→A. Даже точная дорожная карта не устраняет неопределённость будущего трафика. Поэтому ответ ETA — прогноз, а не свойство SQL-строки.\u003c/p\u003e"},{"title":"Map matching и качество входа","html":"\u003cp\u003eGPS-точка может лежать на соседней дороге, во дворе или на другом уровне развязки. Map matching сопоставляет наблюдения с вероятным участком дорожного графа. Одна точка часто неоднозначна; последовательность с направлением и скоростью помогает выбрать путь. Но чрезмерно агрессивное «приклеивание» способно заставить пешего курьера двигаться по автомобильной дороге. Важно учитывать режим и сохранять исходное наблюдение для диагностики в допустимых пределах хранения.\u003c/p\u003e\u003cp\u003eПотеря сигнала в тоннеле не означает остановку. Экстраполяция по последним данным улучшает карту, но её нельзя выдавать за измерение. Чем старше точка, тем шире неопределённость. Для оперативного назначения команда задаёт порог свежести и переводит курьера в отдельное состояние, если подтверждения нет. Это решение о доступном ресурсе, а не визуальный эффект. Порог зависит от скорости, плотности заказов и способности приложения работать в фоне.\u003c/p\u003e\u003cp\u003eВходные координаты также бывают умышленно неверными. Нереалистичные скачки, невозможная скорость и несоответствие ходу заказа — сигналы проверки, но автоматическое обвинение по одному GPS-скачку опасно. Системе нужны фильтрация выбросов и процесс разбора. У GPS нет свойства достоверного доказательства физического исполнения. Для вручения могут потребоваться отдельные подтверждения, предусмотренные бизнесом, а не вера в последнюю точку.\u003c/p\u003e"},{"title":"Как обещать время и проверять прогноз","html":"\u003cp\u003eЕсли модель выдаёт 12 минут, реальные прибытия распределены вокруг прогноза, причём ошибки несимметричны. Опоздание на десять минут и прибытие на десять минут раньше имеют разную цену. Продукт может показывать интервал и обновлять его при изменении маршрута. Важно не уменьшать обещание скачками ради красивого экрана: повторные изменения сами ухудшают доверие. Пользовательский срок доставки и внутренняя оценка дорожного времени не обязательно совпадают.\u003c/p\u003e\u003cp\u003eКачество измеряют по группам: час суток, район, транспорт, свежесть координат, погода и тип адреса. Средняя абсолютная ошибка может выглядеть хорошей, скрывая тяжёлые ошибки в новом районе. Нужны доля прибытия в обещанный интервал, величина позднего хвоста и калибровка вероятности: если говорится «90% до этого времени», примерно такая доля должна укладываться. Без сохранения входных версий и момента прогноза трудно понять, ошиблась модель или данные пришли поздно.\u003c/p\u003e\u003cp\u003eРезервный режим тоже проектируют заранее. При отказе routing можно показать более широкий региональный интервал и временно не обещать точный минутный ETA. При старых координатах нельзя уверенно переназначать курьера как свободного. Снижение детализации полезнее выдуманной точности. Для «Северного маршрута» хороший результат — управляемое обещание с известными границами, а не максимальное число точек, которые удаётся нарисовать каждую секунду.\u003c/p\u003e"},{"title":"Геозона — тоже договор о границе","html":"\u003cp\u003eТочка на линии полигона обслуживания требует явного правила. Если один сервис считает границу включённой, а другой исключённой, адрес будет попеременно доступен и недоступен. Также возникают многоугольники с отверстиями, пересекающиеся зоны разных складов и исключённые территории. Проверка только ограничивающего прямоугольника не выражает эти правила. Выбор пространственного предиката согласуют с бизнес-смыслом и тестируют на граничных адресах.\u003c/p\u003e\u003cp\u003eГеокодирование адреса даёт ещё один источник неопределённости. Точка центра здания не всегда совпадает с входом, а маршрут до центра торгового комплекса не означает путь до нужной двери. Для важных адресов сохраняют уточнение подъезда и разрешённую точку остановки, отделяя их от публичной координаты здания. Эти детали объясняют, почему географический продукт требует работы с данными и обратной связи курьеров, а не только покупки карты и создания индекса.\u003c/p\u003e"}],"workedExample":{"title":"Разбор: ближайший через мост","html":"\u003cp\u003eУ склада находятся три курьера. A в 700 метрах по прямой на другом берегу; B в 1400 метрах на той же стороне; C в 1000 метрах, но его точка получена четыре минуты назад. Все числа учебные. Наивный ORDER BY по расстоянию выбрал бы A. Пространственный запрос сначала отбирает кандидатов в радиусе трёх километров и проверяет их режим, доступность и свежесть. C не исключается из мира, но не участвует как достоверно доступный без обновления.\u003c/p\u003e\u003cp\u003eДля A дорожный маршрут до склада занимает 11 минут через мост. Для B — 5 минут. У B ещё две минуты на завершение текущей передачи, поэтому готовность прибыть оценивается в 7 минут. У A текущей работы нет, но он всё равно медленнее. Алгоритм сохраняет компоненты оценки: время до освобождения, путь до склада и неопределённость. Это позволяет объяснить выбор B и отличить ошибку ETA от неверного статуса занятости.\u003c/p\u003e\u003cp\u003eСклад готовит заказ ещё 6 минут. Если B приедет через 7 минут, ожидание минимально. Затем путь к клиенту занимает в типичной ситуации 14 минут, выдача со склада — 3, подход к адресу — 2. Точечная оценка от текущего момента составит 26 минут: максимум готовности склада и прибытия B, затем 3 + 14 + 2. Складывать 6 и 7 последовательно было бы ошибкой: эти процессы идут параллельно. Для обещания клиенту добавляют рассчитанную по данным неопределённость, а не произвольные одинаковые пять минут на все случаи.\u003c/p\u003e\u003cp\u003eЧерез две минуты мост закрывается. Обновление не должно просто сравнить прямые расстояния заново; меняется дорожная стоимость и возможные маршруты. Прогноз пересчитывается, а назначение пока не меняют автоматически без учёта стоимости отмены. Если routing недоступен, показывают широкий запасной интервал и передают диспетчеру заказы с риском. Приёмка включает неверный порядок осей, позднюю точку C, несвежий кэш направления и параллельность подготовки. Эти тесты проверяют смысл, который красивый SQL-запрос не выражает сам.\u003c/p\u003e"},"expedition":{"world":"geo","title":"Экспедиция: выездная медицинская лаборатория","html":"\u003cp\u003eВыездная лаборатория назначает специалиста для забора анализов. Географический отбор похож на доставку, но время визита включает подготовку, длительность процедуры и температурные ограничения перевозки образца. Самый близкий сотрудник может не иметь нужной квалификации или подходящего контейнера. Эти ограничения жёстче предпочтения по времени: быстрый неподходящий специалист не является кандидатом.\u003c/p\u003e\u003cp\u003eETA до пациента и время до лаборатории — разные обязательства. Образец может требовать обработки в определённое окно после забора, поэтому маршрут оценивают целиком. Прибытие на пять минут быстрее не помогает, если затем нарушается срок хранения. В такой системе цена ошибки включает не только неудобство клиента, а непригодность результата; нужны более строгие подтверждения и ручное управление исключениями. Учебный пример не задаёт медицинские нормативы: их берут из конкретного процесса и действующих требований.\u003c/p\u003e\u003cp\u003eПереносится пространственный отбор, дорожная оценка, время готовности ресурса и работа с устареванием. Меняются ограничения и измерение успеха. Координаты медицинского визита особенно чувствительны: доступ к карте должен следовать роли, а история храниться лишь в необходимом объёме. Нельзя экспортировать весь путь в общую аналитику ради удобства. Геосервис становится частью предметной ответственности, а не универсальным калькулятором километров.\u003c/p\u003e","transfer":["Кандидаты по пространству, затем дорожная оценка","Свежесть и неопределённость"],"distinct":["Квалификация и ограничения образцов","Чувствительные адреса визитов"]},"diagrams":[{"title":"Topology map: мост меняет выбор кандидата","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eГеометрически близко — дорожный путь длиннее\u003c/text\u003e\u003crect x=\"340\" y=\"60\" width=\"80\" height=\"330\" fill=\"#bfdbfe\"/\u003e\u003crect x=\"305\" y=\"315\" width=\"150\" height=\"28\" fill=\"#cbd5e1\" stroke=\"#64748b\"/\u003e\u003ctext x=\"365\" y=\"110\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#203047\" text-anchor=\"start\"\u003eРека\u003c/text\u003e\u003ccircle cx=\"250\" cy=\"130\" r=\"27\" fill=\"#dbeafe\" stroke=\"#526781\" stroke-width=\"2\"/\u003e\u003ctext x=\"250\" y=\"136\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"middle\"\u003eС\u003c/text\u003e\u003ccircle cx=\"500\" cy=\"130\" r=\"27\" fill=\"#dbeafe\" stroke=\"#526781\" stroke-width=\"2\"/\u003e\u003ctext x=\"500\" y=\"136\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"middle\"\u003eA\u003c/text\u003e\u003ccircle cx=\"170\" cy=\"250\" r=\"27\" fill=\"#dbeafe\" stroke=\"#526781\" stroke-width=\"2\"/\u003e\u003ctext x=\"170\" y=\"256\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"middle\"\u003eB\u003c/text\u003e\u003cline x1=\"278\" y1=\"130\" x2=\"473\" y2=\"130\" stroke=\"#d44b4b\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003ctext x=\"445\" y=\"95\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#203047\" text-anchor=\"start\"\u003eA: 700 м по прямой\u003c/text\u003e\u003cpath d=\"M500 158 L500 329 L250 329 L250 158\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"4\"/\u003e\u003ctext x=\"475\" y=\"280\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#b45309\" text-anchor=\"start\"\u003e11 минут\u003c/text\u003e\u003cline x1=\"180\" y1=\"225\" x2=\"230\" y2=\"157\" stroke=\"#15803d\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"230.0,157.0 228.8,165.9 221.8,160.8\" fill=\"#15803d\"/\u003e\u003ctext x=\"40\" y=\"300\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#203047\" text-anchor=\"start\"\u003eB: 1400 м\u003c/text\u003e\u003ctext x=\"40\" y=\"330\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#15803d\" text-anchor=\"start\"\u003e5 минут по дороге\u003c/text\u003e\u003ctext x=\"30\" y=\"430\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eКарта условная; С — склад. Прямая нужна для отбора, путь — для ETA.\u003c/text\u003e","caption":"Схематичная река не является реальной картой. Кандидат A ближе по координатам, но через мост медленнее B. Разные линии показывают две различные метрики, а не ошибку пространственного индекса."},{"title":"Timeline: ETA складывает не всё подряд","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eПараллельная готовность, затем последовательный путь\u003c/text\u003e\u003ctext x=\"35\" y=\"95\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eСклад\u003c/text\u003e\u003crect x=\"155\" y=\"65\" width=\"252\" height=\"55\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"169\" y=\"93\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eГотовит · 6 минут\u003c/text\u003e\u003ctext x=\"35\" y=\"185\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eКурьер B\u003c/text\u003e\u003crect x=\"155\" y=\"155\" width=\"294\" height=\"55\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"169\" y=\"183\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eПрибудет · 7 минут\u003c/text\u003e\u003cline x1=\"449\" y1=\"50\" x2=\"449\" y2=\"240\" stroke=\"#b45309\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003ctext x=\"460\" y=\"100\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#b45309\" text-anchor=\"start\"\u003emax(6, 7)\u003c/text\u003e\u003ctext x=\"460\" y=\"130\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#b45309\" text-anchor=\"start\"\u003e= 7 минут\u003c/text\u003e\u003cline x1=\"449\" y1=\"210\" x2=\"449\" y2=\"270\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"449.0,270.0 444.7,262.1 453.3,262.1\" fill=\"#51657a\"/\u003e\u003crect x=\"45\" y=\"285\" width=\"195\" height=\"75\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"59\" y=\"313\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eВыдача\u003c/text\u003e\u003ctext x=\"59\" y=\"338\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003e3 минуты\u003c/text\u003e\u003crect x=\"280\" y=\"285\" width=\"195\" height=\"75\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"294\" y=\"313\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eПуть к клиенту\u003c/text\u003e\u003ctext x=\"294\" y=\"338\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003e14 минут\u003c/text\u003e\u003crect x=\"515\" y=\"285\" width=\"200\" height=\"75\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"529\" y=\"313\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eПодход\u003c/text\u003e\u003ctext x=\"529\" y=\"338\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003e2 минуты\u003c/text\u003e\u003cline x1=\"240\" y1=\"323\" x2=\"280\" y2=\"323\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"280.0,323.0 272.1,327.3 272.1,318.7\" fill=\"#51657a\"/\u003e\u003cline x1=\"475\" y1=\"323\" x2=\"515\" y2=\"323\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"515.0,323.0 507.1,327.3 507.1,318.7\" fill=\"#51657a\"/\u003e\u003ctext x=\"50\" y=\"420\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#203047\" text-anchor=\"start\"\u003eОт текущего момента: 7 + 3 + 14 + 2 = 26 минут без запаса прогноза\u003c/text\u003e","caption":"Подготовка склада и прибытие курьера идут параллельно, поэтому берётся максимум. После встречи выдача, дорога и подход последовательны. Интервал обещания требует отдельной оценки неопределённости."}],"decision":{"prompt":"Как получить первый честный ETA?","options":[{"title":"Пространственный отбор и внешний routing для малого списка","consequence":"Дорожная оценка без собственной карты","tradeoff":"Стоимость вызовов и зависимость от провайдера"},{"title":"Собственный граф и расчёт маршрутов","consequence":"Контроль алгоритма и специализированных правил","tradeoff":"Обновление карты, трафик и сложная эксплуатация"},{"title":"Широкие интервалы по зонам без минутного прогноза","consequence":"Простой и устойчивый старт","tradeoff":"Меньше точность и конкурентность предложения"}],"recommended":0,"explanation":"При одном регионе и ограниченной команде внешняя маршрутизация оправдана. На время отказа сохраняется третий вариант с честным снижением точности."},"exercise":{"prompt":"Почему индексируемый ST_DWithin не выбирает лучшего курьера?","model":"\u003cp\u003eОн эффективно проверяет географическую близость в выбранной модели. Дорожное время, текущая работа, транспорт и допустимость назначения находятся в других данных и алгоритмах.\u003c/p\u003e","rubric":["Разделены метры и время","Названы дополнительные ограничения"]},"checkpoint":[{"question":"Что означает расстояние geometry в ST_DWithin?","options":["Единицы системы координат geometry","Всегда метры","Всегда километры"],"answer":0,"explanation":"Для geography радиус задаётся в метрах; для geometry важна выбранная система отсчёта."},{"question":"Склад готовит 6 минут, курьер едет 7. Сколько до совместной готовности?","options":["7 минут при параллельном начале","13 минут всегда","1 минута"],"answer":0,"explanation":"Встреча требует завершения обоих параллельных процессов: берётся максимум."}],"sources":[{"title":"PostGIS, ST_DWithin: geometry/geography и индексная проверка","url":"https://postgis.net/docs/ST_DWithin.html"},{"title":"PostGIS, How do I use spatial indexes?","url":"https://postgis.net/documentation/faq/spatial-indexes/"},{"title":"Yandex.Taxi: Under The Hood, Graph Technologies, 26.07.2019; исторический инженерный разбор","url":"https://medium.com/@underthehood21/yandex-taxi-graph-technologies-the-perfect-search-without-routing-api-requests-c8c97cf809e7"}],"wordCount":1526},{"id":"ch-15","arc":4,"title":"Кому отдать заказ: оптимум пары может проиграть городу","briefing":"ETA стало точнее, но два диспетчера всё ещё назначают одного курьера разным заказам. «Северный маршрут» отделяет расчёт хорошего плана от права зафиксировать назначение.","goals":["Понимать matching и общую функцию стоимости","Учитывать маршруты, ограничения и стабильность решений","Связывать оптимизатор с атомарным резервированием ресурсов"],"sections":[{"title":"Жадный выбор не видит следующего заказа","html":"\u003cp\u003eMatching, сопоставление, выбирает пары между заказами и исполнителями. Если каждый заказ независимо берёт ближайшего курьера, локально привлекательные решения могут создать плохой общий результат. Один универсальный автомобиль уйдёт на лёгкую посылку, а заказ с холодильником останется без единственного подходящего ресурса. Поэтому сначала задают допустимые пары, затем оценивают их стоимость и выбирают согласованный набор. География — лишь одна часть допустимости.\u003c/p\u003e\u003cp\u003eДвудольный граф представляет заказы одной группой узлов, курьеров — другой. Ребро существует, если назначение разрешено, и имеет цену: ожидание, риск опоздания, дополнительный путь, стоимость работы. При простом взаимно однозначном назначении можно решать задачу минимальной суммарной стоимости. Но реальная доставка часто допускает несколько заказов на маршрут, требует вместимость и временные окна. Тогда задача становится богаче обычного matching и может требовать эвристик вместо точного решения за приемлемое время.\u003c/p\u003e\u003cp\u003eУ функции стоимости есть социальный и продуктовый смысл. Если считать лишь километры, можно постоянно отдавать заказы одному району и оставлять другой без обслуживания. Если считать только среднюю задержку, тяжело опаздывающие заказы могут стать ещё хуже. Поэтому команда явно выбирает компромисс между эффективностью, соблюдением обещаний, справедливостью нагрузки и доходом исполнителя. Коэффициенты — это политика бизнеса, которую нужно проверять данными, а не техническая константа из библиотеки.\u003c/p\u003e"},{"title":"Окно решения и цена ожидания","html":"\u003cp\u003eОнлайн-заказ хочется назначить немедленно. Но небольшое накопление заявок позволяет увидеть больше пар и избежать плохого раннего решения. Batch matching собирает короткое окно, решает задачу и отправляет предложения. Цена окна — дополнительное ожидание каждого заказа. В плотном городе две секунды могут дать полезные альтернативы, в редком районе ожидание почти ничего не добавляет. Размер окна выбирают по эффекту, а не по одному глобальному значению на всю страну.\u003c/p\u003e\u003cp\u003eРеальный инженерный материал Яндекса «Как мы распределяем заказы между водителями в Яндекс.Такси» опубликован 7 февраля 2019 года. Он разбирает распределение заказов как задачу с учётом множества участников и вариантов, а не только ближайшего автомобиля. Это исторический источник насмотренности, не текущая спецификация сервиса. Для нашей доставки переносится идея общей оценки согласованных назначений; пассажирские поездки и доставка товаров имеют разные ограничения и функции потерь.\u003c/p\u003e\u003cp\u003eЛюбой алгоритм работает на снимке мира, который стареет во время расчёта. Курьер мог уйти offline, принять другое предложение или изменить маршрут. Поэтому оптимизатор выдаёт кандидата на решение, а не право без проверки изменить реальность. Между планом и применением нужна версия входных данных и атомарная проверка актуального состояния ресурса. Если часть плана устарела, систему нельзя заставлять применять весь пакет ради красоты найденного оптимума.\u003c/p\u003e"},{"title":"Маршрут — последовательность зависимых обязательств","html":"\u003cp\u003eКогда курьер уже несёт два заказа, новый заказ нужно вставить в маршрут, а не просто добавить к счётчику. Забор предшествует доставке, вместимость меняется на остановках, временные окна должны сохраняться, а задержка старых клиентов ограничена. Даже короткий дополнительный путь может сильно задержать существующее обязательство из-за ожидания готовности склада. Поэтому стоимость вставки считают по изменению всего маршрута и прогнозу времени на каждой остановке.\u003c/p\u003e\u003cp\u003eТочное решение vehicle routing problem, задачи маршрутизации транспорта, быстро становится дорогим при росте вариантов. Практическая система использует ограничение кандидатов, эвристики вставки, локальные улучшения и бюджет времени. Недостаточно сказать «алгоритм оптимален»: нужно указать относительно какой модели, входных данных и ограничений. Идеальное решение по ошибочным ETA может быть хуже простой устойчивой эвристики. Понятное объяснение отказа «не проходит временное окно» полезнее недостижимого математического идеала.\u003c/p\u003e\u003cp\u003eДополнительные ограничения бывают жёсткими и мягкими. Нельзя назначить пешему курьеру груз, который он физически не перенесёт; такое ребро отсутствует. Нежелательное увеличение пути можно штрафовать, но разрешать при отсутствии лучших вариантов. Если жёсткий предел заменить большим штрафом, оптимизатор в кризис всё равно может его нарушить. Именно поэтому допустимость отделяют от функции стоимости, а единицы и масштабы штрафов документируют.\u003c/p\u003e"},{"title":"План ещё нужно безопасно зафиксировать","html":"\u003cp\u003eДва процесса могут выбрать одного курьера из одинакового снимка. В базе назначения нужен атомарный переход available→reserved с проверкой версии и ожидаемого состояния. Он должен выражать реальную единицу ресурса: при нескольких слотах маршрута нельзя защищать только boolean «занят». Уникальные ограничения и контроль версии предотвращают двойное локальное назначение. Распределённая блокировка сама по себе не делает старый процесс безвредным после истечения её срока.\u003c/p\u003e\u003cp\u003eПредложение курьеру может иметь lease, ограниченный срок резервирования. Отказ или отсутствие ответа освобождает ресурс по правилам. Но позднее принятие старого предложения не должно побеждать новое назначение. Поэтому каждое предложение имеет идентификатор и поколение; принятие сверяется с текущей записью. Если внешний исполнитель способен действовать по старой команде, нужен проверяемый номер поколения или иной способ отвергнуть устаревшее право. Иначе корректная база не спасает от двух физически принятых работ.\u003c/p\u003e\u003cp\u003eПереход фиксируется вместе с исходящим событием через outbox. Мобильный повтор принятия использует тот же идентификатор предложения и не добавляет заказ второй раз. Отмена — отдельный переход с правилами относительно начала исполнения. После фактического забора груза «освободить ресурс» уже недостаточно: нужна передача или завершение маршрута. Так механизмы прошлой арки возвращаются в географической задаче, но защищают другое бизнес-право.\u003c/p\u003e"},{"title":"Стабильность, справедливость и деградация","html":"\u003cp\u003eЕсли пересчитывать оптимум каждую секунду и без цены менять решения, курьер будет получать противоречивые указания. Система оптимальна на снимках и непригодна в жизни. Поэтому в стоимость включают переключение, а принятые обязательства фиксируют сильнее неподтверждённых предложений. Возле начала исполнения полезен freeze horizon — горизонт, внутри которого изменения особенно ограничены. Это снижает теоретическую свободу и повышает реальную исполнимость.\u003c/p\u003e\u003cp\u003eОценка matching должна учитывать не только среднее время назначения. Нужны доля неназначенных, хвост опозданий, число переназначений, отмены после принятия, загрузка по районам и устойчивость дохода исполнителей. Эксперименты сложнее обычного веб-A/B: курьеры и заказы делят общий рынок, поэтому изменение для одной группы влияет на другую. Нельзя считать наблюдения полностью независимыми без анализа взаимного влияния. Симуляция на исторических данных полезна, но реакция людей при новой политике может отличаться.\u003c/p\u003e\u003cp\u003eПри перегрузке оптимизатора система переходит к ограниченной эвристике и меньшему числу кандидатов, а не перестаёт назначать вообще. Для особых заказов остаётся диспетчерский маршрут с теми же проверками ресурса и журналом причин. Ручное действие не должно обходить инварианты двойного назначения. Граница деградации видима в метриках: что улучшилось по задержке расчёта и что ухудшилось по качеству. Это позволяет управлять компромиссом, а не прятать его за словом «оптимизация».\u003c/p\u003e"},{"title":"Объяснение решения помогает улучшать модель","html":"\u003cp\u003eДля каждого назначения полезно сохранить ограниченный набор причин: какие кандидаты были допустимы, какие исключены, какие компоненты стоимости стали решающими и по какой версии ресурса выполнен commit. Это не означает вечное хранение всех перемещений. Достаточно данных, необходимых для проверки политики и разбора ограниченного числа спорных решений, с подходящим сроком и доступом.\u003c/p\u003e\u003cp\u003eЕсли диспетчер постоянно исправляет один тип назначения, проблема может быть не в алгоритме, а в отсутствующем ограничении: двор закрыт, автомобиль не проходит по высоте, склад выдаёт тяжёлые коробки только с помощником. Ручная корректировка должна оставлять структурированную причину, иначе полезное знание исчезает в чате. Обратная связь обновляет модель допустимости или стоимости, затем изменение проверяют на истории и ограниченном запуске. Так система учится на эксплуатации без требования немедленно внедрять машинное обучение.\u003c/p\u003e"}],"workedExample":{"title":"Разбор: два заказа, два курьера","html":"\u003cp\u003eВ короткое окно попадают заказы X и Y. Курьер A может забрать X за 2 минуты, Y за 3. Курьер B — X за 4, Y за 20. Это учебная матрица стоимости уже после дорожной оценки и проверки допустимости. Жадная обработка X первой выбирает A: общая сумма 2 + 20 = 22 минуты. Совместное сопоставление отдаёт X курьеру B, Y курьеру A: 4 + 3 = 7. Для X решение выглядит хуже на две минуты, но общий результат улучшается на пятнадцать.\u003c/p\u003e\u003cp\u003eТеперь добавим обязательство: Y требует холодильный контейнер, который есть только у B. Ребро A–Y исчезает, каким бы привлекательным ни было время. Нельзя просто добавить штраф 100: при достаточно плохой альтернативе алгоритм может решить нарушить условие. В новой допустимой модели остаётся X→A, Y→B, сумма 22. Это не ухудшение алгоритма, а учёт реального ограничения. Объяснение важно диспетчеру, который видит только расстояния и подозревает ошибку.\u003c/p\u003e\u003cp\u003eОптимизатор считал по версиям A:17 и B:9. Пока он работал, B принял другой заказ и стал B:10. При commit атомарная проверка B:9 не проходит. Система не перетирает занятость и не отправляет устаревшее предложение. Она сохраняет допустимое назначение X→A, если пакет не требует общей атомарности, и повторно ищет ресурс для Y. Если условия задачи требуют либо оба назначения, либо ни одного, это отдельное правило фиксации, которое нужно реализовать явно.\u003c/p\u003e\u003cp\u003eНаконец, A принимает предложение P31, но ответ приложения теряется. Повтор P31 возвращает уже принятое состояние. Через 30 секунд истекает старый таймер предложения; он сверяет поколение и статус, поэтому не освобождает уже исполняемый ресурс. Метрики разбора фиксируют стоимость плана, причины недопустимости, конфликты версий и поздние ответы. Производственный контроль здесь важнее красивой суммы 7: хороший план, применённый дважды или к старому ресурсу, становится плохой системой.\u003c/p\u003e"},"expedition":{"world":"saas","title":"Экспедиция: облачный планировщик заданий","html":"\u003cp\u003eПлатформа запускает пользовательские задачи на вычислительных узлах. Заказы превращаются в jobs, курьеры — в workers, грузоподъёмность — в память, CPU и наличие GPU. Самый свободный узел может быть неподходящим по архитектуре процессора или политике размещения данных. Как и в доставке, сначала проверяют допустимость, затем оптимизируют стоимость. Мягкий штраф не заменяет запрет нарушать изоляцию клиента.\u003c/p\u003e\u003cp\u003eПоявляются собственные trade-off. Упаковка задач плотнее экономит инфраструктуру, но оставляет мало запаса на всплеск. Размещение рядом с данными сокращает передачу, но перегревает отдельные узлы. Слишком частая миграция похожа на переназначение курьера: теоретически выравнивает нагрузку, практически теряет прогресс и расходует ресурсы. Нужны цена переключения, приоритет и защита от бесконечного голодания низкоприоритетных клиентов.\u003c/p\u003e\u003cp\u003eПереносится разделение «план вычислен» и «право выдано». Worker получает lease и поколение запуска; поздний старый процесс не должен публиковать результат после нового. Но если задача уже отправила деньги внешнему сервису, отмена lease не откатит эффект. Снова нужны идемпотентность и границы побочных действий. Так matching оказывается общей задачей ограниченных ресурсов, а география заменяется другой топологией стоимости.\u003c/p\u003e","transfer":["Допустимость отдельно от цены","Версия ресурса и срок права"],"distinct":["CPU/GPU и размещение данных","Повтор исполняемого задания"]},"diagrams":[{"title":"Data matrix: лучший для первого — хуже для всех","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eУчебная матрица после проверки допустимости\u003c/text\u003e\u003crect x=\"250\" y=\"70\" width=\"175\" height=\"60\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"264\" y=\"98\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eЗаказ X\u003c/text\u003e\u003crect x=\"425\" y=\"70\" width=\"175\" height=\"60\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"439\" y=\"98\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eЗаказ Y\u003c/text\u003e\u003crect x=\"65\" y=\"130\" width=\"185\" height=\"100\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"79\" y=\"158\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eКурьер A\u003c/text\u003e\u003crect x=\"65\" y=\"230\" width=\"185\" height=\"100\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"79\" y=\"258\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eКурьер B\u003c/text\u003e\u003crect x=\"250\" y=\"130\" width=\"175\" height=\"100\" fill=\"#fee2e2\" stroke=\"#64748b\"/\u003e\u003ctext x=\"337\" y=\"192\" font-family=\"system-ui,sans-serif\" font-size=\"28\" fill=\"#203047\" text-anchor=\"middle\"\u003e2\u003c/text\u003e\u003crect x=\"425\" y=\"130\" width=\"175\" height=\"100\" fill=\"#dcfce7\" stroke=\"#64748b\"/\u003e\u003ctext x=\"512\" y=\"192\" font-family=\"system-ui,sans-serif\" font-size=\"28\" fill=\"#203047\" text-anchor=\"middle\"\u003e3\u003c/text\u003e\u003crect x=\"250\" y=\"230\" width=\"175\" height=\"100\" fill=\"#dcfce7\" stroke=\"#64748b\"/\u003e\u003ctext x=\"337\" y=\"292\" font-family=\"system-ui,sans-serif\" font-size=\"28\" fill=\"#203047\" text-anchor=\"middle\"\u003e4\u003c/text\u003e\u003crect x=\"425\" y=\"230\" width=\"175\" height=\"100\" fill=\"#fee2e2\" stroke=\"#64748b\"/\u003e\u003ctext x=\"512\" y=\"292\" font-family=\"system-ui,sans-serif\" font-size=\"28\" fill=\"#203047\" text-anchor=\"middle\"\u003e20\u003c/text\u003e\u003ctext x=\"45\" y=\"380\" font-family=\"system-ui,sans-serif\" font-size=\"20\" fill=\"#b91c1c\" text-anchor=\"start\"\u003eЖадно: A→X, B→Y = 22\u003c/text\u003e\u003ctext x=\"45\" y=\"420\" font-family=\"system-ui,sans-serif\" font-size=\"20\" fill=\"#15803d\" text-anchor=\"start\"\u003eСовместно: B→X, A→Y = 7\u003c/text\u003e","caption":"Зелёные ячейки образуют совместное решение с суммой 7, красные — жадное с суммой 22. Все пары пока допустимы. Если A не может выполнить Y, ячейка A–Y удаляется, а не получает просто большой штраф."},{"title":"Failure timeline: план устарел до commit","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eОптимизатор предлагает, транзакция выдаёт право\u003c/text\u003e\u003crect x=\"30\" y=\"80\" width=\"200\" height=\"90\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"44\" y=\"108\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eСнимок\u003c/text\u003e\u003ctext
