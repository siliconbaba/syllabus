кты различаются. Нельзя без анализа перенести компенсацию отмены заказа на необратимое внешнее действие.\u003c/p\u003e\u003cp\u003eДля незнакомой области задают четыре опоры: что считается фактом, кто может его изменить, когда результат становится необратимым и какая ошибка наиболее опасна. Затем строят путь данных и отказа. Уже после этого выбирают транзакцию, очередь, индекс, модель или агентный инструмент. Такой порядок не гарантирует правильного ответа без эксперта области, но делает неизвестное явным и предотвращает механическое копирование.\u003c/p\u003e\u003cp\u003eЗавершение курса не означает сертификацию или доказательство опыта читателя. Учебный результат — способность дать связное объяснение, сравнить альтернативы, назвать условия гарантии и предложить проверку. Финальный совет может принять меньшую архитектуру, отложить ML или оставить модульный монолит. Это не недостроенный идеал, если решение честно выполняет важные сценарии и сохраняет путь дальнейшего изменения.\u003c/p\u003e\u003cp\u003eНа защите полезно отделять факт, предположение и решение. Факт подтверждён измерением с известными условиями. Предположение позволяет продолжить проектирование, но имеет владельца и способ проверки. Решение выбирает действие при текущем знании. Если эти категории смешаны, учебная оценка нагрузки быстро превращается в мнимую гарантию. Совет может принять решение условно, поручив короткий эксперимент до необратимого шага. Например, региональную проекцию разрешают строить сразу, а передачу записи откладывают до проверки задержки и сценария разрыва связи. Такая условность не делает архитектуру слабой: она показывает, где стоимость следующего знания меньше цены ошибочного перехода.\u003c/p\u003e"}],"workedExample":{"title":"Совет о третьем регионе","html":"\u003cp\u003eВ учебных условиях новый регион добавит 8 000 заказов в сутки к существующим 24 000. Измеренная задержка до центрального ядра приемлема для оформления, но медиа и поиск дают длинный хвост. Команда располагает шестью инженерами для следующего этапа. Цели: сохранить финансовые инварианты, обеспечить поиск в регионе при кратком обрыве связи и не увеличивать технологическую стоимость завершённого заказа более согласованного учебного предела.\u003c/p\u003e\u003cp\u003eВариант A оставляет всё централизованным и усиливает канал. Он прост, но не выполняет сценарий поиска при обрыве. Вариант B оставляет запись заказов и расчётов в ядре, переносит поисковую проекцию и медиа ближе к пользователям, а новые заказы при недоступности ядра не принимает как окончательно подтверждённые. Вариант C распределяет запись между регионами и требует протокола владения, переноса заказа и сверки. Он способен уменьшить зависимость от канала, но стоимость перехода и сопровождения велика для текущей команды.\u003c/p\u003e\u003cp\u003eСовет выбирает B с явно принятой границей: во время обрыва можно просматривать разрешённый каталог, но нельзя выдавать обещание о принятом заказе без устойчивой записи ядра. Интерфейс сохраняет черновик отдельно и объясняет статус. Это честнее, чем принять локальную заявку под видом завершённой операции и позднее обнаружить недоступный товар. Финансовые действия агента остаются за детерминированными проверками и подтверждением уполномоченного человека.\u003c/p\u003e\u003cp\u003eПлан состоит из измерения свежести проекции, параллельного индекса, проверки ACL и удаления, канареечного маршрута, нагрузочного испытания и учения обрыва. Отдельно оценивают стоимость доставки медиа и работы платформы. Условие пересмотра — доказанная необходимость принимать подтверждённые заказы при длительном отсутствии связи или неприемлемая задержка ядра. Тогда обсуждение C возвращается с новыми требованиями. Защита завершена не потому, что все согласились, а потому, что выбор, ограничения и способ проверки доступны для критики.\u003c/p\u003e"},"expedition":{"world":"saas","title":"Экспедиция: запись на медицинские исследования","html":"\u003cp\u003eВ незнакомом сервисе записи на исследования ограниченный ресурс — временной слот оборудования и персонала. Из доставки переносится конкуренция за ресурс, идемпотентность подтверждения, различие черновика и принятой записи, наблюдение и миграция. Однако цена ошибки и чувствительность данных иные. Двойное бронирование нельзя оценить только стоимостью повторного обращения; возможны последствия для маршрута пациента, которые обязан объяснить предметный эксперт.\u003c/p\u003e\u003cp\u003eАрхитектор начинает с владельца расписания и правил подтверждения, затем выясняет, какие подготовительные условия обязательны и кто имеет право их проверять. Поисковый помощник может находить утверждённые инструкции, но не должен сам придумывать медицинские рекомендации. Сегментация прав и минимизация данных применяются до передачи модели. Техническая схема не является обещанием нормативного соответствия или клинической безопасности.\u003c/p\u003e\u003cp\u003eДля совета готовят сценарии: два человека выбирают последний слот, лаборатория отменяет исследование, пациент повторяет запрос после таймаута, сеть филиала пропадает. Альтернативы сравнивают по сохранению записи, ясности статуса и восстановлению. Там, где неизвестен смысл отмены или допустимый срок ожидания, требуется экспертное решение. Перенесён не готовый стек доставки, а дисциплина построения проверяемого аргумента вокруг фактов, полномочий и последствий.\u003c/p\u003e","transfer":["Сценарий качества связывает механизм и доказательство","Альтернативы и условие пересмотра"],"distinct":["Клинические последствия требуют эксперта","Чувствительные данные и специальные ограничения"]},"diagrams":[{"title":"Аргумент архитектурного решения","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" rx=\"16\" fill=\"#081b2b\"/\u003e\u003crect x=\"40\" y=\"65\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"185.0\" y=\"106.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eСценарий качества\u003c/text\u003e\u003crect x=\"430\" y=\"65\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"575.0\" y=\"106.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eМеханизм + условия\u003c/text\u003e\u003crect x=\"40\" y=\"285\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"185.0\" y=\"326.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eДоказательство\u003c/text\u003e\u003crect x=\"430\" y=\"285\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"575.0\" y=\"326.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eРиск и следующий шаг\u003c/text\u003e\u003cpath d=\"M330 100 L430 100\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"430,100 420.3,105.3 420.3,94.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"90.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eчто требуется\u003c/text\u003e\u003cpath d=\"M185 135 L185 285\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"185,285 179.7,275.3 190.3,275.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"185.0\" y=\"200.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eкак проверить\u003c/text\u003e\u003cpath d=\"M575 135 L575 285\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"575,285 569.7,275.3 580.3,275.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"575.0\" y=\"200.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eграница\u003c/text\u003e\u003cpath d=\"M330 320 L430 320\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"430,320 420.3,325.3 420.3,314.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"310.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eчто неизвестно\u003c/text\u003e\u003ctext x=\"380\" y=\"430\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"17\" fill=\"#dbeafe\"\u003eКаждое обещание связано с проверяемым сценарием\u003c/text\u003e","caption":"Топология показывает устройство защиты: требование связано с механизмом, условиями и доказательством. Неизвестное не скрывается; оно становится риском с конкретным экспериментом и владельцем."},{"title":"Третий регион: локальное чтение, единая запись","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" rx=\"16\" fill=\"#081b2b\"/\u003e\u003crect x=\"40\" y=\"65\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"185.0\" y=\"106.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eКлиенты региона\u003c/text\u003e\u003crect x=\"430\" y=\"65\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"575.0\" y=\"106.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eЦентральное ядро\u003c/text\u003e\u003crect x=\"40\" y=\"285\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"185.0\" y=\"326.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eПоиск + медиа региона\u003c/text\u003e\u003crect x=\"430\" y=\"285\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"575.0\" y=\"326.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eРасчёты + сверка\u003c/text\u003e\u003cpath d=\"M330 100 L430 100\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"430,100 420.3,105.3 420.3,94.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"90.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eкоманды\u003c/text\u003e\u003cpath d=\"M185 135 L185 285\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"185,285 179.7,275.3 190.3,275.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"185.0\" y=\"200.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eчтение\u003c/text\u003e\u003cpath d=\"M575 135 L575 285\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"575,285 569.7,275.3 580.3,275.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"575.0\" y=\"200.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eфинансовый процесс\u003c/text\u003e\u003cpath d=\"M575 135 L185 285\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"185,285 192.1,276.6 195.9,286.5\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"200.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eпроекции\u003c/text\u003e\u003ctext x=\"380\" y=\"430\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"17\" fill=\"#dbeafe\"\u003eПри обрыве к ядру сохраняется просмотр, но не подтверждение заказа\u003c/text\u003e","caption":"Итоговая топология реализует выбранный вариант B. Региональные копии производны, финансовое владение не распределяется. При потере связи интерфейс различает локальный черновик и устойчиво принятый заказ."}],"decision":{"prompt":"Какой вариант защитить для третьего региона сейчас?","options":[{"title":"Централизация с улучшением канала","consequence":"Простой операционный контур","tradeoff":"Нет поиска при обрыве"},{"title":"Региональные производные контуры, центральная запись","consequence":"Локальное чтение при сохранении владельца фактов","tradeoff":"Нельзя подтверждать новый заказ без ядра"},{"title":"Региональное владение заказами","consequence":"Локальная запись и меньшая зависимость от канала","tradeoff":"Сложнее перенос, сверка и эксплуатация"}],"recommended":1,"explanation":"Измеренные проблемы относятся к чтению и медиа, а обязательность автономной записи не доказана. Выбран меньший переход с ясной границей деградации."},"exercise":{"prompt":"Сформулируйте сценарий для таймаута оплаты, который можно проверить.","model":"\u003cp\u003eВо время пика провайдер выполняет платёж, но ответ теряется. Система сохраняет неизвестный исход, повтор с тем же ключом не создаёт второго списания, а сверка приводит заказ к подтверждённому состоянию в заданный срок. Точный срок выбирается требованиями и проверяется репетицией.\u003c/p\u003e","rubric":["Есть окружение и воздействие","Есть измеримая реакция","Сохранён финансовый инвариант"]},"checkpoint":[{"question":"Что делает альтернативу полезной для совета?","options":["Она заведомо хуже выбранной","Она жизнеспособна и сравнивается по тем же сценариям","Она содержит больше технологий"],"answer":1,"explanation":"Сравнение должно раскрывать настоящую цену и условия выбора."},{"question":"Что делать с непроверенным RTO?","options":["Записать желаемую цифру как гарантию","Зафиксировать риск и провести восстановление с измерением","Считать его равным времени запуска контейнера"],"answer":1,"explanation":"Восстановление включает данные, зависимости и подтверждение рабочего результата."}],"sources":[{"title":"SEI: Architecture Tradeoff Analysis Method Collection, 2018","url":"https://www.sei.cmu.edu/library/architecture-tradeoff-analysis-method-collection/"},{"title":"Simon Brown: C4 model","url":"https://c4model.com/"},{"title":"DORA: loosely coupled teams","url":"https://dora.dev/capabilities/loosely-coupled-teams/"}],"wordCount":1516}],"worlds":[{"id":"money","title":"Мир денег: платежи, кошельки и финансовый учёт","briefing":"Знакомая сумма на экране скрывает несколько разных фактов: распоряжение принято, средства заблокированы, расчёт завершён, запись попала в учёт. Этот паспорт помогает отличить быстрый интерфейс от корректного денежного процесса.","signature":{"truth":"Подтверждённый денежный факт и история его основания","traffic":"Точечные записи, запросы статуса, события, реестры и сверка","latency":"Раздельные бюджеты приёма и окончательного расчёта","risk":"Повторный эффект, пропуск операции, неразрешённая неопределённость","cost":"Эксплуатация, надёжность, проверки и обработка спорных операций"},"entryScenario":"Учебный кошелёк должен перевести 1200 рублей со счёта А на счёт Б. Клиент потерял ответ и нажал повтор. Нужна определённость о прежнем действии, а не просто ещё один успешный HTTP-запрос.","sections":[{"title":"Что продаёт бизнес и что считается истиной","html":"\u003cp\u003eПлатёжный сервис продаёт возможность безопасно изменить денежные обязательства и получить достоверное подтверждение. Источник истины зависит от факта. Локальная запись может подтверждать принятие распоряжения, а окончательный расчёт происходит у внешнего участника. Статус «принят» не следует автоматически называть «оплачен». Отдельно определите, какое событие увидит клиент и что сможет доказать поддержка.\u003c/p\u003e\u003cp\u003eУчётная модель должна сохранять сумму, валюту, идентификатор операции, участников и основание изменения. Двойная запись полезна для сохранения связанной истории дебета и кредита, но сама по себе не исправляет неверные бизнес-правила или повтор внешней команды. Корректность включает контроль допустимых переходов и право на действие. Отчёт по агрегированному балансу не заменяет проверку конкретных проводок.\u003c/p\u003e"},{"title":"Три контура вместо одного success","html":"\u003cp\u003eРазделите приём намерения, исполнение и наблюдение результата. У операции есть устойчивый business_id и понятная машина состояний. API может быстро подтвердить принятие и позволить получить конечный статус позднее. Если партнёр ответил с задержкой или ответ потерялся, операция становится неопределённой, а не автоматически неуспешной. Поддержка должна видеть причину и следующий шаг.\u003c/p\u003e\u003cp\u003eСверка восстанавливает соответствие между надёжными источниками: принятые распоряжения, внешний реестр, учёт. Она проверяет идентификаторы, сумму, валюту, статус и допустимое запаздывание. Равные количества строк не исключают двух пропусков и двух дублей. Неразобранные расхождения получают владельца и срок. Это часть проектирования, а не бесконечная ручная работа после запуска.\u003c/p\u003e"},{"title":"Повторы и транзакционные границы","html":"\u003cp\u003eЛокальная транзакция может атомарно сохранить намерение, изменение счёта и запись outbox в одной БД. Она не включает произвольный HTTP-вызов внешнего провайдера. Если приложение упало после внешнего списания, локальный rollback не отменит внешний факт. Нужны согласованный идемпотентный контракт, поиск по прежнему идентификатору и восстановление состояния.\u003c/p\u003e\u003cp\u003eСрок действия ключа повторов имеет значение. Если клиент возвращается после двух суток, а провайдер хранит ключ сутки, прежняя защита может уже не действовать. Система должна знать собственный устойчивый результат либо ограничить такой повтор. Число retries и backoff регулируют нагрузку, но не создают бизнес-безопасность. Отдельно испытывают позднее подтверждение, повтор уведомления и конфликт параметров одного ключа.\u003c/p\u003e"},{"title":"Кэш, нагрузка и интерфейсы","html":"\u003cp\u003eФинтех не означает отсутствие кэша. Справочники, публичные курсы с указанной актуальностью, доступные предложения и части истории могут кэшироваться по согласованному правилу. Решение о доступном остатке для операции требует своей гарантии и источника. Опасно превращать устаревший отображаемый баланс в разрешение нового списания.\u003c/p\u003e\u003cp\u003eB2C часто добавляет короткие мобильные сессии, повтор после обрыва сети и массовые чтения. B2B может усиливать пакетные реестры, несколько подписантов, расписания и корпоративные права. Это различие сценариев, а не правило «один высоконагруженный, другой нет». В одном продукте могут сосуществовать оба профиля и общая учётная база.\u003c/p\u003e"},{"title":"Что ломается и как выглядит готовность","html":"\u003cp\u003eКритический тест разрывает ответ после успешного внешнего исполнения. Затем система получает повтор клиента, позднее уведомление и повторный запуск обработчика. Проверяем не только отсутствие ошибки API, но и единственный разрешённый денежный эффект, сохранение истории и достижение определённого состояния. Отдельно проверяем восстановление БД и полномочия на возврат.\u003c/p\u003e\u003cp\u003eНоль наблюдавшихся дублей не доказывает нулевую вероятность. Нужны объяснённые механизмы защиты и проверка перечисленной модели отказов. SLO по технической доступности не является бюджетом допустимых неверных списаний. Перенос ответственности на провайдера тоже не делает безопасным локальное обещание клиенту.\u003c/p\u003e"},{"title":"Как переносить опыт в другой бизнес","html":"\u003cp\u003eЗнания о намерении, подтверждении, повторе и сверке пригодятся в бронировании, логистике и управлении устройствами. Но денежный возврат не равен физическому откату: комиссию или уже понесённые расходы может быть нельзя устранить автоматически. При переходе в геосервис сохраните дисциплину состояний и добавьте свежесть координат, пространственный поиск и оптимизацию назначения. Не начинайте изучение новой отрасли с отказа от того, что уже умеете.\u003c/p\u003e"}],"transfer":["Состояния операции, идентичность повтора и сверка","Локальные инварианты и проверка внешнего эффекта","Отделение технического SLO от корректности бизнеса"],"distinct":["Семантика денежного учёта и конечного расчёта","Права на финансовое действие и история оснований"],"compare":[{"world":"inventory","title":"Деньги и последний билет","html":"\u003cp\u003eОба сценария защищают ограниченный ресурс от конкурентного использования. В билете появляется срок резерва, а в оплате — внешний эффект, который может завершиться после потери ответа. Общее слово «транзакция» не делает эти границы одинаковыми.\u003c/p\u003e"}],"sources":[{"title":"Ю Kassa: формат взаимодействия и идемпотентность, актуальные условия проверять у провайдера","url":"https://yookassa.ru/developers/using-api/interaction-format"},{"title":"PostgreSQL18: изоляция транзакций","url":"https://www.postgresql.org/docs/18/transaction-iso.html"}]},{"id":"inventory","title":"Мир ограниченного ресурса: торговля, билеты и бронирование","briefing":"Товар в каталоге, свободный номер и место на мероприятии выглядят доступными тысячам людей одновременно. Бизнес должен превратить просмотр в обязательство, не пообещав один ресурс дважды.","signature":{"truth":"Подтверждённый резерв в заданной границе запаса","traffic":"Чтений много, записи концентрируются на популярных объектах","latency":"Разная свежесть витрины и подтверждения резерва","risk":"Oversell, истёкший резерв, гонка оплаты и отмены","cost":"Ёмкость пиков, хранение каталога, поиск и исполнение заказа"},"entryScenario":"В учебном магазине осталось десять одинаковых комплектов. Акция привела пять тысяч читателей и сто одновременных попыток купить. Нужно различить просмотр, резерв и подтверждённую продажу.","sections":[{"title":"Ресурс и обещание","html":"\u003cp\u003eНачните с определения границы: остаток товара на конкретном складе, один номер на конкретные даты, место на конкретный сеанс. Количество само по себе недостаточно. Номер свободен на одну ночь и занят на другую; доставка имеет вместимость и временной интервал; товар может быть в продаже, но недоступен для нужного региона.\u003c/p\u003e\u003cp\u003eРазделите предложение, временный резерв и окончательное подтверждение. Бизнес определяет, допустимо ли принять заявку без гарантированного ресурса и когда пользователь получает обещание. Архитектура затем обеспечивает именно это правило. Если внешняя WMS недоступна, кэш витрины не создаёт права резервировать её запас. Возможен отдельный заранее делегированный пул, но это самостоятельный механизм с правилами возврата.\u003c/p\u003e"},{"title":"Конкуренция вместо простого счётчика","html":"\u003cp\u003eЧтение count=1 и последующая запись count=0 двумя запросами создают гонку: два клиента могут увидеть один и тот же ресурс. Защита должна объединять проверку и изменение. Например, условное атомарное обновление уменьшает доступность только при достаточном количестве; для другого инварианта нужны блокировка, ограничение или иной протокол. Проверяют результат изменения, а не просто отсутствие исключения.\u003c/p\u003e\u003cp\u003eПопулярный товар создаёт горячую строку или ключ. Дополнительные API-процессы увеличивают конкуренцию, но не делают один неделимый ресурс параллельным. Шардинг по товару тоже не дробит один горячий товар автоматически. Сначала измеряют ожидания и предел операции, затем обсуждают очереди, ограничение входа и изменение представления ресурса. Нельзя распределить один физический комплект между шардами без общей модели.\u003c/p\u003e"},{"title":"Время, резерв и внешний платёж","html":"\u003cp\u003eРезерв имеет идентификатор, владельца, состояние и срок. Истечение срока должно быть согласовано с подтверждением оплаты. Если оплата успела пройти, а уборщик резервов уже вернул товар, система обязана определить следующий допустимый шаг: восстановить резерв при наличии, компенсировать или передать спор в разбор. Фоновое удаление по TTL не является полной бизнес-машиной состояний.\u003c/p\u003e\u003cp\u003eЧасы и задержки создают пограничные случаи. Время клиентского устройства не должно единолично определять право на ресурс. Запоздавшее событие может описывать платёж, выполненный до истечения. Укажите, какое время и источник являются основанием перехода. Повтор создания резерва с тем же ключом должен вернуть прежний результат, а не занимать ещё один комплект.\u003c/p\u003e"},{"title":"Каталог, поиск и чтение","html":"\u003cp\u003eКаталог обслуживает описание, изображения, фильтры и предварительную доступность. Для него полезны поисковый индекс, CDN и кэш. Эти производные копии могут иметь допустимый lag. Окончательная цена и резерв подтверждаются по правилу покупки; снимок условий сохраняется в заказе. Изменившийся завтра каталог не должен переписывать вчерашнюю сделку.\u003c/p\u003e\u003cp\u003eСезонная акция меняет распределение, а не только общий RPS. Тысяча запросов к разным товарам и тысяча к одному остатку нагружают систему по-разному. В нагрузочном профиле нужны hot set, одновременные корзины, отмены и повторы. При потере кэша оцените поток в источник. Деградация рекомендаций может освободить ресурсы для оформления, если заранее согласована.\u003c/p\u003e"},{"title":"История против состояния","html":"\u003cp\u003eПользователю нужно текущее состояние, поддержке — история переходов, аналитике — поток фактов. Они могут использовать разные модели хранения с общей идентичностью операции. Возврат и отмена не удаляют факт продажи из истории; они добавляют новые основания изменения. Внешние складские движения могут приходить поздно и требовать сверки.\u003c/p\u003e\u003cp\u003eБронирование гостиницы добавляет интервалы и изменения дат, билет — индивидуальное место, производство — партии и срок годности. Прежде чем переносить решение магазина, выясните математическую модель ресурса. Общая схема «корзина→оплата» скрывает самые важные отличия этих бизнесов.\u003c/p\u003e"},{"title":"Учебная проверка","html":"\u003cp\u003eСмоделируйте десять комплектов, сто конкурирующих запросов, потерю ответа у двух клиентов и позднюю оплату одного истёкшего резерва. Сверьте активные резервы, подтверждённые продажи и свободный запас. Затем выключите витринный кэш. Корректность должна сохраниться при более медленной или ограниченной выдаче, а не держаться на случайно низкой конкуренции.\u003c/p\u003e"}],"transfer":["Атомарное изменение ограниченного ресурса","Повторы, состояния и компенсации","Разделение витрины и подтверждённого факта"],"distinct":["Срок резерва, интервалы, единицы запаса и физическое исполнение","Горячие объекты и связь оплаты с истечением резерва"],"compare":[{"world":"geo","title":"Остаток товара и свободный курьер","html":"\u003cp\u003eОба ресурса ограничены, но курьер движется, меняет доступность и может отказаться. Резервирование требует свежего наблюдения и протокола подтверждения, а качество назначения оценивается ещё и временем подачи.\u003c/p\u003e"}],"sources":[{"title":"PostgreSQL18: конкурентность и изоляция","url":"https://www.postgresql.org/docs/18/transaction-iso.html"},{"title":"OzonTech: буферизация резервирования, публикация 2025; исторический пример, не универсальная схема","url":"https://habr.com/ru/companies/ozontech/articles/950044/"}]},{"id":"search","title":"Мир выбора: поиск, объявления, реклама и рекомендации","briefing":"Здесь результатом становится не одна найденная строка, а полезный порядок объектов. Быстрый ответ может быть бесполезным, а качественный ответ — слишком дорогим для нужной задержки.","signature":{"truth":"Исходный объект плюс версия производного индекса и модели","traffic":"Много чтений, массовая индексация, ML-признаки и события поведения","latency":"Короткий бюджет поиска и отдельно допустимый lag индекса","risk":"Пропуск подходящего объекта, устаревшее предложение, ошибочный доступ","cost":"Индексирование, память, вычисление ranking, эксперименты и хранение"},"entryScenario":"В каталоге миллионы предложений. Пользователь пишет «тёплая куртка на осень», а SQL-поиск по точному названию не находит нужное. Нужно получить кандидатов, оценить их и не показать уже недоступное.","sections":[{"title":"Поиск — конвейер с разными задачами","html":"\u003cp\u003eРазличайте получение кандидатов и их ранжирование. Первый этап стремится быстро собрать достаточно подходящих объектов; второй выбирает порядок с более дорогими признаками и моделями. Иногда нужен дополнительный переранжирующий этап для разнообразия, бизнес-ограничений или персонализации. Если первый этап потерял хороший объект, модель на последнем его уже не вернёт.\u003c/p\u003e\u003cp\u003eДля объяснения качества полезны понятия полноты и точности. Высокая полнота сохраняет подходящие результаты, высокая точность уменьшает долю лишних. В реальном продукте добавляются полезность верхних позиций, разнообразие, свежесть и бизнес-результат. Одна метрика клика может поощрять привлекательные, но бесполезные предложения. Согласуйте, какой эффект действительно нужен пользователю.\u003c/p\u003e"},{"title":"Индекс и источник","html":"\u003cp\u003eИнвертированный индекс связывает термины с документами и позволяет быстро отобрать объекты по словам. Полнотекстовый поиск требует обработки языка, форм слов и опечаток. Векторный поиск помогает искать по сходству представлений, но не гарантирует выполнения точных условий. Гибрид сочетает сигналы, после чего всё равно нужны фильтры прав, региона, цены и доступности.\u003c/p\u003e\u003cp\u003eПоисковая копия отделена от источника истины. Обновление объявления может ещё не попасть в индекс; удаление и изменение прав тоже требуют доставки. Укажите версию и допустимый возраст, наблюдайте отставание. Перестроение индекса должно иметь маршрут проверки и переключения: существующие запросы не обязаны ждать окончания полного rebuild.\u003c/p\u003e"},{"title":"Разные бизнесы используют похожую воронку","html":"\u003cp\u003eУ объявлений важны актуальность, география и модерация; у товарного поиска — свойства и наличие; у найма — совместимость требований и кандидата; у рекламы — ограничения кампании, бюджет и полезность показа. Общий паттерн candidate retrieval→ranking переносится, но целевая функция и допустимые последствия ошибки меняются.\u003c/p\u003e\u003cp\u003eРекомендации могут начинаться без явного поискового запроса. Сигналами служат история и контекст, а для новых пользователей возникает cold start. Нельзя считать, что наличие большой истории автоматически улучшает качество: данные могут отражать старые правила показа и смещения. Эксперимент должен сравнивать сопоставимые группы и учитывать долгосрочный эффект.\u003c/p\u003e"},{"title":"ML внутри бюджета задержки","html":"\u003cp\u003eРасчёт сотен дорогих признаков для миллиона объектов не поместится в короткий ответ. Многоступенчатая воронка уменьшает множество на каждом этапе: дорогой скорер работает с меньшим числом кандидатов. Некоторые признаки рассчитываются заранее, другие — онлайн. Предрасчёт ускоряет ответ ценой свежести и поддержки pipeline.\u003c/p\u003e\u003cp\u003eЛокальный успех модели на отложенном наборе не гарантирует production-эффект. Проверьте совместимость признаков, версию модели, задержку serving, поведение при отсутствии признака и качество по сегментам. Ошибка общего feature-сервиса может ухудшить несколько продуктов одновременно. Fallback должен выдавать допустимый результат, пусть и менее персонализированный.\u003c/p\u003e"},{"title":"Наблюдать полезность, а не только p99","html":"\u003cp\u003eИзмеряйте задержку этапов, пустые выдачи, отставание индекса, отсутствие признаков и нарушения фильтров. Добавьте продуктовую проверку на понятных сценариях. Ускоренный поиск, который игнорирует обязательный регион, не является улучшением. Отдельно проверьте документы разных организаций: найденный закрытый объект нельзя просто спрятать после передачи его генеративной модели.\u003c/p\u003e\u003cp\u003eДля публикаций реальных компаний фиксируйте дату. Разбор AvitoTech от 30 сентября 2024 года показывает этапность поиска и ранжирования, но не является обещанием, что весь текущий стек компании совпадает с нарисованной схемой. В курсе используется логика задач и решений, а не выдуманная реконструкция чужого production.\u003c/p\u003e"},{"title":"Мост к генеративному поиску","html":"\u003cp\u003eRAG добавляет генерацию поверх найденного контекста. Он наследует проблемы полноты, актуальности и прав поиска, затем добавляет собственные риски ответа. Если retrieval не получил нужный регламент, сильная модель может лишь убедительнее заполнить пробел. Проверяйте поиск и объяснение отдельно. Наличие ссылки в ответе полезно только когда она действительно подтверждает утверждение и доступна этому пользователю.\u003c/p\u003e"}],"transfer":["Индексация, производные модели чтения и lag","Версионирование pipeline и испытание отказов","Раздельные показатели технического и бизнес-качества"],"distinct":["Candidate retrieval и многоэтапный ranking","ML-признаки, cold start и оценка качества выдачи"],"compare":[{"world":"money","title":"Поиск товара и проверка платежа","html":"\u003cp\u003eПоиск допускает несколько полезных вариантов ранжирования. У факта списания не должно быть «примерно релевантного» ответа. Генеративное объяснение может помогать поддержке, но факт операции по-прежнему определяется надёжным источником.\u003c/p\u003e"}],"sources":[{"title":"AvitoTech: поисковое ранжирование,30.09.2024","url":"https://habr.com/ru/companies/avito/articles/846832/"},{"title":"Elasticsearch: инвертированный индекс и базовые понятия","url":"https://www.elastic.co/docs/solutions/search"}]},{"id":"geo","title":"Мир движения: карты, такси и назначение исполнителей","briefing":"На карте можно нарисовать точку, но для полезного назначения нужно знать, где объект был, насколько свежо наблюдение, может ли он выполнить заказ и когда действительно приедет.","signature":{"truth":"Положение с временем наблюдения и подтверждённое назначение","traffic":"Поток координат, геопоиск, маршрутизация, события заказа","latency":"Свежесть позиции, время ответа и качество ETA — разные ограничения","risk":"Устаревшее назначение, двойной исполнитель, невыполнимый маршрут","cost":"Обновления индексов, расчёт маршрутов, модели и связь с устройствами"},"entryScenario":"В городе три свободных курьера. Ближайший по прямой находится за рекой без удобного переезда, другой только что потерял связь, третий может приехать быстрее по дороге. Как выбрать?","sections":[{"title":"Разделить пространственный поиск и маршрут","html":"\u003cp\u003eГеоиндекс быстро сокращает кандидатов по области и пространственному отношению. Это не готовый ответ о времени поездки. Расстояние по прямой и длина маршрута различаются; дорожный граф учитывает соединения, направления и другие ограничения. ETA — оценка времени прибытия при текущих условиях и неопределённости, а не просто километры, делённые на константу.\u003c/p\u003e\u003cp\u003eКарты, такси и логистика используют общие данные, но решают разные задачи. Карта должна хранить и показывать пространственные объекты; навигация строит путь; такси назначает доступного исполнителя; планирование доставок распределяет множество остановок с временными и ресурсными ограничениями. Один универсальный «геосервис» скрывает различия этих функций.\u003c/p\u003e"},{"title":"Координата — наблюдение, а не вечная истина","html":"\u003cp\u003eХраните вместе с позицией время измерения, время получения, точность и источник. Устройство может отправить накопленные точки после восстановления сети. Если сортировать только по поступлению, старое измерение перезапишет новое и машина «вернётся» в прежнее место. Порядок и идентичность событий должны учитывать протокол устройства.\u003c/p\u003e\u003cp\u003eДля свежего поиска нужен небольшой рабочий набор последних допустимых наблюдений, а для аналитики — история перемещения. Они имеют разные access patterns и сроки хранения. Подпись «курьер рядом» требует политики допустимого возраста. Нельзя молча компенсировать неизвестную позицию тем, что в базе осталась старая точка. Модель должна уметь сказать «местоположение устарело».\u003c/p\u003e"},{"title":"Назначение — конкурентный протокол","html":"\u003cp\u003eНесколько заказов могут одновременно выбрать одного курьера. Поэтому выбор кандидата и подтверждённое назначение различаются. Есть предложение, срок ожидания, принятие или отказ и защита от несовместимых назначений. Временная аренда права может истечь, пока исполнитель отвечает. Позднее принятие проверяется по актуальному идентификатору предложения, а не автоматически меняет заказ.\u003c/p\u003e\u003cp\u003eЖадное назначение ближайшего кандидата может быть хорошим простым стартом, но не минимизировать общий простой всех участников. Пакетное matching сопоставляет несколько заказов и исполнителей с общей целевой функцией, добавляя ожидание и вычисления. Качество оценивается не только скоростью алгоритма: важны подача, отмены, загрузка и достижимое число выполненных заказов.\u003c/p\u003e"},{"title":"Регионы и неравномерность","html":"\u003cp\u003eГородское распределение очень неоднородно. Вокзал после концерта и тихий пригород имеют разный спрос, скорость обновлений и число кандидатов. Разбиение по географическим ячейкам удобно, пока пограничные запросы и горячие зоны не становятся главной проблемой. Индекс должен учитывать соседние области, иначе ближайший исполнитель за границей ячейки пропадёт.\u003c/p\u003e\u003cp\u003eПерераспределение регионов меняет владельца данных и вычислений. В момент переключения важно не потерять позицию и не создать два центра назначения. Здесь знакомые fencing и единственный владелец записи соединяются со свежестью и пространственной локальностью. Не требуется одинаково сильная согласованность всей истории трека и критического права на назначение.\u003c/p\u003e"},{"title":"Проверка качества","html":"\u003cp\u003eСценарий испытания включает быстро движущийся объект, запоздавший пакет точек, обрыв связи, два конкурирующих заказа и отказ сервиса маршрутов. Считайте возраст позиции, точность ETA по сегментам, процент невыполнимых назначений и время перехода к следующему кандидату. Низкий p99 геопоиска не спасает от систематически неверной подачи.\u003c/p\u003e\u003cp\u003eОпубликованный в 2019 году разбор Яндекс.Такси полезен как сравнение жадного подхода и более общего назначения. Мы используем объяснённые там задачи как исторический источник насмотренности, а вымышленный проект строим со своими условиями. Не переносим чужие числа и не обещаем воспроизвести текущую архитектуру компании.\u003c/p\u003e"},{"title":"Переход из финансовых систем","html":"\u003cp\u003eСохраните дисциплину состояний, повторов, подтверждения и аудита. Добавьте пространственную модель, возраст наблюдения, оптимизацию общего распределения и связь с физическим исполнителем. В отличие от проводки, координата допустимо устаревает и уточняется; в отличие от предварительной точки, подтверждённое назначение создаёт обязательство. Это различие позволяет выбрать отдельные гарантии для каждого факта.\u003c/p\u003e"}],"transfer":["Состояния, подтверждение и идемпотентность назначения","Владение данными и безопасное переключение","Сверка цифрового состояния с внешним фактом"],"distinct":["Геоиндекс, дорожный граф, ETA и пространственные границы","Возраст наблюдений и оптимизация matching"],"compare":[{"world":"telemetry","title":"Курьер и промышленный датчик","html":"\u003cp\u003eОба присылают наблюдения с временем и возможным запаздыванием. Курьер дополнительно участвует в назначении и может отказаться, а датчик может потребовать локального управления при разрыве связи. Поток измерений не следует считать доказательством исполнения команды.\u003c/p\u003e"}],"sources":[{"title":"PostGIS: пространственные запросы","url":"https://postgis.net/docs/using_postgis_query.html"},{"title":"Яндекс: распределение заказов,07.02.2019; исторический кейс","url":"https://habr.com/ru/companies/yandex/articles/439182/"}]},{"id":"collaboration","title":"Мир общего состояния: чаты, документы и игры","briefing":"Пользователи видят один разговор или документ с разных устройств, иногда offline. Система должна объяснить порядок, доставку и результат одновременных действий, а не только держать открытый сокет.","signature":{"truth":"Сохранённое сообщение или допустимо объединённое изменение","traffic":"Долгоживущие соединения, fan-out и синхронизация после offline","latency":"Ответ интерфейса, доставка, прочтение и синхронизация различаются","risk":"Потери, дубли, конфликт изменений, неверные права","cost":"Число соединений, распространение, история и хранение вложений"},"entryScenario":"Два диспетчера редактируют один маршрутный документ; один потерял сеть. Параллельно клиент отправляет сообщение с телефона и затем открывает ноутбук. Что именно должно сойтись?","sections":[{"title":"Соединение и состояние не одно и то же","html":"\u003cp\u003eWebSocket обеспечивает двусторонний обмен поверх соединения, SSE удобен для потока сервера к клиенту, polling может быть приемлем при редком изменении. Выбор транспорта не определяет хранение истории, права, идемпотентность и семантику подтверждения. После разрыва нужен протокол получения пропущенного, а не вера в «реальное время».\u003c/p\u003e\u003cp\u003eУ сообщения есть клиентский идентификатор, сохранённый серверный факт и отдельные подтверждения. «Отправлено», «доставлено устройству» и «прочитано человеком» — разные события с разной доказуемостью. Одно устройство пользователя может быть онлайн, другое — нет. Модель должна определять, какое наблюдение соответствует каждой отметке интерфейса.\u003c/p\u003e"},{"title":"Порядок и fan-out","html":"\u003cp\u003eНельзя автоматически обещать единый глобальный порядок всех разговоров. Часто достаточно порядка внутри диалога или версии документа. Сервер может присваивать последовательность после приёма; клиентский timestamp сам по себе ненадёжен из-за разных часов и offline. Повтор с прежним message_id не должен создавать новое сообщение.\u003c/p\u003e\u003cp\u003eFan-out — распространение одного события многим получателям. Можно готовить персональные потоки при записи либо собирать их при чтении; есть и гибрид. Большая публичная группа, приватный диалог и уведомление сотрудникам компании имеют разную стоимость распространения. Расчёт «RPS сообщений» без числа адресатов скрывает главный множитель нагрузки.\u003c/p\u003e"},{"title":"Одновременное редактирование","html":"\u003cp\u003eЗамена всего документа последней записью проста, но может стереть чужую работу. Optimistic concurrency проверяет версию и требует разрешить конфликт. Operational Transformation и CRDT задают другие модели совместного изменения. Они требуют понимания операций, доставки, идентичности и истории; это не настройка WebSocket.\u003c/p\u003e\u003cp\u003eCRDT может обеспечить сходимость поддерживаемых операций при выполнении предпосылок, но не гарантирует, что итог выражает бизнес-намерение. Два редактора могут согласованно получить документ с двумя несовместимыми назначениями. Критические доменные правила всё равно нуждаются в отдельной проверке. Библиотека синхронизации текста не превращается автоматически в систему финансового учёта.\u003c/p\u003e"},{"title":"Offline и права","html":"\u003cp\u003eКлиент хранит локальные изменения и курсор синхронизации. После подключения он отправляет повторяемые операции и получает историю после известной позиции. Ограничьте объём восстановления, обработайте удаление объекта и изменение доступа. Если пользователь лишился прав во время offline, его старое разрешение не должно автоматически давать право применить новые изменения.\u003c/p\u003e\u003cp\u003eПрисутствие «онлайн» обычно является временным наблюдением, а не вечным фактом. Оно может исчезать по тайм-ауту или иметь задержку; ошибка presence не должна повреждать сохранённые сообщения. Разделяйте эфемерные сигналы набора текста и долговечную историю. Для них нужны разные гарантии и хранение.\u003c/p\u003e"},{"title":"Почему игры выделяются внутри этого мира","html":"\u003cp\u003eМногопользовательская игра тоже синхронизирует состояние, но может иметь авторитетный серверный шаг, строгий бюджет задержки и компенсацию сетевых расхождений. Нельзя свободно принять любое позднее действие как редактуру документа. История, физика, защита от нечестного клиента и допустимость исправления экрана задают другие ограничения.\u003c/p\u003e\u003cp\u003eMatchmaking игры отличается от назначения курьера целевой функцией: подходят ли игроки по навыку, региону и ожиданию. Общий паттерн подбора ограниченного набора переносится, но качество и границы отказа меняются. В курсе это сравнительная экспедиция, а не обязательное создание собственного игрового движка.\u003c/p\u003e"},{"title":"Проверка без магии realtime","html":"\u003cp\u003eПроверьте повтор отправки, перезагрузку клиента, разрыв после сохранения, изменение прав и два параллельных изменения. Затем восстановите состояние на новом устройстве. Результат должен объясняться протоколом и версиями, а не только визуально «работать в двух вкладках». Отдельно измерьте задержку распространения и объём истории, необходимый для возврата после долгого offline.\u003c/p\u003e"}],"transfer":["Идентификаторы операций, повторы и курсоры истории","События, хранение и границы доступа","Раздельные гарантии факта и наблюдения"],"distinct":["Fan-out, долгоживущие соединения и offline-синхронизация","Модели конкурентного редактирования и смысл сходимости"],"compare":[{"world":"geo","title":"Общий документ и назначение курьера","html":"\u003cp\u003eСогласованно объединить текстовые изменения бывает допустимо. Два назначения одного курьера нельзя исправить одним слиянием строк: нужен бизнес-инвариант и подтверждённое владение ресурсом. Одинаковый realtime-транспорт не делает модели состояния одинаковыми.\u003c/p\u003e"}],"sources":[{"title":"RFC6455: WebSocket","url":"https://www.rfc-editor.org/rfc/rfc6455"},{"title":"Yjs: shared data types и CRDT, актуальные ограничения проверять по библиотеке","url":"https://docs.yjs.dev/"}]},{"id":"media","title":"Мир больших потоков: видео, музыка и трансляции","briefing":"Миллион зрителей не означает миллион одинаковых транзакций. Главными становятся объём передаваемых данных, подготовка контента, близость копии и качество воспроизведения.","signature":{"truth":"Исходный объект, проверенные производные версии и права просмотра","traffic":"Крупные загрузки, обработка, многократная доставка сегментов","latency":"Время старта, остановки воспроизведения и задержка live","risk":"Потеря исходника, неполная обработка, массовый cache miss","cost":"Хранение, сетевой трафик, транскодирование и геораспределённая ёмкость"},"entryScenario":"Компания разрешила продавцам прикреплять видео товара. Файлы загружаются с мобильной сети, часть загрузок обрывается, зрители используют разные скорости связи. Одной колонки video_blob уже недостаточно.","sections":[{"title":"Объект, метаданные и производные","html":"\u003cp\u003eРазделите бинарный объект и метаданные: владелец, версия, размер, checksum, права, статус обработки. Объектное хранилище удобно для больших неизменяемых объектов; транзакционная база хранит связанное описание. Между ними нет общей транзакции по умолчанию. Поэтому статус «готов» должен появляться после проверки существования и допустимости нужных версий.\u003c/p\u003e\u003cp\u003eИсходник и производные имеют разную ценность. Потерянную уменьшенную картинку можно восстановить, если исходник сохранён и pipeline воспроизводим. Удаление оригинала ради экономии меняет возможность повторной обработки. Срок хранения и права должны охватывать копии, thumbnails, CDN и резервные данные, а не только запись каталога.\u003c/p\u003e"},{"title":"Загрузка при плохой сети","html":"\u003cp\u003eБольшой файл нельзя заставлять начинать заново при каждом обрыве. Протокол порционной загрузки фиксирует идентификатор сессии, части и условие завершения. Нужны срок жизни незавершённых частей, проверка размера и контроль целостности. URL для загрузки должен иметь ограниченные права и срок, а не открывать произвольную запись в хранилище.\u003c/p\u003e\u003cp\u003eЗавершение приёма не означает готовность к показу. Проверка безопасности, извлечение метаданных и подготовка форматов идут отдельно. Если один этап падает, задача должна повторяться без создания новых неконтролируемых объектов. Ограничивайте очередь и ресурсы обработки, чтобы загрузки не вытеснили критический путь заказов.\u003c/p\u003e"},{"title":"Подготовить контент под клиента","html":"\u003cp\u003eРазные разрешения и битрейты позволяют адаптировать воспроизведение к устройству и сети. Транскодирование создаёт несколько производных вариантов; упаковка разбивает поток на доступные клиенту части и описывает их. HLS — один из протоколов такой доставки, но наличие плейлиста не гарантирует правильной настройки всего pipeline.\u003c/p\u003e\u003cp\u003eКлиент выбирает допустимое качество по доступной скорости и состоянию буфера. Маленькие сегменты могут уменьшить часть задержки ценой большего числа запросов и накладных расходов; детали зависят от протокола и режима. Для live контент ещё появляется, поэтому время публикации, окно хранения и задержка до зрителя требуют отдельного проектирования.\u003c/p\u003e"},{"title":"CDN и origin","html":"\u003cp\u003eCDN распространяет копии ближе к пользователям и уменьшает обращения к исходному origin. Считайте байты и распределение популярности: один популярный фильм и множество уникальных приватных файлов имеют разный cache hit rate. Ключи и правила доступа должны не допустить выдачу приватного контента через общий кэш.\u003c/p\u003e\u003cp\u003eПотеря CDN-кэша может вернуть большой поток к origin. Нужны ёмкость, объединение одинаковых запросов, ограничение входа и постепенный прогрев. Географическая распределённость доставки не означает, что исходник и метаданные автоматически отказоустойчивы. Проверяйте цепочку от права пользователя до конкретного сегмента.\u003c/p\u003e"},{"title":"Наблюдаемость со стороны зрителя","html":"\u003cp\u003eСервер может успешно отдать все HTTP-ответы, а пользователь всё равно ждёт первого кадра или видит остановки. Метрики качества включают время старта, долю неудачных запусков, rebuffering и выбранное качество. Наблюдение должно учитывать клиентскую сеть и устройство. Один средний bitrate не описывает полезный опыт всех сегментов.\u003c/p\u003e\u003cp\u003eВ учебном расчёте тысяча одновременных зрителей по 3 Мбит/с потребует около 3 Гбит/с полезного потока без накладных расходов. Это другая модель ёмкости, чем тысяча запросов к небольшой JSON-ручке. Не путайте мегабиты и мегабайты, пиковую скорость и месячный объём. Финансовая модель должна отдельно учитывать обработку и доставку.\u003c/p\u003e"},{"title":"Отрасли на той же основе","html":"\u003cp\u003eОнлайн-кинотеатр, обучающие вебинары, телемедицинская видеосвязь и пользовательские ролики разделяют часть механизмов, но live-конференция добавляет двустороннюю коммуникацию, интерактивность и иной бюджет задержки. Поэтому предзаписанный курс через CDN нельзя без анализа объявить готовой платформой звонков. Кейс VK Видео используется как датированное свидетельство полного пути контента, не как универсальная инструкция.\u003c/p\u003e"}],"transfer":["Асинхронный pipeline, идемпотентность и версии","Права, жизненный цикл данных и отказ зависимостей","Кэш и защита источника при массовом промахе"],"distinct":["Байты, bitrate, кодирование, сегменты и CDN","Клиентские метрики воспроизведения и особая семантика live"],"compare":[{"world":"search","title":"Медиа и поиск","html":"\u003cp\u003eУ обоих есть исходные данные и производные копии. Перестроение индекса похоже на повторную обработку видео по необходимости версий и безопасного переключения, но поисковый запрос расходует вычисления и память, а доставка видео — прежде всего поток байтов и сеть.\u003c/p\u003e"}],"sources":[{"title":"RFC8216: HLS, informational specification2017; не описание всех современных расширений","url":"https://www.rfc-editor.org/rfc/rfc8216"},{"title":"VK: путь видео от загрузки до кадра, публикация 2026","url":"https://habr.com/ru/companies/vk/articles/1000000/"}]},{"id":"telemetry","title":"Мир наблюдений: устройства, промышленность и потоки событий","briefing":"Датчик сообщает, что произошло в физическом мире, иногда позже и несколько раз. Надёжная обработка должна сохранить смысл времени и не принять получение команды за её исполнение.","signature":{"truth":"Измерение с идентичностью, временем и происхождением","traffic":"Много последовательных событий, всплески после offline","latency":"Возраст измерения, задержка тревоги и доступность локального управления","risk":"Потери, дубли, неверный порядок, опасное действие по старому сигналу","cost":"Приём потока, хранение временных рядов, связь и парк устройств"},"entryScenario":"Холодильный склад передаёт температуру. Устройство 20 минут было offline, затем отправило накопленные измерения. Система получила старое превышение порога после нового нормального значения. Как объяснить историю и текущую тревогу?","sections":[{"title":"Наблюдение и три времени","html":"\u003cp\u003eРазделяйте event time — когда явление измерено, ingestion time — когда запись принята, и processing time — когда обработана. Эти значения отвечают на разные вопросы. Текущий экран может показывать последнее достоверное измерение, аналитика — строить историю по времени явления. Сортировка по времени приёма создаст неверную картину после offline.\u003c/p\u003e\u003cp\u003eЧасы устройства могут ошибаться. Сохраняйте источник, качество времени, последовательность и признаки точности. Не каждое расхождение можно исправить серверной датой: тогда потеряется смысл того, что измерялось до восстановления связи. Политика поздних данных должна явно определять, когда пересчитываем окно и как исправляем уже опубликованный результат.\u003c/p\u003e"},{"title":"Протокол не равен end-to-end гарантии","html":"\u003cp\u003eMQTT использует publish/subscribe и имеет уровни доставки в своих протокольных границах. Даже гарантия протокола не делает однократным весь внешний бизнес-эффект: обработчик мог записать тревогу и упасть до своего подтверждения. Идентификатор измерения, повторная обработка и атомарность локального изменения остаются задачами приложения.\u003c/p\u003e\u003cp\u003eДля устройства нужны регистрация, ограниченные учётные данные, обновление и отзыв доступа. Общий секрет всего парка повышает радиус компрометации. Подписка на тему должна соответствовать правам конкретного устройства или организации. Устройства часто обновляются медленнее серверов, поэтому совместимость формата и длительное сосуществование версий особенно важны.\u003c/p\u003e"},{"title":"Поток и временные ряды","html":"\u003cp\u003eХранилище выбирают по access patterns: последние значения, диапазон времени, агрегаты за час, поиск аномалий и долговременный архив. Одна строка «текущее состояние» не заменяет историю, а бесконечная история в транзакционной таблице может быть дорогой для всех задач. Retention, сжатие и понижение детализации зависят от смысла данных и требований.\u003c/p\u003e\u003cp\u003eПотоковый обработчик объединяет события в окна и поддерживает состояние. Watermark — механизм оценки продвижения event time, а не доказательство, что поздних данных больше никогда не будет. Определите допустимое опоздание и корректирующие результаты. Если тревога влияет на действие, правила отмены и пересмотра тоже должны быть видимыми оператору.\u003c/p\u003e"},{"title":"Edge и команды","html":"\u003cp\u003eEdge-обработка переносит часть вычислений ближе к устройству. Это может уменьшить задержку и сохранить ограниченную автономность при потере сети, но добавляет управление версиями, локальное состояние и восстановление синхронизации. Облачная платформа не должна быть единственным неиспытанным условием безопасности физического процесса.\u003c/p\u003e\u003cp\u003eКоманда «установить режим» имеет идентификатор, параметры, срок применимости и подтверждение результата. Получение MQTT-сообщения не доказывает, что исполнитель изменил физическое состояние. Нужны отдельный наблюдаемый результат, обработка повторов и запрет просроченных команд. Дальнейшие требования к безопасности конкретного оборудования определяются профильными специалистами; учебный пример не является инструкцией управления производством.\u003c/p\u003e"},{"title":"Ёмкость и восстановление","html":"\u003cp\u003eПосле массового восстановления связи устройства могут одновременно выгрузить backlog. Профиль приёма отличается от ровного среднего потока. Ограничьте конкуренцию, распределите повторы и оцените catch-up по разности обработки и входа. Если обработка 3000 событий/с, а новые измерения приходят 2500/с, на сокращение хвоста остаётся 500/с, а не 3000.\u003c/p\u003e\u003cp\u003eМетрики включают возраст последних измерений, долю пропусков, лаг, распределение версий устройств и подтверждённые действия. Низкий CPU при пустой очереди может означать, что устройства вообще перестали присылать данные. Для наблюдений отсутствие события само является возможным сигналом, если согласована частота и условия связи.\u003c/p\u003e"},{"title":"Что узнаёт специалист из другой отрасли","html":"\u003cp\u003eФинтех приносит идентичность, сверку и осторожность с повтором. Медиа — понимание потока и ограниченной связи. Новыми становятся качество физических наблюдений, время события, парк устройств и разделение команды от исполнения. Логистика использует ту же дисциплину для трекеров и сканеров: цифровая отметка должна иметь происхождение, а физическая доставка — отдельное подтверждение.\u003c/p\u003e"}],"transfer":["Очереди, повторы, версии и ограничения входа","История, восстановление и сверка источников","Права на действия и область внешнего эффекта"],"distinct":["Event time, поздние данные и качество часов","Устройства, edge и доказательство физического исполнения"],"compare":[{"world":"money","title":"Тревога и платёж","html":"\u003cp\u003eПозднее подтверждение нельзя считать новой операцией только из-за времени приёма. У платежа критичны сумма и единственный эффект, у датчика — время и качество наблюдения. В обоих случаях полезно сохранять происхождение и отдельно разрешать неопределённость.\u003c/p\u003e"}],"sources":[{"title":"OASIS MQTT5.0, стандарт 2019","url":"https://docs.oasis-open.org/mqtt/mqtt/v5.0/mqtt-v5.0.html"},{"title":"Apache Flink: event time и watermarks","url":"https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/"}]},{"id":"saas","title":"Мир организаций: корпоративный SaaS, документы и процессы","briefing":"В одной платформе работают разные компании, каждая со своими людьми, настройками и данными. Пользовательская функция должна оставаться изолированной, даже когда один клиент значительно крупнее остальных.","signature":{"truth":"Документ или операция в контексте конкретной организации и версии процесса","traffic":"Интерактивные CRUD-операции, поиск, экспорты, фоновые задания","latency":"Отклик интерфейса и срок завершения процесса различаются","risk":"Утечка между клиентами, неверные полномочия, noisy neighbor","cost":"Общие ресурсы, сопровождение конфигураций и вариативность клиентов"},"entryScenario":"Две организации ведут заявки в одном сервисе. КлиентА запускает миллионный экспорт, клиентБ пытается открыть свой документ. Одновременно сотрудник меняет роль, а его вчерашний токен ещё действует.","sections":[{"title":"Tenant — граница, а не параметр формы","html":"\u003cp\u003eTenant обозначает организационный контекст, который система использует для изоляции данных и ресурсов. Пользователь может работать в нескольких организациях с разными правами. Переданный с клиента tenant_id нельзя считать разрешением сам по себе: сервер устанавливает допустимый контекст из проверенной идентичности и полномочий.\u003c/p\u003e\u003cp\u003eПроверка должна сохраняться в REST, экспорте, поиске, кэше, фоновой задаче, вложении и аналитике. Удалённая из основного ответа строка не решает проблему, если её содержание уже попало в общий поисковый индекс или AI-контекст. На архитектурной схеме полезно нарисовать все копии и пути чтения, а не одну центральную БД.\u003c/p\u003e"},{"title":"Три модели размещения","html":"\u003cp\u003eМожно разделять клиентов по отдельным БД, схемам либо строкам общей модели. Каждая стратегия имеет цену в эксплуатации, миграциях, восстановлении и изоляции. Общая таблица упрощает массовое обновление, но требует систематического контроля контекста. Отдельная БД помогает некоторым требованиям изоляции, но не даёт бесплатного сопровождения тысяч клиентов.\u003c/p\u003e\u003cp\u003eRLS PostgreSQL может ограничивать видимость строк, но нужно понимать роли, владельца таблицы и условия обхода. Это один барьер, а не полная модель безопасности приложения. Пулы соединений должны корректно задавать и очищать контекст; иначе запрос следующего клиента может унаследовать чужое состояние. Проверяйте реальный режим подключения, а не только SQL из презентации.\u003c/p\u003e"},{"title":"Процессы и версии правил","html":"\u003cp\u003eКорпоративная заявка может жить недели, иметь несколько согласований и менять исполнителей. Сохраняйте версию процесса и основания решения: новое правило не всегда должно переписать уже начатую заявку. Документ, действие над ним и факт подписи имеют разные статусы. Правовые свойства подписей и хранения определяются по применимому режиму с ответственными специалистами.\u003c/p\u003e\u003cp\u003eНастраиваемость повышает ценность SaaS и усложняет состояние системы. Разные поля, маршруты и интеграции создают комбинации, которые нельзя полностью проверить одним happy path. Ограничивайте поддерживаемые возможности, версионируйте конфигурацию и давайте безопасные проверки до публикации. Ошибка клиентской настройки должна иметь понятную диагностику.\u003c/p\u003e"},{"title":"Крупный клиент и общая очередь","html":"\u003cp\u003eNoisy neighbor возникает, когда один потребитель ухудшает сервис другим через общий ресурс. Миллионный экспорт может занять пул БД или фоновые workers. Помогают квоты, раздельные очереди, fair scheduling, ограничения запросов и выделенные ресурсы по договору. Простое увеличение общего пула может лишь перенести насыщение в БД.\u003c/p\u003e\u003cp\u003eЛимит по IP не заменяет лимит по организации и типу операции. У одного офиса общий адрес, а один клиент может распределить работу по многим адресам. Экспорт нужно оценивать отдельно от открытия документа: размер результата, длительность и стоимость различаются. У задания есть владелец, статус, отмена и срок хранения результата.\u003c/p\u003e"},{"title":"Эксплуатация отдельного клиента","html":"\u003cp\u003eЗапрос «восстановить данные организацииА на вчера» сложнее, чем восстановление всего общего кластера. Нужны правила точечного восстановления и согласование с данными, изменившимися после точки. Удаление клиента также охватывает индексы, файлы, события и бэкапы по установленной политике. Одно DELETE не описывает жизненный цикл.\u003c/p\u003e\u003cp\u003eObservability требует tenant-контекста для расследования, но не должна раскрывать чувствительные данные в общих логах. План поддержки включает персональные доступы, аудит, аварийное расширение полномочий и отзыв. Рост числа клиентов меняет не только RPS, но и объём конфигураций, миграций и операционных действий.\u003c/p\u003e"},{"title":"Разные отрасли на общей основе","html":"\u003cp\u003eCRM, документооборот, управление образованием и часть медицинских процессов разделяют платформенные механизмы организаций, документов и workflow. Но конкретные данные, интеграции и последствия ошибок различаются. Учёт посещаемости и медицинское изображение нельзя считать эквивалентными записями только потому, что оба имеют owner_id. Сначала выделяйте тип полезного действия, затем применяйте общий паттерн с проверкой границ.\u003c/p\u003e"}],"transfer":["Права на объект, версии и аудит","Контракты, длинные процессы и асинхронные задания","Измерение качества по пользовательскому пути"],"distinct":["Модель tenant-изоляции и вариативность конфигураций","Noisy neighbor, восстановление и жизненный цикл отдельного клиента"],"compare":[{"world":"search","title":"Корпоративный поиск","html":"\u003cp\u003eПоисковая система SaaS наследует весь конвейер retrieval/ranking и добавляет обязательную tenant-изоляцию. Хорошее ранжирование чужих документов является нарушением, а не полезной находкой. Права должны действовать до передачи контекста модели.\u003c/p\u003e"}],"sources":[{"title":"PostgreSQL18: Row Security Policies и ограничения ролей","url":"https://www.postgresql.org/docs/18/ddl-rowsecurity.html"},{"title":"OWASP API Security2023: объектные и полевые права","url":"https://owasp.org/API-Security/editions/2023/en/0x11-t10/"}]}],"market":[{"id":"payments","title":"Платежи и кошельки","kernel":"Денежный факт, идемпотентность, сверка и конечный расчёт","worlds":["money"]},{"id":"business-finance","title":"Корпоративные финансы и учёт","kernel":"Реестры, согласования, версии правил, закрытие периода","worlds":["money","saas"]},{"id":"commerce","title":"Торговля и маркетплейсы","kernel":"Каталог, поиск, остаток, цена и длинный заказ","worlds":["inventory","search"]},{"id":"booking","title":"Билеты, гостиницы и слоты","kernel":"Ограниченный ресурс, интервалы, временный резерв и истечение","worlds":["inventory"]},{"id":"discovery","title":"Объявления, найм и рекомендации","kernel":"Кандидаты, ранжирование, свежесть, модерация и ML","worlds":["search"]},{"id":"mobility","title":"Такси, каршеринг и геосервисы","kernel":"Координаты, пространственный поиск, ETA и назначение","worlds":["geo"]},{"id":"logistics","title":"Доставка, склады и транспорт","kernel":"Физическое исполнение, маршруты, сканирования и offline","worlds":["geo","telemetry","inventory"]},{"id":"media","title":"Видео, музыка и трансляции","kernel":"Объекты, обработка, bitrate, CDN и опыт зрителя","worlds":["media"]},{"id":"communications","title":"Мессенджеры и совместная работа","kernel":"Соединения, порядок, fan-out, offline и слияние изменений","worlds":["collaboration"]},{"id":"saas","title":"CRM, ЭДО и корпоративный SaaS","kernel":"Tenant-изоляция, права, workflow, конфигурации и noisy neighbor","worlds":["saas"]},{"id":"adtech","title":"Реклама и продвижение","kernel":"Отбор, бюджет, оценка показа, потоки событий и атрибуция","worlds":["search","telemetry","money"]},{"id":"industrial","title":"Промышленный IT и IoT","kernel":"Устройства, время наблюдения, edge и подтверждение команд","worlds":["telemetry"]},{"id":"games","title":"Онлайн-игры","kernel":"Общее состояние, matchmaking, задержка, серверный шаг и доверие клиенту","worlds":["collaboration","geo"]},{"id":"infrastructure","title":"Облака и инфраструктурные продукты","kernel":"Изоляция, control/data plane, квоты, размещение и metering","worlds":["saas","telemetry"]}]};const arcs=['Открыть двери','Выдержать внимание','Связать миры','Найти и доставить','Доверять копиям','Увидеть другой масштаб','Научиться предсказывать','Изменяться безопасно'];const arcStories=['Первая версия: от обещания клиенту до надёжного заказа.','Рост внимания: быстрый ответ при ограниченном бюджете.','Внешние системы: обещания, повторы и незавершённые процессы.','Новый опыт: найти товар, назначить курьера, сохранить связь.','Несколько копий: кто отвечает за истину при отказах.','Другие нагрузки: данные, сигналы, медиа и чужие процессы.','Предсказания и помощники: измеримая польза под контролем.','Новая организация: менять систему, сохраняя доверие.'];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={done:{},notes:{},bookmarks:{},decisions:{},checks:{},positions:{},theme:'light',last:null},storageOK=true;try{const raw=localStorage.getItem('sd-journey-v3');if(raw){let parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object')state={...state,...parsed};}}catch(e){storageOK=false;}function normalizeState(){const valid=new Set(DATA.chapters.map(c=>c.id));for(const key of ['done','notes','bookmarks','decisions','checks','positions']){const value=state[key];state[key]=value&&typeof value==='object'&&!Array.isArray(value)?Object.fromEntries(Object.entries(value).filter(([id])=>valid.has(id))):{};}for(const c of DATA.chapters){const id=c.id;if(state.done[id]!==true)delete state.done[id];if(state.bookmarks[id]!==true)delete state.bookmarks[id];const n=state.notes[id];if(n&&typeof n==='object')state.notes[id]={personal:typeof n.personal==='string'?n.personal:'',exercise:typeof n.exercise==='string'?n.exercise:''};else delete state.notes[id];const d=state.decisions[id];if(!Number.isInteger(d)||d<0||d>=c.decision.options.length)delete state.decisions[id];const checks=state.checks[id];if(!checks||typeof checks!=='object')delete state.checks[id];else{state.checks[id]={};c.checkpoint.forEach((q,i)=>{const v=checks[i];if(v&&v.confirmed===true&&Number.isInteger(v.choice)&&v.choice>=0&&v.choice<q.options.length)state.checks[id][i]={choice:v.choice,confirmed:true};});}if(!Number.isFinite(state.positions[id])||state.positions[id]<0)delete state.positions[id];}state.theme=state.theme==='dark'?'dark':'light';if(!valid.has(state.last))state.last=null;}normalizeState();let lastFocus=null;function save(){try{localStorage.setItem('sd-journey-v3',JSON.stringify(state));}catch(e){storageOK=false;warn();}}function warn(){if(!storageOK){$('#warning').classList.remove('hidden');$('#warning').textContent='Хранилище недоступно. Изменения сохраняются только в памяти этой вкладки. Экспортируйте портфель перед закрытием.';}}warn();function announce(t){$('#live').textContent=t;}function setTheme(){document.body.classList.toggle('dark',state.theme==='dark');$('#theme').setAttribute('aria-pressed',String(state.theme==='dark'));}setTheme();$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';setTheme();save();};const words=html=>html.replace(/<[^>]+>/g,' ').trim().split(/\s+/).filter(Boolean).length;const chapterText=c=>[c.title,c.briefing,...c.sections.map(s=>s.title+' '+s.html),c.workedExample.html,c.expedition.html,c.decision.prompt,c.exercise.prompt].join(' ').replace(/<[^>]+>/g,' ');const totalWords=DATA.chapters.reduce((n,c)=>n+c.wordCount,0);const worldId=w=>String(w.id||w.world||'').replace(/^world-/,'');function go(h){location.hash=h;}function openDialog(id){lastFocus=document.activeElement;$('#'+id).showModal();}function closeDialog(id){$('#'+id).close();lastFocus?.focus();}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeDialog(
