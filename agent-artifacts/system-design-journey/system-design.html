e\" font-weight=\"600\"\u003eУзел C\u003c/text\u003e\u003crect x=\"535\" y=\"180\" width=\"190\" height=\"64\" rx=\"12\" fill=\"#dff4e8\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"630.0\" y=\"218.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eP2 · primary\u003c/text\u003e\u003crect x=\"535\" y=\"270\" width=\"190\" height=\"64\" rx=\"12\" fill=\"#fff1d5\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"630.0\" y=\"308.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eP1 · backup\u003c/text\u003e\u003cline x1=\"225\" y1=\"212\" x2=\"285\" y2=\"302\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-08-0-arr)\"/\u003e\u003ctext x=\"35\" y=\"399\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eЗелёный — основное; жёлтый — дополнительная копия.\u003c/text\u003e\u003ctext x=\"35\" y=\"431\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eУчебный пример Ignite 2: backups=1. Это не схема Raft Ignite 3.\u003c/text\u003e","caption":"Каждый узел держит часть основных данных и часть дополнительных копий. На примере показаны три раздела и backups=1 в терминологии Ignite 2. Стрелка выделяет копию P0. Схема размещения не доказывает конкретный протокол подтверждения и не переносится буквально на Ignite 3."},{"title":"Подтверждение раньше копии: Redis","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-08-1-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eПодтверждение раньше копии: Redis\u003c/text\u003e\u003ctext x=\"35\" y=\"81\" font-family=\"Arial, sans-serif\" font-size=\"20\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eАсинхронная репликация: допустимое окно потери\u003c/text\u003e\u003ctext x=\"30\" y=\"156\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eОсновной\u003c/text\u003e\u003cline x1=\"165\" y1=\"150\" x2=\"715\" y2=\"150\" stroke=\"#8da4b4\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"/\u003e\u003ctext x=\"30\" y=\"256\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eРеплика\u003c/text\u003e\u003cline x1=\"165\" y1=\"250\" x2=\"715\" y2=\"250\" stroke=\"#8da4b4\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"/\u003e\u003ctext x=\"30\" y=\"356\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eКлиент\u003c/text\u003e\u003cline x1=\"165\" y1=\"350\" x2=\"715\" y2=\"350\" stroke=\"#8da4b4\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"/\u003e\u003crect x=\"180\" y=\"120\" width=\"165\" height=\"60\" rx=\"12\" fill=\"#dff4e8\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"262.5\" y=\"156.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eЗапись v2\u003c/text\u003e\u003cline x1=\"262\" y1=\"180\" x2=\"262\" y2=\"320\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-08-1-arr)\"/\u003e\u003ctext x=\"280\" y=\"287\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eОтвет OK\u003c/text\u003e\u003crect x=\"435\" y=\"119\" width=\"180\" height=\"62\" rx=\"12\" fill=\"#f7dfda\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"525.0\" y=\"156.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eПадение узла\u003c/text\u003e\u003cline x1=\"345\" y1=\"150\" x2=\"435\" y2=\"150\" stroke=\"#be4b3b\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\"/\u003e\u003crect x=\"180\" y=\"221\" width=\"165\" height=\"60\" rx=\"12\" fill=\"#fff1d5\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"262.5\" y=\"257.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eЕщё v1\u003c/text\u003e\u003cline x1=\"345\" y1=\"250\" x2=\"435\" y2=\"250\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-08-1-arr)\"/\u003e\u003crect x=\"435\" y=\"220\" width=\"245\" height=\"60\" rx=\"12\" fill=\"#fff1d5\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"557.5\" y=\"256.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eНовая основная: v1\u003c/text\u003e\u003ctext x=\"35\" y=\"410\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eКрасный пунктир: v2 не успела дойти до реплики.\u003c/text\u003e\u003ctext x=\"35\" y=\"440\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003ePersistence, WAIT и переключение анализируют вместе; OK не всё объясняет.\u003c/text\u003e","caption":"Время направлено слева направо. Основной ответил клиенту, но упал до передачи v2; выбранная копия содержит v1. Это один допустимый сценарий асинхронной репликации, а не утверждение о неизбежной потере при каждом отказе. WAIT уменьшает риск, но не даёт универсальной строгой гарантии failover."}],"decision":{"prompt":"Что выбрать для нынешней витрины?","options":[{"title":"Redis как восстанавливаемый кэш","consequence":"Прямой доступ по ключу соответствует карточке, PostgreSQL остаётся авторитетным.","tradeoff":"Требуются политика памяти, защита промахов и проверка отказа; свежесть ограничена контрактом."},{"title":"Ignite с обоснованной моделью данных","consequence":"Можно исследовать распределённые запросы и вычисления рядом с данными.","tradeoff":"Больше настроек и эксплуатационной ответственности; фиксируют ветку, релиз и режимы."},{"title":"Оставить PostgreSQL без нового хранилища","consequence":"Проще эксплуатация и меньше независимых копий.","tradeoff":"Подходит, если измеренная нагрузка и стоимость исходного чтения помещаются в бюджет."}],"recommended":0,"explanation":"Текущая задача — повторное чтение небольших карточек с допустимой устарелостью. Она не требует распределённого SQL или переноса транзакционного источника. При отсутствии доказанной выгоды третий вариант предпочтительнее дополнительного компонента."},"exercise":{"prompt":"Почему backups=1 в Ignite 2 и REPLICAS=1 в Ignite 3 нельзя считать одинаковой настройкой?","model":"\u003cp\u003eВ Ignite 2 backups задаёт число дополнительных копий к основной. В Ignite 3 REPLICAS описывает число копий раздела в зоне. Названия и механизм координации различаются; проверяют точную версию и конфигурацию, а не переносят число буквально.\u003c/p\u003e","rubric":["Различено дополнительное и полное число копий","Указана версия и механизм"]},"checkpoint":[{"question":"WAIT в Redis позволяет утверждать…","options":["Получено заданное число подтверждений согласно результату команды, но строгая сохранность при любом failover не следует","Кластер автоматически стал строго согласованным при любом разделении","Подтверждённые данные больше не требуют сохранения на диск"],"answer":0,"explanation":"Подтверждение реплик — только часть протокола; выбор копии и persistence остаются существенными."},{"question":"Что лучше всего отличает выбор Ignite 2 от Ignite 3?","options":["Проверка конкретной модели: кэши и режимы API против таблиц, зон и профилей, с анализом релиза","Предположение, что это одна конфигурация с новым номером","Сравнение только максимального числа GET в секунду"],"answer":0,"explanation":"Архитектура и семантика API отличаются; результаты проверки одной ветки не переносят автоматически."}],"sources":[{"title":"Redis: transactions","url":"https://redis.io/docs/latest/develop/using-commands/transactions/"},{"title":"Redis: cluster specification","url":"https://redis.io/docs/latest/operate/oss_and_stack/reference/cluster-spec/"},{"title":"Redis: persistence","url":"https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/"},{"title":"Redis: replication and WAIT limits","url":"https://redis.io/docs/latest/operate/oss_and_stack/management/replication/"},{"title":"Apache Ignite 2: data partitioning","url":"https://ignite.apache.org/docs/ignite2/latest/data-modeling/data-partitioning"},{"title":"Apache Ignite 2: atomicity modes","url":"https://ignite.apache.org/docs/ignite2/latest/configuring-caches/atomicity-modes"},{"title":"Apache Ignite 2: native persistence and WAL modes","url":"https://ignite.apache.org/docs/ignite2/latest/persistence/native-persistence"},{"title":"Apache Ignite 3: transactions","url":"https://ignite.apache.org/docs/ignite3/latest/developers-guide/transactions"},{"title":"Apache Ignite 3: data partitions","url":"https://ignite.apache.org/docs/ignite3/latest/administrators-guide/storage/data-partitions"},{"title":"Apache Ignite 3: storage engines and profiles","url":"https://ignite.apache.org/docs/ignite3/latest/administrators-guide/storage/storage-overview"}],"wordCount":1709},{"id":"ch-09","arc":3,"title":"Платёж без ответа: неизвестность — тоже состояние","briefing":"Кэш ускорил витрину, но не сделал оплату надёжной. «Северный маршрут» подключил эквайринг: банк списал деньги, а приложение дождалось тайм-аута. Все суммы и инциденты главы учебные.","goals":["Разделять отсутствие ответа и отсутствие эффекта","Проектировать ключ идемпотентности и платёжную попытку","Замыкать цикл неопределённости сверкой"],"sections":[{"title":"Что на самом деле сообщил тайм-аут","html":"\u003cp\u003eПри обычном вызове мы видим только свою сторону сети. Запрос мог не дойти до банка, мог ожидать обработки, мог завершиться списанием, после которого потерялся ответ. Во всех трёх случаях клиент получает одинаковый тайм-аут. Следовательно, это свидетельство о времени ожидания, а не о банковской операции. Даже отмена локального HTTP-запроса не обязана отменять работу удалённого сервера. Если интерфейс пишет «оплата не прошла», он выдаёт отсутствие знания за знание.\u003c/p\u003e\u003cp\u003eКоманда вводит отдельную сущность payment_attempt — платёжную попытку. У заказа может быть несколько попыток, но ни одна неизвестная попытка не должна незаметно превращаться в новую. Состояния created, submitted, unknown, succeeded, failed описывают нашу картину мира. Статус failed допустим после достоверного окончательного отказа провайдера; unknown означает необходимость выяснения. Отдельно живут возврат и отмена авторизации: это другие операции с собственными состояниями. Успешное списание нельзя стереть сменой статуса заказа.\u003c/p\u003e\u003cp\u003eПолезно явно назвать модель отказа: процессы падают между любыми двумя действиями, сеть теряет ответы, уведомления дублируются, часы расходятся. Банк может быть доступен, когда наш сервис недоступен. Мы не предполагаем злонамеренный банк, но проверяем подпись его сообщений. Такой список нужен, чтобы обещание «повтор безопасен» имело точные условия.\u003c/p\u003e"},{"title":"Идемпотентность — договор об эффекте","html":"\u003cp\u003eИдемпотентной называют операцию, для которой повтор не добавляет новый целевой эффект. Это не требование возвращать побитно одинаковый ответ и не обещание исполнить код лишь один раз. По HTTP-семантике PUT и DELETE идемпотентны, а POST не получает такое свойство автоматически. Для платежа команда заключает прикладной договор: одинаковый ключ операции означает одну платёжную попытку в пределах согласованного срока хранения ключа.\u003c/p\u003e\u003cp\u003eКлюч создают до первого внешнего вызова и сохраняют устойчиво. Ключ принадлежит не соединению и не нажатию кнопки, а бизнес-намерению. Обновление страницы использует тот же ключ; осознанная новая оплата после окончательного отказа получает другой. На стороне нашего API ключ связывают с клиентом, типом операции, суммой, валютой и хешем существенных параметров. Повтор ключа с другой суммой — конфликт, а не просьба вернуть старый успех. Иначе ошибка клиента превращается в финансовую ошибку.\u003c/p\u003e\u003cp\u003eДва параллельных запроса могут одновременно не увидеть запись ключа. Поэтому проверку закрепляет уникальное ограничение базы, а не схема «сначала SELECT, потом INSERT». Победитель регистрирует намерение, второй читает его результат или получает понятное «ещё выполняется». Параметры банковского ключа зависят от договора провайдера: области уникальности, срока хранения, поведения параллельных повторов. Наш локальный ключ сам по себе не защищает удалённое списание.\u003c/p\u003e"},{"title":"Где кончается локальная транзакция","html":"\u003cp\u003eВ одной транзакции PostgreSQL можно создать попытку и зафиксировать, что заказ ожидает оплаты. Включить удалённый банк в эту транзакцию обычно нельзя. Если держать блокировку заказа во время сетевого запроса, она не даст атомарности между системами, зато удлинит очереди и повысит вероятность тайм-аутов. Поэтому короткая транзакция сохраняет намерение, затем происходит внешний вызов, затем другая транзакция сохраняет наблюдённый результат.\u003c/p\u003e\u003cp\u003eМежду этими шагами остаются окна падения. Если процесс исчез после записи намерения, фоновый обработчик подхватит её. Если он исчез после списания, но до записи результата, тот же банковский ключ либо запрос статуса позволит продолжить. Если провайдер не умеет ни дедупликацию, ни надёжный поиск по merchant reference, автоматически повторять списание опасно. Тогда операция остаётся на сверке, а продукт принимает временную неопределённость. Никакая локальная блокировка не восполнит отсутствующий контракт партнёра.\u003c/p\u003e\u003cp\u003eПереходы состояний защищают от запоздалых сообщений. Событие «в обработке», пришедшее после «успешно», не откатывает успех. Но нельзя придумать единый порядок всех статусов: возврат не слабее успеха, он отдельный факт. Практичнее хранить подтверждённые операции и допустимые переходы, а итоговый статус заказа вычислять по явным правилам. Это делает разбор спора возможным без догадок по последней строке лога.\u003c/p\u003e"},{"title":"Повтор, бюджет ожидания и восстановление","html":"\u003cp\u003eПовтор нужен для временных сбоев, но способен усилить аварию. Если мобильный клиент, API и внутренний адаптер независимо делают по три попытки, один платёж порождает до двадцати семи обращений. Команда назначает владельца повторов на каждой границе и передаёт общий срок выполнения. При исчерпании срока запрос не продолжает бесконечно занимать поток. Неизвестная оплата переходит в фоновое выяснение, а интерфейс показывает безопасное действие: проверить статус.\u003c/p\u003e\u003cp\u003eДля повторов используют ограничение числа попыток, увеличивающуюся задержку и случайный разброс. Последний не позволяет тысячам клиентов одновременно вернуться после восстановления банка. Повторяют только ошибки, допускающие повтор по контракту: перегрузку и сетевую неопределённость, но не неправильную валюту или отклонённую подпись. Отдельно ограничивают общее число одновременных внешних операций, чтобы медленный банк не съел все соединения приложения.\u003c/p\u003e\u003cp\u003eУстойчивость означает ещё и возможность завершить работу после длительного простоя. Срок хранения наших ключей и журнала попыток должен превышать окно повторов, доставки webhook и сверки. Если банковский ключ живёт сутки, а оператор через неделю повторит старый POST, гарантия уже могла исчезнуть. Поэтому позднее восстановление сначала запрашивает факты, а не слепо повторяет команду. Метрика возраста unknown полезнее одной средней задержки: она показывает незамкнутый финансовый риск.\u003c/p\u003e"},{"title":"Сверка замыкает контур","html":"\u003cp\u003eWebhook — внешнее HTTP-уведомление о результате — сокращает задержку, но не заменяет сверку. Оно может запоздать, повториться или не прийти после долгой недоступности получателя. Входящий запрос сначала аутентифицируют по предусмотренной провайдером схеме, проверяют идентификатор события и сохраняют устойчиво. Быстрый успешный ответ означает принятие уведомления в обработку, а не обязательно завершённый бизнес-процесс. Если подтверждать до сохранения, падение потеряет единственную копию.\u003c/p\u003e\u003cp\u003eПериодическая сверка сравнивает наши попытки с операциями провайдера. Для заказа нужны идентификаторы попытки и операции, сумма, валюта, время наблюдения и источник факта. Финансовая сверка также обнаруживает успехи, о которых приложение вообще не знает. Она не сводится к поиску unknown: возможны двойные списания, частичные возвраты, разные даты расчёта и комиссии. Несовпадение суммы не разрешают автоматически правилом «банк главнее»: его выделяют в расследование.\u003c/p\u003e\u003cp\u003eПользовательский опыт должен выдерживать эту неопределённость. Пока оплата выясняется, повторная кнопка открывает существующую попытку. Резерв товара имеет срок, но его освобождение не означает, что деньги не списаны. Если поздний успех пришёл после освобождения последнего товара, нужен явный сценарий: восстановить заказ при наличии или инициировать возврат. Архитектура здесь включает не только таблицы, но и честное обещание клиенту, очередь исключений и ответственность оператора.\u003c/p\u003e"},{"title":"Данные для спора, а не только для графика","html":"\u003cp\u003eПлатёжный журнал полезен лишь тогда, когда из него можно собрать цепочку доказательств. Запись должна отличать нашу команду, внешний ответ и последующее подтверждение сверкой. Нельзя перезаписывать неизвестный ответ успешным так, чтобы исчез момент первоначальной неопределённости. При расследовании важно понять, почему система разрешила следующий шаг, а не только увидеть окончательный статус.\u003c/p\u003e\u003cp\u003eПри этом журнал не должен содержать лишние карточные данные и секреты подписи. Идентификатор операции, сумма, валюта и безопасные технические атрибуты обычно полезнее полного сетевого дампа. Доступ к финансовым исключениям отделяют от доступа к обычной витрине. Оператор, способный инициировать возврат, получает проверяемое полномочие и оставляет причину действия. Таким образом, восстановление не становится незащищённым обходом основного процесса. Даже ручное решение использует устойчивое намерение и проходит сверку.\u003c/p\u003e"}],"workedExample":{"title":"Разбор: 2400 рублей исчезли из ответа","html":"\u003cp\u003eВ 12:00 клиент оплачивает заказ №718 на 2400 рублей. API создаёт попытку P41 с ключом K41, суммой и валютой, фиксирует её и возвращает идентификатор операции интерфейсу. Адаптер отправляет K41 банку. Через две секунды банк подтверждает списание во внутренней системе, но ответ теряется. Через пять секунд наш тайм-аут срабатывает. Запись P41 получает unknown; заказ сохраняет payment_pending. Это не успех, но и не окончательный отказ.\u003c/p\u003e\u003cp\u003eВ 12:00:07 клиент нажимает кнопку снова. Запрос несёт K41. Уникальное ограничение на область клиента и ключ не позволяет создать P42. API возвращает P41 и объясняет, что результат выясняется. Фоновый обработчик делает запрос состояния по банковскому идентификатору либо merchant reference, если такой поиск гарантирован договором. При временном отказе поиска он планирует следующий запрос с задержкой. Он не превращает ошибку поиска в доказательство отсутствия списания.\u003c/p\u003e\u003cp\u003eВ 12:01 приходит подписанный webhook E90. В одной локальной транзакции обработчик регистрирует E90 в inbox, отмечает P41 succeeded и фиксирует событие для продолжения заказа. Если процесс упадёт до commit, повтор E90 обработается заново. Если после commit, уникальный event_id остановит повторный локальный эффект. Уведомление клиенту может уйти позже. В 12:03 приходит повтор E90; он подтверждается без нового перехода и без второго запуска сборки.\u003c/p\u003e\u003cp\u003eНочная сверка находит ровно одну операцию 2400 рублей, связанную с P41. Учебная комиссия 48 рублей не должна выглядеть недоплатой: сумма платежа и сумма перечисления магазину — разные поля. Если бы в отчёте обнаружились две операции, система создала бы финансовое исключение с двумя внешними идентификаторами. Она не удаляла бы одну строку ради красивого статуса. Для проверки команда воспроизводит потерю ответа после списания, падение до локального commit и повтор webhook; критерием служит один бизнес-платёж и прослеживаемое восстановление, а не число HTTP-запросов.\u003c/p\u003e"},"expedition":{"world":"money","title":"Экспедиция: подписка списывает каждый месяц","html":"\u003cp\u003eУ сервиса подписки повторяемость операции заложена в продукт: ежемесячные списания одного клиента имеют одинаковые сумму и карту, но являются разными намерениями. Поэтому дедупликация по паре «клиент + сумма» ошибочна. Ключ строят из подписки и расчётного периода, а попытки взыскать один счёт связывают с самим счётом. Повтор после сетевого сбоя сохраняет попытку, повтор после окончательного отказа может создать новую в рамках того же долга.\u003c/p\u003e\u003cp\u003eПоявляется дополнительная гонка: клиент отменяет подписку, пока фоновый процесс уже отправляет списание. Локальная отметка cancelled не отзывает отправленную банковскую команду. Нужно определить момент вступления отмены в силу, право на возврат и допустимое окно обработки. Иногда достаточно обещания «следующее продление отключено», иногда требуется немедленное финансовое исправление. Это продуктовый договор, который выражается в состояниях и журнале операций.\u003c/p\u003e\u003cp\u003eПереносится главный принцип главы: неизвестное состояние нельзя чинить новой денежной командой. Меняется единица намерения и длительность жизни данных. У доставки попытка связана с конкретным заказом, у подписки — со счётом и периодом, а история нужна для споров спустя месяцы. Метрика успешных HTTP-ответов не показывает полноту собранной выручки; её дополняют сверенные счета, возраст неопределённых операций и доля ручных исключений. Так один и тот же механизм получает другой финансовый смысл.\u003c/p\u003e","transfer":["Стабильное намерение переживает повторы","Сверка обнаруживает невидимые ответы"],"distinct":["Периодические счета","Гонка отмены и продления"]},"diagrams":[{"title":"Sequence: потеря ответа не отменяет платёж","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eОдин платёж, несколько наблюдений\u003c/text\u003e\u003crect x=\"20\" y=\"48\" width=\"150\" height=\"48\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"34\" y=\"76\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eКлиент\u003c/text\u003e\u003cline x1=\"95\" y1=\"102\" x2=\"95\" y2=\"418\" stroke=\"#51657a\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003crect x=\"210\" y=\"48\" width=\"150\" height=\"48\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"224\" y=\"76\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eНаш API\u003c/text\u003e\u003cline x1=\"285\" y1=\"102\" x2=\"285\" y2=\"418\" stroke=\"#51657a\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003crect x=\"400\" y=\"48\" width=\"150\" height=\"48\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"414\" y=\"76\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eБанк\u003c/text\u003e\u003cline x1=\"475\" y1=\"102\" x2=\"475\" y2=\"418\" stroke=\"#51657a\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003crect x=\"590\" y=\"48\" width=\"150\" height=\"48\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"604\" y=\"76\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eСверка\u003c/text\u003e\u003cline x1=\"665\" y1=\"102\" x2=\"665\" y2=\"418\" stroke=\"#51657a\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003cline x1=\"95\" y1=\"135\" x2=\"285\" y2=\"135\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"285.0,135.0 277.1,139.3 277.1,130.7\" fill=\"#51657a\"/\u003e\u003ctext x=\"103\" y=\"125\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#51657a\" text-anchor=\"start\"\u003eK41: оплатить\u003c/text\u003e\u003cline x1=\"285\" y1=\"193\" x2=\"475\" y2=\"193\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"475.0,193.0 467.1,197.3 467.1,188.7\" fill=\"#51657a\"/\u003e\u003ctext x=\"293\" y=\"183\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#51657a\" text-anchor=\"start\"\u003eK41: списать\u003c/text\u003e\u003cline x1=\"475\" y1=\"251\" x2=\"285\" y2=\"251\" stroke=\"#d44b4b\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003cpolygon points=\"285.0,251.0 292.9,246.7 292.9,255.3\" fill=\"#d44b4b\"/\u003e\u003ctext x=\"293\" y=\"241\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#d44b4b\" text-anchor=\"start\"\u003eответ потерян\u003c/text\u003e\u003cline x1=\"95\" y1=\"310\" x2=\"285\" y2=\"310\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"285.0,310.0 277.1,314.3 277.1,305.7\" fill=\"#51657a\"/\u003e\u003ctext x=\"103\" y=\"300\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#51657a\" text-anchor=\"start\"\u003eповтор K41\u003c/text\u003e\u003cline x1=\"665\" y1=\"368\" x2=\"475\" y2=\"368\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"475.0,368.0 482.9,363.7 482.9,372.3\" fill=\"#51657a\"/\u003e\u003ctext x=\"483\" y=\"358\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#51657a\" text-anchor=\"start\"\u003eпроверка K41\u003c/text\u003e\u003ctext x=\"485\" y=\"226\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eСписание есть\u003c/text\u003e\u003ctext x=\"295\" y=\"278\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#b45309\" text-anchor=\"start\"\u003eunknown\u003c/text\u003e\u003ctext x=\"295\" y=\"337\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eта же попытка\u003c/text\u003e\u003ctext x=\"430\" y=\"430\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eПоздний факт замыкает процесс\u003c/text\u003e","caption":"Банк фиксирует списание до потери ответа. Повтор клиента использует K41 и не создаёт новую попытку. Сверка обращается к тому же намерению; схема не предполагает общей транзакции с банком."},{"title":"Failure timeline: локальная неизвестность","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eОкно падения и правильный вывод\u003c/text\u003e\u003crect x=\"50\" y=\"70\" width=\"310\" height=\"70\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"64\" y=\"98\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eНамерение сохранено\u003c/text\u003e\u003ctext x=\"64\" y=\"123\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eP41 → submitted\u003c/text\u003e\u003cline x1=\"205\" y1=\"140\" x2=\"205\" y2=\"160\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"205.0,160.0 200.7,152.1 209.3,152.1\" fill=\"#51657a\"/\u003e\u003crect x=\"50\" y=\"160\" width=\"310\" height=\"70\" rx=\"10\" fill=\"#dcfce7\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"64\" y=\"188\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eУдалённый эффект\u003c/text\u003e\u003ctext x=\"64\" y=\"213\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eбанк списал 2400 ₽\u003c/text\u003e\u003cline x1=\"205\" y1=\"230\" x2=\"205\" y2=\"250\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"205.0,250.0 200.7,242.1 209.3,242.1\" fill=\"#51657a\"/\u003e\u003crect x=\"50\" y=\"250\" width=\"310\" height=\"70\" rx=\"10\" fill=\"#fff3cd\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"64\" y=\"278\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eОтвет не наблюдался\u003c/text\u003e\u003ctext x=\"64\" y=\"303\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eP41 → unknown\u003c/text\u003e\u003cline x1=\"205\" y1=\"320\" x2=\"205\" y2=\"340\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"205.0,340.0 200.7,332.1 209.3,332.1\" fill=\"#51657a\"/\u003e\u003crect x=\"50\" y=\"340\" width=\"310\" height=\"70\" rx=\"10\" fill=\"#dcfce7\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"64\" y=\"368\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eРезультат подтверждён\u003c/text\u003e\u003ctext x=\"64\" y=\"393\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003ewebhook / запрос / сверка\u003c/text\u003e\u003cline x1=\"405\" y1=\"82\" x2=\"405\" y2=\"410\" stroke=\"#d44b4b\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003ctext x=\"430\" y=\"130\" font-family=\"system-ui,sans-serif\" font-size=\"19\" fill=\"#b91c1c\" text-anchor=\"start\"\u003eПадение здесь\u003c/text\u003e\u003ctext x=\"430\" y=\"160\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#203047\" text-anchor=\"start\"\u003eне доказывает отказ\u003c/text\u003e\u003ctext x=\"430\" y=\"275\" font-family=\"system-ui,sans-serif\" font-size=\"19\" fill=\"#b91c1c\" text-anchor=\"start\"\u003eНовая оплата опасна\u003c/text\u003e\u003ctext x=\"430\" y=\"304\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#203047\" text-anchor=\"start\"\u003eдо выяснения P41\u003c/text\u003e","caption":"Вертикальная шкала показывает порядок фактов, а не масштаб времени. Между внешним эффектом и локальным подтверждением может исчезнуть процесс. Восстановление выясняет P41 и не подменяет неизвестность новым списанием."}],"decision":{"prompt":"Как действовать после тайм-аута банка?","options":[{"title":"Сохранить unknown и выяснять по тому же намерению","consequence":"Нет нового списания без основания","tradeoff":"Нужны статусный API, webhook и сверка"},{"title":"Подождать дольше в синхронном запросе","consequence":"Меньше видимых тайм-аутов при кратких задержках","tradeoff":"Дольше заняты ресурсы; неопределённость всё равно возможна"},{"title":"Остановить автоматические повторы и передать исключение оператору","consequence":"Безопасно при слабом контракте банка","tradeoff":"Медленнее завершение и операционные расходы"}],"recommended":0,"explanation":"Для нашего провайдера предусмотрены ключ операции и запрос статуса. Это позволяет автоматическое восстановление; при отсутствии этих возможностей третий вариант был бы разумнее."},"exercise":{"prompt":"Почему локальная таблица processed_keys не гарантирует одно списание?","model":"\u003cp\u003eОна защищает локальный переход. Если процесс упал после удалённого эффекта, повтор без банковской дедупликации может создать второе списание. Нужны внешний ключ, надёжное выяснение результата либо ручная развязка.\u003c/p\u003e","rubric":["Названа граница транзакции","Учтён сбой после списания"]},"checkpoint":[{"question":"После тайм-аута банк мог списать деньги. Какой статус честен?","options":["unknown до выяснения","failed, поскольку ответа нет","succeeded, поскольку запрос отправлен"],"answer":0,"explanation":"Тайм-аут описывает наблюдение клиента, а не результат удалённого эффекта."},{"question":"Повтор ключа пришёл с другой валютой. Что делать?","options":["Отклонить конфликт параметров","Создать новый платёж под тем же ключом","Вернуть успех без проверки"],"answer":0,"explanation":"Ключ связывает конкретное намерение; изменение существенных параметров нарушает договор."}],"sources":[{"title":"IETF, RFC 9110, HTTP Semantics, июнь 2022: идемпотентность и повторы","url":"https://www.rfc-editor.org/rfc/rfc9110.html#name-idempotent-methods"}],"wordCount":1522},{"id":"ch-10","arc":3,"title":"Партнёры говорят по-разному: контракт важнее формата","briefing":"После первого эквайринга «Северный маршрут» подключает склады, корпоративных заказчиков и курьерскую службу. Один ждёт JSON, другой выгружает файл ночью. Нужна граница, защищающая смысл заказа.","goals":["Сопоставлять интерфейс с характером взаимодействия","Отделять адаптацию протокола от бизнес-семантики","Планировать совместимость, повторы и стоимость запроса"],"sections":[{"title":"Один заказ, несколько языков","html":"\u003cp\u003eИнтеграция начинается не с выбора REST или gRPC, а с вопроса, что стороны считают совершившимся действием. Склад может называть «принятым» файл, проверенный на синтаксис, а наш оператор понимать под этим резерв товара. Если эти смыслы не разделены, корректные HTTP-коды маскируют потерю заказа. Команда описывает состояния: доставлено сообщение, принято намерение, выполнена операция, получен окончательный результат. Это разные подтверждения с разными владельцами.\u003c/p\u003e\u003cp\u003eНа границе появляется адаптер, переводящий внешний контракт во внутренние понятия. Внутри заказа количество хранится в штуках, партнёр присылает упаковки по шесть; его статус shipped означает выход со склада, а не доставку получателю. Перевод требует версии справочника и правил округления, а не только переименования JSON-полей. Неизвестный статус лучше направить в исключения, чем угадать близкий по названию. Сохранение исходного сообщения с ограниченным доступом помогает восстановить смысл спора.\u003c/p\u003e\u003cp\u003eГраница также ограничивает распространение изменений. Если партнёр добавил новый код склада, не должны одновременно изменяться витрина, расчёт цены и мобильное приложение. Адаптер владеет внешней моделью и выдаёт устойчивый внутренний результат. Однако чрезмерно универсальная модель, вмещающая все возможные протоколы и отрасли, сама становится труднее конкретных контрактов. Нужна общая семантика заказа и явные особенности конкретного поставщика.\u003c/p\u003e"},{"title":"REST и gRPC: разные удобства, общие отказы","html":"\u003cp\u003eREST-подобный HTTP API обычно удобно строить вокруг ресурсов: заказ имеет адрес, состояние читается через GET, изменение задаётся документированным методом. Само наличие JSON не делает интерфейс REST. Главное практическое преимущество для внешнего партнёра — доступные инструменты и понятные HTTP-механизмы: коды ответа, условные запросы, кэширование, аутентификация. Бизнес-идемпотентность денежного POST всё равно проектируется отдельно. HTTP не знает, что два документа относятся к одному счёту.\u003c/p\u003e\u003cp\u003egRPC строит вызовы по описанию сервиса и сообщений; генерация клиента помогает согласовать типы между командами. Он поддерживает одиночные и потоковые вызовы. Это полезно, когда обе стороны контролируются организацией и важны строгая схема, эффективный обмен и единые библиотеки. Но отсутствие поля и нулевое значение, развитие схемы, совместимость клиентов и ограничения транспорта требуют внимания. Типизированный клиент предотвращает часть ошибок формы, но не знает, можно ли повторить бронирование.\u003c/p\u003e\u003cp\u003eВ обоих случаях вызов может завершиться тайм-аутом после выполнения. Отмена и deadline, предельный срок вызова, ограничивают ожидание и работу, но не откатывают уже зафиксированный эффект. Для цепочки запросов нужен общий бюджет времени. Если клиент ждёт две секунды, а пять вложенных сервисов каждый считает своими две секунды, реальная задержка выйдет за обещание. Команда фиксирует правила распространения срока, допустимые повторы и формат идентификатора операции независимо от протокола.\u003c/p\u003e"},{"title":"GraphQL: удобство чтения имеет цену","html":"\u003cp\u003eМобильной витрине нужны карточка товара, доступность в регионе и краткая доставка. GraphQL позволяет клиенту описать нужную форму данных через схему полей. Это снижает потребность выпускать отдельный endpoint для каждого экрана, но превращает один запрос клиента в потенциально большое дерево обращений. Одна карточка может раскрыть продавца, все товары продавца и отзывы каждого товара. Маленький входной документ не означает маленькую вычислительную работу.\u003c/p\u003e\u003cp\u003eПоэтому граница исполнения считает стоимость: глубину и ширину дерева, размер страниц, объём сложных полей, число обращений к источникам. Доступ проверяется на нужных объектах и полях, а не только на входном endpoint. Иначе клиент с правом увидеть заказ может запросить вложенные персональные данные. Для стабильного мобильного приложения разумны заранее зарегистрированные документы и предсказуемые лимиты. Это ограничивает гибкость, но делает нагрузку и доступ проверяемыми.\u003c/p\u003e\u003cp\u003eЕсть и проблема N+1: список из ста товаров вызывает сто отдельных запросов продавца. Группировка чтений в пределах запроса уменьшает число походов, но должна учитывать контекст прав и область кэша. Кэш, разделяемый между пользователями без корректного ключа, превращает оптимизацию в утечку. GraphQL у «Северного маршрута» может быть фасадом чтения. Он не обязан становиться общей шиной интеграций и не отменяет отдельные команды для оплаты или резервирования.\u003c/p\u003e"},{"title":"Webhook и batch: время становится частью контракта","html":"\u003cp\u003eWebhook переворачивает направление HTTP-вызова: теперь партнёр сообщает о событии нашему endpoint. Получатель должен переживать повторы и перестановку уведомлений. Отправитель определяет срок повторной доставки, подпись, идентификатор события и условия окончательного отказа. Получатель ограничивает размер сообщения, проверяет происхождение, устойчиво сохраняет его и быстро подтверждает. Долгая сборка заказа внутри webhook увеличивает число повторов и связывает доступность интеграции с каждым внутренним шагом.\u003c/p\u003e\u003cp\u003eBatch — обработка пакетом — полезен для больших выгрузок и партнёров с редким обменом. Файл требует не меньшего контракта, чем API: кодировка, разделители, версия схемы, временной пояс, контрольная сумма, идентификатор пакета, число записей и результат по каждой строке. Название файла само по себе не гарантирует уникальность. Если половина строк принята, повтор всего файла должен иметь определённый результат: пропуск уже обработанных строк либо атомарное отклонение пакета.\u003c/p\u003e\u003cp\u003eНочная выгрузка остатков означает окно устаревания почти сутки. Это может быть допустимо для рекламной витрины и недопустимо для обещания последнего товара. Команда либо дополняет пакет онлайн-подтверждением, либо ограничивает продаваемый запас, либо честно предлагает подтверждение заказа позже. Выбор частоты обмена — выбор качества бизнес-обещания. Его нельзя спрятать под словом «интеграция готова».\u003c/p\u003e"},{"title":"ESB, совместимость и эксплуатация границы","html":"\u003cp\u003eESB, корпоративная сервисная шина, централизует маршрутизацию, преобразования и взаимодействие систем. В организации с десятками старых приложений это может сократить число отдельных связей и дать общий контроль. Но если в шину перенести решения о скидках, оплате и доступности, она станет скрытым владельцем бизнеса. Выпуск изменения начнёт требовать общего окна, а отказ преобразования перекроет несколько независимых процессов. Поэтому техническая оркестрация и бизнес-правила требуют явного разграничения.\u003c/p\u003e\u003cp\u003eСовместимость проверяют не только добавлением необязательных полей. Новое значение enum способно сломать старый клиент; изменение единиц измерения ломает смысл при неизменном типе integer. Удаление поля требует наблюдения за реальными потребителями, срока миграции и способа отката. Контрактные примеры включают пустые страницы, повтор операции, неизвестный статус, частичное принятие и ошибки авторизации. Проверять один счастливый JSON недостаточно.\u003c/p\u003e\u003cp\u003eДля каждой интеграции команда знает владельца, квоты, контакт на случай аварии, правила смены секретов, предел хранения входных данных и процедуру повторной обработки. Нужны метрики не только доступности endpoint, но и возраста непринятых заказов, доли неизвестных кодов, полноты пакетов. Прослеживаемый correlation_id связывает сообщения, однако не заменяет бизнес-идентификатор. Один заказ проходит несколько запросов и может пережить дни, несколько соединений и смену процесса.\u003c/p\u003e"},{"title":"Контракт ошибки — часть полезного результата","html":"\u003cp\u003eПартнёр должен различать ошибку всего запроса и ошибку отдельных элементов. Если API принимает сто заказов и возвращает общий код 200, внутри ответа всё ещё могут находиться девяносто успехов и десять отказов. Если клиент трактует код как общий успех, часть заказов потеряется без единого сетевого сбоя. Поэтому примеры ответа включают смешанные результаты и стабильные идентификаторы элементов.\u003c/p\u003e\u003cp\u003eНужно также решить, что означает неизвестный идентификатор при запросе статуса. Это окончательное отсутствие операции или временная задержка появления в поиске? При втором варианте мгновенный повтор создания способен дать дубль. Команда записывает срок видимости, правила повторного чтения и предел автоматического восстановления. Такие тонкости выясняют на контрактных примерах с партнёром до запуска. Хорошая схема типов делает вопрос видимым, но ответ остаётся свойством внешней системы и согласованного процесса.\u003c/p\u003e"}],"workedExample":{"title":"Разбор: склад подтвердил файл, но не товар","html":"\u003cp\u003eКорпоративный склад принимает ночной CSV на 1200 строк. Для «Северного маршрута» это товары на завтра. В договоре есть два результата: receipt — файл получен и прошёл проверку формата; reservation_result — резерв каждой строки завершён. Команда сначала ошибочно хотела после receipt помечать все заказы готовыми к сборке. Разбор состояний показывает: между результатами склад ещё проверяет остатки, поэтому такой переход создавал бы ложные обещания.\u003c/p\u003e\u003cp\u003eФайл получает batch_id B17, версию схемы 2, контрольную сумму и 1200 отдельных line_id. Количество передаётся в штуках; упаковка хранится отдельным полем. До отправки фиксируется связь строки с заказом и его версией. Файл выкладывается атомарно: партнёр не должен читать половину записанного объекта. После receipt B17 система показывает «принято складом на обработку», а не «зарезервировано».\u003c/p\u003e\u003cp\u003eВ 03:00 приходит результат: 1180 резервов, 15 отказов по остатку, 5 ошибок справочника. Сервис применяет результат построчно с уникальностью B17 + line_id + тип результата. Пятнадцать отказов переводят заказы в подбор замены, пять строк требуют исправления кода. Для исправленных строк формируется новый пакет B18 с явной ссылкой на прежние намерения; случайно повторившийся B17 не создаёт ещё 1180 резервов. Если склад не гарантирует такую дедупликацию, повтор согласуется через запрос состояния пакета.\u003c/p\u003e\u003cp\u003eВ 08:00 webhook склада сообщает об отгрузке одного из заказов, а ночной обработчик ещё догоняет очередь. Правило переходов не позволяет более старому «резерв принят» понизить уже подтверждённую отгрузку. Отдельная сверка сравнивает число строк и итоговые статусы. При потере результата не требуется повторно резервировать всё: можно запросить итоги B17. Цена решения — хранение протокола обмена и исключений, зато оператор может объяснить судьбу каждой строки. Для небольшого склада это надёжнее, чем принуждение его к модному протоколу, которым он не умеет пользоваться.\u003c/p\u003e"},"expedition":{"world":"saas","title":"Экспедиция: бухгалтерия и электронный документооборот","html":"\u003cp\u003eВ SaaS для бухгалтерии клиенту нужен акт за месяц. HTTP-успех при передаче документа оператору означает только приём файла. Юридическое завершение может потребовать подписи второй стороны, проверки сертификата и отдельного отказа. Поэтому внутренний документ, отправка, внешнее сообщение и подпись — разные сущности. Переводить всё в одну колонку sent опасно: по ней нельзя понять, можно ли закрыть период.\u003c/p\u003e\u003cp\u003eЗдесь особенно заметна разница синтаксической и смысловой совместимости. Добавить поле в XML легко, изменить правило расчёта НДС без версии документа — финансовая ошибка. Нужны неизменяемые версии выпущенного документа, привязка подписи к конкретным байтам и новая версия исправления. Повтор доставки прежней версии не должен создавать новый акт. Запрос на исправление уже подписанного документа — не технический retry, а новая бизнес-операция.\u003c/p\u003e\u003cp\u003eПереносится архитектура границы: адаптер, устойчивый приём, отдельные подтверждения, сверка и очередь исключений. Меняются сроки и цена ошибки. У доставки статус уточняют минутами, у документа ожидание подписи может длиться недели; ретраи и мониторинг должны учитывать это. Центральная шина может быть оправдана множеством устаревших бухгалтерских систем, но правила юридического жизненного цикла остаются у сервиса документов. Так выбор транспорта подчиняется процессу, а не определяет его.\u003c/p\u003e","transfer":["Различение приёма и выполнения","Версии и повторная обработка"],"distinct":["Подпись конкретной версии","Длительный юридический цикл"]},"diagrams":[{"title":"Topology: разные интерфейсы, явная граница","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-u =\"140\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"564\" y=\"178\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eМодель заказа\u003c/text\u003e\u003ctext x=\"564\" y=\"203\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eрезерв ≠ receipt\u003c/text\u003e\u003cline x1=\"215\" y1=\"97\" x2=\"280\" y2=\"205\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"280.0,205.0 272.2,200.5 279.6,196.0\" fill=\"#51657a\"/\u003e\u003cline x1=\"215\" y1=\"217\" x2=\"280\" y2=\"205\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"280.0,205.0 273.0,210.7 271.4,202.2\" fill=\"#51657a\"/\u003e\u003cline x1=\"215\" y1=\"337\" x2=\"280\" y2=\"205\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"280.0,205.0 280.4,214.0 272.6,210.2\" fill=\"#51657a\"/\u003e\u003cline x1=\"480\" y1=\"220\" x2=\"550\" y2=\"220\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"550.0,220.0 542.1,224.3 542.1,215.7\" fill=\"#51657a\"/\u003e\u003ctext x=\"278\" y=\"330\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eИсходный протокол сохраняется\u003c/text\u003e\u003ctext x=\"278\" y=\"355\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eдля разбора; права ограничены\u003c/text\u003e","caption":"Три внешних способа обмена не проникают напрямую во все внутренние модули. Адаптер переводит формат и бизнес-семантику, но не скрывает частичность или окно устаревания."},{"title":"Data layout: результат по каждой строке","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eBatch B17: приём файла ≠ резерв строк\u003c/text\u003e\u003crect x=\"50\" y=\"118\" width=\"260\" height=\"52\" rx=\"10\" fill=\"#dcfce7\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"64\" y=\"146\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eline 01\u003c/text\u003e\u003crect x=\"395\" y=\"118\" width=\"300\" height=\"52\" rx=\"10\" fill=\"#dcfce7\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"409\" y=\"146\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003ereserved\u003c/text\u003e\u003cline x1=\"310\" y1=\"144\" x2=\"395\" y2=\"144\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"395.0,144.0 387.1,148.3 387.1,139.7\" fill=\"#51657a\"/\u003e\u003crect x=\"50\" y=\"183\" width=\"260\" height=\"52\" rx=\"10\" fill=\"#fee2e2\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"64\" y=\"211\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eline 02\u003c/text\u003e\u003crect x=\"395\" y=\"183\" width=\"300\" height=\"52\" rx=\"10\" fill=\"#fee2e2\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"409\" y=\"211\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eno_stock\u003c/text\u003e\u003cline x1=\"310\" y1=\"209\" x2=\"395\" y2=\"209\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"395.0,209.0 387.1,213.3 387.1,204.7\" fill=\"#51657a\"/\u003e\u003crect x=\"50\" y=\"248\" width=\"260\" height=\"52\" rx=\"10\" fill=\"#fff3cd\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"64\" y=\"276\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eline 03\u003c/text\u003e\u003crect x=\"395\" y=\"248\" width=\"300\" height=\"52\" rx=\"10\" fill=\"#fff3cd\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"409\" y=\"276\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003ebad_code\u003c/text\u003e\u003cline x1=\"310\" y1=\"274\" x2=\"395\" y2=\"274\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"395.0,274.0 387.1,278.3 387.1,269.7\" fill=\"#51657a\"/\u003e\u003crect x=\"50\" y=\"313\" width=\"260\" height=\"52\" rx=\"10\" fill=\"#dcfce7\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"64\" y=\"341\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eline 04\u003c/text\u003e\u003crect x=\"395\" y=\"313\" width=\"300\" height=\"52\" rx=\"10\" fill=\"#dcfce7\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"409\" y=\"341\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003ereserved\u003c/text\u003e\u003cline x1=\"310\" y1=\"339\" x2=\"395\" y2=\"339\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"395.0,339.0 387.1,343.3 387.1,334.7\" fill=\"#51657a\"/\u003e\u003ctext x=\"50\" y=\"82\" font-family=\"system-ui,sans-serif\" font-size=\"19\" fill=\"#203047\" text-anchor=\"start\"\u003ereceipt: весь файл получен\u003c/text\u003e\u003ctext x=\"52\" y=\"428\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eПовтор B17 сохраняет line_id; исправление — новый согласованный пакет\u003c/text\u003e","caption":"Общее подтверждение receipt не делает успешными все строки. Идентичность пакета и строки позволяет применить частичный результат и отличить безопасный повтор от исправленной операции."}],"decision":{"prompt":"Как подключить склад с ночными файлами?","options":[{"title":"Адаптер batch и явное подтверждение резерва","consequence":"Склад работает в привычном режиме","tradeoff":"Окно устаревания требует ограничить обещания"},{"title":"Заказать складу онлайн REST API","consequence":"Можно быстрее проверять остатки","tradeoff":"Срок и стоимость внедрения на чужой стороне"},{"title":"Провести обмен через существующую ESB","consequence":"Переиспользуются эксплуатация и маршрутизация","tradeoff":"Зависимость от общей платформы и её очереди изменений"}],"recommended":0,"explanation":"На текущем объёме важнее точный контракт и сверка. Онлайн API разумен при измеримой цене задержки; ESB — если она уже надёжно эксплуатируется организацией."},"exercise":{"prompt":"Назовите два результата batch, которые нельзя объединять.","model":"\u003cp\u003eПолучение и синтаксическая проверка файла не равны резервированию каждой строки. Для частичного результата нужны отдельные идентификаторы строк и правила повтора.\u003c/p\u003e","rubric":["Разделён транспорт и бизнес","Учтена частичность"]},"checkpoint":[{"question":"Что строго типизированный gRPC-клиент сам не гарантирует?","options":["Безопасность повтора списания","Соответствие типов описанию сообщения","Генерацию методов из схемы"],"answer":0,"explanation":"Бизнес-эффект и его дедупликация находятся за пределами типизации."},{"question":"Почему лимит размера GraphQL-документа недостаточен?","options":["Небольшое дерево может раскрыть очень много объектов","Любой GraphQL всегда медленнее REST","GraphQL не поддерживает права доступа"],"answer":0,"explanation":"Нужны ограничения сложности, страниц и вычислений, а также объектная авторизация."}],"sources":[{"title":"gRPC, официальные core concepts: типы RPC и deadline","url":"https://grpc.io/docs/what-is-grpc/core-concepts/"},{"title":"GraphQL, официальное руководство Security: контроль спроса и сложности","url":"https://graphql.org/learn/security/"},{"title":"IETF, RFC 9110, 2022: HTTP-семантика","url":"https://www.rfc-editor.org/rfc/rfc9110.html"}],"wordCount":1511},{"id":"ch-11","arc":3,"title":"Заказ стал событием: зачем между системами журнал","briefing":"Платёж подтверждён. Теперь сборка, уведомления и аналитика хотят узнать об этом независимо. «Северный маршрут» впервые выбирает посредника сообщений и выясняет, что доставка сообщения не равна выполнению работы.","goals":["Различать команду, очередь и событие","Понимать подтверждения, повторы и порядок","Выбирать RabbitMQ или Kafka по характеру работы"],"sections":[{"title":"Команда просит, событие утверждает","html":"\u003cp\u003eКоманда «отправь чек» имеет предполагаемого исполнителя и может быть отклонена. Событие «платёж подтверждён» описывает уже зафиксированный факт; на него могут независимо реагировать сборка, уведомления и отчётность. Событие не должно тайно означать «кто-нибудь обязательно сделайте всё, что нужно заказу». Если процесс требует определённого следующего шага и контроля срока, у него должен быть владелец. Иначе потеря одного подписчика выглядит как ничья проблема.\u003c/p\u003e\u003cp\u003eBroker, посредник сообщений, принимает сообщения и передаёт их получателям согласно правилам. В рабочей очереди несколько обработчиков делят задания: одну доставку обычно получает один из них, а повтор возможен после сбоя. В publish/subscribe один факт нужен нескольким независимым потребителям. Это не значит, что каждый экземпляр сервиса получает копию: экземпляры одного логического обработчика часто делят одну подписку. Независимость определяется очередями или группами потребителей, а не количеством процессов.\u003c/p\u003e\u003cp\u003eДля «Северного маршрута» сообщение об оплате содержит event_id, order_id, тип факта, версию схемы, время события и необходимые атрибуты. Избыточные персональные данные не добавляют «на всякий случай»: каждое размножение повышает стоимость защиты и удаления. Слишком пустое событие тоже неудобно: если для каждой обработки надо синхронно читать заказ, отказ базы связывает все подписки. Полнота факта выбирается по конкретным потребителям и сроку его полезности.\u003c/p\u003e"},{"title":"Где живёт очередь и что значит подтверждение","html":"\u003cp\u003eУ RabbitMQ маршрутизацию задают exchanges и bindings: обменник принимает сообщение, правила направляют его в очереди, потребители читают очереди. Для безопасного сценария требуется отдельно настроить долговечность, свойства сообщения и нужный тип очереди. Название продукта не означает, что любой опубликованный байт уже переживёт потерю узла. Команда формулирует допустимый отказ: падение одного процесса, потеря одного сервера или всей площадки. Под каждый нужен свой набор мер.\u003c/p\u003e\u003cp\u003ePublisher confirm сообщает издателю о принятии сообщения брокером в рамках настроенных гарантий. Consumer acknowledgement сообщает брокеру, что потребитель завершил доставку и её можно убрать из очереди. Одно не доказывает другое. Более того, положительное подтверждение публикации не всегда доказывает попадание в нужную очередь: необходимо обрабатывать отсутствие маршрута предусмотренным механизмом, например mandatory и возвращённым сообщением. Иначе надёжно подтверждается сообщение, которое не встретило получателя.\u003c/p\u003e\u003cp\u003eПотребитель подтверждает после устойчивого эффекта. Если подтвердить раньше записи в базу, падение потеряет работу. Если записать в базу, затем упасть до ack, брокер доставит снова. Поэтому надёжная обработка обычно допускает повтор и делает эффект идемпотентным. Поле redelivered полезно для диагностики, но не заменяет устойчивый идентификатор и дедупликацию: потребитель не должен строить корректность только на транспортном флаге.\u003c/p\u003e"},{"title":"Kafka: читаемый журнал, а не просто большая очередь","html":"\u003cp\u003eKafka организует topic как набор partition — упорядоченных журналов. Записи сохраняются по политике хранения, а потребитель хранит позицию, offset. Чтение не удаляет запись для других групп. Поэтому журнал удобен, когда независимым системам нужны собственный темп и повторное чтение истории. Но retention ограничен, а восстановление требует совместимых обработчиков: старое событие может больше не помещаться в новую бизнес-модель без перевода.\u003c/p\u003e\u003cp\u003eПорядок обеспечивается внутри partition, а не во всём topic. Ключ order_id позволяет событиям одного заказа попадать в одну partition при стабильной стратегии размещения. Разные заказы обрабатываются параллельно. При этом «по порядку прочитано» ещё не означает «по порядку завершены внешние операции»: асинхронный код может отправить медленный первый запрос и быстрый второй. Порядок бизнес-переходов нужно сохранять внутри обработчика либо проверять версиями сущности.\u003c/p\u003e\u003cp\u003eВ одной consumer group partition распределяются между экземплярами. Больше экземпляров, чем partition, не добавит параллельного чтения этой группы. При перераспределении часть работы может повториться, если эффект успел произойти до фиксации offset. Транзакционные механизмы Kafka поддерживают ограниченную область exactly-once для чтения и записи в Kafka с нужной изоляцией. Они не превращают HTTP-вызов банка или отправку SMS в атомарный эффект с offset. Внешний получатель должен участвовать в собственной защите от повтора.\u003c/p\u003e"},{"title":"Задержка, перегрузка и ядовитые сообщения","html":"\u003cp\u003eПосредник разрывает временную связность, но не уничтожает работу. Если за минуту приходит 1200 заданий, а потребители выполняют 900, очередь растёт на 300 каждую минуту. Дополнительный диск даёт время на реакцию, а не увеличивает скорость исполнения. Для заказа важен возраст старейшего сообщения и время до бизнес-эффекта. Небольшое число крупных медленных заданий может быть опаснее огромного потока мелких; длина очереди без времени вводит в заблуждение.\u003c/p\u003e\u003cp\u003ePrefetch ограничивает число выданных, но ещё не подтверждённых доставок у потребителя. Слишком большое значение прячет работу у одного процесса и увеличивает объём повторов после падения. Слишком маленькое оставляет обработчик без работы между сетевыми обменами. В Kafka похожую практическую задачу решают размером пакета, внутренними очередями и дисциплиной обработки, хотя механизмы отличаются. Нельзя переносить одну настройку из RabbitMQ в Kafka по совпадающему названию проблемы.\u003c/p\u003e\u003cp\u003eЯдовитое сообщение стабильно ломает обработчик: неизвестная версия, повреждённая сумма, нарушение данных. Бесконечный немедленный retry блокирует полезную работу. После ограниченных попыток сообщение изолируют с причиной, исходным идентификатором и маршрутом восстановления. Такая dead-letter очередь не кладбище. У неё есть владелец и срок разбора. При ошибке версии массовый replay проводят после исправления и с контролем скорости, иначе восстановление создаёт вторую аварию.\u003c/p\u003e"},{"title":"Выбор инструмента следует из обещания","html":"\u003cp\u003eRabbitMQ естественен для распределения заданий с гибкой маршрутизацией и подтверждениями отдельной работы. Kafka естественна для длительного потока фактов, нескольких независимых групп и повторного чтения. Это не абсолютные границы продуктов: у RabbitMQ есть и другие модели, у Kafka появляются новые способы потребления. Но для учебного выбора важны не рекламные возможности, а конкретная модель и способность команды её эксплуатировать.\u003c/p\u003e\u003cp\u003eКоманда записывает объём, размер сообщения, число независимых подписчиков, срок хранения, допустимую задержку, требование порядка и способ восстановления. Если нужны только пятьсот заказов в сутки и один почтовый обработчик, устойчивая таблица заданий в существующей базе может быть проще нового кластера. Если аналитика должна пересчитывать неделю событий независимо от рабочих задач, читаемый журнал даёт реальную ценность. Ни один вариант не отменяет атомарную публикацию относительно заказа — это следующая глава.\u003c/p\u003e\u003cp\u003eНаблюдаемость связывает задержку сообщения с конкретным процессом. Нужно видеть время факта, принятия брокером, начала обработки и устойчивого эффекта. Эти часы могут расходиться, поэтому для точных интервалов используют подходящие локальные измерения и осторожную интерпретацию. Секреты и персональные данные не включают в общедоступный trace. Хороший отчёт об инциденте отвечает, какой эффект не выполнен и можно ли безопасно повторить, а не только показывает зелёный статус брокера.\u003c/p\u003e"},{"title":"Повторное чтение требует новой дисциплины","html":"\u003cp\u003eВозможность replay кажется бесплатной страховкой, пока обработчик не меняется. Допустим, старая версия выдавала скидочный купон при первом заказе, а новая — при каждом пятом. При полном перечитывании истории новый код может создать не те внешние эффекты, которых ожидал бизнес. Поэтому обработку для пересчёта аналитики отделяют от реакций, выдающих реальные права или деньги.\u003c/p\u003e\u003cp\u003eДля нового потребителя выбирают стартовую позицию осознанно: с начала доступной истории, с согласованного снимка либо с текущего момента. Этот выбор влияет на полноту результата и нагрузку. Нулевое отставание группы (consumer lag) не означает полноту, если группа начала читать только сегодня. Нужно знать, какую историю она обязана покрыть. У «Северного маршрута» аналитическая проекция может воспроизводиться отдельно, тогда как рабочий обработчик проверяет устойчивые бизнес-ключи и не создаёт старые уведомления заново.\u003c/p\u003e"}],"workedExample":{"title":"Разбор: чек отправлен дважды","html":"\u003cp\u003eСервис чеков получает PaymentSucceeded с event_id E71. Учебная скорость составляет 20 сообщений в секунду. Обработчик записывает чек в свою базу, отправляет его почтовому провайдеру, а затем подтверждает сообщение. В 10:03 процесс падает после успешной отправки письма, до ack. Брокер делает всё правильно: доставляет E71 другому экземпляру. Тот отправляет второй чек. Получается, брокерная надёжность повысила вероятность повторного внешнего эффекта.\u003c/p\u003e\u003cp\u003eПервое исправление — уникальная запись processed_event внутри той же транзакции, что и локальный чек. Оно защищает от второго создания чека, но ещё не решает письмо. Если отмечать E71 обработанным до отправки, падение оставит письмо неотправленным. Если после, остаётся окно дубля. Команда отделяет создание чека от доставки: первая транзакция создаёт чек и задание mail:M71. Внешняя доставка использует стабильный идентификатор M71, если провайдер поддерживает соответствующую дедупликацию. Если не поддерживает, продукт принимает редкий повтор письма и делает его безвредным по содержанию.\u003c/p\u003e\u003cp\u003eПри перегрузке потребители исполняют лишь 15 сообщений в секунду. За десять минут накопится 3000 сообщений: разница 5 умножается на 600 секунд. После восстановления мощности до 25 сообщений в секунду, при прежнем входе 20, на догон потребуется ещё десять минут. Показатель «сервис снова отвечает» не означает, что очередь восстановлена. Команда планирует запас производительности и оценивает возраст самого старого неоправленного чека.\u003c/p\u003e\u003cp\u003eНаконец, приходит событие новой версии с неизвестным типом валюты. Пять ограниченных попыток не исправляют семантику. Сообщение уходит в изолированную очередь; остальные продолжают работу. После исправления его повторяют с прежним E71-подобным идентификатором и тем же бизнес-ключом чека. Новый event_id ради обхода дедупликации разрушил бы защиту. Приёмка проверяет падение между записью и ack, недоступность провайдера и контролируемый разбор ошибок схемы.\u003c/p\u003e"},"expedition":{"world":"telemetry","title":"Экспедиция: датчики холодильников","html":"\u003cp\u003eСеть холодильных складов отправляет температуру каждую секунду. Датчик может сутки работать без связи и потом выгрузить историю. В отличие от задания «сформировать чек», старое измерение не нужно исполнять один раз и забывать: его могут читать оперативный мониторинг, расследование порчи и модель энергопотребления. Независимые позиции чтения и ограниченный по сроку журнал здесь полезнее конкуренции обработчиков за единственное выполнение.\u003c/p\u003e\u003cp\u003eОднако свежесть и полнота — разные цели. Аварийное уведомление должно учитывать время измерения: вчерашняя высокая температура, приехавшая сегодня из буфера, не доказывает текущую аварию. Для отчёта вчерашняя запись важна. Событие получает идентификатор устройства, номер измерения и время наблюдения; получение сервером хранится отдельно. Дедупликация по устройству и номеру устраняет повтор выгрузки, но не исправляет неверные часы датчика.\u003c/p\u003e\u003cp\u003eПереносится дисциплина доставки: подтверждение, повтор, ограничение нагрузки и явная обработка плохих данных. Меняется смысл задержки и требование хранения. «Северный маршрут» хотел завершить работу по заказу, складская телеметрия хочет сохранить наблюдения и вычислить несколько разных ответов. Увеличение retention не заменяет архивирование и контроль стоимости. Выбор журнала оправдан возможностью независимого переосмысления фактов, а не тем, что Kafka звучит масштабнее очереди.\u003c/p\u003e","transfer":["Повторы и устойчивые идентификаторы","Независимые потребители"],"distinct":["Время наблюдения отдельно от доставки","История для пересчётов"]},"diagrams":[{"title":"Topology: две границы подтверждения RabbitMQ","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eRabbitMQ: публикация и обработка — разные ack\u003c/text\u003e\u003crect x=\"25\" y=\"75\" width=\"180\" height=\"70\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"39\" y=\"103\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eИздатель\u003c/text\u003e\u003ctext x=\"39\" y=\"128\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eevent E71\u003c/text\u003e\u003crect x=\"285\" y=\"75\" width=\"190\" height=\"70\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"299\" y=\"103\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eExchange\u003c/text\u003e\u003ctext x=\"299\" y=\"128\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eмаршрутизация\u003c/text\u003e\u003crect x=\"555\" y=\"75\" width=\"180\" height=\"70\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"569\" y=\"103\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eОчередь чеков\u003c/text\u003e\u003ctext x=\"569\" y=\"128\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eустойчивая работа\u003c/text\u003e\u003crect x=\"555\" y=\"285\" width=\"180\" height=\"70\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"569\" y=\"313\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eПотребитель\u003c/text\u003e\u003ctext x=\"569\" y=\"338\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eзапись → ack\u003c/text\u003e\u003cline x1=\"205\" y1=\"104\" x2=\"285\" y2=\"104\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"285.0,104.0 277.1,108.3 277.1,99.7\" fill=\"#51657a\"/\u003e\u003cline x1=\"475\" y1=\"104\" x2=\"555\" y2=\"104\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"555.0,104.0 547.1,108.3 547.1,99.7\" fill=\"#51657a\"/\u003e\u003cline x1=\"555\" y1=\"176\" x2=\"205\" y2=\"176\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"205.0,176.0 212.9,171.7 212.9,180.3\" fill=\"#51657a\"/\u003e\u003ctext x=\"235\" y=\"166\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003epublisher confirm\u003c/text\u003e\u003cline x1=\"650\" y1=\"145\" x2=\"650\" y2=\"285\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"650.0,285.0 645.7,277.1 654.3,277.1\" fill=\"#51657a\"/\u003e\u003cline x1=\"600\" y1=\"285\" x2=\"600\" y2=\"145\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"600.0,145.0 604.3,152.9 595.7,152.9\" fill=\"#51657a\"/\u003e\u003ctext x=\"435\" y=\"240\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003econsumer ack\u003c/text\u003e\u003ctext x=\"30\" y=\"315\" font-family=\"system-ui,sans-serif\" font-size=\"20\" fill=\"#b45309\" text-anchor=\"start\"\u003eПотерян ack → повтор E71\u003c/text\u003e\u003ctext x=\"30\" y=\"350\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#203047\" text-anchor=\"start\"\u003eНет маршрута проверяется отдельно\u003c/text\u003e\u003ctext x=\"30\" y=\"380\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#203047\" text-anchor=\"start\"\u003eConfirm не доказывает письмо клиенту\u003c/text\u003e","caption":"Confirm направлен издателю, consumer ack — от обработчика очереди. Двусторонняя вертикальная связь означает доставку и подтверждение. Схема не утверждает сохранность без корректной конфигурации очереди и публикации."},{"title":"Data layout: журнал и независимые offsets","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eKafka: порядок внутри partition, позиции у групп\u003c/text\u003e\u003ctext x=\"30\" y=\"115\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#203047\" text-anchor=\"start\"\u003eP0 · order 7\u003c/text\u003e\u003crect x=\"220\" y=\"80\" width=\"100\" height=\"64\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"234\" y=\"108\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003ev1\u003c/text\u003e\u003ctext x=\"234\" y=\"133\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eoffset 0\u003c/text\u003e\u003crect x=\"335\" y=\"80\" width=\"100\" height=\"64\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"349\" y=\"108\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003ev2\u003c/t " text-anchor=\"start\"\u003eoffset 1\u003c/text\u003e\u003crect x=\"450\" y=\"205\" width=\"100\" height=\"64\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"464\" y=\"233\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003ev3\u003c/text\u003e\u003ctext x=\"464\" y=\"258\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eoffset 2\u003c/text\u003e\u003crect x=\"565\" y=\"205\" width=\"100\" height=\"64\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"579\" y=\"233\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003ev4\u003c/text\u003e\u003ctext x=\"579\" y=\"258\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eoffset 3\u003c/text\u003e\u003ctext x=\"40\" y=\"345\" font-family=\"system-ui,sans-serif\" font-size=\"19\" fill=\"#203047\" text-anchor=\"start\"\u003eГруппа «аналитика»: P0 → 2, P1 → 1\u003c/text\u003e\u003ctext x=\"40\" y=\"385\" font-family=\"system-ui,sans-serif\" font-size=\"19\" fill=\"#203047\" text-anchor=\"start\"\u003eГруппа «чеки»: P0 → 3, P1 → 3\u003c/text\u003e\u003ctext x=\"40\" y=\"430\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eЧтение одной группы не удаляет историю для другой\u003c/text\u003e","caption":"Номера offset локальны каждой partition. Группы хранят независимые позиции; схема не обещает общего порядка P0 и P1. Возможность повторного чтения ограничена retention и совместимостью обработчика."}],"decision":{"prompt":"Что выбрать для первых фоновых задач?","options":[{"title":"Устойчивую таблицу заданий в PostgreSQL","consequence":"Меньше инфраструктуры, атомарная постановка рядом с заказом","tradeoff":"Нужно корректно реализовать захват и ограничить нагрузку на OLTP"},{"title":"RabbitMQ с рабочими очередями","consequence":"Удобны маршрутизация, ack и разделение исполнителей","tradeoff":"Нужны эксплуатация брокера и атомарная публикация"},{"title":"Kafka с журналом заказов","consequence":"Поддержит независимое чтение и replay","tradeoff":"Больше операционных понятий и ограничение порядка по partition"}],"recommended":0,"explanation":"При пятистах заказах в сутки и одном обработчике новая инфраструктура пока не окупается. Появление независимых потребителей изменит оценку."},"exercise":{"prompt":"Чем publisher confirm отличается от consumer ack?","model":"\u003cp\u003eПервое относится к принятию публикации брокером в его модели сохранности, второе — к завершению конкретной доставки потребителем. Ни одно автоматически не доказывает отправку письма или списание денег.\u003c/p\u003e","rubric":["Разделены две границы","Назван внешний эффект"]},"checkpoint":[{"question":"Kafka-транзакция автоматически делает SMS ровно один раз?","options":["Нет, внешняя система должна участвовать в защите эффекта","Да, если topic имеет три реплики","Да, если consumer читает read_committed"],"answer":0,"explanation":"Изоляция чтения Kafka не включает транзакцию SMS-провайдера."},{"question":"Поток 1200 в минуту, обработка 900. Что даёт большой диск?","options":["Дополнительное время до исчерпания ёмкости","Автоматическое уменьшение очереди","Гарантию прежней задержки"],"answer":0,"explanation":"Долг растёт на 300 сообщений в минуту независимо от размера диска."}],"sources":[{"title":"RabbitMQ, Consumer Acknowledgements and Publisher Confirms","url":"https://www.rabbitmq.com/docs/confirms"},{"title":"RabbitMQ, Reliability Guide","url":"https://www.rabbitmq.com/docs/reliability"},{"title":"Apache Kafka 4.0, Design: message delivery semantics","url":"https://kafka.apache.org/40/design/design/"}],"wordCount":1520},{"id":"ch-12","arc":3,"title":"Длинный заказ: локальные гарантии вместо общей иллюзии","briefing":"Оплата, резерв, сборка и доставка переживают разные отказы. «Северному маршруту» нужен процесс на часы, а не одна длинная транзакция. Команда учится связывать локальные успехи и восстанавливать промежутки.","goals":["Понять границу outbox и дедупликации","Разделять saga, CQRS, event sourcing и CDC","Проектировать компенсации и повтор проекций"],"sections":[{"title":"Двойная запись оставляет щель","html":"\u003cp\u003eПосле подтверждения платежа сервис меняет заказ в PostgreSQL и публикует событие брокеру. Если сначала commit, затем публикация, падение между ними оставляет оплаченный заказ без продолжения. Если сначала публикация, затем commit, получатель увидит факт, которого в базе ещё нет или никогда не будет. Повторы не устраняют логическую щель: в одном порядке возможна потеря, в другом — ложный факт. Нужен способ связать бизнес-изменение с намерением его сообщить.\u003c/p\u003e\u003cp\u003eTransactional outbox — таблица исходящих сообщений, записываемая в той же локальной транзакции, что и изменение заказа. Commit делает видимыми и новое состояние, и событие; rollback не оставляет ни одного. Отдельный relay читает outbox и публикует события. Он может опрашивать таблицу либо получать изменения через журнал базы. Это переносит неопределённость на участок, где повтор возможен без потери исходного намерения. Outbox не создаёт общую транзакцию с брокером.\u003c/p\u003e\u003cp\u003eЕсли relay отправил сообщение и упал до отметки «отправлено», после запуска он отправит повтор. Следовательно, обещание outbox — устойчивое намерение и возможность доставки при восстановлении, а не единственная физическая отправка. Необходимы идентификатор события, стратегия повторов, мониторинг возраста записей и очистка только после безопасной границы. Бесконечно растущий outbox способен заполнить диск главной базы и остановить приём заказов: эксплуатация входит в механизм, а не добавляется потом.\u003c/p\u003e"},{"title":"Inbox защищает конкретную транзакцию","html":"\u003cp\u003eНа стороне потребителя inbox, или журнал обработанных событий, хранит event_id. В одной транзакции потребитель вставляет этот идентификатор и применяет локальное изменение. Уникальное ограничение не даёт двум экземплярам одновременно применить один факт. Важно, чтобы dedup-запись и эффект находились в одной атомарной области. Проверка в отдельном Redis перед записью PostgreSQL не даёт такой гарантии: можно пометить событие и не изменить заказ либо изменить дважды.\u003c/p\u003e\u003cp\u003eОбласть уникальности обычно включает имя обработчика: одно событие должны независимо применить склад и бухгалтерия. Идентификатор доставки брокера может меняться при повторной публикации, поэтому он хуже стабильного бизнес-event_id. Время хранения inbox должно покрывать реальные возможности replay и задержки. Если запись удалить через сутки, а журнал перечитать через месяц, прежнее сообщение снова станет «новым». Иногда уникальное ограничение самой бизнес-сущности надёжнее временной таблицы дедупликации.\u003c/p\u003e\u003cp\u003eНо письмо, банковский возврат и сообщение партнёру не становятся атомарными с inbox. Для них создают новое устойчивое намерение и используют возможности внешнего API. Если внешний эффект нельзя дедуплицировать, гарантии формулируют честно: возможен повтор либо требуется ручное подтверждение. Дедупликация события означает лишь «этот обработчик не применил повторно свою локальную транзакцию». Это полезная, но ограниченная гарантия. Разница особенно важна, когда локальный эффект запускает цепочку новых денежных операций.\u003c/p\u003e"},{"title":"Saga — последовательность решений и компенсаций","html":"\u003cp\u003eSaga описывает длинную бизнес-операцию как цепочку локальных транзакций с действиями при неуспехе. Для заказа это резерв товара, авторизация платежа, назначение доставки и подтверждение исполнения. Каждый шаг фиксируется отдельно, поэтому промежуточные состояния видны другим процессам. Saga не даёт изоляцию большой ACID-транзакции. Пока платёж авторизован, другой запрос может отменить заказ, а склад — сообщить недостачу. Такие гонки требу
