tion": "Стоимость наблюдаемости связана со стоимостью восстановления и выполнением SLO. Локальная экономия ресурса может увеличить совокупный ущерб и труд."}, {"question": "Алерт бюджета настроен на 100 тысяч рублей. Ограничен ли расход?", "options": ["Да, уведомление эквивалентно квоте провайдера", "Да, если владелец прочитал сообщение", "Нет: нужен механизм ограничения/эскалации и согласованное поведение при пороге"], "answer": 2, "explanation": "Алерт даёт сигнал, а не ограничивает потребление. Жёсткий stop тоже требует проектирования, чтобы не создать непредусмотренную недоступность."}], "sources": [{"title": "FinOps Foundation: Unit Economics — атрибуция идеи связи затрат с полезным результатом; примеры авторские", "url": "https://www.finops.org/framework/capabilities/unit-economics/"}, {"title": "Google SRE: Non-Abstract Large System Design", "url": "https://sre.google/workbook/non-abstract-design/"}], "recall": "Чем LLM-ответ отличается от разрешённого бизнес-действия? Какие версии попадают в протокол выпуска?"}, {"id": "sd-10", "title": "Архитектурный совет: защитить решение и план поставки", "minutes": 120, "intro": "Итог после платформы, AI и экономики. Защитите решение, включающее сквозной бизнес-путь, платформенный контракт, ограничения AI и бюджет. Это учебный совет, а не сертификация.", "lessons": [{"title": "Сначала критерии, потом варианты", "body": "\u003cp>Заказчик просит запустить корпоративный маркетплейс за 12 недель. Команда предлагает микросервисы, потому что «так масштабируется». Руководителю нужно вернуть обсуждение к критическим сценариям: создание заказа, резерв товара, подтверждение оплаты, изменение статуса и поддержка спорных операций. Для каждого сценария нужны инвариант, предел нагрузки, допустимая задержка и ущерб при сбое.\u003c/p>\u003cp>Архитектурный вариант сравнивают с этими критериями, а не со списком модных технологий. Модульный монолит с одной транзакционной БД может уменьшить риск первого запуска; отдельная обработка уведомлений и аналитики — изолировать второстепенные задачи. Микросервисы могут быть оправданы независимыми командами, разным масштабированием и зрелой эксплуатацией. Цена — распределённые отказы и координация контрактов.\u003c/p>\u003cp>Разделите ограничения и предпочтения. «Уже есть поддерживаемый PostgreSQL-кластер» — значимый ресурсный факт. «Архитектор любит Kafka» — предпочтение. «Нельзя терять подтверждённый резерв» — инвариант. «Запуск через 12 недель» — ограничение, которое может потребовать уменьшения scope. Не превращайте любое пожелание в жёсткое требование.\u003c/p>\u003cp>Сформулируйте два жизнеспособных варианта. Заведомо плохой вариант в сравнении создаёт иллюзию анализа. Для каждого укажите операционную сложность, границы данных, зависимости команд, стоимость перехода и что проверять прототипом. Неопределённость является частью решения, если имеет владельца и план снятия.\u003c/p>"}, {"title": "Записка решения: от схемы к доказательству", "body": "\u003cp>Короткая архитектурная записка начинается с контекста и решения, затем показывает причины. Удобный набор: цель, критические сценарии, измеримые требования, контекстная схема, контейнеры и владельцы данных, один динамический путь, один отказ, варианты, ADR и план проверки. C4 помогает выбирать уровень детализации, но ни одна нотация не доказывает корректность сама по себе.\u003c/p>\u003cp>ADR — запись значимого решения: контекст, выбранный вариант, рассмотренные альтернативы и последствия. Добавьте в учебном формате срок пересмотра или событие-триггер. Например: «На старте один writer остатков; пересмотр при устойчивом превышении измеренного предела записи или появлении независимых доменных команд». Это лучше обещания «перепишем когда-нибудь».\u003c/p>\u003cp>На динамическом пути покажите не только стрелки, но и факты: где операция становится принятой, что подтверждает запись, какой ID связывает повторы и как появляется конечный статус. На отказе укажите: что произойдёт при потере ответа после успешного списания? Где останется знание о незавершённой операции? Кто её найдёт?\u003c/p>\u003cp>Схема должна позволять выделить решение о поставке. Если одна миграция требует одновременного релиза восьми команд, это архитектурное ограничение независимости, а не исключительно плохое планирование. Изменение границ или совместимый контракт могут быть эффективнее нового общего календаря.\u003c/p>"}, {"title": "Стоимость, команда и управляемое сокращение scope", "body": "\u003cp>Стоимость архитектуры включает не только вычисления. Оцените хранение и резервные копии, сеть, лицензии, поддержку, наблюдаемость, время дежурств, обучение и переходный период. Для сравнения вариантов используйте горизонт и одинаковые предпосылки. Учебные оценки — диапазоны, а не бюджетные обязательства без тарифов и замеров.\u003c/p>\u003cp>Допустим, вариант А требует 15 инженеро-недель, вариант Б —24, а в 12 календарных неделях доступно две команды. Из этого нельзя автоматически вывести срок: навыки и последовательные зависимости могут ограничивать параллелизм. Отдельно выделите внешние согласования, доступ к стенду партнёра, данные и операционную готовность. В критический путь попадает не только код.\u003c/p>\u003cp>При дефиците времени сокращайте возможность, а не скрытно ослабляйте инвариант. Можно отказаться от рекомендаций и отложить отчёт, но нельзя незаметно разрешить двойное списание. Можно честно принимать заказ в обработку, если бизнес согласовал неопределённость резерва; нельзя показывать «подтверждено», когда подтверждения нет.\u003c/p>\u003cp>Архитектурный spike нужен для рискованной гипотезы с критерием выхода: проверить, выдержит ли горячий остаток нужную конкуренцию, либо как долго восстанавливается 100 ГБ. «Исследовать Kafka» без результата съест время и не изменит решение. Остановите исследование, когда данных достаточно для конкретного выбора.\u003c/p>"}, {"title": "Защита: вопрос меняет условия", "body": "\u003cp>Учебный архитектурный совет проверяет причинное мышление. На вопрос «почему Kafka?» отвечайте не названием паттерна, а потребностью: развязать доставку уведомлений, выдержать недоступность потребителя и иметь воспроизводимый поток. Затем назовите цену: задержка, повторы, схемы, хранение и сопровождение. Если задача исчезает, решение может стать лишним.\u003c/p>\u003cp>Используйте облегчённую логику анализа компромиссов, вдохновлённую SEI: бизнес-драйверы, важные сценарии качества, архитектурные подходы, чувствительные места и риски. Полный ATAM включает отдельный процесс и участников; наш 40-минутный разбор не следует выдавать за полную оценку ATAM. Здесь достаточно доказать, что выбор связан с требованиями и проверкой.\u003c/p>\u003cp>Когда интервьюер или коллега меняет входные данные, пересчитайте затронутый участок. Удвоение чтений может решить кэш; удвоение конкурирующих резервов на один SKU — другая задача. Потеря дата-центра затрагивает quorum, ёмкость и сеть. Запрет передачи данных меняет интеграцию, а не только текст политики.\u003c/p>\u003cp>Сильный ответ иногда состоит в «этого пока не знаем; до решения проверяем таким экспериментом». Важно ограничить неизвестное и объяснить, что нельзя выпускать до проверки. Уверенность без границ опаснее явно управляемой неопределённости.\u003c/p>"}, {"title": "Разобранный пример: решение под дату, а не культ микросервисов", "body": "\u003cp>Учебный маркетплейс получает 80 тыс.заказов в сутки, пиковый коэффициент 15, на заказ приходится 20 чтений каталога. Средний поток заказов≈0,93/с, пиковый≈13,9/с; чтения каталога в соответствующем профиле≈278/с. Эти числа сами по себе не требуют десятков сервисов. Но распродажа одного товара может создать локальную конкуренцию, которую средние скрывают.\u003c/p>\u003cp>На старте выбираем модульный транзакционный контур заказов и резервов с явными границами модулей, отдельно — асинхронные уведомления. Внешняя оплата имеет устойчивый operation_id, неопределённый статус и сверку. Источник истины о резерве один; кэш отвечает только за витрину. Доступ к заказу проверяется по организации и роли. Бэкап и failover подтверждаются прогоном.\u003c/p>\u003cp>Поставку делим на контракт и сквозной тестовый путь, затем пилот ограниченной группы, проверку восстановления и расширение. Метрика успеха — корректно завершённые заказы, а не количество развёрнутых сервисов. Риск: при росте независимых команд монолит может стать узким местом поставки; сохраняем внутренние границы и критерий пересмотра.\u003c/p>\u003cp>Альтернатива с отдельными сервисами заказов и остатков уместна, если команды уже независимы и умеют эксплуатировать распределённый протокол резерва. Но за 12 недель нельзя считать эти навыки бесплатными. За 20 минут защитите обе позиции, затем выберите одну под заданные ресурсы. В хорошем решении видна цена отказа от альтернативы.\u003c/p>"}], "practice": {"minutes": 40, "task": "\u003cp>\u003cb>Итоговый совет: «Маршрут B2B».\u003c/b> 200 тыс.заказов/сутки, пик×12,20 чтений на заказ, шесть регионов РФ. Две backend-команды, одна мобильная, платформа с PostgreSQL/Kafka/OpenShift. Партнёр оплаты отвечает до 3 секунд, иногда ответ теряется после списания. Остаток обновляет внешняя WMS, предел 100 запросов/с. Дата пилота —12 недель. Подтверждённый заказ не должен теряться; двойное списание запрещено. Конечный статус 95%заказов должен появляться за 2 минуты — учебное требование, которое предстоит проверить с партнёрами.\u003c/p>\u003col>\u003cli>5 мин: требования, инварианты и нагрузки.\u003c/li>\u003cli>10 мин: два варианта, контекстная схема и владельцы данных; схему можно описать структурированным текстом.\u003c/li>\u003cli>10 мин: путь заказа, timeout оплаты, повтор и сверка.\u003c/li>\u003cli>10 мин: ADR, план поставки, испытания и Go/No-Go.\u003c/li>\u003cli>5 мин: вводная совета — WMS недоступна 20 минут. Пересмотрите обещание подтверждения и границы пилота.\u003c/li>\u003c/ol>\u003cp>После работы 20 минут проверки: защитите за 5 минут решение вслух, ответьте на вопросы, сравните разбор и отметьте рубрику. Не компенсируйте критический дефект большим числом второстепенных деталей.\u003c/p>\u003ch3>Дополнительные условия совета 2026\u003c/h3>\u003cp>Платформа выдаёт типовую среду за 1 день, особую сетевую политику — за 10 рабочих дней; runtime работает независимо от портала. Бизнес просит AI-помощника, который объясняет статус и сам переносит дату доставки. Регламенты имеют ACL по организациям; внешний LLM требует проверки допустимых потоков данных. На пилот выделено 300 тысяч рублей в месяц на эксплуатацию; расчётная база без AI — 220 тысяч, AI-путь при прогнозе — 90 тысяч. Ставки учебные.\u003c/p>\u003cp>В пределах прежних 40 минут распределите работу так: 5 минут требования и нагрузки, 8 архитектура и владельцы, 8 платёжный сбой, 7 платформа и AI, 7 бюджет и поставка, 5 изменение условия WMS. Выберите scope: AI-черновик/поиск, самостоятельные действия либо отсрочка. Запишите последствия для прав, качества, полезной стоимости, лимитов и сроков. Нельзя считать 310 тысяч соответствующими бюджету 300 тысяч без изменения плана или явного решения владельца.\u003c/p>", "rubric": ["Нагрузка≈2,31 заказа/с в среднем,≈27,8/с в пике; чтения≈556/с при заданной модели.", "Сравнены два жизнеспособных варианта с организационной ценой и ограничением WMS.", "Timeout оплаты не создаёт новое списание; есть ID, идемпотентность и сверка.", "Названы источник истины, объектные права и обработка недоступности WMS.", "План имеет проверяемые этапы, восстановление, границу отката и владельцев.", "Изменение условия привело к пересмотру обещания; неопределённый заказ не назван подтверждённым.", "Платформенный путь и особое исключение учтены в сроках и ответственности.", "AI-возможность имеет границы прав, ACL, оценку по сегментам и fallback; модель не является источником статуса.", "Бюджет 310 тысяч сопоставлен с лимитом 300 тысяч: сокращён scope/расход либо согласовано изменение, а не скрыто превышение."], "model": "\u003cp>Выберите вариант по фактической зрелости двух команд: модульный контур со стабильными интеграционными границами либо сервисы при готовой эксплуатации. При 27,8 заказа/с лимит WMS 100/с кажется достаточным только если на заказ не больше≈3,6 обращения и нет иных потребителей; это гипотеза для измерения. Каталог не должен обращаться к WMS на каждое чтение. Платёж имеет единый устойчивый ID и состояние неопределённости, а потеря ответа запускает проверку, а не новое списание.\u003c/p>\u003cp>При отказе WMS 20 минут нельзя обещать подтверждение актуального резерва за 2 минуты без локально делегированного запаса или другого согласованного механизма. Можно принять заявку в ожидание, ограничить ассортимент/регион пилота либо изменить обещание вместе с бизнесом. Нужны SLI по принятому сценарию и отдельный контроль инвариантов. Релиз начинается со сквозного пути, contract tests и прогона отказов; расширение пилота зависит от наблюдаемых результатов.\u003c/p>\u003cp>Не ставьте особую политику на последнюю неделю: её 10 рабочих дней — отдельная зависимость. Сначала подтвердите типовой путь, а исключение согласуйте с владельцем поддержки. AI в MVP разумно ограничить поиском и черновиком, с ACL перед контекстом, проверкой человеком и данными статуса из основного сервиса. Автономный перенос даты потребовал бы проверяемого инструмента и иной программы испытаний. Выбранный scope всё равно нужно оценить: 310 тысяч больше 300 тысяч. Уменьшите объём вызовов, фиксированные статьи или согласуйте новый лимит с guardrails качества. Простая квота без fallback может сломать SLO; регион и когорту пилота выбирают с учётом лимита WMS, платформы и качества.\u003c/p>"}, "quiz": [{"question": "Какой аргумент лучше защищает архитектуру?", "options": ["У варианта меньше начальная инфраструктурная цена, поэтому совокупный риск ниже", "Вариант связан с измеримыми сценариями, его цена и риски проверяются экспериментами", "Все компоненты поддерживают горизонтальное масштабирование по документации"], "answer": 1, "explanation": "Нужно связать решение с критическими сценариями и ограничениями, а затем показать доказательства и цену компромисса. Масштабирование компонентов и низкая стартовая цена не доказывают корректность целого."}, {"question": "WMS недоступна 20 мин, актуальный резерв обязателен. Что можно честно обещать?", "options": ["Принять заявку в ожидание либо согласовать механизм локально делегированного резерва", "Подтвердить заказ по витринному кэшу, а резерв сверить после восстановления WMS", "Повторять запрос каждые 100 мс до ответа, сохранив обещание двух минут"], "answer": 0, "explanation": "Меняется бизнес-сценарий; кэш без делегированного права резервирования не создаёт подтверждение."}, {"question": "Команда не знает предела горячего остатка. Лучший следующий шаг?", "options": ["Заранее распределить заказы по случайным шардам, не меняя владельца остатка", "Начать полную реализацию и отложить проверку до общего нагрузочного теста", "Проверить гипотезу ограниченным экспериментом с реалистичной конкуренцией и порогом"], "answer": 2, "explanation": "Эксперимент должен снять архитектурно значимую неопределённость до решения о выпуске."}, {"question": "На пилоте: база 220 тыс./мес., AI 90 тыс., лимит 300 тыс. Новая модель дешевле, но хуже на спорных заказах. Как защитить решение?", "options": ["Выбрать её автоматически: главное поместиться в бюджет", "Сократить объём и задачи AI либо выбрать иной вариант с проверкой сегментов, лимитом и fallback; явно согласовать остаток", "Оставить 310 тысяч и описать 10 тысяч как погрешность без согласования"], "answer": 1, "explanation": "Себестоимость и качество нужно рассматривать вместе. Экономия ценой скрытой регрессии не равна выполнению требований. Превышение требует изменения плана или решения владельца; ограничение расхода нуждается в безопасном fallback."}], "sources": [{"title": "SEI: ATAM — Method for Architecture Evaluation", "url": "https://www.sei.cmu.edu/library/atam-method-for-architecture-evaluation/"}, {"title": "C4: diagram levels", "url": "https://c4model.com/diagrams"}, {"title": "Google SRE: Non-Abstract Large System Design", "url": "https://sre.google/workbook/non-abstract-design/"}, {"title": "CMU: Spaced Practice", "url": "https://www.cmu.edu/teaching/resources/instructionalstrategies/activelearningstrategies/spacedopractice/index.html"}], "recall": "Вспомните TCO и цену полезного результата. Как меньший тариф может дать более дорогой бизнес-исход?"}];
const TOTAL_HOURS=COURSE.reduce((n,m)=>n+m.minutes,0)/60,TOTAL_DAYS=Math.ceil(COURSE.length/2);
const KEY='sd-course-v2';let state={module:'home',notes:{},checks:{},answers:{},done:{},theme:'light',legacyDone:{}},storageOK=true,migrationNotice='';
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(!saved){const old=JSON.parse(localStorage.getItem('sd-course-v1')||'null');if(old&&typeof old==='object'){saved={module:old.module,notes:old.notes,checks:old.checks,theme:old.theme,legacyDone:old.done};migrationNotice='Перенесены заметки и рубрики прежнего курса. Вопросы и задания обновлены: отметьте завершение заново после проверки. Прежнее прохождение сохранено в портфеле.';}}if(saved&&typeof saved==='object'){for(const k of ['notes','checks','answers','done','legacyDone'])if(saved[k]&&typeof saved[k]==='object'&&!Array.isArray(saved[k]))state[k]=saved[k];if(saved.theme==='dark')state.theme='dark';if(saved.module==='home'||COURSE.some(m=>m.id===saved.module))state.module=saved.module;}}catch(e){storageOK=false;}

const $=s=>document.querySelector(s),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}$('#storageStatus').textContent=storageOK?migrationNotice:'Сохранение недоступно. Не закрывайте страницу до экспорта портфеля.';}

function toc(query=''){const q=query.toLocaleLowerCase('ru');$('#toc').innerHTML='<li><button data-go="home" '+(state.module==='home'?'aria-current="page"':'')+'>Обзор и инструменты<small>Маршрут · калькуляторы · результат</small></button></li>'+COURSE.map((m,i)=>{if(q&&!JSON.stringify(m).toLocaleLowerCase('ru').includes(q))return'';return'<li><button data-go="'+escapeHTML(m.id)+'" '+(state.module===m.id?'aria-current="page"':'')+'>'+ (state.done[m.id]?'✓ ':'')+String(i+1).padStart(2,'0')+' · '+escapeHTML(m.title)+'<small>День '+(Math.floor(i/2)+1)+' · 2 часа</small></button></li>';}).join('');$('#searchStatus').textContent=q&&!COURSE.some(m=>JSON.stringify(m).toLocaleLowerCase('ru').includes(q))?'Ничего не найдено. Попробуйте другое слово.':'';const n=COURSE.filter(m=>state.done[m.id]).length;$('#progressFill').style.width=n/COURSE.length*100+'%';$('.progress').setAttribute('aria-valuemax',COURSE.length);$('.progress').setAttribute('aria-valuenow',n);$('#progressText').textContent=n+' из '+COURSE.length+' модулей завершено';}
function home(){return `<span class="eyebrow">Практикум для PM · Delivery · Release</span><h1>Понимать архитектуру.<br>Управлять последствиями.</h1><p class="lead">От бизнес-сценария до архитектурного совета: научитесь видеть, где решение изменяет сроки, риски, стоимость и безопасность поставки.</p><div class="meta"><span class="pill">${TOTAL_HOURS} часов с практикой</span><span class="pill">${TOTAL_DAYS} дней · до 4 часов в день</span><span class="pill">${COURSE.length} рабочих артефактов</span><span class="pill">Редакция 2026 · офлайн</span></div><div class="actions"><button class="primary" data-go="${escapeHTML(COURSE.find(m=>!state.done[m.id])?.id||COURSE[0].id)}">${Object.keys(state.notes).length?'Продолжить обучение':'Начать первый модуль'} →</button></div><div class="rule"><b>Ваш результат — обоснованное решение.</b> После курса вы сможете собрать измеримые требования, разобрать путь данных и сбои, потребовать доказательства готовности и защитить план выпуска. Для детального проектирования и реализации по-прежнему нужна работа с инженерами.</div><h2>Как проходить курс</h2><div class="grid"><div class="card"><span class="eyebrow">Каждый модуль · 120 минут</span><h3>40 + 20 + 40 + 20</h3><p>40 минут — теория и заметки; 20 — разбор примера и проверка допущений; 40 — самостоятельное решение; 20 — вопросы, рубрика и рефлексия.</p><p class="small muted">Объём чтения меньше ${TOTAL_HOURS} часов. Полная длительность включает расчёты, создание артефактов и самостоятельную проверку. Это ориентир темпа, а не таймер.</p></div><div class="card"><span class="eyebrow">Режим работы</span><h3>Сначала решение, затем разбор</h3><p>Пишите свой ответ в рабочее поле, называйте допущения и владельцев. Затем откройте разбор и оцените решение по рубрике. Правильный вариант в тесте не заменяет аргументацию.</p><p class="small muted">Кейсы учебные, организации и показатели вымышлены. Российский контекст используется для реалистичных ограничений, а не для описания внутренних систем компаний.</p></div></div><h2>Маршрут на ${TOTAL_DAYS} дней</h2><div class="card">${Array.from({length:TOTAL_DAYS},(_,d)=>d).map(d=>'<div class="day"><b>День '+(d+1)+'</b><div>'+COURSE.slice(d*2,d*2+2).map(m=>'<a href="#'+escapeHTML(m.id)+'" data-go="'+escapeHTML(m.id)+'">'+escapeHTML(m.title)+'</a>').join('<br>')+'</div></div>').join('')}</div><h2>Как устроена методика</h2><p>Основа — сценарии качества и анализ компромиссов SEI, уровни схем C4, пользовательские SLO из Google SRE и проверка поведения по документации PostgreSQL, Kafka и OWASP. Новые модули связывают платформенный контракт, AI-качество и полезную стоимость; в них используются первоисточники DORA, NIST, OWASP GenAI и FinOps Foundation. Ссылки на первоисточники есть в каждом модуле. Необязательное дополнительное чтение не входит в ${TOTAL_HOURS} часов.</p><p>В начале следующего дня воспроизведите без подсказки ключевое решение прошлого. После этого проверьте его и решите изменённый сценарий. Такая практика полезнее простого узнавания текста; результаты курса всё равно зависят от самостоятельной работы.</p><h2>Архитектурный полигон</h2><div class="decision"><h3>Ответ об оплате потерян</h3><p>Партнёр мог уже списать деньги. Клиент нажал «Повторить». Какое действие выберете?</p><button data-decision="retry">Создать новый платёж</button><button data-decision="fail">Назвать платёж неуспешным</button><button data-decision="reconcile">Проверить прежнюю операцию</button><output id="decisionResult" aria-live="polite">Сначала примите решение — затем появится разбор.</output></div><h2>Рабочий договор</h2><p>Умеете вести проект или релиз и знаете базовые роли разработки и эксплуатации. Термины раскрываются по ходу курса. Для практики достаточно текста и калькулятора; код писать не требуется.</p><p>Каждый артефакт должен содержать: контекст и ограничения, варианты, решение и цену компромисса, критерий проверки, владельца и следующий шаг. Сохранённый портфель пригодится на архитектурном ревью и при подготовке к собеседованию.</p><details><summary>Словарь терминов перед практикой</summary><div><dl><dt><b>NFR / SLI / SLO</b></dt><dd>Требование к качеству / измеритель / целевое значение измерителя с окном и правилами.</dd><dt><b>RPS / throughput / concurrency</b></dt><dd>Запросы в секунду / скорость завершения работы / число операций одновременно.</dd><dt><b>p95 / p99</b></dt><dd>Пороги,которые не превышают примерно 95% / 99% наблюдений в выбранной выборке. Не среднее время.</dd><dt><b>Инвариант / источник истины</b></dt><dd>Правило,которое нельзя нарушать / согласованный авторитетный источник конкретного факта.</dd><dt><b>CDC / backfill</b></dt><dd>Доставка изменений из источника / заполнение исторических данных. Их порядок должен быть согласован.</dd><dt><b>WMS / ERP</b></dt><dd>Система управления складом / система управления ресурсами и учётом предприятия.</dd><dt><b>RPO / RTO / DR</b></dt><dd>Допустимая потеря данных / целевое время восстановления функции / восстановление после серьёзного отказа.</dd><dt><b>Fencing / sole writer</b></dt><dd>Ограждение старого узла от записи / единственный уполномоченный владелец записи.</dd><dt><b>Outbox / DLQ / replay</b></dt><dd>Атомарно сохранённое намерение публикации / карантин проблемных сообщений / повторная обработка диапазона истории.</dd><dt><b>ADR / cutover</b></dt><dd>Запись архитектурного решения и последствий / переключение на новый путь обработки или записи.</dd><dt><b>Golden path / control plane</b></dt><dd>Поддерживаемый типовой путь работы / контур управления, отличный от обработки пользовательских запросов.</dd><dt><b>LLM / RAG / eval</b></dt><dd>Генеративная языковая модель / поиск источников для контекста ответа / проверка качества на заданных сценариях.</dd><dt><b>ACL / TCO / unit cost</b></dt><dd>Правила доступа / совокупная стоимость владения / стоимость определённой полезной единицы.</dd></dl></div></details><h2>Лаборатория чисел</h2><p class="muted">Это модели первого приближения. Называйте единицы и допущения; проверяйте модель нагрузочным тестом и наблюдениями.</p><div class="card calc"><h3>От пользователей к нагрузке</h3><label>Активных пользователей в сутки<input id="dau" type="number" min="1" max="1000000000" value="1000000"></label><label>Запросов на пользователя в сутки<input id="requests" type="number" min="1" max="100000" value="20"></label><label>Коэффициент пика к среднему<input id="peak" type="number" min="1" max="1000" step="0.1" value="8"></label><label>Среднее время запроса, мс<input id="latency" type="number" min="1" max="1000000" value="200"></label><div class="result" id="loadResult" aria-live="polite"></div><p class="small muted">Средний RPS = DAU × запросы / 86 400. Пиковый = средний × коэффициент. Одновременные запросы ≈ пиковый RPS × средняя задержка в секундах (закон Литтла, устойчивое состояние). Это не число серверов и не p99.</p></div><div class="card calc"><h3>Бюджет ошибок</h3><label>SLO доступности, %<input id="slo" type="number" min="0" max="100" step="0.001" value="99.9"></label><label>Длительность окна, дней<input id="days" type="number" min="1" max="366" value="30"></label><div class="result" id="sloResult" aria-live="polite"></div><p class="small muted">Временная модель: минуты окна × (1 − SLO). Для request-based SLI бюджет считают по доле плохих событий. Не смешивайте эти модели и заранее определяйте правила исключений.</p></div><div class="card calc"><h3>Когда очередь догонит поток</h3><label>Накопленный backlog, сообщений<input id="backlog" type="number" min="0" max="1000000000000" value="1800000"></label><label>Входящий поток, сообщений/с<input id="incoming" type="number" min="0" max="1000000000" value="1000"></label><label>Скорость обработки, сообщений/с<input id="capacity" type="number" min="0" max="1000000000" value="1500"></label><div class="result" id="queueResult" aria-live="polite"></div><p class="small muted">Время = backlog / (обработка − поступление). Модель предполагает постоянные скорости, одинаковую стоимость сообщений, отсутствие повторов и достаточную пропускную способность зависимостей.</p></div><div class="card calc"><h3>AI: стоимость полезного результата</h3><p class="small muted">Все значения ниже учебные, не тарифы провайдера. Формула не включает труд оператора, если он не заложен в фиксированные статьи.</p><label>Запросов в месяц<input id="aiRequests" type="number" min="0" max="1000000000" value="100000"></label><label>Входных токенов на оплачиваемый вызов<input id="aiInput" type="number" min="0" max="10000000" value="2000"></label><label>Выходных токенов на вызов<input id="aiOutput" type="number" min="0" max="10000000" value="400"></label><label>Рублей за миллион входных токенов<input id="aiInputRate" type="number" min="0" max="1000000" step="any" value="100"></label><label>Рублей за миллион выходных токенов<input id="aiOutputRate" type="number" min="0" max="1000000" step="any" value="400"></label><label>Среднее число оплачиваемых вызовов на запрос<input id="aiCalls" type="number" min="0" max="1000" step="any" value="1.15"></label><label>Принятые полезные ответы, %<input id="aiAccepted" type="number" min="0" max="100" step="any" value="80"></label><label>Фиксированные расходы в месяц, рублей<input id="aiFixed" type="number" min="0" max="1000000000000" step="any" value="150000"></label><output id="aiResult" class="result" aria-live="polite"></output><p class="small muted">Переменная часть = запросы × вызовы × (входные токены × ставка входа + выходные токены × ставка выхода) / 1 000 000. Полная = переменная + фиксированная. Цена полезного результата = полная / (запросы × доля принятых). Средние требуют проверки по сегментам; кэш, несколько моделей и разные профили считаются отдельно.</p></div>`;}
function decisionLab(){document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{$('#decisionResult').textContent={retry:'Риск двойного списания. Новый operation_id создаёт новую бизнес-операцию, даже если старый HTTP-запрос завершился тайм-аутом. Возвращайтесь к прежнему идентификатору.',fail:'Тайм-аут означает неизвестный результат. Партнёр мог списать деньги, а ответ потеряться. Нужны промежуточный статус и поиск конечного факта.',reconcile:'Обоснованно: сохраняем прежний operation_id, проверяем статус и сверяемся. Повтор допускается в пределах согласованного идемпотентного контракта. Если партнёр не поддерживает поиск или дедупликацию, это архитектурный риск до выпуска.'}[b.dataset.decision];});}
function recallHTML(i){return '<section class="recall"><b>Пять минут без подсказки</b><p>'+escapeHTML(COURSE[i].recall||'Какое решение прошлого модуля изменится в вашем проекте?')+'</p><label for="recall">Короткое воспроизведение перед чтением</label><textarea id="recall" placeholder="Пишите по памяти. Затем сверяйтесь с теорией."></textarea></section>';}
function mapHTML(id){const maps={
'sd-11':['Контракт внутренней платформы',['Путь команды и самообслуживание','Проверки и версия артефакта','Runtime и ответственность сервиса','Когорты, поддержка и исключения'],'Портал и runtime имеют разные границы. Общий путь требует владельцев, обратной связи и ограниченного rollout.'],
'sd-12':['RAG и контролируемое действие',['Пользователь и проверенные права','Поиск разрешённых источников','Модель: ответ или предложение','Исполнитель: права, лимиты, ID'],'Найденный документ — данные. Модель не выдаёт себе полномочия: внешний эффект проверяет детерминированный исполнитель.'],
'sd-13':['От счёта к полезной единице',['Нагрузка и качество сценария','Вызовы, токены и фиксированные статьи','TCO и полезный знаменатель','Бюджет, пределы и fallback'],'Меньшая цена токена не доказывает меньшую стоимость полезного результата. Общий бюджет и качество проверяются отдельно.'],

'sd-01':['От обещания к проверке',['Сценарий и инвариант','SLI, SLO и профиль нагрузки','Ограничения и неизвестные','Эксперимент и Go/No-Go'],'Числа и ограничения связывают архитектурный выбор с проверяемым бизнес-обещанием.'],
'sd-02':['Границы ответственности',['Клиент и внешний контекст','Контракт бизнес-возможности','Владелец данных и записи','Команда и эксплуатация'],'Отдельный deployment полезен только вместе с контрактом, ответственностью и управляемыми зависимостями.'],
'sd-03':['Операция с неопределённым результатом',['Создать operation_id','Принять и сохранить намерение','Ответ потерян: результат неизвестен','Проверить и сверить прежнюю операцию'],'Из неопределённости нельзя сделать вывод о неуспехе. Повтор сохраняет идентичность бизнес-операции.'],
'sd-05':['Атомарное намерение и повторная доставка',['Транзакция: заказ + outbox','Публикация: возможен повтор','Потребитель: защита бизнес-эффекта','Подтверждение и сверка'],'Сбой между отправкой и подтверждением ведёт к повтору. Локальная атомарность не превращается в глобальную гарантию.'],
'sd-07':['Восстановить полезную работу',['Обнаружение отказа','Ограждение и переключение','Проверка данных и статусов','Возврат согласованной функции'],'RTO включает весь согласованный путь восстановления, а не только технический старт процесса.'],
'sd-09':['Миграция с границей отката',['Совместимое расширение','Backfill + CDC + сверка','Оградить старую запись и cutover','Новые записи: иной план возврата'],'После переключения записи новая БД — источник истины. Без обратной доставки слепой возврат теряет новые факты.']};if(!maps[id])return'';const [title,nodes,caption]=maps[id];return '<figure class="map"><svg role="img" aria-label="'+escapeHTML(title)+'" viewBox="0 0 500 340"><title>'+escapeHTML(title)+'</title>'+nodes.map((x,i)=>'<rect x="15" y="'+(i*83+5)+'" width="470" height="53" rx="10"/><text x="250" y="'+(i*83+36)+'" text-anchor="middle" font-size="17">'+escapeHTML(x)+'</text>'+(i<3?'<path d="M250 '+(i*83+59)+' v23 m-6 -7 l6 7 6 -7" stroke-width="2"/>':'')).join('')+'</svg><figcaption>'+escapeHTML(caption)+'</figcaption></figure>';}
function moduleHTML(m){const i=COURSE.indexOf(m),p=practice(m),checks=state.checks[m.id]||[];return `<span class="eyebrow">День ${Math.floor(i/2)+1} · Модуль ${i+1} / ${COURSE.length}</span><h1>${escapeHTML(m.title)}</h1><p class="lead">${escapeHTML(m.intro)}</p><div class="meta"><span class="pill">120 минут</span><span class="pill">40 теория / 20 пример / 40 работа / 20 проверка</span></div><div class="rule"><b>Режим руководителя:</b> фиксируйте, какое решение нужно принять, какие факты ещё неизвестны и чем команда докажет работоспособность.</div>${recallHTML(i)}${mapHTML(m.id)}${m.lessons.map((l,n)=>'<section class="lesson"><h2>'+String(n+1).padStart(2,'0')+' · '+escapeHTML(l.title.replace(/^\d+\.\s*/,''))+'</h2>'+l.body+'</section>').join('')}<section class="card"><span class="eyebrow">Самостоятельная работа · 40 минут</span><h2>Ваше решение</h2>${p.task}<label for="work"><b>Рабочий артефакт модуля</b></label><textarea id="work" placeholder="Контекст → допущения → варианты → решение → риски → проверка → владелец"></textarea><p class="small muted" id="savedNote" role="status">Сохраняется автоматически на этом устройстве.</p><details><summary>Сверить с разбором после своей попытки</summary><div>${p.model}</div></details><h3>Проверка по рубрике</h3><p class="small muted">Отметьте только то, что явно присутствует в вашем ответе. Это самооценка, а не автоматическая экспертиза.</p>${p.rubric.map((r,n)=>'<label class="check"><input type="checkbox" data-check="'+n+'" '+(checks[n]?'checked':'')+'><span>'+escapeHTML(typeof r==='string'?r:JSON.stringify(r))+'</span></label>').join('')}</section><section><h2>Проверка понимания</h2><p class="muted">Выберите вариант и подтвердите ответ. Разбор объясняет механизм и границы решения.</p>${m.quiz.map((q,n)=>{const a=state.answers[m.id+'-'+n],answered=Number.isInteger(a)&&a>=0&&a<q.options.length;return '<form class="card quiz" data-quiz="'+n+'"><fieldset><legend>'+(n+1)+'. '+escapeHTML(q.question)+'</legend>'+q.options.map((o,j)=>'<label class="option"><input type="radio" name="q'+n+'" value="'+j+'" '+(answered&&a===j?'checked':'')+' required><span>'+escapeHTML(o)+'</span></label>').join('')+'</fieldset><button type="submit">Проверить ответ</button><div class="feedback" role="status" '+(!answered?'hidden':'')+'>'+(answered?feedback(q,a):'')+'</div></form>';}).join('')}</section><section><h2>Закрепить результат</h2><p>Сформулируйте коллегам: что изменилось бы в вашем текущем проекте после этой темы? Какой один вопрос вы зададите архитектору или техлиду?</p><label class="check"><input type="checkbox" id="complete" '+(state.done[m.id]?'checked':'')+'><span>Я подготовил артефакт, прошёл вопросы и проверил решение по рубрике.</span></label><p class="small muted">Отметка завершения — ваша осознанная самооценка. Курс не блокирует переход к следующей теме.</p></section><section><h2>Первоисточники и дальнейшее чтение</h2><p class="small muted">Внешние ссылки требуют интернета. Основной материал курса доступен офлайн.</p><ul class="sources">${m.sources.map(s=>'<li><a rel="noopener" href="'+escapeHTML(s.url)+'">'+escapeHTML(s.title)+'</a></li>').join('')}</ul></section><div class="next"><button data-go="${i?escapeHTML(COURSE[i-1].id):'home'}">← ${i?'Предыдущий модуль':'Обзор'}</button>${i<COURSE.length-1?'<button class="primary" data-go="'+escapeHTML(COURSE[i+1].id)+'">Следующий модуль →</button>':'<button id="finishExport" class="primary">Открыть портфель</button>'}</div>`;}
function feedback(q,a){return '<b>'+(a===q.answer?'Верно.':'Стоит пересмотреть решение.')+'</b> '+escapeHTML(q.explanation)+'<p class="small">Обоснованный вариант: '+escapeHTML(q.options[q.answer])+'</p>';}
function render(id,focus=true){state.module=id;const m=COURSE.find(m=>m.id===id);$('#main').innerHTML=m?moduleHTML(m):home();if(m){$('#work').value=typeof state.notes[m.id]==='string'?state.notes[m.id]:'';$('#recall').value=state.notes[m.id+'-recall']||'';}else{calculators();decisionLab();}toc($('#search').value);document.body.classList.remove('menu-open');$('#main').inert=false;$('#menu').setAttribute('aria-expanded','false');save();if(focus){window.scrollTo(0,0);$('#main').focus({preventScroll:true});}history.replaceState(null,'','#'+id);}
function calculators(){const num=id=>{const el=$('#'+id),v=Number(el.value);return el.value!==''&&el.validity.valid&&Number.isFinite(v)?v:null;},fmt=n=>n.toLocaleString('ru-RU',{maximumFractionDigits:2});function run(){let d=num('dau'),r=num('requests'),p=num('peak'),l=num('latency');$('#loadResult').textContent=[d,r,p,l].includes(null)?'Введите допустимые значения всех полей.':fmt(d*r/86400)+' RPS в среднем · '+fmt(d*r/86400*p)+' RPS в пике · ≈ '+fmt(d*r/86400*p*l/1000)+' запросов одновременно';let s=num('slo'),days=num('days');$('#sloResult').textContent=[s,days].includes(null)?'Введите SLO от 0 до 100 и положительное окно.':fmt(days*24*60*(1-s/100))+' минут допустимой недоступности за окно';let b=num('backlog'),inc=num('incoming'),cap=num('capacity');$('#queueResult').textContent=[b,inc,cap].includes(null)?'Введите допустимые неотрицательные значения.':b===0?'Очередь сейчас пуста.':cap<=inc?'Очередь не догонит поток: обработка должна превышать поступление.':'≈ '+fmt(b/(cap-inc)/60)+' минут до опустошения очереди';}function ai(){const keys=['aiRequests','aiInput','aiOutput','aiInputRate','aiOutputRate','aiCalls','aiAccepted','aiFixed'],v=keys.map(num);if(v.includes(null)){$('#aiResult').textContent='Введите допустимые значения всех полей.';return;}const[n,inp,out,ir,or,calls,accept,fixed]=v,variable=n*calls*(inp*ir+out*or)/1000000,total=variable+fixed,useful=n*accept/100;$('#aiResult').textContent='Переменная часть: '+fmt(variable)+' ₽ · Всего: '+fmt(total)+' ₽ · '+(useful>0?fmt(total/useful)+' ₽ за принятый результат':'Нет принятых результатов: цена единицы не определена.');}document.querySelectorAll('.calc input').forEach(el=>el.addEventListener('input',()=>{run();ai();}));run();ai();}
function exportPortfolio(){const payload={course:'Системный дизайн для руководителей',version:2,legacyCompleted:state.legacyDone,exportedAt:new Date().toISOString(),modules:COURSE.map(m=>({id:m.id,title:m.title,work:state.notes[m.id]||'',recall:state.notes[m.id+'-recall']||'',rubric:practice(m).rubric.map((r,i)=>({criterion:r,checked:!!(state.checks[m.id]||[])[i]})),quiz:m.quiz.map((q,n)=>({question:q.question,answer:Number.isInteger(state.answers[m.id+'-'+n])?q.options[state.answers[m.id+'-'+n]]:null,correct:state.answers[m.id+'-'+n]===q.answer})),completed:!!state.done[m.id]}))};$('#portfolioText').value=JSON.stringify(payload,null,2);$('#portfolioStatus').textContent='';$('#portfolio').showModal();}
$('#closePortfolio').onclick=()=>$('#portfolio').close();
$('#selectPortfolio').onclick=()=>{$('#portfolioText').focus();$('#portfolioText').select();$('#portfolioStatus').textContent='Текст выделен. Используйте системную команду копирования.';};
$('#copyPortfolio').onclick=async()=>{const text=$('#portfolioText').value;try{if(!navigator.clipboard)throw Error('clipboard');await navigator.clipboard.writeText(text);$('#portfolioStatus').textContent='Скопировано.';}catch(e){$('#portfolioText').focus();$('#portfolioText').select();$('#portfolioStatus').textContent='Используйте системную команду «Копировать» для выделенного текста.';}};
$('#downloadPortfolio').onclick=()=>{if(window.webkit?.messageHandlers?.setting){$('#portfolioStatus').textContent='В приложении используйте копирование текста портфеля.';return;}const url=URL.createObjectURL(new Blob([$('#portfolioText').value],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='system-design-portfolio.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);};

document.documentElement.dataset.theme=state.theme;$('#theme').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;save();});$('#menu').addEventListener('click',()=>{const open=document.body.classList.toggle('menu-open');$('#menu').setAttribute('aria-expanded',String(open));$('#main').inert=open&&innerWidth<=800;if(open)$('#search').focus();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#portfolio').open){document.body.classList.remove('menu-open');$('#main').inert=false;$('#menu').setAttribute('aria-expanded','false');$('#menu').focus();}});$('#search').addEventListener('input',e=>toc(e.target.value));$('#export').addEventListener('click',exportPortfolio);document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){e.preventDefault();render(go.dataset.go);}if(e.target.id==='finishExport')exportPortfolio();});$('#main').addEventListener('input',e=>{if(e.target.id==='work'||e.target.id==='recall'){state.notes[state.module+(e.target.id==='recall'?'-recall':'')]=e.target.value;save();if(e.target.id==='work')$('#savedNote').textContent=storageOK?'Ответ сохранён на этом устройстве.':'Сохранение недоступно — скачайте портфель до закрытия страницы.';}});$('#main').addEventListener('change',e=>{if(e.target.matches('[data-check]')){if(!Array.isArray(state.checks[state.module]))state.checks[state.module]=[];state.checks[state.module][Number(e.target.dataset.check)]=e.target.checked;save();}if(e.target.id==='complete'){state.done[state.module]=e.target.checked;save();toc($('#search').value);}if(e.target.matches('.quiz input')){const form=e.target.closest('form');form.querySelector('.feedback').hidden=true;}});$('#main').addEventListener('submit',e=>{if(!e.target.matches('.quiz'))return;e.preventDefault();const m=COURSE.find(m=>m.id===state.module),n=Number(e.target.dataset.quiz),selected=e.target.querySelector('input:checked');if(!selected)return;const a=Number(selected.value);state.answers[m.id+'-'+n]=a;save();const out=e.target.querySelector('.feedback');out.innerHTML=feedback(m.quiz[n],a);out.hidden=false;});window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id==='home'||COURSE.some(m=>m.id===id))render(id);});new ResizeObserver(()=>document.documentElement.style.setProperty('--header-height',document.querySelector('header').getBoundingClientRect().height+'px')).observe(document.querySelector('header'));const initial=location.hash.slice(1);render(initial==='home'||COURSE.some(m=>m.id===initial)?initial:state.module,false);
</script></body></html>
