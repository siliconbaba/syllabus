itle":"Совместный документ при разрыве связи","html":"\u003cp\u003eРедактор документов часто позволяет двум пользователям работать офлайн. Это сознательно другое обещание, чем единственный владелец резерва товара. Изолированные участники создают изменения, которые затем объединяются по определённым правилам. CRDT или операционное преобразование описывают совместимость таких изменений, но не превращают разные экраны в один мгновенный документ в реальном времени.\u003c/p\u003e\u003cp\u003eЕсли один пользователь вставил абзац, а другой удалил соседний символ, модель может сохранить оба намерения. Если два пользователя независимо утвердили взаимоисключающие юридические версии, слияние символов не решит бизнес-конфликт. Финальное утверждение документа разумно вынести в отдельную команду над фиксированной версией, которая требует авторитетного согласования. Офлайн можно редактировать, но нельзя обещать немедленное глобальное утверждение.\u003c/p\u003e\u003cp\u003eПолучается система с разными гарантиями внутри одного продукта. Текстовые операции принимаются локально и сходятся после обмена; публикация версии ждёт доступности управляющей группы. Пользователь должен видеть различие между «сохранено на устройстве», «синхронизировано» и «утверждено». К «Северному маршруту» переносится разделение локально допустимых действий и глобального решения. Новая часть — содержательное разрешение конкурентных изменений: для документа оно возможно в гораздо более широком классе операций, чем для права потратить последний резерв.\u003c/p\u003e","transfer":["Выделять операции с несовместимыми решениями","Проверять полномочие на стороне ресурса"],"distinct":["Текст допускает алгоритмическое слияние, утверждение версии — отдельный инвариант"]},"diagrams":[{"title":"Кворум живёт в топологии","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003ctext x=\"30\" y=\"40\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eПять голосов: размещение 2 + 2 + 1\u003c/text\u003e\u003crect x=\"30\" y=\"95\" width=\"200\" height=\"230\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"217.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eЗона A\u003c/text\u003e\u003ccircle cx=\"85\" cy=\"210\" r=\"20\" fill=\"#64d8c4\"/\u003e\u003ctext x=\"73\" y=\"217\" fill=\"#102332\" font-family=\"sans-serif\" font-size=\"18\"\u003e1\u003c/text\u003e\u003ccircle cx=\"165\" cy=\"210\" r=\"20\" fill=\"#64d8c4\"/\u003e\u003ctext x=\"153\" y=\"217\" fill=\"#102332\" font-family=\"sans-serif\" font-size=\"18\"\u003e2\u003c/text\u003e\u003crect x=\"280\" y=\"95\" width=\"200\" height=\"230\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"217.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eЗона B\u003c/text\u003e\u003ccircle cx=\"335\" cy=\"210\" r=\"20\" fill=\"#64d8c4\"/\u003e\u003ctext x=\"323\" y=\"217\" fill=\"#102332\" font-family=\"sans-serif\" font-size=\"18\"\u003e1\u003c/text\u003e\u003ccircle cx=\"415\" cy=\"210\" r=\"20\" fill=\"#64d8c4\"/\u003e\u003ctext x=\"403\" y=\"217\" fill=\"#102332\" font-family=\"sans-serif\" font-size=\"18\"\u003e2\u003c/text\u003e\u003crect x=\"530\" y=\"95\" width=\"200\" height=\"230\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"217.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eЗона C\u003c/text\u003e\u003ccircle cx=\"585\" cy=\"210\" r=\"20\" fill=\"#64d8c4\"/\u003e\u003ctext x=\"573\" y=\"217\" fill=\"#102332\" font-family=\"sans-serif\" font-size=\"18\"\u003e1\u003c/text\u003e\u003ctext x=\"30\" y=\"380\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eБольшинство: 3 из 5 в текущей конфигурации\u003c/text\u003e\u003ctext x=\"30\" y=\"420\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eПотеря одной зоны оставляет минимум 3 голоса\u003c/text\u003e","caption":"В учебной пятиузловой группе голоса размещены по трём зонам как 2+2+1. Потеря любой одной зоны оставляет большинство. Схема предполагает связь оставшихся участников и не обещает прогресс при дополнительных разделениях; это не византийский протокол."},{"title":"Проснувшийся устаревший исполнитель","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003ctext x=\"30\" y=\"40\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eFencing проверяется в точке эффекта\u003c/text\u003e\u003crect x=\"40\" y=\"65\" width=\"180\" height=\"55\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"54\" y=\"99.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eA\u003c/text\u003e\u003cpath d=\"M130 120 L130 405\" fill=\"none\" stroke=\"#708aa4\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/\u003e\u003crect x=\"290\" y=\"65\" width=\"180\" height=\"55\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"304\" y=\"99.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eКоординатор\u003c/text\u003e\u003cpath d=\"M380 120 L380 405\" fill=\"none\" stroke=\"#708aa4\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/\u003e\u003crect x=\"550\" y=\"65\" width=\"180\" height=\"55\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"564\" y=\"99.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eРесурс\u003c/text\u003e\u003cpath d=\"M640 120 L640 405\" fill=\"none\" stroke=\"#708aa4\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/\u003e\u003cpath d=\"M380 155 L130 155\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"155\" y=\"145\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003etoken 91\u003c/text\u003e\u003ctext x=\"45\" y=\"215\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eA замер\u003c/text\u003e\u003cpath d=\"M380 245 L640 245\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"405\" y=\"232\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eB: token 92\u003c/text\u003e\u003ccircle cx=\"640\" cy=\"245\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003cpath d=\"M130 335 L640 335\" fill=\"none\" stroke=\"#f5c677\" stroke-width=\"3\"/\u003e\u003ctext x=\"245\" y=\"322\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eA: token 91 → отклонён\u003c/text\u003e\u003ctext x=\"30\" y=\"445\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eРесурс уже принял 92 и атомарно отвергает меньшие номера\u003c/text\u003e","caption":"Координатор выдал A токен 91. После паузы A новое полномочие 92 выдано B, и ресурс его принял. Проснувшийся A отправляет 91, но сам ресурс отвергает меньшую эпоху. Проверка только у координатора не закрыла бы гонку."}],"decision":{"prompt":"Как защитить каталог владельцев?","options":[{"title":"Управляемая consensus-группа в трёх зонах","consequence":"Единая история владения при потере одной зоны в выбранной конфигурации","tradeoff":"Межзональная задержка и зависимость от большинства"},{"title":"Один управляющий узел с ручным восстановлением","consequence":"Простой протокол и понятная остановка при отказе","tradeoff":"Больше время восстановления и меньше автоматической доступности"},{"title":"Локальные автономные владельцы с последующей сверкой","consequence":"Изолированные регионы продолжают работу","tradeoff":"Допустимо лишь если бизнес способен разрешить конфликт владения"}],"recommended":0,"explanation":"Для неделимого права записи выбираем согласованный каталог; автономность уместна для черновиков, но не для двух владельцев одного резерва."},"exercise":{"prompt":"Покажите, почему distributed lock без fencing не защищает запись.","model":"\u003cp\u003eA получил lease и замер. Lease истекла, B получил новую и записал результат. A продолжил и перезаписал B. Ресурс должен отклонить меньшую эпоху атомарно с записью.\u003c/p\u003e","rubric":["Есть пауза процесса","Проверка находится в ресурсе","Идемпотентность не спутана с fencing"]},"checkpoint":[{"question":"В пятиузловой группе три узла в одной зоне. Что при потере этой зоны?","options":["Два оставшихся всегда образуют кворум","Без дополнительного корректного механизма конфигурации большинства нет","Число зон не влияет на запись"],"answer":1,"explanation":"Большинство считается по текущей конфигурации, а не по оставшимся узлам."},{"question":"Почему R+W\u003eN недостаточно для линеаризуемости?","options":["Нужно ещё определить версии, конкуренцию, чтения и правила фиксации","Потому что кворумы вообще не используются","Потому что линеаризуемость означает лишь быструю репликацию"],"answer":0,"explanation":"Пересечение множеств — полезное условие, но не полный протокол."}],"sources":[{"title":"Ongaro, Ousterhout: In Search of an Understandable Consensus Algorithm, 2014","url":"https://raft.github.io/raft.pdf"},{"title":"CockroachDB: Replication Layer","url":"https://www.cockroachlabs.com/docs/stable/architecture/replication-layer"},{"title":"Seth Gilbert, Nancy Lynch: Perspectives on the CAP Theorem","url":"https://groups.csail.mit.edu/tds/papers/Gilbert/Brewer2.pdf"},{"title":"Daniel J. Abadi: Consistency Tradeoffs in Modern Distributed Database System Design, 2012","url":"https://www.cs.umd.edu/~abadi/papers/abadi-pacelc.pdf"},{"title":"Martin Kleppmann: How to do distributed locking, 8 февраля 2016","url":"https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html"}],"wordCount":1481},{"id":"ch-20","arc":5,"title":"Площадка исчезла: восстановить сервис, а не только сервер","briefing":"В «Северном маршруте» есть шарды и безопасные владельцы. Учебный инцидент теперь отключает целую площадку в вечерний пик. Оставшиеся узлы должны не просто включиться, а выдержать поток без разрушительной очереди.","goals":["Мощность зависит от режима отказа","Очередь хранит работу и накапливает ожидание","Повторы могут превратить отказ в лавину"],"sections":[{"title":"Мощность зависит от режима отказа","html":"\u003cp\u003eCapacity planning, планирование мощности, связывает прогноз работы с ресурсами и допустимыми задержками. Среднее количество запросов в секунду — слабое начало: чтение маленького заказа, построение маршрута и загрузка видео имеют разную стоимость. Нужны классы запросов, распределение размеров, доля промахов кэша, интенсивность фоновых задач и пределы внешних партнёров. Мощность должна измеряться при требуемом хвосте задержки, а не в момент, когда сервер ещё формально отвечает.\u003c/p\u003e\u003cp\u003eЕсли три площадки обслуживают по трети нагрузки и каждая загружена на 70%, после потери одной оставшиеся должны принять примерно полуторный поток. При неизменной эффективности это уже 105% прежней мощности. При этом холодный кэш, восстановление реплик и повторные запросы повышают стоимость операции. Резерв N+1 имеет смысл только относительно конкретного ресурса и отказа: запас CPU не восполнит предел соединений с БД.\u003c/p\u003e\u003cp\u003eКоманда строит сценарии отдельно: отказ узла, зоны, региона и внешнего провайдера. Для каждого указывает оставшуюся мощность, потерянные зависимости и способ ограничения спроса. Распределённость переносит риск: больше площадок может означать больше сетевых зависимостей. Размещение сервисов без их данных и секретов на другой площадке не делает её самостоятельной.\u003c/p\u003e"},{"title":"Очередь хранит работу и накапливает ожидание","html":"\u003cp\u003eКогда входящий поток превышает скорость обработки, очередь растёт. Связь закона Литтла L=λW описывает среднее число работ в устойчивой системе через среднюю интенсивность и время пребывания; применять её к бесконечно растущей очереди как к равновесию нельзя. Для короткой перегрузки проще посчитать накопление: избыток двести задач в секунду за минуту создаёт двенадцать тысяч задач долга.\u003c/p\u003e\u003cp\u003eБольшая очередь не повышает пропускную способность. Она переводит отказ сейчас в задержку позже, иногда когда результат уже бесполезен. Для назначения курьера задача возрастом двадцать минут может быть неверна по смыслу. Нужны ограничение размера, максимальный возраст, отмена устаревшей работы и отдельная политика для незаменимых событий. Уведомление о каждом старом положении машины обычно можно заменить последним положением, платёжное событие — нельзя.\u003c/p\u003e\u003cp\u003eBackpressure, обратное давление, сообщает верхнему уровню, что нижний не успевает. Это может быть ограничение числа одновременно обрабатываемых запросов, отказ в новой работе с Retry-After или управление скоростью потребителя. Уменьшать приём нужно до исчерпания памяти. Если каждый слой бесконтрольно буферизует запросы, оператор видит лишь спокойный вход, пока внутри растёт уже неустранимый долг.\u003c/p\u003e"},{"title":"Повторы могут превратить отказ в лавину","html":"\u003cp\u003eПри недоступности партнёра клиент повторяет запрос, шлюз повторяет запрос, сервис повторяет запрос. Три попытки на каждом из трёх слоёв способны дать до двадцати семи нижележащих обращений на исходную команду. Ровные интервалы синхронизируют клиентов. Экспоненциальная задержка с разбросом, ограничение числа попыток и общий бюджет времени уменьшают усиление, но не создают дополнительную мощность у партнёра.\u003c/p\u003e\u003cp\u003eDeadline — конечный срок полезности операции — должен передаваться по цепочке. Если пользователь перестал ждать через две секунды, работа, которая ещё минуту удерживает соединение и строит сложный ответ, расходует ресурс для результата без потребителя. Отмена полезна там, где действие ещё обратимо; уже отправленный платёж нельзя считать отменённым по закрытому HTTP-соединению. Его результат восстанавливается сверкой.\u003c/p\u003e\u003cp\u003eИзоляция пулов, иногда называемая bulkhead, ограничивает распространение отказа. Аналитика, документы и критические команды не должны конкурировать за все соединения одним неограниченным пулом. Circuit breaker прекращает заведомо бесполезные обращения на время, затем пробует восстановление. Его состояние и условия открытия требуют настройки: слишком грубый breaker способен заблокировать здоровые операции вместе с больными.\u003c/p\u003e"},{"title":"SLO задаёт обещание пользователю","html":"\u003cp\u003eService level indicator, SLI, — измеряемый показатель поведения: доля корректно подтверждённых заказов в пределах двух секунд, а не просто доля HTTP 200. Service level objective, SLO, — целевое значение этого показателя в окне. При цели 99,9% из миллиона подходящих операций бюджет ошибки составляет тысячу. Нужно заранее определить знаменатель, исключения и трактовку частичного успеха, иначе показатель можно улучшать скрытием неудачных запросов.\u003c/p\u003e\u003cp\u003eБюджет ошибки помогает выбирать темп изменений и мощность. Если инцидент быстро расходует его, команда ограничивает риск, откладывает необязательную миграцию или включает деградацию. Сам по себе бюджет не запрещает релизы механически: решение зависит от причины и ожидаемой пользы исправления. Важнее видеть скорость расходования, чтобы не ждать конца месяца для обнаружения критического ухудшения.\u003c/p\u003e\u003cp\u003eРазные пути требуют разных SLO. Потеря красивой карты при сохранении принятия заказа менее серьёзна, чем неверное подтверждение платежа. Деградация может отключать рекомендации и тяжёлую историю, но оставлять детализацию и отмену. Честный ответ «приём временно ограничен» уменьшает успешность по SLO, зато лучше бесконечного ожидания и ложного подтверждения. Метрика должна отражать эту цену, а не прятать её.\u003c/p\u003e"},{"title":"DR начинается с области потери","html":"\u003cp\u003eDisaster recovery, DR, — восстановление после крупного разрушения. Recovery point objective, RPO, задаёт допустимую потерю данных во времени или иной явно определённой мере. Recovery time objective, RTO, задаёт целевое время восстановления нужной функции. «RPO ноль» неполно без области: для каких подтверждённых операций, при каком отказе, в каких хранилищах и с какими исключениями. Нулевой RPO для заказов при потере зоны не означает нулевую потерю всех видеозагрузок при разрушении региона.\u003c/p\u003e\u003cp\u003eРезервная копия должна восстанавливаться вместе с ключами шифрования, конфигурацией, доступами, схемой, журналами и зависимостями. Восстановление PostgreSQL на момент времени опирается на базовую копию и непрерывную цепочку WAL. Разрыв архива делает часть точек недостижимой. Поэтому успешная загрузка файлов в хранилище ещё не доказывает восстановимость.\u003c/p\u003e\u003cp\u003eПлан содержит порядок: ограничить новые команды, выбрать авторитетную историю, восстановить контур идентичности и данных, проверить инварианты, открыть критические операции, затем фоновые функции. После восстановления нельзя одномоментно выпустить весь накопленный backlog: он способен повторно уронить площадку. Репетиция измеряет время до полезного пользовательского результата, а не время запуска последнего виртуального сервера.\u003c/p\u003e"},{"title":"Репетиция должна включать возвращение в норму","html":"\u003cp\u003eАварийный режим заканчивается не первым успешным запросом. После восстановления зоны нужно догнать реплики, прогреть кэш, перераспределить трафик и погасить очередь. Если всё включить одновременно, восстановительные задачи конкурируют с пользователями и создают вторую волну отказа. Поэтому возвращение проходит ступенями с ограничением скорости и критериями остановки. Команда заранее назначает, кто имеет право увеличить поток и кто может вернуть ограничение.\u003c/p\u003e\u003cp\u003eОтдельно проверяется достоверность данных, созданных во время инцидента. Заказы могли остаться в неопределённом состоянии, уведомления — задвоиться, внешний платёж — завершиться без локального ответа. После технического восстановления запускается бизнес-сверка. Она имеет собственную очередь, приоритет и безопасные повторы, а не исполняется вручную без журнала. Результат инцидента оценивают числом затронутых операций и временем снятия неопределённости.\u003c/p\u003e\u003cp\u003eУ резервной площадки проверяют не только мощность приложения, но и квоты провайдера, DNS, сертификаты, доступ к секретам и возможность команды работать при недоступной основной системе коммуникации. Учебный документ с командами бесполезен, если он хранится только внутри исчезнувшего контура. В нём нужны владельцы шагов и доступный канал связи, но не открытые секреты.\u003c/p\u003e\u003cp\u003eПосле репетиции обновляют исходные допущения. Если прогрев занял дольше, чем ожидалось, это меняет RTO и нужный запас мощности. Если восстановление одного шарда невозможно без соседнего сервиса, карта зависимостей была неполной. Цель упражнения — обнаружить и исправить такие факты до настоящей аварии, а не подтвердить заранее нарисованную красивую цифру.\u003c/p\u003e"}],"workedExample":{"title":"Вечерний пик и потерянная зона","html":"\u003cp\u003eУчебные три зоны вместе принимают 900 команд в секунду, каждая рассчитана на 500 при нужном SLO. В обычном режиме по 300 на зону оставляют запас. После потери одной две оставшиеся получают по 450. По арифметике всё хорошо, но прогрев кэша увеличивает среднюю стоимость на 20%, и реальная требуемая работа становится эквивалентна 540 прежним командам. Одновременно клиенты повторяют неотвеченные запросы.\u003c/p\u003e\u003cp\u003eКоманда вводит лимит приёма 800 команд в секунду для оставшейся пары, отключает автоматическое перестроение старых маршрутов и приостанавливает выгрузку отчётов. Платежи, отмены и подтверждение существующих заказов получают отдельную квоту. Новое оформление иногда получает контролируемое предложение повторить позже. Ключи идемпотентности сохраняются, чтобы повтор не превращал перегрузку в дублирование бизнеса.\u003c/p\u003e\u003cp\u003eОчередь назначения содержит 24 тысячи задач. Если свободная мощность после текущего потока составляет 100 задач в секунду, только погашение долга займёт четыре минуты при постоянных условиях. У части задач уже истёк срок полезности. Их не исполняют вслепую: актуальное состояние заказа проверяется перед назначением, устаревшие сигналы положения объединяются, незавершённые денежные операции отправляются в отдельную сверку.\u003c/p\u003e\u003cp\u003eДля заказов заявлен RPO ноль при отказе одной зоны при работающей синхронной схеме и RTO пять минут до возобновления критических команд. Для аналитики RPO пятнадцать минут и RTO несколько часов. На упражнении дополнительно выясняется, что ключ расшифровки резервной копии доступен только в исчезнувшей зоне. План исправляют: независимое контролируемое восстановление ключей входит в DR. После этого повторяют восстановление из чистой среды и проверяют конкретные подтверждённые заказы, права доступа и баланс резервов, а не только доступность страницы входа.\u003c/p\u003e"},"expedition":{"world":"media","title":"Прямой эфир во время отказа CDN","html":"\u003cp\u003eПлатформа прямых трансляций тоже сталкивается с потерей площадки, но старый backlog не всегда имеет ценность. Если зритель смотрит спортивное событие, доставлять ему последовательно все пропущенные минуты после восстановления может быть хуже, чем перескочить к текущему моменту. Архив и live-поток требуют разных правил: архив сохраняют, live при перегрузке допускает пропуск устаревших сегментов.\u003c/p\u003e\u003cp\u003eПри отказе сети доставки, CDN, переключение на резервный маршрут защищает просмотр только при достаточной пропускной способности origin и резервного CDN. Если миллионы клиентов одновременно обходят кэш и запрашивают origin, переключение усугубляет инцидент. Нужны постепенное перенаправление, защита источника, заранее прогретые популярные сегменты и ограничения на качество. Снижение разрешения иногда сохраняет непрерывность лучше, чем попытка удержать максимальный битрейт.\u003c/p\u003e\u003cp\u003eПереносится расчёт мощности в аварийном режиме и борьба с синхронными повторами. Меняется единица полезной работы: для заказа важен точный итог команды, для эфира — свежий непрерывный просмотр с допустимым качеством. SLO поэтому считает не HTTP-успехи сегментов, а запуск, зависания и отставание от live. Граница деградации является продуктовым решением, которое архитектура должна уметь выполнить.\u003c/p\u003e","transfer":["Рассчитывать аварийную мощность и защищать источник","Отделять полезную очередь от устаревшей"],"distinct":["В live свежесть может быть важнее доставки каждого старого сегмента"]},"diagrams":[{"title":"Потеря площадки и скрытый запас","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003ctext x=\"30\" y=\"40\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eАварийная мощность: полезный поток и восстановление\u003c/text\u003e\u003crect x=\"40\" y=\"90\" width=\"185\" height=\"250\" rx=\"12\" fill=\"#392b35\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"54\" y=\"222.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eЗона A\u003c/text\u003e\u003ctext x=\"65\" y=\"210\" fill=\"#ff9ba6\" font-family=\"sans-serif\" font-size=\"24\"\u003eОТКАЗ\u003c/text\u003e\u003crect x=\"285\" y=\"90\" width=\"185\" height=\"250\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"299\" y=\"222.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eЗона B\u003c/text\u003e\u003crect x=\"325\" y=\"160.0\" width=\"100\" height=\"150.0\" fill=\"#f5c677\"/\u003e\u003ctext x=\"315\" y=\"375\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003e450 команд/с\u003c/text\u003e\u003crect x=\"530\" y=\"90\" width=\"185\" height=\"250\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"222.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eЗона C\u003c/text\u003e\u003crect x=\"570\" y=\"160.0\" width=\"100\" height=\"150.0\" fill=\"#f5c677\"/\u003e\u003ctext x=\"560\" y=\"375\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003e450 команд/с\u003c/text\u003e\u003ctext x=\"30\" y=\"420\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eХолодный кэш повышает стоимость; одной арифметики мало\u003c/text\u003e","caption":"При потере зоны A поток делится между B и C, по 450 команд в секунду. Однако холодный кэш и восстановление данных повышают стоимость команды: номинальная мощность не равна аварийной. Требуются ограничение приёма и проверка SLO в этом режиме."},{"title":"DR и возврат полезной работы","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003ctext x=\"30\" y=\"40\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eВосстановление функции — несколько этапов\u003c/text\u003e\u003cpath d=\"M50 210 L710 210\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ccircle cx=\"90\" cy=\"210\" r=\"12\" fill=\"#64d8c4\"/\u003e\u003cpath d=\"M90 145 L90 205\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"25\" y=\"115\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eОграничить\u003c/text\u003e\u003ctext x=\"18\" y=\"280\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"16\"\u003eновые команды\u003c/text\u003e\u003ccircle cx=\"280\" cy=\"210\" r=\"12\" fill=\"#64d8c4\"/\u003e\u003cpath d=\"M280 145 L280 205\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"215\" y=\"115\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eВосстановить\u003c/text\u003e\u003ctext x=\"208\" y=\"280\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"16\"\u003eисторию + ключи\u003c/text\u003e\u003ccircle cx=\"470\" cy=\"210\" r=\"12\" fill=\"#64d8c4\"/\u003e\u003cpath d=\"M470 145 L470 205\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"405\" y=\"115\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eПроверить\u003c/text\u003e\u003ctext x=\"398\" y=\"280\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"16\"\u003eинварианты\u003c/text\u003e\u003ccircle cx=\"670\" cy=\"210\" r=\"12\" fill=\"#64d8c4\"/\u003e\u003cpath d=\"M670 145 L670 205\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"605\" y=\"115\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eОткрыть\u003c/text\u003e\u003ctext x=\"598\" y=\"280\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"16\"\u003eпо квотам\u003c/text\u003e\u003crect x=\"80\" y=\"345\" width=\"600\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"94\" y=\"384.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eBacklog выпускается постепенно, не одним залпом\u003c/text\u003e","caption":"Временная линия DR начинает с ограничения команд, восстанавливает данные вместе с ключами, проверяет инварианты и поэтапно открывает поток. RTO относится к нужной функции, а погашение очереди и бизнес-сверка могут продолжаться после первого успешного ответа."}],"decision":{"prompt":"Что включить при потере зоны?","options":[{"title":"Сразу удвоить повторы","consequence":"Быстрее закрываются отдельные случайные потери","tradeoff":"Уместно лишь при запасе и строгом бюджете; здесь усиливает перегрузку"},{"title":"Ограничить приём и отключить некритическую работу","consequence":"Сохраняются важные операции в доступной мощности","tradeoff":"Часть новых заказов временно отклоняется"},{"title":"Автоматически добавить узлы без деградации","consequence":"Мощность растёт после запуска и прогрева","tradeoff":"Не помогает мгновенно и может упереться в БД или квоту"}],"recommended":1,"explanation":"Нужен немедленный контроль работы; автоматическое расширение можно выполнять параллельно, но оно не заменяет ограничение приёма."},"exercise":{"prompt":"Сформулируйте RPO без двусмысленности для двух типов данных.","model":"\u003cp\u003eНапример: не теряем подтверждённые заказы при потере одной зоны с сохранением большинства и требуемых копий; аналитическую витрину восстанавливаем с лагом до пятнадцати минут. Потеря региона и злонамеренное удаление описываются отдельно.\u003c/p\u003e","rubric":["Названы данные","Назван отказ","Отделены подтверждения от всех попыток"]},"checkpoint":[{"question":"Почему очередь на миллион задач не решает перегрузку?","options":["Она увеличивает скорость процессора","Она хранит долг и увеличивает время ожидания, не меняя устойчивую скорость обработки","Она всегда теряет все задачи"],"answer":1,"explanation":"Буфер полезен для кратких всплесков, но должен иметь предел и политику возраста."},{"question":"Какой тест сильнее подтверждает DR?","options":["Проверка размера резервного файла","Восстановление в чистую среду с ключами, журналами и проверкой бизнес-инвариантов","Запуск ещё одного dashboard"],"answer":1,"explanation":"Только фактическое восстановление проверяет весь путь зависимостей."}],"sources":[{"title":"PostgreSQL 18: Continuous Archiving and Point-in-Time Recovery","url":"https://www.postgresql.org/docs/18/continuous-archiving.html"},{"title":"Google SRE: Handling Overload","url":"https://sre.google/sre-book/handling-overload/"},{"title":"Google SRE: Service Level Objectives","url":"https://sre.google/sre-book/service-level-objectives/"}],"wordCount":1478},{"id":"ch-21","arc":6,"title":"Отчёт мешает заказам: другая форма тех же фактов","briefing":"После аварийного упражнения тяжёлые отчёты отключали первыми. Теперь руководство просит маржу по регионам и опоздания за год. «Северному маршруту» нужен аналитический контур, который не превращает принятие заказа в побочный эффект отчёта.","goals":["OLTP и OLAP различаются работой","Колонки меняют стоимость сканирования","Факт должен иметь определённую зернистость"],"sections":[{"title":"OLTP и OLAP различаются работой","html":"\u003cp\u003eOnline transaction processing, OLTP, обслуживает короткие операции над небольшим числом сущностей: создать заказ, проверить резерв, изменить статус с условием на версию. Важны быстрый поиск по ключу, конкурентные изменения, ограничения целостности и предсказуемая задержка. Online analytical processing, OLAP, сканирует большие наборы, группирует факты и сравнивает периоды. Одна строка может почти не меняться, но запрос читает миллионы таких строк.\u003c/p\u003e\u003cp\u003eРазница не сводится к размеру базы или наличию SQL. PostgreSQL способен строить аналитические запросы, ClickHouse использует SQL и умеет соединения. При определённом масштабе одна БД удобна; при другом несовместимые профили работы конкурируют за дисковую полосу, память и CPU. Длинный отчёт вытесняет горячие страницы заказов и удерживает ресурсы намного дольше пользовательской команды. Реплика для чтения уменьшает часть конкуренции, но сохраняет стоимость обработки и особенности репликационного лага.\u003c/p\u003e\u003cp\u003eПоэтому архитектурное решение начинается с запроса: сколько строк он читает, какие столбцы нужны, насколько свежим должен быть ответ и как часто он повторяется. «Поставить аналитическую базу» без определения фактов и времени обновления часто просто переносит неверный отчёт на более быстрый сервер.\u003c/p\u003e"},{"title":"Колонки меняют стоимость сканирования","html":"\u003cp\u003eВ строковом представлении значения одной записи расположены рядом, что удобно, когда транзакции нужна большая часть заказа. В колоночном представлении рядом хранятся значения одного столбца для многих записей. Если отчёту нужны только регион, дата и сумма из широкой таблицы, он читает меньше лишних данных. Повторяющиеся значения хорошо сжимаются; обработка векторами уменьшает накладные расходы на отдельные строки. Это механизмы выигрыша, а не магия слова OLAP.\u003c/p\u003e\u003cp\u003eClickHouse строит аналитическую обработку вокруг такого профиля. Для семейства MergeTree порядок сортировки влияет на локальность, сжатие и пропуск ненужных гранул. Разреженный первичный индекс не является обещанием уникальности строки как OLTP PRIMARY KEY. Неверно переносить ожидания транзакционного уникального ограничения на столбец с похожим названием. Слишком мелкие вставки создают много частей и повышают стоимость последующих слияний, поэтому поток обычно пакетируют.\u003c/p\u003e\u003cp\u003eСекционирование по месяцу помогает управлять историей, но чрезмерно мелкие секции усложняют обслуживание. Ключ сортировки выбирают по частым фильтрам и группировкам, не просто копируют order_id из PostgreSQL. Если каждое чтение ищет одну произвольную изменяемую строку, колоночная аналитическая модель может оказаться дорогим и неудобным выбором.\u003c/p\u003e"},{"title":"Факт должен иметь определённую зернистость","html":"\u003cp\u003eGrain, зернистость факта, отвечает: что означает одна строка? В таблице фактов заказов это может быть один заказ, одна позиция заказа или один переход статуса. Если смешать их, сумма выручки умножится на количество позиций или событий. Измерения — регион, клиентский сегмент, склад — задают контекст. Денормализация ускоряет типовой анализ, но требует определить, какое состояние измерения относится к факту.\u003c/p\u003e\u003cp\u003eНапример, организация перешла из малого сегмента в крупный. Пересчитать прошлогоднюю выручку по её нынешнему сегменту и показать сегмент на дату продажи — два разумных, но разных вопроса. Медленно меняющиеся измерения сохраняют версии с интервалами действия, если нужна историческая интерпретация. Простое ежедневное обновление справочника незаметно переписывает смысл старых графиков.\u003c/p\u003e\u003cp\u003eВозвраты и отмены тоже нельзя решать одной текущей колонкой status. Для отчёта по завершённым заказам нужен момент признания, для движения денег — события списания и возврата, для операционного потока — время создания. Все учебные графики «Северного маршрута» получают описание метрики, зернистость, часовой пояс, правила поздних данных и владельца определения. Это часть модели данных, а не украшение панели.\u003c/p\u003e"},{"title":"ETL, ELT и доставка изменений","html":"\u003cp\u003eExtract-transform-load, ETL, преобразует данные перед загрузкой в целевое хранилище. Extract-load-transform, ELT, сначала сохраняет исходные данные, затем преобразует их внутри аналитического контура. Оба подхода требуют схемы, контроля качества и воспроизводимости; порядок букв не делает один современным, а другой устаревшим. Сырые данные полезны для повторного расчёта, но без каталога и срока хранения легко превращаются в неуправляемую свалку.\u003c/p\u003e\u003cp\u003eChange data capture, CDC, извлекает изменения из журнала транзакционной системы. Он позволяет избежать периодического полного чтения большой таблицы, но переносит технические изменения строк, а не обязательно смысловые бизнес-события. UPDATE статуса и событие «доставка завершена» имеют разные договоры. Для снимка плюс поток нужна согласованная граница, иначе появятся пропуски или дубли. Удаление должно переноситься явно, например как tombstone, иначе удалённая строка останется в аналитике навсегда.\u003c/p\u003e\u003cp\u003eKafka может сохранять и распределять такой поток, но порядок гарантируется в пределах партиции, а не всего бизнеса. Подтверждение доставки сообщения не означает завершение внешней записи в ClickHouse. Практичный путь — at-least-once доставка с устойчивым event_id, версией сущности и определённой дедупликацией. При повторном расчёте одинаковые исходные события должны давать объяснимый результат.\u003c/p\u003e"},{"title":"Warehouse, lake и цена свежести","html":"\u003cp\u003eData warehouse — управляемый аналитический слой с согласованной моделью и быстрыми запросами. Data lake хранит наборы файлов разных типов, часто в объектном хранилище, и полезен для дешёвой истории, повторной обработки и новых способов анализа. Формат таблиц поверх файлов может добавлять снимки, схему и управление изменениями, но сам bucket не создаёт этих гарантий. Lake и warehouse дополняют друг друга или объединяются в отдельных реализациях; названия не отменяют инженерных требований.\u003c/p\u003e\u003cp\u003eЧем свежее отчёт, тем дороже поддерживать порядок поздних изменений и корректность промежуточного результата. Для оперативной диспетчерской задержка в секунды может быть необходима. Для закрытия финансового месяца важнее полнота и воспроизводимый срез. Панель должна показывать watermark или время последнего полного обновления, а не только текущее время браузера. Иначе оператор сравнивает неполный текущий час с полным вчерашним и делает неверный вывод о падении спроса.\u003c/p\u003e\u003cp\u003eАналитика не становится источником истины для команды резервирования только потому, что у неё красивый агрегат остатков. Она может подсказать проблему, после чего команда обращается к авторитетному OLTP-контуру. Возврат вычисленных признаков в операционную систему требует отдельного контракта версии и свежести, который понадобится в главах о машинном обучении.\u003c/p\u003e"},{"title":"Эволюция схемы и воспроизводимость расчёта","html":"\u003cp\u003eВ исходной базе поле delivery_status однажды разделяют на состояние исполнения и причину исключения. Поток CDC сразу отражает новую техническую схему, но старые потребители могут ожидать прежнюю колонку. Поэтому изменение начинается с совместимого расширения, затем потребители переходят на новую версию, и только после проверки убирается старое поле. Для событий полезны явная версия схемы и правило обработки неизвестных полей.\u003c/p\u003e\u003cp\u003eВоспроизводимый отчёт требует не только исходных файлов. Нужны версия преобразования, версия справочников, границы входных данных и настройки часового пояса. Если код сегодня использует текущий справочник регионов, повтор вчерашнего расчёта может изменить прошлый результат. Это иногда допустимо, но должно называться пересчётом по новой методике. Зафиксированный финансовый срез и оперативный обновляемый dashboard имеют разные правила публикации.\u003c/p\u003e\u003cp\u003eBackfill, заполнение истории новым расчётом, конкурирует с обычной загрузкой. Его следует ограничивать по ресурсам и выполнять с отдельной идентичностью версии, чтобы половина старого и половина нового результата не выглядели одним согласованным набором. Удобно строить новую витрину параллельно, сравнивать контрольные показатели, затем переключать читателей на завершённую версию. Откат касается указателя публикации, пока старые данные ещё сохранены.\u003c/p\u003e\u003cp\u003eКачество наблюдают по полноте, уникальности, допустимым диапазонам и сверке бизнес-итогов. Проверка «процесс завершился без ошибки» недостаточна: неверный join тоже успешно выполняется. Для опозданий дополнительно анализируют пустые и отрицательные интервалы. Для денег проверяют валюту, округление и возвраты. Эти проверки предметные; универсальная инфраструктурная панель не выведет их из схемы автоматически.\u003c/p\u003e"}],"workedExample":{"title":"Почему выручка выросла в три раза без новых денег","html":"\u003cp\u003eВ учебном дне оформлено 100 тысяч заказов на 120 миллионов рублей, в среднем по три позиции. Аналитик соединяет orders с order_items и суммирует orders.total. После соединения сумма каждого заказа повторяется по числу позиций; отчёт показывает около 360 миллионов. Более мощный ClickHouse ускорит ошибку, поэтому сначала определяем факт: выручка заказа считается один раз, либо выручка позиций агрегируется из их собственных сумм.\u003c/p\u003e\u003cp\u003eСледующая проблема — дубликаты CDC. Изменение заказа 731 версии 8 доставлено дважды, версия 9 пришла раньше повторной 8. Таблица текущего состояния выбирает максимальную бизнес-версию по ключу заказа; история событий сохраняется отдельно. Физическое фоновое слияние не следует путать с немедленным логическим исключением дублей из любого запроса. Команда определяет корректный путь чтения для выбранного движка и проверяет его до завершения слияний.\u003c/p\u003e\u003cp\u003eДалее появляется возврат, оформленный на следующий день. Отчёт продаж по дате заказа и отчёт движения денег по дате возврата расходятся закономерно. Мы сохраняем две метрики с разными определениями, а не исправляем одну до совпадения. Для управленческого отчёта выбираем допустимый лаг пять минут; для закрытия месяца строим версионированный срез с учётом поздних событий и явной датой пересчёта.\u003c/p\u003e\u003cp\u003eКонвейер получает начальный снимок, применяет поток с фиксированной границы, хранит сырую историю в объектном слое и строит витрину. Контроль качества сравнивает суммы и число уникальных заказов по региону и дню с авторитетным срезом. При отставании витрина продолжает отвечать, но показывает время свежести. Если лаг превышает договор, тревога касается данных, а не только живости процесса загрузки. Мы отдельно проверяем удаление персональных полей и повторный расчёт, чтобы историческая копия не стала обходом политики доступа.\u003c/p\u003e"},"expedition":{"world":"search","title":"Поисковая аналитика магазина и операционный поиск","html":"\u003cp\u003eИнтернет-магазин хочет одновременно искать товары и анализировать, какие запросы приводят к покупке. Поисковый движок оптимизирует отбор документов, текстовую релевантность и выдачу первых результатов. Аналитическое хранилище считает воронку миллионов поисковых сессий, экспериментальные группы и конверсию по периодам. Оба могут использовать распределённое хранение, но структура работы и критерий правильности различаются.\u003c/p\u003e\u003cp\u003eЕсли индексировать каждый просмотр товара как документ и затем строить финансовую отчётность запросами к поисковому кластеру, можно получить неудобную и дорогую модель. Если отправлять полнотекстовую выдачу в OLAP, агрегации не создадут хорошее ранжирование сами. Разумный путь — общий поток событий с чёткими идентификаторами, отдельный индекс для выдачи и отдельная витрина для анализа. Это несколько проекций одной истории с разными сроками обновления.\u003c/p\u003e\u003cp\u003eПод словом NoSQL также скрываются разные механизмы: document store хранит агрегаты-документы, key-value оптимизирует доступ по ключу, wide-column модель группирует данные по выбранному ключу, search engine строит инвертированный индекс. Колоночный OLAP не следует автоматически приравнивать к wide-column хранилищу только из-за слова «колонка». Переносится выбор физической модели под операции. Новое ограничение — качество ранжирования и смещение аналитики из-за того, какие документы уже были показаны пользователю.\u003c/p\u003e","transfer":["Разделять индекс выдачи и аналитическую витрину","Фиксировать зернистость и полноту событий"],"distinct":["Ранжирование и экспериментальная экспозиция влияют на смысл метрик"]},"diagrams":[{"title":"Строки и колонки: цена чтения","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003ctext x=\"30\" y=\"38\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eОдин набор фактов, две физические формы\u003c/text\u003e\u003crect x=\"35\" y=\"100\" width=\"115\" height=\"45\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"49\" y=\"129.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e731\u003c/text\u003e\u003crect x=\"155\" y=\"100\" width=\"115\" height=\"45\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"169\" y=\"129.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eСевер\u003c/text\u003e\u003crect x=\"300\" y=\"100\" width=\"115\" height=\"45\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"314\" y=\"129.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e1200\u003c/text\u003e\u003crect x=\"35\" y=\"155\" width=\"115\" height=\"45\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"49\" y=\"184.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e732\u003c/text\u003e\u003crect x=\"155\" y=\"155\" width=\"115\" height=\"45\" rx=\"12\" fill=\"#203950\" stroke =\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"464\" y=\"239.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eСевер\u003c/text\u003e\u003crect x=\"590\" y=\"100\" width=\"125\" height=\"45\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"604\" y=\"129.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e1200\u003c/text\u003e\u003crect x=\"590\" y=\"155\" width=\"125\" height=\"45\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"604\" y=\"184.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e900\u003c/text\u003e\u003crect x=\"590\" y=\"210\" width=\"125\" height=\"45\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"604\" y=\"239.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e800\u003c/text\u003e\u003ctext x=\"35\" y=\"360\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eИзменить заказ: мало строк, много полей\u003c/text\u003e\u003ctext x=\"35\" y=\"405\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eПосчитать регион: много строк, мало столбцов\u003c/text\u003e","caption":"Раскладка данных показывает разные профили: OLTP получает поля одной сущности, OLAP читает выбранные столбцы многих фактов. Это концептуальная схема, не точное устройство файлов PostgreSQL или ClickHouse. Колоночность сама по себе не исправляет неверную зернистость отчёта."},{"title":"Конвейер с воспроизводимым входом","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003crect x=\"30\" y=\"65\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"104.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eOLTP + журнал\u003c/text\u003e\u003crect x=\"280\" y=\"65\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"104.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eCDC / события\u003c/text\u003e\u003crect x=\"530\" y=\"65\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"104.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eСырая история\u003c/text\u003e\u003cpath d=\"M230 98 L280 98\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M480 98 L530 98\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"280\" y=\"260\" width=\"220\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"302.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eВитрина OLAP\u003c/text\u003e\u003cpath d=\"M630 130 L630 295\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M630 295 L500 295\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"30\" y=\"260\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"302.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eСверка итогов\u003c/text\u003e\u003cpath d=\"M280 295 L230 295\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"35\" y=\"395\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eevent_id + версия + граница снимка\u003c/text\u003e\u003ctext x=\"35\" y=\"435\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eВидимая свежесть и определение метрики обязательны\u003c/text\u003e","caption":"Из транзакционного журнала или бизнес-событий данные поступают в сырую историю, затем в витрину. Отдельная сверка сравнивает предметные итоги с авторитетным срезом. Доставка может повторяться; event_id, версии и согласованная граница начального снимка предотвращают тихие дубли и пропуски."}],"decision":{"prompt":"С чего начать аналитический контур?","options":[{"title":"Отдельная PostgreSQL-реплика и ограниченные отчёты","consequence":"Быстрый старт при умеренном объёме","tradeoff":"Тяжёлое сканирование и лаг остаются, ресурс ограничен"},{"title":"CDC и ClickHouse для выбранных витрин","consequence":"OLTP разгружается, агрегации масштабируются отдельно","tradeoff":"Нужны версии, дедупликация, контроль свежести и новые навыки"},{"title":"Ежедневные файлы и пакетный warehouse","consequence":"Просто воспроизводить полные срезы","tradeoff":"Не подходит оперативной диспетчерской"}],"recommended":1,"explanation":"Годовая история и оперативная аналитика уже имеют отдельный профиль нагрузки; переносим конкретные витрины, сохраняя определения и проверку качества."},"exercise":{"prompt":"Как проверить сумму выручки после соединения с позициями?","model":"\u003cp\u003eСначала назвать зернистость. Сумма заказа не должна повторяться для каждой позиции; можно агрегировать позиции до заказа или считать их собственные суммы с правилами скидок. Затем сверить уникальные заказы и финансовый срез.\u003c/p\u003e","rubric":["Определена зернистость","Предотвращено умножение суммы","Есть независимая сверка"]},"checkpoint":[{"question":"Что означает PRIMARY KEY MergeTree?","options":["Обязательно глобальную уникальность каждой строки","Ключ, связанный с физическим порядком и разреженным индексом, а не OLTP-ограничение уникальности","Только пароль администратора"],"answer":1,"explanation":"Нельзя переносить семантику PostgreSQL по совпадению названия."},{"question":"Почему вчерашний полный день нельзя прямо сравнить с текущим часом витрины?","options":["SQL запрещает сравнения дат","Текущий срез может быть неполным из-за лага и поздних событий","В OLAP нет времени"],"answer":1,"explanation":"Сравнение требует одинаковых окон и понятной полноты."}],"sources":[{"title":"ClickHouse: MergeTree table engine","url":"https://clickhouse.com/docs/engines/table-engines/mergetree-family/mergetree"},{"title":"ClickHouse: Schema Design","url":"https://clickhouse.com/docs/data-modeling/schema-design"},{"title":"Apache Kafka 4.0: Design, delivery semantics","url":"https://kafka.apache.org/40/design/design/"},{"title":"PostgreSQL 18: Logical Decoding","url":"https://www.postgresql.org/docs/18/logicaldecoding.html"}],"wordCount":1528},{"id":"ch-22","arc":6,"title":"Мир прислал сигнал: время устройства не равно времени сервера","briefing":"Аналитический контур заработал. Теперь «Северный маршрут» принимает координаты курьеров и температуру в рефрижераторах. Сигналы приходят с опозданием, повторяются и иногда сообщают невозможное время.","goals":["Телеметрия описывает наблюдение, а не команду","Event time и processing time отвечают на разные вопросы","MQTT определяет участок доставки"],"sections":[{"title":"Телеметрия описывает наблюдение, а не команду","html":"\u003cp\u003eТелеметрический сигнал сообщает, что устройство что-то измерило: температуру, положение, заряд батареи. Он не обязательно меняет бизнес-состояние напрямую. Из отсутствия новых сигналов нельзя заключать, что температура нормальная или автомобиль стоит: мог пропасть канал связи. Команда «открыть замок» имеет другой контракт, поскольку запускает действие и требует авторизации, подтверждения результата и безопасного повтора. Смешивать измерения и команды в одном неограниченном потоке рискованно.\u003c/p\u003e\u003cp\u003eСобытие полезно снабжать device_id, идентификатором загрузочной сессии, последовательным номером, временем измерения, временем приёма, единицами и версией схемы. Номер помогает найти пропуски и дубли, но после перезапуска устройство может начать счёт заново. Поэтому одного sequence без boot_id недостаточно. Время в миллисекундах без указания эпохи, часового пояса и точности создаёт правдоподобный мусор, который трудно заметить по обычному HTTP-успеху.\u003c/p\u003e\u003cp\u003eДля курьера точка относится к конкретной точности GPS и состоянию связи. Для температуры важны расположение датчика, калибровка и физическая инерция. Технически корректное сообщение может быть неверным измерением. Архитектура должна сохранять качество и происхождение наблюдения, чтобы аналитика не превращала любой пришедший байт в достоверный факт.\u003c/p\u003e"},{"title":"Event time и processing time отвечают на разные вопросы","html":"\u003cp\u003eEvent time — время события в мире или на устройстве. Processing time — время обработки сервером. Курьер проехал контрольную точку в 10:02, телефон восстановил связь в 10:08, аналитика обработала сообщение в 10:09. Если строить маршрут по времени приёма, появится ложный скачок. Если верить часам телефона без ограничений, устройство с неверной датой испортит целый будущий день.\u003c/p\u003e\u003cp\u003eОкна группируют события по времени: фиксированная минута для средней температуры, скользящие пять минут для обнаружения перегрева, сессионное окно для периода активности. Watermark — оценка того, насколько далеко продвинулось событийное время и какие более ранние события теперь считаются поздними. Это политика ожидания и полноты, а не доказательство, что сеть никогда больше не принесёт старое сообщение. У неактивной партиции watermark может застопорить общий прогресс, поэтому правила idle-источников тоже важны.\u003c/p\u003e\u003cp\u003eДля позднего события есть несколько честных вариантов: обновить предыдущий результат, записать отдельную корректировку или исключить из оперативного расчёта, сохранив для истории. Цена зависит от продукта. Сигнал о нарушении холодовой цепи полезно расследовать даже через час, но отправлять водителю запоздалую срочную команду без проверки текущего состояния опасно.\u003c/p\u003e"},{"title":"MQTT определяет участок доставки","html":"\u003cp\u003eMQTT — протокол публикации и подписки, удобный для устройств с ограниченными ресурсами и нестабильной связью. Клиент публикует в topic, брокер доставляет подписчикам. QoS 0 допускает потерю, QoS 1 допускает повторную доставку, QoS 2 использует дополнительный обмен для соответствующей гарантии доставки на конкретном участке протокола. Уровень между устройством и брокером не обязан совпадать с уровнем между брокером и каждым подписчиком.\u003c/p\u003e\u003cp\u003eДаже QoS 2 не доказывает, что бизнес-эффект в отдельной базе выполнен ровно один раз. Получатель может сохранить сообщение, отправить внешнюю команду и упасть до фиксации собственного результата. Нужны собственные идентификаторы, транзакционные границы и идемпотентность эффекта. Retained message хранит последнее сохранённое сообщение темы для новых подписчиков, а не всю историю. Last Will помогает заметить неожиданное отключение, но не заменяет измерение свежести конкретного датчика.\u003c/p\u003e\u003cp\u003eПостоянная сессия и срок хранения сообщений влияют на восстановление после офлайна. Бесконечно копить каждую координату на устройстве и брокере невозможно. Для текущего положения можно сохранять последнюю точку и ограниченную историю, для доказательства температуры груза — более полный журнал с контролем пропусков. Настройка QoS начинается с ценности потери и повтора, а не с автоматического выбора максимального уровня.\u003c/p\u003e"},{"title":"Edge — место принятия ограниченного решения","html":"\u003cp\u003eEdge processing выполняет часть работы возле источника: в телефоне, шлюзе склада или бортовом компьютере. Он может отфильтровать шум, сжать пакет, обнаружить локальную опасность и продолжить работу без облака. Но каждое такое решение требует границы полномочий. Шлюз может включить локальный звуковой сигнал при перегреве, а окончательно списать товар или изменить договор поставки должен авторитетный бизнес-контур.\u003c/p\u003e\u003cp\u003eStore-and-forward сначала устойчиво сохраняет сообщение локально, затем отправляет при появлении сети. Размер диска ограничен, значит нужна политика заполнения: что объединять, что отбрасывать, что блокировать. Пакетная передача снижает сетевые накладные расходы, но увеличивает задержку тревоги. Команда выбирает отдельно путь срочного сигнала и путь полной истории. Шифрование канала не заменяет защиту локального буфера на потерянном телефоне.\u003c/p\u003e\u003cp\u003eУстройства отличаются версиями прошивки, часами и возможностями. Обновление протокола должно поддерживать период сосуществования схем. Повторно подключившееся старое устройство не должно неожиданно получить чужие команды из-за повторно использованного идентификатора. Управление сертификатами, отзывом доступа и инвентарём устройств — такая же часть системы, как брокер. Здесь эксплуатационная реальность особенно быстро разрушает красивую схему одного идеального отправителя.\u003c/p\u003e"},{"title":"Временные ряды и кардинальность","html":"\u003cp\u003eTime series, временной ряд, связывает значение с моментом и набором меток. Для наблюдения сервиса полезны метрики с ограниченной кардинальностью: число запросов по региону и типу результата. Если добавить order_id или произвольный URL в метку каждой метрики, количество уникальных рядов резко вырастет, увеличивая память, индекс и стоимость запросов. Детальные идентификаторы лучше сохранять в событиях, логах или трассировках, выбирая подходящий механизм поиска.\u003c/p\u003e\u003cp\u003eПоказания датчиков могут храниться в специализированной временной модели или колоночной аналитике, если профиль запросов это оправдывает. Важны временной порядок, сжатие, retention — срок хранения, downsampling — уменьшение детализации, и качество агрегата. Среднее из средних без числа измерений и весов ошибочно при разных размерах групп. Максимум и число пропусков нередко важнее средней температуры, поскольку короткий пик может повредить груз.\u003c/p\u003e\u003cp\u003eТелеметрия устройства и observability самой платформы связаны, но не тождественны. Отсутствие датчика может быть бизнес-событием, а рост лага потребителя — признаком неполадки платформы. Нужно видеть обе цепочки: когда последний сигнал был измерен и когда он обработан. Иначе зелёный брокер скрывает давно переставший измерять прибор.\u003c/p\u003e"},{"title":"Команды устройствам требуют отдельной ответственности","html":"\u003cp\u003eВ обратную сторону идут команды: изменить частоту измерений, обновить конфигурацию, открыть отсек. Они должны содержать адресата, command_id, срок действия, требуемую версию конфигурации и полномочие отправителя. Подтверждение брокера означает приём сообщения протоколом, а не физическое открытие замка. Устройство сообщает отдельный результат исполнения, а сервер хранит неопределённость, пока его не получил.\u003c/p\u003e\u003cp\u003eПовтор команды с тем же command_id не должен дважды запускать необратимый эффект. Для простого задания «установить интервал десять секунд» идемпотентность естественна. Для «выдать одну порцию» нужен журнал исполненных команд на устройстве или другой авторитетный механизм. После сброса памяти такой журнал может исчезнуть, поэтому гарантию нельзя обещать без устойчивого локального хранения. Устройство с устаревшей прошивкой также может неправильно понимать команду новой версии.\u003c/p\u003e\u003cp\u003eСрок действия защищает от запоздалого выполнения после долгого офлайна. Но проверять его можно только с достаточно надёжным временем либо протоколом актуального сеанса. Критическая команда дополнительно связывается с текущим состоянием, чтобы старое сообщение не открыло уже переданный другому клиенту отсек. При смене владельца конфигурации полезна эпоха, проверяемая самим устройством, если оно способно её устойчиво хранить.\u003c/p\u003e\u003cp\u003e«Северный маршрут» поэтому начинает с безопасных конфигурационных команд и сохраняет локальный ручной способ действия. Удалённая автоматика вводится по мере появления доказуемой цепочки полномочий, исполнения и восстановления. Это прямое продолжение темы fencing: право должно проверяться в точке эффекта, а не оставаться красивым флагом на центральном сервере.\u003c/p\u003e"}],"workedExample":{"title":"Холодовая цепь с восьмиминутным офлайном","html":"\u003cp\u003eРефрижератор отправляет измерение каждые десять секунд. Во время восьмиминутного обрыва локальный буфер сохраняет 48 точек. После восстановления сети они приходят за две секунды и частично повторяются. Если считать перегрев по времени приёма, получится странный двухсекундный скачок из десятков измерений. Мы используем event time, а processing time сохраняем для диагностики доставки.\u003c/p\u003e\u003cp\u003eИдентификатор события составлен из device_id, boot_id и sequence. Дедупликация хранит достаточно длинное окно для ожидаемых повторов; более поздний повтор учитывается при исторической сверке. Часы устройства проверяются на допустимое отклонение относительно сеанса связи. Сильно будущая дата попадает в карантин качества и не продвигает общий watermark. Исправление времени сохраняет исходное значение и правило коррекции, иначе расследование теряет свидетельство.\u003c/p\u003e\u003cp\u003eОперативная тревога срабатывает локально, если температура выше порога достаточно долго. Облако пересчитывает интервал превышения после получения буфера, маркирует результат как поздний и создаёт задачу контроля качества. Оно не отправляет автоматически старую команду водителю, будто опасность возникла сейчас. Для карты курьера, напротив, выбирается последняя валидная точка, а старые точки достраивают историю отдельно.\u003c/p\u003e\u003cp\u003eПри хранении за сутки один датчик даёт 8640 точек. Тысяча датчиков — 8,64 миллиона; полезная нагрузка в 80 байт составляет около 691 мегабайта до индексов, протокола и репликации. Число полезно как нижняя оценка, а не как готовая квота диска. Мы храним сырые точки ограниченное время, затем сохраняем минутные минимум, максимум, сумму, число и число пропусков. Так можно корректно пересчитать среднее и не потерять короткий перегрев. Удаление детализации имеет необратимую границу: будущий анализ уже не восстановит десятисекундный профиль из одной средней.\u003c/p\u003e"},"expedition":{"world":"telemetry","title":"Промышленный станок и медицинский монитор","html":"\u003cp\u003eНа заводе датчик вибрации может выдавать тысячи отсчётов в секунду. Отправлять весь поток в облако дорого и иногда бессмысленно: локальный узел вычисляет спектральные признаки, а сырые фрагменты сохраняет возле аномалий. Но признаки должны иметь версию алгоритма и настройки измерения. После изменения фильтра одинаковое численное значение уже может означать другое физическое состояние.\u003c/p\u003e\u003cp\u003eУ медицинского монитора похожая сеть и совершенно другая цена пропуска. Отдалённый dashboard не должен быть единственным местом срочного сигнала, если связь может исчезнуть. Локальная тревога, клинически определённые пороги и процедура проверки входят в систему независимо от выбранного брокера. Этот учебный пример не задаёт медицинские нормы; он показывает, почему технический QoS нельзя напрямую переводить в безопасность пациента.\u003c/p\u003e\u003cp\u003eПереносится дисциплина событийного времени, качества, пропусков и локальной автономности. Новыми становятся частота сигнала, физическая интерпретация и регламент реакции. Ни MQTT, ни временная база не знают сами, какой пропуск допустим. В «Северном маршруте» тот же вопрос задаётся проще: где достаточно последнего положения, где требуется полная температурная история и кто обязан действовать, когда облако молчит.\u003c/p\u003e","transfer":["Сохранять качество, происхождение и пропуски","Отделять локальную тревогу от облачной аналитики"],"distinct":["Частота измерений и цена пропуска задаются физикой и отраслевыми требованиями"]},"diagrams":[{"title":"Событийное время и поздний сигнал","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003ctext x=\"30\" y=\"40\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eДва времени одного измерения\u003c/text\u003e\u003cpath d=\"M70 135 L700 135\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M70 285 L700 285\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"30\" y=\"105\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eМир / устройство\u003c/text\u003e\u003ctext x=\"30\" y=\"250\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eСервер\u003c/text\u003e\u003ccircle cx=\"170\" cy=\"135\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ctext x=\"125\" y=\"175\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003e10:02\u003c/text\u003e\u003ccircle cx=\"540\" cy=\"285\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ctext x=\"495\" y=\"325\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003e10:08\u003c/text\u003e\u003cpath d=\"M170 135 L540 285\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"285\" y=\"200\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eофлайн и буфер\u003c/text\u003e\u003cpath d=\"M420 70 L420 355\" fill=\"none\" stroke=\"#f5c677\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/\u003e\u003ctext x=\"330\" y=\"390\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003ewatermark — политика ожидания, не всеведение\u003c/text\u003e\u003ctext x=\"30\" y=\"435\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eПоздняя точка корректирует историю, но не притворяется новой\u003c/text\u003e","caption":"Измерение относится к 10:02, хотя сервер получил его в 10:08. Watermark задаёт политику ожидания поздних событий, а не исключает их существование. Оперативная реакция и историческая корректировка могут применять разные правила."},{"title":"Два пути: срочный и исторический","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003crect x=\"30\" y=\"65\" width=\"200\" height=\"75\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"109.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eДатчик\u003c/text\u003e\u003crect x=\"280\" y=\"65\" width=\"200\" height=\"75\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"109.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eEdge-буфер\u003c/text\u003e\u003crect x=\"530\" y=\"65\" width=\"200\" height=\"75\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"109.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eMQTT broker\u003c/text\u003e\u003cpath d=\"M230 100 L280 100\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M480 100 L530 100\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"280\" y=\"280\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"322.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eЛокальная тревога\u003c/text\u003e\u003cpath d=\"M380 140 L380 280\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"530\" y=\"280\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"322.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eИстория / анализ\u003c/text\u003e\u003cpath d=\"M630 140 L630 280\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"30\" y=\"405\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eQoS описывает участок доставки, не внешний бизнес-эффект\u003c/text\u003e\u003ctext x=\"30\" y=\"440\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eПовторы: device + boot + sequence; пропуски сохраняются\u003c/text\u003e","caption":"Edge сохраняет историю при офлайне и может запустить ограниченную локальную тревогу. MQTT передаёт сообщения дальше в историю и аналитику. Протокольный QoS не доказывает ровно однократный эффект в сторонней базе; бизнес-дедупликация имеет собственный ключ."}],"decision":{"prompt":"Что делать с сигналами при офлайне?","options":[{"title":"Буферизовать всё без ограничения","consequence":"Сохраняется подробная история до заполнения носителя","tradeoff":"Нужны конечная ёмкость и политика переполнения"},{"title":"Разделить срочную локальную реакцию и отложенную историю","consequence":"Критический сигнал не ждёт облака, история догоняет","tradeoff":"Нужны два согласованных режима и управление устройствами"},{"title":"Отправлять только последнюю точку","consequence":"Малая стоимость и свежая карта","tradeoff":"Неприемлемо для доказательства всех температурных интервалов"}],"recommended":1,"explanation":"Карта и холодовая цепь имеют разные потребности; единая политика потери для всех сигналов не подходит."},"exercise":{"prompt":"Какие поля нужны, чтобы отличить повтор после перезагрузки устройства?","model":"\u003cp\u003edevice_id, boot_id и sequence различают источник, сеанс загрузки и позицию в нём. Также сохраняем время измерения, приёма и версию схемы; один timestamp не является надёжным уникальным ключом.\u003c/p\u003e","rubric":["Есть идентичность загрузки","Не используется только время","Сохранены два времени"]},"checkpoint":[{"question":"Что гарантирует MQTT QoS 2?","options":["Ровно один платёж в любой внешней БД","Протокольную гарантию доставки на конкретном участке MQTT при его условиях","Отсутствие любых повторов бизнес-команды после рестарта"],"answer":1,"explanation":"Бизнес-эффект за границей протокола требует собственного соглашения."},{"question":"Зачем сохранять count вместе с минутным средним?","options":["Чтобы корректно объединять группы разного размера","Чтобы изменить шкалу температуры","Чтобы убрать необходимость контролировать пропуски"],"answer":0,"explanation":"Невзвешенное среднее средних искажает результат при разном числе измерений."}],"sources":[{"title":"OASIS Standard: MQTT Version 5.0, 7 March 2019","url":"https://docs.oasis-open.org/mqtt/mqtt/v5.0/os/mqtt-v5.0-os.html"},{"title":"Apache Flink: Timely Stream Processing","url":"https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/"},{"title":"Prometheus: Metric and label naming","url":"https://prometheus.io/docs/practices/naming/"}],"wordCount":1483},{"id":"ch-23","arc":6,"title":"Клиенты прикрепили видео: байты идут другим путём","briefing":"Сигналы устройств уже поступают отдельно от заказов. Клиенты «Северного маршрута» хотят прикладывать видео повреждений, а партнёры — смотреть обучающие трансляции. Большой файл нельзя обслуживать как ещё одно маленькое JSON-поле.","goals":["Объектное хранилище и метаданные имеют разные роли","Загрузка — управляемая сессия","Обработка строится как граф задач"],"sections":[{"title":"Объектное хранилище и метаданные имеют разные роли","html":"\u003cp\u003eВидеофайл может занимать сотни мегабайт, тогда как карточка претензии — несколько килобайт. Если пропускать каждый байт через тот же процесс, который подтверждает заказ, долгие соединения, память и сетевой трафик начинают конкурировать с короткими командами. Объектное хранилище сохраняет данные как объекты по ключу и подходит для больших неизменяемых полезных нагрузок. Реляционная база хранит владельца, связь с заказом, состояние проверки, размер, контрольную сумму и правила доступа.\u003c/p\u003e\u003cp\u003eКлюч объекта не должен быть секретом или доказательством права. Даже случайный трудно угадываемый идентификатор не заменяет авторизацию. Нельзя доверять присланным клиентом tenant_id, MIME-типу и пути хранения. Сервер определяет область доступа, выдаёт ограниченное право загрузки и после завершения проверяет результат. Читающий API возвращает ссылку только после проверки прав на связанную сущность.\u003c/p\u003e\u003cp\u003eСемантика объектных операций зависит от сервиса и конкретной функции. Наличие S3-совместимого API не доказывает полностью одинаковые гарантии согласованности, версионирования и условной записи у всех провайдеров. Для курса важно проверять документацию выбранного хранилища и отдельно модель метаданных: атомарной общей транзакции между PostgreSQL и bucket по умолчанию нет.\u003c/p\u003e"},{"title":"Загрузка — управляемая сессия","html":"\u003cp\u003eСначала приложение создаёт сессию загрузки: кто загружает, к какому заказу, максимальный размер и какие форматы разрешены. Затем получает короткоживущие подписанные права на конкретные операции с конкретным объектом. Байты идут напрямую в хранилище, а не через API заказа. Подписанная ссылка — bearer credential: обладающий ею может выполнить разрешённое действие до истечения условий. Поэтому её не следует логировать как обычный публичный URL.\u003c/p\u003e\u003cp\u003eMultipart upload делит большой объект на независимые части. Потерянную часть можно повторить без перезапуска всего файла; клиент ограничивает параллелизм, хранит состояние и завершает загрузку после успешных частей. Контрольная сумма нужна для проверки содержимого; ETag не следует универсально считать MD5 всего объекта, особенно при multipart и разных настройках. Незавершённые загрузки необходимо отменять или очищать по политике, иначе они продолжают занимать ресурсы.\u003c/p\u003e\u003cp\u003eПосле сигнала клиента «готово» сервер не публикует файл немедленно. Он проверяет наличие объекта, ожидаемые размеры и связь с сессией, затем переводит запись в состояние проверки. Если уведомление хранилища дублируется или приходит позже клиентского вызова, один upload_id и переходы с условиями на состояние удерживают процесс от повторного создания претензии.\u003c/p\u003e"},{"title":"Обработка строится как граф задач","html":"\u003cp\u003eИсходник сначала попадает в карантин. Обработчик проверяет тип по содержимому, ограничения длительности и размера, вредоносные вложения и допустимость дальнейшего использования. Затем извлекает метаданные, создаёт превью и необходимые производные версии. Транскодирование меняет кодек или параметры потока; transmuxing может менять контейнер без повторного кодирования. Это разные по цене операции, и их нельзя считать одинаковой «конвертацией».\u003c/p\u003e\u003cp\u003eГраф обработки имеет зависимости: превью и анализ могут выполняться параллельно, публикация ждёт обязательных проверок. Задача должна быть идемпотентна по исходному объекту, версии конвейера и типу результата. Выход пишется под неизменяемым ключом, а метаданные переключаются на завершённый набор после проверки. Частично созданные варианты не должны выглядеть как полностью опубликованный ролик.\u003c/p\u003e\u003cp\u003eПовторяемость важна и для расследований. Если изменился алгоритм сжатия или модерации, версия конвейера объясняет разницу результатов. Исходник сохраняется столько, сколько нужно продукту и политике хранения, а не навсегда по инерции. Вычислительные очереди для медиа ограничены отдельно: всплеск длинных роликов не должен вытеснить обработку маленького доказательства повреждения и тем более принятие заказа.\u003c/p\u003e"},{"title":"CDN переносит чтение ближе к зрителю","html":"\u003cp\u003eContent delivery network, CDN, кэширует контент в узлах доставки и уменьшает расстояние до зрителя и нагрузку на origin, исходное хранилище. Хорошо кэшируются неизменяемые сегменты и версии. Если заменить объект под прежним URL, разные узлы могут некоторое время отдавать разные байты. Версионированные ключи и обновление манифеста делают публикацию понятнее; срочная invalidation имеет стоимость и собственное время распространения.\u003c/p\u003e\u003cp\u003eВидео по требованию часто разбивается на сегменты, а манифест HLS или DASH перечисляет варианты качества и порядок воспроизведения. Адаптивный плеер выбирает битрейт по доступной полосе и буферу. Несколько разрешений увеличивают стоимость транскодирования и хранения, но позволяют сохранить просмотр на слабой сети. Ключевые кадры и границы сегментов должны быть совместимы между вариантами для корректного переключения.\u003c/p\u003e\u003cp\u003eАвторизация CDN требует продуманного cache key. Если персональный токен включить в ключ без необходимости, одинаковое видео перестанет разделять кэш между зрителями. Если исключить важный признак доступа и проверять права только на origin, кэш может обойти защиту. Подписанные cookies или URL, проверяемые на границе, отделяют право чтения от идентичности самих неизменяемых байтов. Приватное доказательство клиента и публичный учебный ролик требуют разных политик.\u003c/p\u003e"},{"title":"Live отличается бюджетом задержки","html":"\u003cp\u003eВ live конвейер не ждёт завершения файла: принимает поток, кодирует варианты, формирует сегменты и непрерывно обновляет манифест. Сумма задержек захвата, кодирования, сегментации, доставки и буфера определяет отставание зрителя. Более длинные сегменты улучшают эффективность кэша и устойчивость, но увеличивают задержку; более короткие повышают частоту запросов и чувствительность к сети. «Реальное время» без числа и сценария не является требованием.\u003c/p\u003e\u003cp\u003eДля массовой трансляции с задержкой в несколько секунд сегментная доставка удобна. Для разговора диспетчера с курьером нужен иной компромисс и часто интерактивный транспорт вроде WebRTC. Нельзя заменить разговор обычной CDN-выдачей только потому, что обе задачи содержат видео. Запись эфира, чат и права просмотра также имеют отдельные потоки и сроки хранения.\u003c/p\u003e\u003cp\u003eОперационные показатели — время начала просмотра, доля зависаний, фактическое качество, отставание от live и ошибки публикации. HTTP 200 на манифесте не доказывает, что зритель видит движение. Стоимость учитывает исходники, производные версии, незавершённые части, вычисления и особенно исходящий трафик. Бесплатная на вид загрузка может создать дорогую многократную доставку популярного ролика.\u003c/p\u003e"},{"title":"Удаление и публикация — тоже конвейеры","html":"\u003cp\u003eКогда клиент удаляет ролик, одной строки deleted недостаточно. Нужно прекратить выдачу новых ссылок, отозвать доступ к объекту по выбранной модели, удалить или ограничить производные копии и учесть уже закэшированные сегменты. Короткоживущие права ограничивают время остаточного доступа, но не стирают файл, который зритель уже скачал. Обещание удаления должно различать управляемые копии сервиса и полученные внешним клиентом байты.\u003c/p\u003e\u003cp\u003eДля публикации полезна симметричная модель. Пока все обязательные результаты не готовы, манифест не ссылается на незавершённый набор. Сначала загружаются неизменяемые варианты, затем атомарно обновляется метаданный указатель на опубликованную версию. Повтор обновления безопасен по версии. Если один регион CDN временно отстаёт, прежняя законченная версия лучше набора с отсутствующими сегментами. Это напоминает переключение аналитической витрины, хотя единицы данных совершенно другие.\u003c/p\u003e\u003cp\u003eСроки хранения исходника и производных версий могут различаться. Если исходник удалён ради экономии, новый кодек уже нельзя получить с прежним качеством без повторной загрузки. Если превью содержит персональные данные, его нельзя оставить в общедоступном bucket после удаления основного файла. Инвентаризация связей становится обязательной частью модели метаданных, а не отдельной случайной уборкой.\u003c/p\u003e\u003cp\u003eКоманда также защищает обработчики от вредоносной сложности файла: малый размер не гарантирует малую стоимость декодирования. Ограничиваются память, процессорное время, длительность и сетевой доступ задач. Ошибка декодера не должна давать доступ к секретам заказа. Изоляция вычисления здесь так же важна, как корректные права на хранилище.\u003c/p\u003e"}],"workedExample":{"title":"Претензия с роликом на 240 мегабайт","html":"\u003cp\u003eКлиент прикладывает двухминутный ролик размером 240 мегабайт. Сервер создаёт upload-731, ограничивает общий размер и выдаёт права только на нужный ключ. При размере части 16 мегабайт получится 15 частей. Если сеть оборвалась на четырнадцатой, повторяется эта часть, а не все 240 мегабайт. Слишком большой параллелизм на мобильном канале не ускорит слабое радио и может ухудшить конкурирующие запросы приложен
