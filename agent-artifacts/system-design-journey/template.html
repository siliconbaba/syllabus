<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Системы: путь архитектора</title><style>
:root{--bg:#f3f1ea;--paper:#fffdf7;--ink:#18352f;--muted:#53685f;--line:#ced7cc;--accent:#19644c;--soft:#e3eddf;--gold:#a55a22}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 system-ui,sans-serif}body.dark{--bg:#14221f;--paper:#1b302a;--ink:#edf2e8;--muted:#bbcec1;--line:#3d574b;--accent:#9dd6af;--soft:#294338;--gold:#edbe89}a{color:var(--accent);text-underline-offset:4px}button,input,textarea{font:inherit}button,.button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:.55rem .85rem;cursor:pointer}button:hover,.button:hover{background:var(--soft)}:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.skip{position:absolute;top:-100px}.skip:focus{top:0;background:var(--paper);z-index:9}header{padding:16px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--paper)}.top{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:-.03em;flex:1;min-width:170px}.brand small{display:block;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}nav{display:flex;gap:12px;flex-wrap:wrap}nav a{font-size:14px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{font-size:14px}main{max-width:1200px;margin:auto;padding:36px 20px 90px}h1{font:650 clamp(2rem,5vw,3.8rem)/1.13 system-ui;letter-spacing:-.045em;margin:.3em 0 .5em}h2{font-size:1.6rem;line-height:1.3;letter-spacing:-.02em;margin:2em 0 .7em}h3{line-height:1.4}p{margin:.9em 0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:700}.lead{font-size:1.2rem;color:var(--muted);max-width:800px}.muted{color:var(--muted)}.hero{max-width:920px;padding:12px 0 32px}.stats{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}.stats strong{font-size:1.5rem;display:block}.stats span{font-size:13px;color:var(--muted)}.next{background:var(--ink);color:var(--bg);padding:24px;border-radius:18px;margin:20px 0 36px}.next a{color:inherit}.arcs,.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.arc,.world{padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:18px}.arc h2{margin:.3em 0}.chapter-link{display:block;padding:11px 0;border-top:1px solid var(--line);text-decoration:none;font-size:15px}.chapter-link span{float:right}.arc-number{color:var(--gold);font-size:13px;letter-spacing:.12em}.reader{display:grid;grid-template-columns:220px minmax(0,800px);gap:44px;align-items:start}.toc{position:sticky;top:20px;font-size:13px;max-height:85vh;overflow:auto}.toc a{display:block;padding:5px 0}.prose{min-width:0}.prose>h1{font-size:clamp(2rem,4vw,3.1rem)}.prose p,.prose li{overflow-wrap:anywhere}.prose code{font-size:.88em;background:var(--soft);padding:2px 4px}.prose pre{overflow:auto;padding:18px;background:var(--soft);border-radius:10px}.prose table{display:block;overflow:auto;border-collapse:collapse}.prose td,.prose th{padding:9px;border:1px solid var(--line)}.panel{padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin:30px 0}.expedition{border-left:5px solid var(--gold)}.diagram{margin:30px 0}.svg-scroll{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;color:#17352b;padding:12px}.svg-scroll svg{display:block;min-width:680px;width:100%;height:auto;font-family:system-ui,sans-serif}.diagram figcaption{font-size:14px;color:var(--muted);padding-top:10px}.options{display:grid;gap:10px}.choice{text-align:left;width:100%}.selected{border:2px solid var(--accent);background:var(--soft)}.feedback{border-left:3px solid var(--accent);padding:4px 16px;margin-top:16px}.hidden{display:none!important}textarea,input[type=search]{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);background:var(--paper)}textarea{min-height:150px;resize:vertical}.reader-footer{display:flex;gap:12px;flex-wrap:wrap;margin-top:35px}.status{font-size:13px;color:var(--muted);min-height:1.7em}.warning{padding:12px 20px;background:#ffedba;color:#4d3500}.glossary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.glossary div{padding:20px;border-bottom:1px solid var(--line)}dialog{width:min(850px,calc(100% - 28px));max-height:85vh;overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:24px}dialog::backdrop{background:#0009}.search-results a{display:block;padding:14px 0;border-bottom:1px solid var(--line)}details summary{cursor:pointer;font-weight:600}.navrow{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.progress{height:7px;background:var(--line);border-radius:6px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.market-scroll{overflow:auto;margin:24px 0 36px;border:1px solid var(--line);border-radius:14px}.market-scroll table{border-collapse:collapse;width:100%;min-width:650px;background:var(--paper);font-size:15px}.market-scroll th,.market-scroll td{text-align:left;vertical-align:top;padding:15px;border-bottom:1px solid var(--line)}.market-scroll thead{background:var(--soft)}@media(max-width:760px){main{padding:24px 16px 70px}.arcs,.worlds,.glossary{grid-template-columns:1fr}.reader{display:block}.toc{position:static;max-height:190px;border-bottom:1px solid var(--line);margin-bottom:24px;padding-bottom:16px}.panel{padding:18px}.top{gap:10px}.tools{width:100%}.stats{gap:18px}header nav{width:100%;gap:10px}.arc,.world{padding:20px}}@media print{header,.toc,.tools,button{display:none}body{background:white;color:black}.reader{display:block}.panel{break-inside:avoid}}

/* Reading cues: stable semantic labels, restrained emphasis, no collapsed theory. */
.prose .reading-cue{display:block;padding:18px 20px;margin:1.5em 0;border-inline-start:3px solid var(--accent);background:var(--soft);border-radius:0 10px 10px 0}
.prose .reading-boundary{background:#faf0e2;border-color:#99521a}
body.dark .prose .reading-boundary{background:#382d23;border-color:#e6b67c}
.cue-label{display:block;font-size:12px;font-weight:750;line-height:1.4;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
.reading-boundary .cue-label{color:#834513}body.dark .reading-boundary .cue-label{color:#edbe89}
.reading-key{font-weight:650;background:linear-gradient(transparent 58%,#dbe9ca 58%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
body.dark .reading-key{background:linear-gradient(transparent 58%,#365440 58%)}
.prose strong{font-weight:750}
.prose #worked{background:var(--paper);border-inline-start:3px solid var(--line)}
.prose #worked h2{margin-top:.5em}.prose #worked pre{border:1px solid var(--line)}
@media(max-width:760px){.prose .reading-cue{display:block;padding:14px 15px;margin:1.3em 0}.cue-label{font-size:11px}}
@media(forced-colors:active){.reading-key{background:none;text-decoration:underline}.prose .reading-cue{border:2px solid CanvasText}.cue-label{color:CanvasText}}
@media print{.reading-key{background:none;text-decoration:underline}.prose .reading-cue{break-inside:avoid;border:1px solid #555}.cue-label{color:#222}}

.story-passport{margin:22px 0;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.story-passport summary{font-size:14px}.story-passport dt{font-size:13px;font-weight:700;color:var(--muted);margin-top:16px}.story-passport dd{margin:4px 0 0;font-size:15px;line-height:1.65}

/* Narrative illustrations are deliberately separate from precise system diagrams. */
.story-scene{margin:30px 0 36px;break-inside:avoid}.story-window{position:relative;width:100%;overflow:hidden;border-radius:14px;background:#d7c6ab;isolation:isolate}
.story-window img{position:absolute;display:block;max-width:none;object-fit:fill}
.story-scene figcaption{font-size:14px;line-height:1.6;color:var(--muted);margin-top:12px;max-width:66ch}
.story-moment{max-width:560px;margin:32px auto}.story-moment .story-window{border-radius:10px}
@media(max-width:760px){.story-scene{margin:24px 0 28px}.story-scene figcaption{font-size:13px}.story-window{border-radius:10px}}
@media print{.story-scene{max-width:150mm}.story-scene figcaption{color:#333}}

.visual-explainer{margin:36px 0;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--paper);min-width:0}
.visual-explainer button{min-height:44px}.visual-explainer h3{font-size:1.3rem;margin:.4em 0}.visual-modes,.visual-controls{display:flex;gap:8px;flex-wrap:wrap}
.visual-modes button,.visual-controls button{font-size:14px}.visual-explainer button[aria-pressed="true"]{background:var(--soft);border:2px solid var(--accent);font-weight:650}
.visual-explainer button:disabled{opacity:.5;cursor:default}.visual-steps{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.visual-steps button{font-size:13px;text-align:left;flex:1 1 135px}.visual-steps button span{font-weight:750}
.visual-status{font-size:14px;color:var(--muted)}.visual-frame{margin:16px 0 24px}.visual-frame[hidden]{display:none}
.visual-scroll{overflow-x:auto;background:#fffdf7;color:#18352f;border:1px solid var(--line);border-radius:10px}
.visual-scroll svg{display:block;min-width:600px;width:100%;height:auto;font-family:Arial,sans-serif}.visual-frame figcaption{font-size:15px;line-height:1.65;margin-top:12px}
.visual-takeaway{padding:12px 16px;border-inline-start:3px solid var(--accent);background:var(--soft)}.visual-caveat{font-size:14px;color:var(--muted)}
@media(max-width:760px){.visual-explainer{padding:14px;margin:28px 0}.visual-controls button{flex:1 1 135px}.visual-frame figcaption{font-size:14px}}
@media print{.visual-modes,.visual-steps,.visual-controls,.visual-status{display:none!important}.visual-frame[hidden]{display:block!important}.visual-explainer{border:1px solid #888;padding:12px}.visual-frame{break-inside:avoid}.visual-scroll{overflow:visible}.visual-scroll svg{min-width:0}}

/* Small transparent spots interrupt paragraphs gently, without wrapping prose. */
.story-spot{display:grid;grid-template-columns:124px minmax(0,1fr);align-items:center;gap:20px;max-width:480px;margin:24px auto;break-inside:avoid}
.story-spot .story-window{background:transparent;border-radius:0}.story-spot figcaption{font-size:14px;line-height:1.6;margin:0;max-width:28ch}
@media(max-width:760px){.story-spot{grid-template-columns:88px minmax(0,1fr);gap:14px;margin:20px auto;max-width:360px}.story-spot figcaption{font-size:13px}}
@media print{.story-spot{max-width:110mm;grid-template-columns:25mm minmax(0,1fr)}}

'use strict';const DATA=__COURSE_DATA__;const arcs=['Открыть двери','Выдержать внимание','Связать миры','Найти и доставить','Доверять копиям','Увидеть другой масштаб','Научиться предсказывать','Изменяться безопасно'];const arcStories=['Первая версия: от обещания клиенту до надёжного заказа.','Рост внимания: быстрый ответ при ограниченном бюджете.','Внешние системы: обещания, повторы и незавершённые процессы.','Новый опыт: найти товар, назначить курьера, сохранить связь.','Несколько копий: кто отвечает за истину при отказах.','Другие нагрузки: данные, сигналы, медиа и чужие процессы.','Предсказания и помощники: измеримая польза под контролем.','Новая организация: менять систему, сохраняя доверие.'];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={done:{},notes:{},bookmarks:{},decisions:{},checks:{},positions:{},theme:'light',last:null},storageOK=true;try{const raw=localStorage.getItem('sd-journey-v3');if(raw){let parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object')state={...state,...parsed};}}catch(e){storageOK=false;}function normalizeState(){const valid=new Set(DATA.chapters.map(c=>c.id));for(const key of ['done','notes','bookmarks','decisions','checks','positions']){const value=state[key];state[key]=value&&typeof value==='object'&&!Array.isArray(value)?Object.fromEntries(Object.entries(value).filter(([id])=>valid.has(id))):{};}for(const c of DATA.chapters){const id=c.id;if(state.done[id]!==true)delete state.done[id];if(state.bookmarks[id]!==true)delete state.bookmarks[id];const n=state.notes[id];if(n&&typeof n==='object')state.notes[id]={personal:typeof n.personal==='string'?n.personal:'',exercise:typeof n.exercise==='string'?n.exercise:''};else delete state.notes[id];const d=state.decisions[id];if(!Number.isInteger(d)||d<0||d>=c.decision.options.length)delete state.decisions[id];const checks=state.checks[id];if(!checks||typeof checks!=='object')delete state.checks[id];else{state.checks[id]={};c.checkpoint.forEach((q,i)=>{const v=checks[i];if(v&&v.confirmed===true&&Number.isInteger(v.choice)&&v.choice>=0&&v.choice<q.options.length)state.checks[id][i]={choice:v.choice,confirmed:true};});}if(!Number.isFinite(state.positions[id])||state.positions[id]<0)delete state.positions[id];}state.theme=state.theme==='dark'?'dark':'light';if(!valid.has(state.last))state.last=null;}normalizeState();let lastFocus=null;function save(){try{localStorage.setItem('sd-journey-v3',JSON.stringify(state));}catch(e){storageOK=false;warn();}}function warn(){if(!storageOK){$('#warning').classList.remove('hidden');$('#warning').textContent='Хранилище недоступно. Изменения сохраняются только в памяти этой вкладки. Экспортируйте портфель перед закрытием.';}}warn();function announce(t){$('#live').textContent=t;}function setTheme(){document.body.classList.toggle('dark',state.theme==='dark');$('#theme').setAttribute('aria-pressed',String(state.theme==='dark'));}setTheme();$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';setTheme();save();};const words=html=>html.replace(/<[^>]+>/g,' ').trim().split(/\s+/).filter(Boolean).length;const chapterText=c=>[c.title,c.briefing,...c.sections.map(s=>s.title+' '+s.html),c.workedExample.html,c.expedition.html,c.decision.prompt,c.exercise.prompt].join(' ').replace(/<[^>]+>/g,' ');const totalWords=DATA.chapters.reduce((n,c)=>n+c.wordCount,0);const worldId=w=>String(w.id||w.world||'').replace(/^world-/,'');function go(h){location.hash=h;}function openDialog(id){lastFocus=document.activeElement;$('#'+id).showModal();}function closeDialog(id){$('#'+id).close();lastFocus?.focus();}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeDialog(b.dataset.close));document.querySelectorAll('dialog').forEach(d=>d.addEventListener('close',()=>lastFocus?.focus()));$('.skip').onclick=e=>{e.preventDefault();$('#main').focus();};$('#searchOpen').onclick=()=>{openDialog('searchDialog');$('#searchInput').focus();};$('#searchInput').oninput=()=>{let q=$('#searchInput').value.trim().toLocaleLowerCase('ru');$('#searchResults').innerHTML=q.length<2?'<p class="muted">Введите хотя бы два символа.</p>':[...DATA.chapters.filter(c=>chapterText(c).toLocaleLowerCase('ru').includes(q)).map(c=>`<a href="#${c.id}">${esc(c.title)} <small>· глава ${Number(c.id.slice(3))}</small></a>`),...DATA.worlds.filter(w=>JSON.stringify(w).toLocaleLowerCase('ru').includes(q)).map(w=>`<a href="#world-${worldId(w)}">Мир: ${esc(w.title)}</a>`)].join('')||'<p>Совпадений нет.</p>';$('#searchResults').querySelectorAll('a').forEach(a=>a.onclick=()=>closeDialog('searchDialog'));};function home(){const count=Object.values(state.done).filter(Boolean).length;const next=DATA.chapters.find(c=>!state.done[c.id])||DATA.chapters[31];return `<div class="hero"><div class="eyebrow">Один продукт · восемь версий архитектуры</div><h1>От первого заказа<br>до архитектурного совета</h1><p class="lead">Вы следите за развитием «Северного маршрута»: сервис доставки растёт, встречает новые ограничения и меняет устройство. Каждая арка продолжает предыдущую. Все главы доступны сразу.</p><p class="muted">История следует опорной архитектуре; ваши решения сохраняются как сравнение альтернатив и не блокируют чтение.</p><div class="stats"><div><strong>32</strong><span>главы · 8 арок</span></div><div><strong>${totalWords.toLocaleString('ru')}</strong><span>слов в главах</span></div><div><strong>32</strong><span>экспедиции · 8 миров</span></div><div><strong>${count}/32</strong><span>отмечено прочитанным</span></div></div><div class="progress" aria-label="Прогресс чтения: ${count} из 32"><i style="width:${count/32*100}%"></i></div></div><div class="next"><div class="eyebrow" style="color:inherit">${state.last?'Продолжить путь':'Следующий шаг'}</div><a href="#${state.last||next.id}">${esc((DATA.chapters.find(c=>c.id===state.last)||next).title)} →</a></div><div class="arcs">${arcs.map((a,i)=>`<section class="arc"><div class="arc-number">ВЕРСИЯ ${i+1} / АРКА ${i+1}</div><h2>${a}</h2><p class="muted">${arcStories[i]}</p>${DATA.chapters.filter(c=>c.arc===i+1).map(c=>`<a class="chapter-link" href="#${c.id}">${c.id.slice(3)} · ${esc(c.title)} <span aria-label="${state.done[c.id]?'Прочитано':''}">${state.done[c.id]?'✓':''}${state.bookmarks[c.id]?' ★':''}</span></a>`).join('')}</section>`).join('')}</div>`;}
function figureHTML(c,d,i){return `<figure class="diagram"><h3>${esc(d.title)}</h3><div class="svg-scroll" tabindex="0" role="region" aria-label="Схема: ${esc(d.title)}. Прокручивается горизонтально"><svg xmlns="http://www.w3.org/2000/svg" viewBox="${esc(d.viewBox)}" role="img" aria-labelledby="journey-diagram-title-${c.id}-${i}"><title id="journey-diagram-title-${c.id}-${i}">${esc(d.title)}</title>${d.svg}</svg></div><figcaption>${esc(d.caption)}</figcaption></figure>`;}
function storyPassport(c){const stage=DATA.storyStages?.find(s=>s.id===c.arc);if(!stage)return '';return `<details class="story-passport"><summary>Паспорт этапа · ${esc(stage.title)}</summary><dl><dt>Место в истории</dt><dd>${esc(stage.period)}</dd><dt>Регионы</dt><dd>${esc(stage.regions)}</dd><dt>Масштаб и расчётные стенды</dt><dd>${esc(stage.scale)}</dd><dt>Что меняется</dt><dd>${esc(stage.change)}</dd></dl></details>`;}
function storyArtFor(c,placement,section,paragraph){const art=DATA.storyArt;if(!art)return '';return art.scenes.filter(scene=>scene.chapter===c.id&&scene.placement===placement&&(placement==='afterSection'?scene.afterSection===section:placement==='inline'?scene.section===section&&scene.afterParagraph===paragraph:true)).map(scene=>{const sheet=art.sheets[scene.sheet],col=scene.cell%sheet.columns,row=Math.floor(scene.cell/sheet.columns);return `<figure class="story-scene story-${scene.kind}" aria-describedby="story-caption-${scene.id}"><div class="story-window" style="aspect-ratio:${sheet.width/sheet.columns}/${sheet.height/sheet.rows}"><img src="${sheet.src}" alt="${esc(scene.alt)}" width="${sheet.width}" height="${sheet.height}" loading="lazy" decoding="async" style="width:${sheet.columns*100}%;height:${sheet.rows*100}%;left:${-col*100}%;top:${-row*100}%"></div><figcaption id="story-caption-${scene.id}">${esc(scene.caption)}</figcaption></figure>`;}).join('');}
function theoryWithSpots(c,section,index){let paragraph=0;return section.html.replace(/<\/p>/g,end=>end+storyArtFor(c,'inline',index,++paragraph));}

function chapter(c){state.last=c.id;save();const idx=DATA.chapters.indexOf(c);return `<div class="reader"><aside class="toc" aria-label="Оглавление главы"><a href="#home">← Карта пути</a><p class="eyebrow">Арка ${c.arc} · ${arcs[c.arc-1]}</p>${c.sections.map((s,i)=>`<a href="#section-${i}" data-scroll="section-${i}">${esc(s.title)}</a>`).join('')}<a href="#worked" data-scroll="worked">Разобранный пример</a><a href="#expedition" data-scroll="expedition">Экспедиция</a><a href="#decision" data-scroll="decision">Решение</a><a href="#checkpoint" data-scroll="checkpoint">Проверка понимания</a></aside><article class="prose"><div class="eyebrow">Глава ${idx+1} / 32 · ${c.wordCount.toLocaleString('ru')} слов</div><h1>${esc(c.title)}</h1><p class="lead">${esc(c.briefing)}</p>${storyArtFor(c,'opening')}${storyPassport(c)}<div class="navrow"><button id="bookmark" aria-pressed="${!!state.bookmarks[c.id]}">${state.bookmarks[c.id]?'★ В закладках':'☆ В закладки'}</button><button id="resume">Вернуться к позиции чтения</button></div><details><summary>Что станет понятнее</summary><ul>${c.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></details>${c.sections.map((s,i)=>`<section id="section-${i}"><h2>${esc(s.title)}</h2>${theoryWithSpots(c,s,i)}${storyArtFor(c,'afterSection',i)}${visualExplainersFor(c,i)}</section>${c.diagrams.map((d,di)=>((Number.isInteger(d.afterSection)?d.afterSection:(di===0?Math.min(1,c.sections.length-1):c.sections.length-1))===i)?figureHTML(c,d,di):'').join('')}`).join('')}<section id="worked" class="panel"><div class="eyebrow">Разбор с числами</div><h2>${esc(c.workedExample.title)}</h2>${c.workedExample.html}</section><section id="expedition" class="panel expedition"><div class="eyebrow">Экспедиция · <a href="#world-${c.expedition.world}">открыть мир ↗</a></div><h2>${esc(c.expedition.title)}</h2>${c.expedition.html}<h3>Что переносится</h3><ul>${c.expedition.transfer.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Что меняется</h3><ul>${c.expedition.distinct.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section id="decision" class="panel"><div class="eyebrow">Архитектурное решение</div><h2>${esc(c.decision.prompt)}</h2><p class="muted">Выберите подход, чтобы увидеть его последствия. Это исследование компромиссов.</p><div class="options">${c.decision.options.map((o,i)=>`<button class="choice ${state.decisions[c.id]===i?'selected':''}" aria-pressed="${state.decisions[c.id]===i}" data-decision="${i}">${esc(o.title)}</button>`).join('')}</div><div id="decisionFeedback" aria-live="polite"></div></section><section class="panel"><div class="eyebrow">Короткое закрепление</div><h2>${esc(c.exercise.prompt)}</h2><label for="exerciseNote">Ваш ответ или наблюдение</label><textarea id="exerciseNote" data-note="exercise">${esc(state.notes[c.id]?.exercise||'')}</textarea><details><summary>Открыть разбор и критерии</summary>${c.exercise.model}<ul>${c.exercise.rubric.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details></section><section id="checkpoint"><h2>Проверка понимания</h2><p class="muted">Ответы и объяснения появятся после подтверждения каждого выбора. Баллы — только учебная обратная связь.</p>${c.checkpoint.map((q,i)=>`<fieldset class="panel"><legend>Вопрос ${i+1} из 2</legend><p>${esc(q.question)}</p>${q.options.map((o,j)=>`<label style="display:block;margin:10px 0"><input type="radio" name="q${i}" value="${j}" ${state.checks[c.id]?.[i]?.choice===j?'checked':''}> ${esc(o)}</label>`).join('')}<button data-check="${i}">Подтвердить ответ</button><div id="checkFeedback${i}" class="status" aria-live="polite"></div></fieldset>`).join('')}</section><section class="panel"><h2>Заметки к главе</h2><label for="chapterNote">Идеи, ограничения, вопросы для своего продукта</label><textarea id="chapterNote" data-note="personal">${esc(state.notes[c.id]?.personal||'')}</textarea><p id="noteStatus" class="status" aria-live="polite"></p></section><section><h2>Источники</h2><p class="muted">Содержание главы доступно офлайн. Для открытия источников нужен интернет.</p><ul>${c.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.title)} ↗</a></li>`).join('')}</ul></section><div class="reader-footer"><button id="markDone">${state.done[c.id]?'✓ Прочитано — снять отметку':'Отметить прочитанным'}</button>${idx>0?`<a class="button" href="#${DATA.chapters[idx-1].id}">← Предыдущая</a>`:''}${idx<31?`<a class="button" href="#${DATA.chapters[idx+1].id}">Следующая →</a>`:'<a class="button" href="#notes">Открыть портфель →</a>'}</div></article></div>`;}
function marketOverview(){return (DATA.market||[]).length?`<details style="margin-bottom:30px"><summary>Карта бизнесов: куда переносится механизм</summary><p class="muted">Авторская учебная классификация. Узнавайте семейства систем по ядру задачи, затем переходите к подробному паспорту мира.</p><div class="market-scroll" tabindex="0" role="region" aria-label="Карта архитектурного рынка, прокручиваемая таблица"><table><thead><tr><th scope="col">Бизнес</th><th scope="col">Ядро задачи</th><th scope="col">Миры атласа</th></tr></thead><tbody>${DATA.market.map(m=>`<tr><th scope="row">${esc(m.title)}</th><td>${esc(m.kernel)}</td><td>${m.worlds.map(id=>`<a href="#world-${esc(id)}">${esc(DATA.worlds.find(w=>worldId(w)===id)?.title||id)}</a>`).join(' · ')}</td></tr>`).join('')}</tbody></table></div><p class="muted">B2B/B2C, размер компании и highload сами по себе не определяют архитектуру.</p></details>`:'';}function atlas(){return `<div class="hero"><div class="eyebrow">Атлас отраслей</div><h1>Восемь миров.<br>Разные правила истины.</h1><p class="lead">Переносите механизм, проверяйте условия. Деньги, остатки и медиапоток по-разному переживают дубликаты, задержки и потерю данных.</p></div>${marketOverview()}<div class="worlds">${DATA.worlds.map(w=>`<section class="world"><div class="eyebrow">${esc(worldId(w))}</div><h2>${esc(w.title)}</h2><p>${esc(w.briefing)}</p><a href="#world-${worldId(w)}">Исследовать мир →</a></section>`).join('')}</div>`;}function world(w){const id=worldId(w);return `<article class="prose" style="max-width:830px;margin:auto"><a href="#atlas">← Атлас миров</a><div class="eyebrow">Паспорт мира · ${esc(id)}</div><h1>${esc(w.title)}</h1><p class="lead">${esc(w.briefing)}</p>${w.entryScenario?`<div class="panel">${esc(w.entryScenario)}</div>`:''}${w.signature?`<dl class="panel">${Object.entries(w.signature).map(([k,v])=>`<dt><strong>${esc(({truth:'Источник истины',traffic:'Нагрузка',latency:'Задержка',risk:'Риск',cost:'Стоимость'})[k]||k)}</strong></dt><dd>${esc(v)}</dd>`).join('')}</dl>`:''}${(w.sections||[]).map(s=>`<h2>${esc(s.title)}</h2>${s.html}`).join('')}${['transfer','distinct'].map(k=>w[k]?`<h2>${k==='transfer'?'Что переносится':'Что отличает этот мир'}</h2><ul>${w[k].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'').join('')}${(w.compare||[]).map(x=>`<section class="panel"><h2>${esc(x.title)}</h2>${x.html}<a href="#world-${esc(x.world)}">Открыть связанный мир →</a></section>`).join('')}<h2>Экспедиции из истории продукта</h2>${DATA.chapters.filter(c=>c.expedition.world===id).map(c=>`<p><a href="#${c.id}">${esc(c.expedition.title)} · глава ${Number(c.id.slice(3))}</a></p>`).join('')}<h2>Источники</h2><ul>${(w.sources||[]).map(s=>`<li><a href="${esc(s.url)}">${esc(s.title)} ↗</a></li>`).join('')}</ul></article>`;}const glossary=[['Идемпотентность','Повтор одной логической операции не создаёт дополнительного эффекта. Граница ключа и срок хранения результата входят в гарантию.'],['Транзакция','Набор операций с общей границей фиксации. Изоляция определяет, какие конкурентные эффекты допустимы.'],['Источник истины','Система или правило, по которому разрешают противоречия данных в определённом домене.'],['Репликация','Передача изменений между копиями. Наличие копии само по себе не гарантирует свежесть и безопасное переключение.'],['Consistency','Согласованность наблюдений: какие значения и порядок операций разрешено видеть клиенту.'],['Индекс','Дополнительная структура доступа к данным: ускоряет определённые чтения ценой места и работы при записи.'],['Кэш','Производная копия для ускорения доступа. Её пригодность зависит от допустимой устарелости и способа обновления.'],['Outbox','Запись намерения отправить событие в одной транзакции с бизнес-изменением. Отправка и повтор требуют отдельного механизма.'],['Saga','Последовательность локальных транзакций с обработкой неуспеха и, где возможно, компенсациями.'],['Шардирование','Распределение разных частей данных по узлам по выбранному правилу. Ключ определяет локальность и перекос нагрузки.'],['Quorum','Правило участия достаточного набора узлов. Свойства зависят от протокола, пересечения наборов и модели отказов.'],['Fencing','Ограждение ресурса от действий устаревшего владельца записи. Проверяемый ресурсом монотонный токен — один из механизмов; гарантия зависит от того, где проверяется право записи.'],['SLO','Целевой уровень измеримого качества сервиса за определённое окно наблюдения.'],['Backpressure','Передача ограничения скорости вверх по потоку, чтобы не накапливать неограниченную работу.'],['RPO / RTO','Цели допустимой потери данных и времени восстановления в заданной модели отказов. RPO часто выражают временем, но допустимую потерю можно задавать и объёмом данных; RTO — время восстановления. Проверяются восстановлением, а не наличием копии.'],['OLTP / OLAP','Обработка операционных транзакций / аналитических запросов. Они предъявляют разные требования к структурам и нагрузке.'],['Event time','Время события в предметном мире; отличается от времени поступления и обработки.'],['RAG','Формирование ответа модели с извлечённым контекстом. Качество извлечения и права доступа остаются отдельными задачами.'],['Embedding','Векторное представление, обученное для сравнения объектов. Близость не является доказательством истинности.'],['TCO','Полная стоимость владения: ресурсы, лицензии, работа команды, поддержка и последствия отказов.'],['Control / data plane','Контур управления правилами и контур выполнения операций с пользовательскими данными.'],['Expand–migrate–contract','Сначала совместимое расширение, затем перенос данных и клиентов, затем удаление старого контракта.'],["DNS", "Система имён и записей о ресурсах. Разрешение имени, кэширование записей и соединение с сервером — разные этапы запроса."],["L4 / L7", "Балансировка на уровне транспортных соединений / на уровне прикладного протокола. Граница влияет на маршрутизацию, TLS, состояния и стоимость."],["MVCC", "Хранение нескольких логических версий данных для согласованных наблюдений конкурентных транзакций. Не отменяет блокировки и проверку инвариантов."],["WAL", "Журнал предзаписи: изменения фиксируются в журнале до соответствующей записи страниц по правилам СУБД. Режим подтверждения определяет гарантию сохранности."],["B-tree", "Сбалансированная индексная структура с упорядоченными ключами и переходами между страницами. Цена чтения зависит от запроса, селективности и доступа к самим данным."],["LSM", "Семейство структур с записью в память и отсортированные компоненты на диске, которые затем объединяются. Ускорение одних операций оплачивается дополнительной работой чтения, записи и compaction."],["Deadlock", "Цикл взаимного ожидания ресурсов. Одна из транзакций может быть прервана; повторять нужно согласованную целую операцию, а не случайный её фрагмент."],["CDC", "Получение потока изменений из источника данных. Нужны позиция, порядок, версии, обработка повторов и согласование с начальным снимком."],["CQRS", "Разделение моделей изменения и чтения. Не требует автоматически отдельных сервисов или хранения состояния только в событиях."],["Event sourcing", "Модель, где состояние восстанавливается из последовательности доменных событий. Требует версий, воспроизведения и контроля внешних эффектов."],["ETA", "Оценка времени прибытия. Это прогноз с неопределённостью; расстояние по прямой и время по дорожному маршруту не взаимозаменяемы."],["Matching", "Сопоставление кандидатов и задач с ограничениями и целевой функцией. Самый близкий кандидат не всегда даёт лучший общий результат."],["Fan-out", "Распространение одного изменения нескольким получателям. Число адресатов и момент подготовки результата определяют нагрузку."],["CRDT", "Тип данных или алгоритм слияния, обеспечивающий сходимость поддерживаемых изменений при своих предпосылках. Сходимость не доказывает бизнес-корректность итога."],["CDN", "Распределённая доставка контента через копии ближе к потребителям. Нужны права, правила кэширования и защита origin при промахах."],["Multipart upload", "Приём объекта по частям с отдельной сессией и завершением. У незавершённых частей есть стоимость, срок жизни и правила очистки."],["Tenant", "Организационный контекст клиента в общей системе. Данные, права и ресурсы должны сохранять эту границу на всех путях."],["Noisy neighbor", "Ухудшение сервиса одного клиента из-за использования общих ресурсов другим. Квоты и изоляция выбираются по конкретному узкому месту."],["JWT", "Формат токена с утверждениями. Подпись, срок, issuer/audience и права проверяются отдельно; токен не является автоматическим разрешением на любой объект."],["mTLS", "TLS с проверкой идентичности обеих сторон соединения. Не заменяет объектную авторизацию и бизнес-ограничения."],["Training-serving skew", "Различие данных или преобразований при обучении и обслуживании модели. Качество offline может не воспроизвестись в production."],["Drift", "Изменение распределений данных или связей с целевым результатом. Требует наблюдения и диагностики, а не обязательного автоматического переобучения при любом сигнале."],["Hybrid search", "Сочетание нескольких способов поиска, например лексического и векторного, с общими фильтрами и ранжированием. Качество надо измерять."],["Unit cost", "Стоимость определённого полезного результата при заданном качестве и горизонте. Число технических вызовов не всегда является правильным знаменателем."],["SBOM", "Перечень программных компонентов артефакта. Помогает учёту и расследованию, но сам по себе не гарантирует отсутствие уязвимостей."],["Provenance", "Сведения о происхождении и процессе получения артефакта. Их проверка помогает понять, что и как собрано, но не доказывает правильность всей бизнес-логики."]];function notes(){return `<div class="hero"><div class="eyebrow">Личное пространство</div><h1>Портфель решений</h1><p class="lead">Учебный прогресс и собственные мысли хранятся в этой среде. Экспорт помогает сохранить их отдельно.</p><button id="exportOpen">Экспортировать портфель JSON</button></div><h2>Закладки</h2>${DATA.chapters.filter(c=>state.bookmarks[c.id]).map(c=>`<p><a href="#${c.id}">${esc(c.title)}</a></p>`).join('')||'<p class="muted">Пока нет закладок.</p>'}<h2>Заметки</h2>${DATA.chapters.filter(c=>state.notes[c.id]?.personal||state.notes[c.id]?.exercise).map(c=>`<section class="panel"><h3><a href="#${c.id}">${esc(c.title)}</a></h3>${state.notes[c.id].personal?`<p style="white-space:pre-wrap">${esc(state.notes[c.id].personal)}</p>`:''}${state.notes[c.id].exercise?`<details><summary>Ответ на упражнение</summary><p style="white-space:pre-wrap">${esc(state.notes[c.id].exercise)}</p></details>`:''}</section>`).join('')||'<p class="muted">Заметки можно добавить в каждой главе.</p>'}`;}function portfolio(){let oldRaw={},warnings=['Старый курс имеет другую структуру. Его данные включены как raw, не сопоставлены новым главам и не изменены.'];for(const k of ['sd-course-v1','sd-course-v2'])try{let raw=localStorage.getItem(k);if(raw!==null)oldRaw[k]=raw;}catch(e){warnings.push('Не удалось прочитать старое хранилище.');}return {schema:'sd-journey-portfolio-v3',exportedAt:new Date().toISOString(),course:'Системы: путь архитектора',state,oldRaw,warnings};}function exportOpen(){ $('#exportText').value=JSON.stringify(portfolio(),null,2);$('#exportStatus').textContent='';openDialog('exportDialog');}$('#copyExport').onclick=async()=>{try{await navigator.clipboard.writeText($('#exportText').value);$('#exportStatus').textContent='JSON скопирован.';}catch(e){$('#exportText').focus();$('#exportText').select();$('#exportStatus').textContent='Выделен весь JSON. Нажмите Ctrl+C или ⌘C.';}};$('#downloadExport').onclick=()=>{if(window.webkit?.messageHandlers?.setting){$('#exportText').focus();$('#exportText').select();$('#exportStatus').textContent='В приложении сохраните JSON через системное меню копирования выделенного текста или кнопку «Копировать JSON».';return;}const url=URL.createObjectURL(new Blob([$('#exportText').value],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='systems-journey-portfolio.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};let currentChapter=null,positionTimer,ignoreScrollUntil=0,pendingPosition=null;function flushPosition(){clearTimeout(positionTimer);positionTimer=null;if(pendingPosition){state.positions[pendingPosition.id]=pendingPosition.pos;pendingPosition=null;save();return;}if(currentChapter&&Date.now()>=ignoreScrollUntil){state.positions[currentChapter.id]=window.scrollY;save();}}window.bookSavePosition=flushPosition;window.addEventListener('pagehide',flushPosition);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPosition();});function render(){flushPosition();ignoreScrollUntil=Date.now()+650;let hash=decodeURIComponent(location.hash.slice(1)||'home');const c=DATA.chapters.find(c=>c.id===hash),w=DATA.worlds.find(w=>'world-'+worldId(w)===hash);currentChapter=c||null;$('#main').innerHTML=c?chapter(c):w?world(w):hash==='atlas'?atlas():hash==='notes'?notes():hash==='glossary'?`<h1>Словарь механизмов</h1><p class="lead">Короткие определения для ориентации. Условия и границы гарантий разобраны в главах.</p><div class="glossary">${glossary.map(([t,d])=>`<div><h2>${t}</h2><p>${d}</p><a href="#" data-term="${esc(t.split(' / ')[0])}">Найти в главах →</a></div>`).join('')}</div>`:home();document.title=(c?c.title:w?w.title:'Системы: путь архитектора')+' · Путь архитектора';window.scrollTo(0,0);$('#main').focus({preventScroll:true});$('#exportOpen')?.addEventListener('click',exportOpen);document.querySelectorAll('[data-term]').forEach(a=>a.onclick=e=>{e.preventDefault();$('#searchInput').value=a.dataset.term;$('#searchInput').oninput();openDialog('searchDialog');});if(c)bindChapter(c);announce(c?`Открыта глава ${Number(c.id.slice(3))}: ${c.title}`:w?`Открыт мир ${w.title}`:'Открыт раздел');}function decisionFeedback(c){let i=state.decisions[c.id];if(!Number.isInteger(i))return;const o=c.decision.options[i];$('#decisionFeedback').innerHTML=`
