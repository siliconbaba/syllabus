:"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" rx=\"16\" fill=\"#081b2b\"/\u003e\u003crect x=\"40\" y=\"65\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"185.0\" y=\"106.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eТрассы и расходы\u003c/text\u003e\u003crect x=\"430\" y=\"65\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"575.0\" y=\"106.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eГипотеза меры\u003c/text\u003e\u003crect x=\"40\" y=\"285\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"185.0\" y=\"326.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eПилот + SLO\u003c/text\u003e\u003crect x=\"430\" y=\"285\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"575.0\" y=\"326.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eРешение и пересмотр\u003c/text\u003e\u003cpath d=\"M330 100 L430 100\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"430,100 420.3,105.3 420.3,94.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"90.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eдрайвер\u003c/text\u003e\u003cpath d=\"M575 135 L575 285\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"575,285 569.7,275.3 580.3,275.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"575.0\" y=\"200.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eплан\u003c/text\u003e\u003cpath d=\"M185 135 L185 285\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"185,285 179.7,275.3 190.3,275.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"185.0\" y=\"200.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eбазовая линия\u003c/text\u003e\u003cpath d=\"M330 320 L430 320\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"430,320 420.3,325.3 420.3,314.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"310.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eфакт + качество\u003c/text\u003e\u003ctext x=\"380\" y=\"430\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"17\" fill=\"#dbeafe\"\u003eМеньший счёт без качества не подтверждает успех\u003c/text\u003e","caption":"Топология связывает расход с наблюдаемым механизмом и экспериментом. Решение использует стоимость полезного результата и ограничения сервиса; изменение метода распределения расходов отдельно от реальной экономии."}],"decision":{"prompt":"Как уменьшить расходы помощника без потери полезности?","options":[{"title":"Сразу перейти на меньшую модель","consequence":"Снижение ставки генерации","tradeoff":"Может увеличить исправления и повторные обращения"},{"title":"Сначала устранить повторы и лишний контекст","consequence":"Уменьшение работы с сохранением проверки качества","tradeoff":"Нужны трассы и эксперимент на одинаковой выборке"},{"title":"Перенести весь контур на собственные вычисления","consequence":"Контроль ресурсов и данных","tradeoff":"Капитал, сопровождение и риск недозагрузки"}],"recommended":1,"explanation":"В трассах уже видны повторы и нерелевантный контекст. Это проверяемый драйвер расходов; смену модели можно оценить следующим отдельным экспериментом."},"exercise":{"prompt":"Какие две метрики нужны рядом со стоимостью токена?","model":"\u003cp\u003eСтоимость решённого обращения и доля решений без повторного открытия. Добавьте время проверки человеком и защитные SLO, иначе локальная экономия может увеличить общий расход.\u003c/p\u003e","rubric":["Есть бизнес-знаменатель","Учтён человеческий труд"]},"checkpoint":[{"question":"Куда относить расходы неуспешных повторов?","options":["Исключить из отчёта","Включить в числитель цены результата","Добавить в число успешных операций"],"answer":1,"explanation":"Повторы потребили ресурсы, даже не создав отдельной ценности."},{"question":"Снижение тарифа доказывает улучшение эффективности кода?","options":["Нет, ставка и объём потребления — разные драйверы","Да, всегда","Да, если общий счёт уменьшился"],"answer":0,"explanation":"Для причинного вывода разделяют цену ресурса и количество ресурса."}],"sources":[{"title":"FinOps Foundation: Unit Economics","url":"https://www.finops.org/framework/capabilities/unit-economics/"},{"title":"FinOps Foundation: Allocation","url":"https://framework.finops.org/framework/capabilities/allocation/"},{"title":"FinOps Framework: обзор","url":"https://www.finops.org/framework/"}],"wordCount":1493},{"id":"ch-29","arc":8,"title":"Команд стало много: границы, которые позволяют меняться","briefing":"Цена результата выявила повторяющиеся расходы команд: каждая заново настраивает выпуск, наблюдение и доступ. «Северному маршруту» нужна архитектура организации и платформы, но разделение на сервисы само по себе независимости не создаёт.","goals":["Архитектурный стиль выражает ограничения","DDD: одинаковое слово может иметь разные модели","Данные и выпуск показывают настоящую связанность","Платформа — внутренний продукт","Control plane и data plane","Как понять, что границы помогают"],"sections":[{"title":"Архитектурный стиль выражает ограничения","html":"\u003cp\u003eСтиль архитектуры — набор правил о компонентах и их взаимодействии. Слоистая архитектура разделяет представление, прикладную логику и хранение. Событийная организует часть взаимодействий через сообщения. Сервисная выделяет отдельные развёртываемые компоненты. Эти описания отвечают на разные вопросы и могут сочетаться: сервис бывает слоистым внутри и обменивается событиями с соседями. Название стиля не заменяет карту конкретных зависимостей.\u003c/p\u003e\u003cp\u003eМодульный монолит — одно приложение с явно защищёнными внутренними границами. Его модули могут владеть своими таблицами и предоставлять интерфейсы, оставаясь в одном процессе и выпуске. Общий процесс упрощает вызовы и транзакции, но ошибка ресурсоёмкого модуля способна затронуть остальных. Отдельный сервис усиливает изоляцию и независимость выпуска, одновременно добавляя сеть, частичные отказы, версии контрактов и эксплуатационную работу.\u003c/p\u003e\u003cp\u003eНачинать выбор следует с нужного изменения. Если поиск требует отдельного масштабирования и собственного графика выпуска, это довод для выделения. Если три разработчика постоянно меняют заказ и оплату одной задачей, преждевременное разделение может увеличить координацию. Архитектор измеряет связи и частоту совместных изменений, а не число прямоугольников на схеме. Допустимо оставить ядро монолитом, выделив только части с убедительной причиной.\u003c/p\u003e"},{"title":"DDD: одинаковое слово может иметь разные модели","html":"\u003cp\u003eDomain-driven design, DDD, предлагает строить модель вокруг предметной области и её языка. Ограниченный контекст — область, внутри которой термины имеют согласованный смысл. «Доставка» для клиента означает обещанный результат, для диспетчера — назначение ресурсов, для расчётов — оплачиваемую услугу. Попытка сделать один гигантский объект с полями для всех подразделений связывает их изменения и права.\u003c/p\u003e\u003cp\u003eВ «Северном маршруте» контекст заказа владеет обязательством перед клиентом, диспетчеризация — назначением и маршрутом, расчёты — финансовыми проводками. Контекст не обязан совпадать с отдельным сервисом: сначала можно закрепить модель и владельца в модуле. Граница становится полезной, когда понятно, кто принимает решение и какой факт передаёт соседу. Событие «курьер назначен» не даёт диспетчеризации права менять сумму оплаты напрямую.\u003c/p\u003e\u003cp\u003eМежду контекстами нужен перевод. Внешний партнёр называет статус delivered после передачи на промежуточный пункт, а наш бизнес считает доставкой вручение клиенту. Антикоррупционный слой преобразует внешний смысл в локальный, не пропуская чужую модель во всё ядро. Это дополнительный код, но он локализует изменение партнёра. Универсальная общая библиотека статусов может, напротив, заставить все команды одновременно обновляться ради одного нового значения.\u003c/p\u003e"},{"title":"Данные и выпуск показывают настоящую связанность","html":"\u003cp\u003eДва сервиса, которые пишут в одни таблицы и требуют синхронного релиза, часто являются распределённым монолитом. Вызовы идут по сети, а независимости нет. Владение данными означает, что один контекст определяет инварианты и разрешённые изменения, а остальные обращаются через контракт или получают производные копии. Прямой SQL соседней команды удобен сегодня, но привязывает её к внутренней схеме навсегда.\u003c/p\u003e\u003cp\u003eВыделение сервиса требует решить судьбу транзакций. Если одна бизнес-операция атомарно меняла заказ и расчёт, после разделения общая локальная транзакция исчезнет. Появятся промежуточные состояния, события, сверка и компенсации. Это может быть оправдано, но не должно возникнуть неожиданно после переноса кода. Сначала описывают инвариант, например невозможность двойного возврата, и сохраняют его в одном владельце либо проектируют явный протокол.\u003c/p\u003e\u003cp\u003eПрактический критерий — способна ли команда проверить и выпустить изменение без согласованного окна со всеми соседями. Контрактные тесты, обратная совместимость и локальные среды помогают, но не исправляют неверно выбранную границу. Если каждое изменение поля запускает цепочку обязательных релизов, стоит исследовать семантическую связь. Иногда правильное решение — объединить слишком мелкие сервисы и вернуть локальный инвариант.\u003c/p\u003e"},{"title":"Платформа — внутренний продукт","html":"\u003cp\u003eПлатформа предоставляет повторяемые возможности: создание окружения, выпуск артефакта, секреты, наблюдение, резервное копирование. Её пользователи — команды продукта. Хороший путь позволяет выполнить типовую задачу самостоятельно и получить понятный результат. Каталог из сотни кнопок, после которых всё равно нужен тикет специалисту, не уменьшает зависимость и когнитивную нагрузку.\u003c/p\u003e\u003cp\u003eКоманда начинает с самого частого пути: развернуть фоновый обработчик с очередью, метриками и безопасным доступом. Шаблон создаёт минимальный набор, объясняет ограничения и показывает ошибки. Платформа не решает за продуктовую команду смысл сообщения или допустимость повторной обработки; она обеспечивает проверяемый механизм доставки и наблюдения. Так разделяются общие гарантии и предметные решения.\u003c/p\u003e\u003cp\u003eВнутренний продукт требует обратной связи и пути исключений. ML-команда может нуждаться в пакетных заданиях, медиаконтур — в длительном перекодировании. Единый шаблон синхронного HTTP-сервиса не подходит всем. Исключение имеет владельца, срок пересмотра и понятные обязательства, а не превращается в скрытый обход. Данные DORA полезны как карта способностей и наблюдаемых связей; они не доказывают, что любая платформа автоматически улучшит именно нашу компанию.\u003c/p\u003e"},{"title":"Control plane и data plane","html":"\u003cp\u003eControl plane — контур управления, где создаются конфигурации, политики и желаемое состояние. Data plane — контур исполнения, который обрабатывает пользовательские операции. Например, платформа задаёт маршруты и лимиты, а шлюзы применяют последнюю подтверждённую конфигурацию. Разделение позволяет продолжить обслуживание заказов, если панель управления временно недоступна. Но это свойство нужно построить, а не получить от английских названий.\u003c/p\u003e\u003cp\u003eИсполнитель хранит версию конфигурации и проверяет её целостность. При недоступности управления он может применять последнюю безопасную версию в пределах допустимого срока. Для срочного отзыва доступа это создаёт конфликт между доступностью и свежестью политики. Поэтому разные настройки имеют разные правила: маршрут может жить дольше, разрешение на чувствительное действие — требовать более свежего подтверждения. Политика устаревания задаётся явно.\u003c/p\u003e\u003cp\u003eКонтур управления часто обладает широкими полномочиями и становится ценным объектом атаки. Его изменение требует аутентификации, авторизации, аудита и постепенного распространения. Ошибочная глобальная конфигурация способна повредить весь data plane сразу, даже если тот хорошо реплицирован. Версионирование, канареечное применение и быстрый возврат предыдущей версии ограничивают радиус воздействия.\u003c/p\u003e"},{"title":"Как понять, что границы помогают","html":"\u003cp\u003eОценка включает время от изменения до выпуска, частоту обязательных согласований, долю неуспешных изменений, восстановление и субъективную сложность работы. Один показатель легко исказить: частые деплои могут быть пустыми, короткое время выпуска — достигаться отказом от проверок. Поэтому количественные сигналы сопровождаются разбором конкретных историй. Изменение лимита доставки должно проходить по понятному пути с известным владельцем.\u003c/p\u003e\u003cp\u003eАрхитектурное решение записывают как ADR: контекст, выбранный вариант, альтернативы, последствия и условие пересмотра. Такой документ объясняет, почему поиск выделили, а расчёты оставили рядом с финансовым журналом. Он не запрещает будущим командам менять решение. Наоборот, наличие исходных ограничений помогает понять, что уже перестало быть верным.\u003c/p\u003e\u003cp\u003eПереход к новой структуре выполняют постепенно. Сначала защищают интерфейсы и владение внутри приложения, затем выделяют компонент с небольшим числом пересечений. Платформа обеспечивает выпуск и наблюдение до увеличения количества сервисов. Иначе сложность эксплуатации растёт раньше, чем появляется средство с ней справиться. Успешная архитектура здесь измеряется способностью изменяться безопасно, а не количеством технологий в перечне.\u003c/p\u003e\u003cp\u003eЗависимости стоит показать и на уровне библиотек. Общий пакет с моделями всех доменов может заставить команды обновляться совместно даже при отдельных базах и сервисах. Полезно различать стабильную техническую библиотеку и предметный контракт. Для контракта важны совместимые версии и проверка потребителей; для внутренней реализации — свобода владельца менять детали. Если общая библиотека начинает включать правила возвратов, поиска и назначения одновременно, она незаметно становится ещё одним центром связанности. Удаление такой зависимости требует той же дисциплины миграции, что и изменение сетевого API: сначала новая форма, затем переход потребителей, только после этого удаление старой. Отдельные репозитории сами по себе эту проблему не решают.\u003c/p\u003e"}],"workedExample":{"title":"Почему выделяют поиск, но оставляют расчёты","html":"\u003cp\u003eУ «Северного маршрута» восемь продуктовых команд. Поиск выпускается четыре раза в неделю и потребляет переменный объём памяти; ядро заказа выпускается раз в неделю. Два последних инцидента связаны с перестроением поискового индекса, которое ухудшило оформление. Финансовый модуль, напротив, часто меняется вместе с правилами отмены и пока обслуживается одной командой. Все количества учебные.\u003c/p\u003e\u003cp\u003eКоманда рассматривает три шага. Первый — ограничить поиску ресурсы в общем процессе. Это быстро, но не обеспечивает отдельного выпуска и не устраняет последствия утечки памяти. Второй — выделить поиск с собственной проекцией каталога, получаемой через события. Третий — разделить все модули на сервисы сразу. Для последнего нет подтверждённой выгоды, а число межсервисных границ резко возрастает.\u003c/p\u003e\u003cp\u003eВыбирают второй шаг. Источник истины каталога остаётся у владельца каталога. Поиск получает события с версией объекта, умеет переигрывать их и показывает возраст индекса. При его недоступности доступен ограниченный просмотр категорий, оформление по уже выбранному товару не зависит от поискового индекса. Пропавшее событие обнаруживается сверкой, а не предположением о безошибочной доставке. Перед выпуском проверяют удаление товара и смену прав арендатора.\u003c/p\u003e\u003cp\u003eФинансовый модуль пока остаётся в приложении, но прямой доступ соседей к его таблицам закрывают. Он предоставляет команду возврата с идемпотентностью и проверкой остатка. Это создаёт реальную границу без преждевременной сети. Платформенная команда выпускает шаблон поискового сервиса с лимитами, трассировкой и восстановлением индекса. Через месяц оценивают независимость релиза и влияние на оформление, сохраняя возможность признать, что отдельный сервис оказался дороже ожидаемого.\u003c/p\u003e"},"expedition":{"world":"collaboration","title":"Экспедиция: совместное редактирование","html":"\u003cp\u003eВ продукте совместного редактирования документов контексты выглядят иначе. Биллинг и управление организациями можно отделить относительно спокойно, а оперативная модель совместных правок тесно связана с синхронизацией, разрешением конфликтов и присутствием участников. Механическое разделение по существительным «документ», «редактор», «курсор» может создать множество сетевых шагов для одного нажатия клавиши.\u003c/p\u003e\u003cp\u003eПереносится критерий владения инвариантом и независимого изменения. Команда исследует, какие данные нужны атомарно или в одном упорядоченном потоке. Часть протокола синхронизации остаётся единым компонентом, а поисковая индексация получает производные события. Права проверяются перед подключением к документу и при существенных изменениях доступа, а не только при открытии страницы.\u003c/p\u003e\u003cp\u003eПлатформа помогает с соединениями, наблюдением и ограничением ресурсов, но не выбирает алгоритм разрешения конфликтов за команду редактора. Control plane управляет организациями и политиками, data plane доставляет изменения, однако отзыв доступа требует отдельного канала и понятного срока применения. Таким образом, переносится способ рассуждения о границах, а конкретные границы строятся заново вокруг частоты взаимодействий и необходимых гарантий.\u003c/p\u003e","transfer":["Граница вокруг инварианта и владельца","Платформа как продукт для команд"],"distinct":["Высокая частота обмена правками","Отзыв доступа к длительным соединениям"]},"diagrams":[{"title":"Владение важнее числа сервисов","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" rx=\"16\" fill=\"#081b2b\"/\u003e\u003crect x=\"40\" y=\"65\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"185.0\" y=\"106.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eЯдро заказа\u003c/text\u003e\u003crect x=\"430\" y=\"65\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"575.0\" y=\"106.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eПоиск: своя проекция\u003c/text\u003e\u003crect x=\"40\" y=\"285\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"185.0\" y=\"326.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eФинансовый модуль\u003c/text\u003e\u003crect x=\"430\" y=\"285\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"575.0\" y=\"326.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eПлатформа выпуска\u003c/text\u003e\u003cpath d=\"M330 100 L430 100\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"430,100 420.3,105.3 420.3,94.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"90.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eсобытия\u003c/text\u003e\u003cpath d=\"M185 135 L185 285\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"185,285 179.7,275.3 190.3,275.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"185.0\" y=\"200.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eкоманда\u003c/text\u003e\u003cpath d=\"M575 285 L575 135\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"575,135 580.3,144.7 569.7,144.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"575.0\" y=\"200.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eразвёртывание\u003c/text\u003e\u003cpath d=\"M430 320 L330 320\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"330,320 339.7,314.7 339.7,325.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"310.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eобщий путь\u003c/text\u003e\u003ctext x=\"380\" y=\"430\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"17\" fill=\"#dbeafe\"\u003eМодуль расчётов пока остаётся в общем приложении\u003c/text\u003e","caption":"Топология показывает смешанную архитектуру: поиск выделен по профилю изменений и отказов, финансовый инвариант пока локален. Платформа предоставляет механизм выпуска и не владеет смыслом заказа."},{"title":"Управление не должно быть скрытым писателем","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" rx=\"16\" fill=\"#081b2b\"/\u003e\u003crect x=\"20\" y=\"25\" width=\"160\" height=\"52\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"100.0\" y=\"57.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eКоманда\u003c/text\u003e\u003cpath d=\"M100 80 V395\" stroke=\"#45627b\" stroke-dasharray=\"6 6\"/\u003e\u003crect x=\"205\" y=\"25\" width=\"160\" height=\"52\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"285.0\" y=\"57.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eControl plane\u003c/text\u003e\u003cpath d=\"M285 80 V395\" stroke=\"#45627b\" stroke-dasharray=\"6 6\"/\u003e\u003crect x=\"395\" y=\"25\" width=\"160\" height=\"52\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"475.0\" y=\"57.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eData plane\u003c/text\u003e\u003cpath d=\"M475 80 V395\" stroke=\"#45627b\" stroke-dasharray=\"6 6\"/\u003e\u003crect x=\"580\" y=\"25\" width=\"160\" height=\"52\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"660.0\" y=\"57.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eКлиент\u003c/text\u003e\u003cpath d=\"M660 80 V395\" stroke=\"#45627b\" stroke-dasharray=\"6 6\"/\u003e\u003cpath d=\"M100 118 L285 118\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"285,118 275.3,123.3 275.3,112.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"192.5\" y=\"108.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eновая политика v8\u003c/text\u003e\u003cpath d=\"M285 171 L475 171\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"475,171 465.3,176.3 465.3,165.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"161.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eпроверенная конфигурация\u003c/text\u003e\u003cpath d=\"M660 224 L475 224\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"475,224 484.7,218.7 484.7,229.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"567.5\" y=\"214.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eрабочий запрос\u003c/text\u003e\u003cpath d=\"M475 277 L660 277\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"660,277 650.3,282.3 650.3,271.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"567.5\" y=\"267.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eответ по допустимой v8\u003c/text\u003e\u003cpath d=\"M100 330 L285 330\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"285,330 275.3,335.3 275.3,324.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"192.5\" y=\"320.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eследующее изменение\u003c/text\u003e\u003ctext x=\"380\" y=\"432\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"17\" fill=\"#dbeafe\"\u003eПри отказе управления действует политика свежести\u003c/text\u003e","caption":"Последовательность разделяет изменение конфигурации и обслуживание. Продолжение работы по последней версии допустимо только в заранее определённых пределах; чувствительные права могут требовать более свежей проверки."}],"decision":{"prompt":"Что выделять первым из общего приложения?","options":[{"title":"Укрепить модули без нового сервиса","consequence":"Дешёвые вызовы и общий выпуск","tradeoff":"Остаётся общий радиус отказа"},{"title":"Выделить поиск с производным индексом","consequence":"Независимые ресурсы и выпуск","tradeoff":"Добавляются задержка проекции и восстановление"},{"title":"Разделить все контексты сразу","consequence":"Максимальная свобода будущих развёртываний","tradeoff":"Высокая стоимость контрактов и операций до доказательства пользы"}],"recommended":1,"explanation":"Есть измеримые инциденты и отдельный профиль изменений поиска. Для остальных частей пока достаточно модульных границ."},"exercise":{"prompt":"Два сервиса требуют общего релиза и пишут в одну таблицу. Что исследовать?","model":"\u003cp\u003eОпределите владельца инварианта, допустимые способы записи и причины совместных изменений. Сеть уже добавлена, но независимость не возникла; возможно, границу надо перенести или компоненты временно объединить.\u003c/p\u003e","rubric":["Выявлена связанность данных","Предложено исследовать инвариант"]},"checkpoint":[{"question":"Ограниченный контекст обязан быть сервисом?","options":["Да, иначе DDD не работает","Нет, он может быть защищённым модулем","Да, и обязательно с отдельным языком"],"answer":1,"explanation":"Модель и владение определяются раньше механизма развёртывания."},{"question":"Что должно произойти при отказе control plane?","options":["Всегда немедленно остановить все заказы","Следовать заранее определённой политике последней конфигурации и свежести прав","Всегда игнорировать все ограничения"],"answer":1,"explanation":"Допустимость устаревания различается для маршрутов и чувствительных разрешений."}],"sources":[{"title":"DORA: Loosely coupled teams","url":"https://dora.dev/capabilities/loosely-coupled-teams/"},{"title":"DORA: Platform engineering, 2026","url":"https://dora.dev/capabilities/platform-engineering/"},{"title":"Simon Brown: C4 model, официальный сайт","url":"https://c4model.com/"}],"wordCount":1486},{"id":"ch-30","arc":8,"title":"Перенести систему: мост должен выдержать оба берега","briefing":"После выделения поиска команда хочет перенести заказы на новую схему и другую площадку. В отличие от нового сервиса, здесь уже есть работающие клиенты, долгие операции и накопленные данные. Главная задача — управлять переходными состояниями.","goals":["Миграция — последовательность совместимых состояний","Expand: сначала расширить контракт","Migrate: заполнить и догнать изменения","Проверка не сводится к числу строк","Cutover: единственная точка владения записью","Contract и граница отката"],"sections":[{"title":"Миграция — последовательность совместимых состояний","html":"\u003cp\u003eМиграцией называют изменение кода, данных или размещения при сохранении необходимых свойств бизнеса. Готовая новая архитектура — только конец пути. Между старой и новой системами существуют интервалы, когда работают две версии приложения, часть данных уже перенесена, а часть ещё нет. Ошибки обычно возникают именно здесь: отдельные компоненты корректны, но их сочетание не предусмотрено.\u003c/p\u003e\u003cp\u003eСначала составляют матрицу совместимости. Старая программа должна читать расширенную схему; новая — понимать ещё не перенесённые строки; старые клиенты — получать прежний контракт. Для каждого перехода задают наблюдаемое условие готовности и путь остановки. Фраза «перенести ночью» не отвечает, что делать с платежом, начатым до переключения и завершившимся после него.\u003c/p\u003e\u003cp\u003eОтдельно определяют инварианты: единственный владелец записи заказа, отсутствие повторных списаний, сохранение идентификаторов и прав. Некоторые свойства можно временно ослабить, например свежесть поисковой проекции, другие нельзя, например баланс возвратов. Это позволяет не требовать невозможной полной синхронности всего мира, но строго защищать критичные границы. План миграции является частью архитектуры, потому что определяет реально достижимые промежуточные системы.\u003c/p\u003e"},{"title":"Expand: сначала расширить контракт","html":"\u003cp\u003eExpand-migrate-contract означает расширить, перенести и лишь затем удалить старое. Если поле address_text заменяют структурированным адресом, сначала добавляют новые nullable-поля и поддержку чтения обеих форм. Старый код продолжает работать. Изменение не должно сразу вводить требование, которому старые строки не соответствуют. Обязательность и удаление прежней формы приходят позже, после проверки покрытия.\u003c/p\u003e\u003cp\u003eДобавление поля API часто совместимо, но не всегда: строгий потребитель может отвергать неизвестные поля, а сгенерированный клиент — некорректно обрабатывать новое значение enum. Поэтому проверяют реальные контракты и поддержку читателей. Изменение единицы измерения под прежним именем опаснее нового поля: оно выглядит технически совместимым, но меняет смысл. Версия схемы и объяснение семантики важнее формального успешного парсинга.\u003c/p\u003e\u003cp\u003eДля базы учитывают блокировки и объём работы конкретного DDL. Даже простое изменение на большой таблице может ожидать блокировку за длинной транзакцией и задержать последующие запросы. Проверяют поведение используемой версии, ограничивают ожидание и репетируют на сопоставимом размере. Заявление «онлайн-миграция» не означает отсутствия блокировок; оно требует точного описания, какие блокировки возникают и насколько долго допустимо их держать.\u003c/p\u003e"},{"title":"Migrate: заполнить и догнать изменения","html":"\u003cp\u003eПервичное копирование переносит снимок данных, но записи продолжаются. Требуется механизм догонки: журнал изменений, CDC или логическая репликация при подходящих условиях. Важно связать границу снимка с позицией журнала, иначе часть изменений потеряется либо будет применена дважды. Получатель должен обрабатывать повтор и порядок так, чтобы восстановить нужное состояние.\u003c/p\u003e\u003cp\u003eФоновое заполнение, backfill, выполняют ограниченными порциями. Курсор по устойчивому ключу обычно предсказуемее больших OFFSET: смещение заставляет базу снова проходить пропущенные строки и хуже ведёт себя при изменениях. Каждая порция имеет контрольную точку и метрики влияния на рабочую нагрузку. Скорость уменьшают, если растёт задержка заказов или репликационный лаг. Миграция не получает неограниченный приоритет над бизнесом.\u003c/p\u003e\u003cp\u003eДвойная запись из приложения в две базы опасна: первая запись может пройти, вторая — нет. Для перехода предпочтительнее один источник истины и надёжное распространение, например outbox либо управляемая репликация. Если двойная запись всё же необходима, определяют порядок, повтор, обнаружение расхождения и разрешение конфликтов. Нельзя считать два успешных тестовых запроса доказательством атомарности между независимыми хранилищами.\u003c/p\u003e"},{"title":"Проверка не сводится к числу строк","html":"\u003cp\u003eРавное количество строк не означает равенство данных. Проверяют диапазоны ключей, контрольные суммы нормализованных значений, ссылочную целостность и бизнес-инварианты. Нормализация нужна потому, что представление дат, пробелов или порядка JSON-полей может отличаться при одинаковом смысле. Для финансовых сумм сравнение должно быть точным в установленной денежной модели, а не приблизительным числом с плавающей точкой.\u003c/p\u003e\u003cp\u003eТеневое чтение отправляет запрос и в новую систему, но пользователю показывает старый ответ. Сравнение выявляет семантические отличия: другая сортировка, часовой пояс, обработка null или прав. Оно должно учитывать ожидаемую задержку репликации и не объявлять каждое временное расхождение повреждением. При этом допустимый лаг задаётся числом и связан с сценарием пользователя.\u003c/p\u003e\u003cp\u003eЛогическая репликация PostgreSQL имеет конкретные ограничения. В документации PostgreSQL 18 указано, что DDL и состояния sequence не переносятся автоматически вместе с табличными данными. Следовательно, перед переключением записи отдельно сверяют схему и выставляют безопасное значение последовательностей. Это не общая гарантия любого механизма переноса и не повод считать миграцию завершённой после нулевого лага. Триггеры, расширения и другие особенности также требуют отдельного инвентаря.\u003c/p\u003e"},{"title":"Cutover: единственная точка владения записью","html":"\u003cp\u003eCutover — переключение рабочего трафика и ответственности. Если обе площадки принимают запись без согласованного протокола, появляется split brain: один заказ получает несовместимые изменения. Перед передачей владения старую запись ограждают, дожидаются завершения или разрешения активных операций, фиксируют последнюю позицию и убеждаются, что новая сторона её применила. Переключение DNS само по себе не запрещает старым соединениям продолжать писать.\u003c/p\u003e\u003cp\u003eПотребители очередей, cron-задачи, webhooks и административные скрипты также являются писателями. Их забывают чаще, чем основной API. Список включает все каналы изменения, а ограждение должно работать на уровне, который они не могут обойти. Приложение может использовать эпоху владения или другой проверяемый токен; точная реализация зависит от хранения и модели отказов.\u003c/p\u003e\u003cp\u003eДля некоторых систем допустима короткая пауза записи и ясный экран повторной попытки. Она часто безопаснее сложной иллюзии непрерывности. Если пауза неприемлема, стоимость протокола повышается и это нужно обосновать требованиями. После переключения наблюдают задержку, ошибки, конфликты идентификаторов и бизнес-итоги, а не только зелёные проверки доступности. Первые успешные чтения ещё не доказывают правильность новых записей.\u003c/p\u003e"},{"title":"Contract и граница отката","html":"\u003cp\u003eУдаление старых полей и кода выполняют после подтверждения, что потребители перешли, данные заполнены и завершён период наблюдения. Устаревшие мобильные клиенты могут жить неделями, поэтому контракт не закрывают по календарю одного релиза. Наблюдение использования старой формы и политика прекращения поддержки позволяют принять обоснованное решение. Временная совместимость имеет стоимость, но преждевременное удаление создаёт скрытый отказ.\u003c/p\u003e\u003cp\u003eОткат приложения и откат данных — разные операции. Пока новая программа только читала старый формат, возврат прост. После записи новой информации, которую старая программа не понимает, возврат бинарного файла может стать опасным. Это граница отката. Её отмечают заранее и выбирают стратегию: поддерживать обратный перевод, сохранять совместимый формат или после границы исправлять вперёд.\u003c/p\u003e\u003cp\u003eРезервная копия не является мгновенным безопасным откатом, если после неё появились реальные заказы и платежи. Восстановление потеряет изменения, а внешние эффекты останутся. Поэтому план содержит RPO, допустимую потерю данных, RTO, время восстановления, и процедуру сверки внешнего мира. Репетиция подтверждает время и последовательность действий. Архитектор обязан уметь объяснить, что именно можно вернуть, до какого момента и какой ценой.\u003c/p\u003e\u003cp\u003eВо время длительного переноса есть ещё риск накопления журнала изменений. Если получатель отстаёт, источник может удерживать всё больше данных, необходимых для догонки, и исчерпать диск. Поэтому наблюдают не только время отставания, но и объём удержанного журнала, скорость его роста и оставшийся запас. План содержит порог остановки backfill и действие при невозможности догнать поток. Повторное начальное копирование иногда безопаснее бесконечной попытки спасти отставший экземпляр. Также задают владельца решения остановить переключение: давление календарного срока не должно отменять заранее выбранные критерии целостности. Неуспешная репетиция полезнее формально выполненного cutover с неизвестным состоянием данных.\u003c/p\u003e"}],"workedExample":{"title":"Перенос заказов с учебной паузой в сорок секунд","html":"\u003cp\u003eВ новой базе подготовлены схема, роли и индексы. Старое приложение остаётся единственным писателем. Команда копирует 12 миллионов учебных заказов порциями по 5 000, сохраняя курсор. Изменения после границы снимка поступают через логическую репликацию. Во время пика скорость backfill снижают, поскольку p95 чтения вырос с 90 до 140 миллисекунд; предел пилота задан 160. Это управление воздействием, а не гонка за максимальной скоростью копирования.\u003c/p\u003e\u003cp\u003eПосле копирования сверяют число заказов по дням, суммы по валютам, контрольные суммы диапазонов и наборы статусов. Теневые чтения обнаруживают, что новая сортировка по времени не определяет порядок одинаковых значений. Добавляют идентификатор вторым ключом, чтобы страницы не дублировались. Ещё один тест показывает отсутствие нужного значения sequence: табличные идентификаторы скопированы, но генератор новых ключей не продвинут. Его исправляют до переключения.\u003c/p\u003e\u003cp\u003eВ согласованное окно шлюз приостанавливает новые изменения и возвращает контролируемый повтор. Останавливаются фоновые писатели и приём изменяющих webhooks в обработку; входящие события остаются в надёжном буфере. Завершаются активные транзакции, фиксируется позиция журнала, новая база догоняет её. Старые права записи отзываются, назначается новая эпоха владельца, новый сервис получает запись. Пауза занимает учебные сорок секунд, но это результат репетиции, а не обещание любой системе.\u003c/p\u003e\u003cp\u003eПосле первой записи нового формата простое возвращение старого приложения запрещено. В плане это явная граница: дальше либо проверенный обратный перенос, либо исправление вперёд. Команда сохраняет исходную базу только для чтения, наблюдает новые заказы и сверяет платежи. Удаление старого адресного поля отложено до подтверждения совместимости клиентов. Успех миграции означает не факт переключения, а сохранённые инварианты и проверенный эксплуатационный путь.\u003c/p\u003e"},"expedition":{"world":"search","title":"Экспедиция: перенос поиска каталога","html":"\u003cp\u003eДля поискового индекса стратегия мягче, чем для транзакционной базы. Источник истины каталога остаётся прежним, а новый индекс можно построить заново. Переносится дисциплина версий, теневого чтения и наблюдаемого переключения, но нет необходимости делать индекс единственным владельцем бизнес-записи. Это важное различие: производную структуру допустимо пересоздать, финансовый журнал нельзя заменить приблизительной копией.\u003c/p\u003e\u003cp\u003eКоманда строит новый индекс параллельно, догоняет события и сравнивает релевантность на запросах, фильтры арендатора, удаление товара и сортировку. Количество документов может совпасть при неправильной токенизации или забытом ограничении прав. Поэтому проверка включает пользовательские результаты, а не только контрольную сумму. Новая embedding-модель также требует собственного пространства векторов и повторной оценки.\u003c/p\u003e\u003cp\u003eПереключают псевдоним индекса или маршрут запросов небольшой группе. Откат чтения прост, пока старый индекс продолжает получать изменения и поддерживает актуальные права. Если его перестали обновлять неделю назад, кнопка возврата вернёт устаревшие товары. Таким образом, даже у производного контура есть условие безопасного отката: пригодный запасной экземпляр, известная свежесть и совместимый контракт выдачи.\u003c/p\u003e","transfer":["Совместимые состояния и теневое сравнение","Условия безопасного отката"],"distinct":["Индекс производен и пересоздаваем","Релевантность требует отдельной оценки"]},"diagrams":[{"title":"Переходная совместимость адреса","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" rx=\"16\" fill=\"#081b2b\"/\u003e\u003crect x=\"40.0\" y=\"65\" width=\"166.0\" height=\"55\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"123.0\" y=\"98.5\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eЭтап\u003c/text\u003e\u003crect x=\"210.0\" y=\"65\" width=\"166.0\" height=\"55\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"293.0\" y=\"98.5\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eСтарое поле\u003c/text\u003e\u003crect x=\"380.0\" y=\"65\" width=\"166.0\" height=\"55\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"463.0\" y=\"98.5\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eНовое поле\u003c/text\u003e\u003crect x=\"550.0\" y=\"65\" width=\"166.0\" height=\"55\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"633.0\" y=\"98.5\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eЧитатели\u003c/text\u003e\u003crect x=\"40.0\" y=\"135\" width=\"166.0\" height=\"54\" rx=\"12\" fill=\"#173548\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"123.0\" y=\"168.0\" text-anchor=\ ns-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eобе версии\u003c/text\u003e\u003crect x=\"40.0\" y=\"267\" width=\"166.0\" height=\"54\" rx=\"12\" fill=\"#173548\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"123.0\" y=\"300.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eContract\u003c/text\u003e\u003crect x=\"210.0\" y=\"267\" width=\"166.0\" height=\"54\" rx=\"12\" fill=\"#173548\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"293.0\" y=\"300.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eудаляется\u003c/text\u003e\u003crect x=\"380.0\" y=\"267\" width=\"166.0\" height=\"54\" rx=\"12\" fill=\"#173548\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"463.0\" y=\"300.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eобязательно\u003c/text\u003e\u003crect x=\"550.0\" y=\"267\" width=\"166.0\" height=\"54\" rx=\"12\" fill=\"#173548\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"633.0\" y=\"300.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eтолько новые\u003c/text\u003e\u003ctext x=\"380\" y=\"423\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"17\" fill=\"#dbeafe\"\u003eУдаление следует после подтверждения перехода\u003c/text\u003e","caption":"Раскладка показывает промежуточные состояния expand-migrate-contract. Заполнение данных и совместимость потребителей проверяются отдельно; наличие нового поля ещё не разрешает удаление старого."},{"title":"Передача владения записью","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" rx=\"16\" fill=\"#081b2b\"/\u003e\u003cpath d=\"M90 85 V385\" stroke=\"#60a5fa\" stroke-width=\"3\"/\u003e\u003ccircle cx=\"90\" cy=\"95\" r=\"7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"68\" y=\"101\" text-anchor=\"end\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003et0\u003c/text\u003e\u003crect x=\"120\" y=\"70\" width=\"590\" height=\"54\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"415.0\" y=\"103.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eСтарый владелец пишет\u003c/text\u003e\u003ctext x=\"415\" y=\"148\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#a5b4cc\"\u003eНовая база копирует и догоняет\u003c/text\u003e\u003ccircle cx=\"90\" cy=\"175\" r=\"7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"68\" y=\"181\" text-anchor=\"end\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003et1\u003c/text\u003e\u003crect x=\"120\" y=\"150\" width=\"590\" height=\"54\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"415.0\" y=\"183.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eПисатели приостановлены\u003c/text\u003e\u003ctext x=\"415\" y=\"228\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#a5b4cc\"\u003eЗавершены активные операции\u003c/text\u003e\u003ccircle cx=\"90\" cy=\"255\" r=\"7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"68\" y=\"261\" text-anchor=\"end\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003et2\u003c/text\u003e\u003crect x=\"120\" y=\"230\" width=\"590\" height=\"54\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"415.0\" y=\"263.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eПоследняя позиция применена\u003c/text\u003e\u003ctext x=\"415\" y=\"308\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#a5b4cc\"\u003eСтарые права записи ограждены\u003c/text\u003e\u003ccircle cx=\"90\" cy=\"335\" r=\"7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"68\" y=\"341\" text-anchor=\"end\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003et3\u003c/text\u003e\u003crect x=\"120\" y=\"310\" width=\"590\" height=\"54\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"415.0\" y=\"343.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eНовая сторона принимает запись\u003c/text\u003e\u003ctext x=\"415\" y=\"388\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#a5b4cc\"\u003eНовый формат может закрыть простой откат\u003c/text\u003e\u003ctext x=\"380\" y=\"445\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eПереключение маршрута не равно ограждению писателя\u003c/text\u003e","caption":"Линия переключения делает явной границу владения. Нужны все каналы записи, включая фоновые задания. После несовместимой новой записи возврат старого бинарного файла может быть небезопасным."}],"decision":{"prompt":"Как передать запись заказов новой площадке?","options":[{"title":"Короткая пауза и единственный новый писатель","consequence":"Ясная граница владения","tradeoff":"Нужны буферизация и допустимость паузы"},{"title":"Постепенная передача по арендаторам","consequence":"Меньший радиус воздействия","tradeoff":"Сложнее маршрутизация и общие операции"},{"title":"Двусторонняя активная запись с разрешением конфликтов","consequence":"Минимум паузы при подходящей модели","tradeoff":"Существенно сложнее; не все инварианты допускают слияние"}],"recommended":0,"explanation":"Для текущего объёма репетиция показала приемлемую паузу. Усложнение до активной записи в двух местах не оправдано требованиями."},"exercise":{"prompt":"Почему резервная копия вчерашней базы не решает откат после сегодняшних оплат?","model":"\u003cp\u003eВ копии нет новых заказов, но внешние платежи уже существуют. Нужны восстановление с журналом, сверка эффектов и определённый предел потери данных; возврат одной базы нарушит согласованность бизнеса.\u003c/p\u003e","rubric":["Учтены внешние эффекты","Различены код и данные"]},"checkpoint":[{"question":"Что переносит логическая репликация PostgreSQL18 автоматически?","options":["Любые DDL и sequence","Табличные данные в поддерживаемых условиях, но не все объекты и состояния","Полную среду вместе с приложением"],"answer":1,"explanation":"Схему, sequence и другие ограничения проверяют отдельно по версии."},{"question":"Когда удалять старое поле?","options":["В первом релизе нового кода","После подтверждения перехода потребителей и заполнения данных","Сразу после добавления нового nullable-поля"],"answer":1,"explanation":"Contract завершает переход, а не начинает его."}],"sources":[{"title":"PostgreSQL 18: Logical Replication — Restrictions","url":"https://www.postgresql.org/docs/18/logical-replication-restrictions.html"},{"title":"PostgreSQL 18: Logical Replication","url":"https://www.postgresql.org/docs/18/logical-replication.html"}],"wordCount":1487},{"id":"ch-31","arc":8,"title":"Проверить доверие: от модели угроз до живой документации","briefing":"Миграция показала, что скрытые писатели и устаревшие контракты опаснее красивой схемы. Перед следующим расширением «Северный маршрут» связывает безопасность, приватность, поставку кода и наблюдение в проверяемую картину.","goals":["Модель угроз начинается с ценного действия","Приватность — весь путь данных","Цепочка поставки: от исходника до запущенных байтов","Наблюдение отвечает на конкретные вопросы","Аудит отличается от отладки","Документация как интерфейс эксплуатации"],"sections":[{"title":"Модель угроз начинается с ценного действия","html":"\u003cp\u003eМодель угроз описывает, что защищаем, от кого и при каких предположениях. Активами являются не только база клиентов, но и право вернуть деньги, изменить адрес, выпустить код и отозвать доступ. Угрозы рассматривают на потоках данных и границах доверия: браузер, API, очередь, платёжный партнёр, административная платформа. Один сервер может содержать несколько границ, а два сервиса внутри одной сети не становятся взаимно доверенными автоматически.\u003c/p\u003e\u003cp\u003eДля каждого потока задают личность вызывающего, проверку полномочий, целостность сообщения и допустимую повторяемость. Например, webhook с корректным JSON ещё не является сообщением платёжного провайдера. Нужны проверка происхождения по контракту, защита от повторного эффекта и сопоставление с ожидаемой операцией. Сетевая изоляция уменьшает поверхность, но не исправляет ошибку объектной авторизации в API.\u003c/p\u003e\u003cp\u003eFailure model формулируют конкретно: похищена сессия оператора, скомпрометирован партнёр, подменён пакет сборки, потерян регион или задержано применение отзыва прав. Нельзя одновременно предположить, что злоумышленник полностью управляет доверенной инфраструктурой, и обещать абсолютную защиту её ключами. Честная модель указывает доверенные компоненты и остаточный риск. Это помогает выбрать проверку, способную остановить реальный сценарий, а не собрать длинный общий список.\u003c/p\u003e"},{"title":"Приватность — весь путь данных","html":"\u003cp\u003eМинимизация означает собирать и передавать сведения, необходимые для определённой цели. Курьеру нужен адрес активной доставки, исследователю времени пути часто достаточно агрегированных координат. Один и тот же набор данных не должен автоматически копироваться во все аналитические и AI-контуры. Для каждого получателя определяют цель, срок хранения, область доступа и возможные производные копии.\u003c/p\u003e\u003cp\u003eПсевдонимизация заменяет прямой идентификатор на косвенный, но связь может восстановиться через таблицу соответствия или сочетание признаков. Это снижает некоторые риски, не делая набор гарантированно анонимным. Точные маршруты и редкие события способны выделить человека без имени. Поэтому оценка включает детализацию, доступ к сопоставлению и возможность повторной идентификации, а не только наличие поля phone.\u003c/p\u003e\u003cp\u003eУдаление требует карты происхождения данных: исходная таблица, поисковый индекс, кэш, объектное хранилище, логи, резервные копии и наборы оценки. Для резервных копий часто нужен регламент истечения и запрет повторного появления удалённого объекта при восстановлении. Технические меры не доказывают юридическое соответствие. Применимые основания обработки, сроки и обязательства требуют отдельной проверки специалистами, а архитектура предоставляет им достоверный путь данных.\u003c/p\u003e"},{"title":"Цепочка поставки: от исходника до запущенных байтов","html":"\u003cp\u003eSupply chain, цепочка поставки программного обеспечения, включает зависимости, исходный код, сборочную среду, артефакт и развёртывание. Проверенный pull request не гарантирует, что production запустил именно его: между ними могут быть подмена зависимости, непроверенная сборка или изменяемый тег образа. Поэтому приложение идентифицируют неизменяемым digest, а сведения о происхождении связывают с конкретным артефактом.\u003c/p\u003e\u003cp\u003eProvenance описывает, кем и из чего получен артефакт. Подпись позволяет проверить целостность утверждения и доверенного подписанта, но не означает отсутствие уязвимостей в коде. Если доверенный сборщик скомпрометирован, подпись сама по себе не спасает. SLSA задаёт уровни и требования для последовательного укрепления цепочки; объявлять уровень можно только после проверки всех применимых требований выбранной версии и track.\u003c/p\u003e\u003cp\u003eВ «Северном маршруте» развёртывание проверяет digest, происхождение из разрешённого сборщика и правила допуска. Список компонентов помогает реагировать на уязвимость зависимости, но перечень пакетов без связи с работающими версиями мало полезен. Секреты сборки ограничены по времени и задаче. Изолированная воспроизводимая сборка уменьшает риск, однако не отменяет проверку приложения, конфигурации и миграций данных.\u003c/p\u003e"},{"title":"Наблюдение отвечает на конкретные вопросы","html":"\u003cp\u003eМетрики показывают тенденции и позволяют быстро обнаружить отклонение. Логи содержат дискретные события. Трассы связывают шаги одного запроса через компоненты. Ни один вид не заменяет остальные: средняя задержка не объясняет конкретный двойной возврат, а миллионы строк логов не дают удобного сигнала о росте отказов. Инструментирование начинают с вопросов: что произошло с заказом, кто разрешил действие и где потерялось время.\u003c/p\u003e\u003cp\u003eCorrelation ID объединяет технический путь, business operation ID — одну логическую операцию через повторы. Их различают: новая HTTP-попытка может иметь новый trace, но прежний ключ возврата. Иначе расследование посчитает повторы разными бизнес-действиями. Для очередей контекст передают осторожно, сохраняя происхождение и не доверяя пользовательскому идентификатору как доказательству полномочий.\u003c/p\u003e\u003cp\u003eНаблюдение само создаёт риски. Полные тела запросов содержат адреса, токены и документы; неограниченные метки создают высокую кардинальность и дорогой мониторинг. Секреты редактируют до записи, доступ к диагностике ограничивают, сроки хранения определяют отдельно. При семплировании трасс важно сохранять ошибки и редкие критичные сценарии. Отсутствие трассы в выборке не является доказательством отсутствия события.\u003c/p\u003e"},{"title":"Аудит отличается от отладки","html":"\u003cp\u003eАудит отвечает, кто и на каком основании совершил значимое действие. Запись содержит субъект, объект, время, тип действия, решение политики и результат. Для возврата полезны идентификатор подтверждения и сумма, а не полный разговор с помощником. Аудит должен выдерживать проверку целостности и ограничение доступа; обычный разработчик не получает возможность бесследно удалить неудобную запись.\u003c/p\u003e\u003cp\u003eНеизменяемость требует точной модели. Запрет UPDATE в приложении не защищает от администратора базы с широкими правами. Отдельное хранение, ограниченные роли, внешнее закрепление контрольных значений или специальные режимы хранения усиливают защиту при соответствующих предположениях. Абсолютное обещание «журнал нельзя изменить» заменяют описанием, какие изменения предотвращаются и какие обнаруживаются.\u003c/p\u003e\u003cp\u003eСобытие аудита нельзя терять молча после успешной финансовой операции. В зависимости от требований запись связывают с доменной транзакцией через outbox или другой надёжный механизм. Если аудит временно недоступен, политика определяет, какие операции приостанавливаются, а какие допускают буферизацию. Универсальное «продолжать всегда» и «останавливать всё» одинаково плохо без анализа последствий для конкретного действия.\u003c/p\u003e"},{"title":"Документация как интерфейс эксплуатации","html":"\u003cp\u003eДокументация нужна разным читателям. Контекстная схема показывает пользователей и внешние системы. Схема контейнеров объясняет исполняемые части и хранилища. Динамическая схема раскрывает важный сценарий, а схема развёртывания — размещение и отказ. C4 предлагает уровни абстракции, позволяющие не смешивать бизнес-окружение и отдельные классы в одном рисунке. Каждый рисунок имеет область, дату и владельца.\u003c/p\u003e\u003cp\u003eADR фиксирует мотивы выбора. Контракт описывает входы, версии и ошибки. Runbook задаёт наблюдаемый сигнал, проверку причины, безопасное действие и критерий восстановления. Для миграции отдельно нужна граница отката. Если документация говорит «перезапустить сервис», она должна объяснять, как убедиться, что повтор не создаст финансовый эффект. Исполнимые примеры и ссылки на текущие панели полезнее длинного списка названий технологий.\u003c/p\u003e\u003cp\u003eАктуальность проверяется при изменении соответствующего механизма и на учениях. Новый дежурный должен суметь восстановить тестовый индекс по инструкции, не обращаясь к автору. Провал учения — обнаруженный дефект системы, а не вина читателя. Общая карта связывает актив, поток, угрозу, контроль, наблюдение и инструкцию. Так безопасность становится проверяемым поведением, а документация — рабочим средством изменения и восстановления.\u003c/p\u003e\u003cp\u003eНабор доказательств удобно хранить рядом с решением: проверяемый контракт, сценарий теста, результат последнего учения и ссылка на владельца. Это не означает копирование секретов в архитектурный документ. Достаточно указать, где уполномоченный проверяющий увидит подтверждение. Для каждого контроля различают наличие, корректную настройку и реальное применение. Например, проверка provenance может существовать в платформе, но быть выключенной для аварийного пути выпуска. Такой обход должен иметь ограниченные полномочия, аудит и последующую проверку, иначе именно он станет постоянным способом работы. Документация обязана описывать исключения столь же честно, как основной путь, поскольку инциденты часто развиваются там, где привычная гарантия перестаёт действовать.\u003c/p\u003e"}],"workedExample":{"title":"Поддельная сборка и настоящий платёж","html":"\u003cp\u003eУчебный инцидент начинается с изменяемого тега release-latest. Одобренный код был собран утром, но вечером тег указывает на другой образ. Сервис запускается и работает достаточно правдоподобно, чтобы обычная проверка доступности оставалась зелёной. В новой политике развёртывания платформа принимает только точный digest, связанный с утверждённой заявкой, и проверяет provenance разрешённого сборщика. Подмена тега больше не меняет выбранные байты.\u003c/p\u003e\u003cp\u003eОднако это не доказывает безопасности самого кода. Отдельный сценарий проверяет объектную авторизацию: оператор арендатора A подставляет идентификатор заказа B. API отклоняет запрос на уровне доменного сервиса, а аудит записывает субъект и отказ без раскрытия адреса заказа B. Сетевая принадлежность внутреннему шлюзу не даёт автоматического права. Для помощника действует та же проверка, даже если он получил идентификатор из найденного документа.\u003c/p\u003e\u003cp\u003eЗатем имитируют таймаут возврата. По business operation ID видно один одобренный возврат, две технические попытки и один внешний эффект. Трасса первой попытки неполна из-за семплирования, но доменный журнал и сверка подтверждают результат. Если бы расследование опиралось только на трассы, отсутствие финального span могло бы быть ошибочно принято за неуспех. Runbook прямо запрещает создавать новый возврат до проверки статуса прежнего.\u003c/p\u003e\u003cp\u003eНаконец, запрос на удаление клиента проходит по карте данных. Из активной базы и индекса удаление выполнено, но в диагностическом логе найден полный адрес. Это дефект минимизации, исправляемый редактированием до записи и сроком удержания. Команда не объявляет соответствие закону после закрытия одного дефекта: она фиксирует проверенный технический результат и передаёт доказательства ответственным за применимые требования.\u003c/p\u003e"},"expedition":{"world":"telemetry","title":"Экспедиция: телеметрия промышленного оборудования","html":"\u003cp\u003eВ промышленной телеметрии ценным активом становится не только информация, но и право изменить режим оборудования. Переносится карта потоков и границ доверия: датчик, шлюз, центральное хранилище и панель оператора. Показание может быть подделано или повторено; корректная подпись устройства не доказывает физическую правдивость измерения, если датчик повреждён.\u003c/p\u003e\u003cp\u003eНаблюдение разделяет отсутствие связи, выход измерения за диапазон и подтверждённый аварийный режим. Пропуск пакета не равен нулевой температуре. Для команд управления нужна отдельная авторизация, защита от устаревания и локальные ограничения. Облачная панель не должна становиться единственным механизмом безопасности физического процесса. Конкретные защитные требования определяются инженерами предметной области и применимыми нормами.\u003c/p\u003e\u003cp\u003eДокументация включает поведение при потере связи и восстановлении буфера событий. Аудит связывает команду с человеком, устройством и версией конфигурации. Если шлюз воспроизводит накопленные данные после простоя, журнал должен отличать время измерения от времени приёма. Так переносится дисциплина доверия, но модель отказов расширяется физическим миром, где достоверность данных и безопасность действия нельзя свести к успешному HTTP-ответу.\u003c/p\u003e","transfer":["Потоки, границы и модель угроз","Наблюдение не заменяет аудит"],"distinct":["Физическая правдивость показания","Локальная безопасность при потере связи"]},"diagrams":[{"title":"Доверие к поставке — цепочка проверок","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" rx=\"16\" fill=\"#081b2b\"/\u003e\u003crect x=\"20\" y=\"25\" width=\"160\" height=\"52\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"100.0\" y=\"57.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eИсходники\u003c/text\u003e\u003cpath d=\"M100 80 V395\" stroke=\"#45627b\" stroke-dasharray=\"6 6\"/\u003e\u003crect x=\"205\" y=\"25\" width=\"160\" height=\"52\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"285.0\" y=\"57.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eСборщик\u003c/text\u003e\u003cpath d=\"M285 80 V395\" stroke=\"#45627b\" stroke-dasharray=\"6 6\"/\u003e\u003crect x=\"395\" y=\"25\" width=\"160\" height=\"52\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"475.0\" y=\"57.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eРеестр\u003c/text\u003e\u003cpath d=\"M475 80 V395\" stroke=\"#45627b\" stroke-dasharray=\"6 6\"/\u003e\u003crect x=\"580\" y=\"25\" width=\"160\" height=\"52\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"660.0\" y=\"57.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eПлатформа\u003c/text\u003e\u003cpath d=\"M660 80 V395\" stroke=\"#45627b\" stroke-dasharray=\"6 6\"/\u003e\u003cpath d=\"M100 118 L285 118\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"285,118 275.3,123.3 275.3,112.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"192.5\" y=\"108.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eпроверенная ревизия\u003c/text\u003e\u003cpath d=\"M285 171 L475 171\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"475,171 465.3,176.3 465.3,165.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"161.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eартефакт + provenance\u003c/text\u003e\u003cpath d=\"M475 224 L660 224\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"660,224 650.3,229.3 650.3,218.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"567.5\" y=\"214.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003edigest + свидетельство\u003c/text\u003e\u003cpath d=\"M660 277 L475 277\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"475,277 484.7,271.7 484.7,282.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"567.5\" y=\"267.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eпроверить происхождение\u003c/text\u003e\u003ctext x=\"380\" y=\"432\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"17\" fill=\"#dbeafe\"\u003eПодпись происхождения не доказывает отсутствие ошибок\u003c/text\u003e","caption":"Последовательность раскрывает проверяемую связь исходников и запускаемых байтов. Платформа доверяет только определённым сборщикам и проверяет digest; безопасность кода и миграций остаётся отдельной задачей."},{"title":"Операция и попытки — разные идентификаторы","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" rx=\"16\" fill=\"#081b2b\"/\u003e\u003crect x=\"40.0\" y=\"65\" width=\"222.66666666666666\" height=\"55\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"151.33333333333331\" y=\"98.5\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eСлой\u003c/text\u003e\u003crect x=\"266.66666666666663\" y=\"65\" width=\"222.66666666666666\" height=\"55\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"377.99999999999994\" y=\"98.5\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eИдентификатор\u003c/text\u003e\u003crect x=\"493.3333333333333\" y=\"65\" width=\"222.66666666666666\" height=\"55\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"604.6666666666666\" y=\"98.5\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eСмысл\u003c/text\u003e\u003crect x=\"40.0\" y=\"135\" width=\"222.66666666666666\" height=\"54\" rx=\"12\" fill=\"#173548\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"151.33333333333331\" y=\"168.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eБизнес\u003c/text\u003e\u003crect x=\"266.66666666666663\" y=\"135\" width=\"222.66666666666666\" height=\"54\" rx=\"12\" fill=\"#173548\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"377.99999999999994\" y=\"168.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eR-81\u003c/text\u003e\u003crect x=\"493.3333333333333\" y=\"135\" width=\"222.66666666666666\" height=\"54\" rx=\"12\" fill=\"#173548\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"604.6666666666666\" y=\"168.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eодин возврат\u003c/text\u003e\u003crect x=\"40.0\" y=\"201\" width=\"222.66666666666666\" height=\"54\" rx=\"12\" fill=\"#102b37\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"151.33333333333331\" y=\"234.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eHTTP\u003c/text\u003e\u003crect x=\"266.66666666666663\" y=\"201\" width=\"222.66666666666666\" height=\"54\" rx=\"12\" fill=\"#102b37\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"377.99999999999994\" y=\"234.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003etrace-A\u003c/text\u003e\u003crect x=\"493.3333333333333\" y=\"201\" width=\"222.66666666666666\" height=\"54\" rx=\"12\" fill=\"#102b37\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"604.6666666666666\" y=\"234.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eпервая попытка\u003c/text\u003e\u003crect x=\"40.0\" y=\"267\" width=\"222.66666666666666\" height=\"54\" rx=\"12\" fill=\"#173548\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"151.33333333333331\" y=\"300.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eHTTP\u003c/text\u003e\u003crect x=\"266.66666666666663\" y=\"267\" width=\"222.66666666666666\" height=\"54\" rx=\"12\" fill=\"#173548\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"377.99999999999994\" y=\"300.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003etrace-B\u003c/text\u003e\u003crect x=\"493.3333333333333\" y=\"267\" width=\"222.66666666666666\" height=\"54\" rx=\"12\" fill=\"#173548\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"604.6666666666666\" y=\"300.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eповтор R-81\u003c/text\u003e\u003ctext x=\"380\" y=\"423\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"17\" fill=\"#dbeafe\"\u003eАудит и сверка не зависят от полноты семплированной трассы\u003c/text\u003e","caption":"Раскладка предотвращает смешение технических попыток и бизнес-эффектов. Два trace не доказывают два возврата, а отсутствие trace не доказывает отсутствие операции. Доменный журнал фиксирует результат независимо."}],"decision":{"prompt":"Что проверить перед расширением прав платформы?","options":[{"title":"Аудит потоков и минимальные права","consequence":"Контроли связаны с реальными действиями","tradeoff":"Требует инвентаря писателей и владельцев"},{"title":"Сначала купить единый защитный продукт","consequence":"Быстрое покрытие типовых сигналов","tradeoff":"Без модели угроз останутся неизвестные пробелы"},{"title":"Ограничить расширение до следующего релиза","consequence":"Меньше краткосрочного риска","tradeoff":"Задержка полезных изменений и сохранение ручных обходов"}],"recommended":0,"explanation":"Уже обнаружены скрытые писатели и AI-инструменты. Карта полномочий определяет необходимые проверки и место их исполнения."},"exercise":{"prompt":"Чем подписанный образ отличается от безопасного приложения?","model":"\u003cp\u003eПодпись и provenance помогают установить целостность и происхождение при доверии к ключам и сборщику. Они не доказывают отсутствие уязвимостей, правильность прав или совместимость миграции.\u003c/p\u003e","rubric":["Названы условия доверия","Не обещана полная безопасность"]},"checkpoint":[{"question":"Можно считать отсутствие trace доказательством отсутствия операции?","options":["Да, если панель зелёная","Нет, трассы могут семплироваться или теряться","Да, если операция финансовая"],"answer":1,"explanation":"Доменный журнал и сверка имеют отдельную роль."},{"question":"Псевдонимизация гарантирует анонимность?","options":["Да, если убрано имя","Нет, сочетание признаков и таблица соответствия могут восстановить связь","Да, если идентификатор случайный"],"answer":1,"explanation":"Оценивают возможность повторной идентификации и доступ к сопоставлению."}],"sources":[{"title":"SLSA specification v1.2: tracks, provenance and verification","url":"https://slsa.dev/spec/v1.2/"},{"title":"NIST AI RMF: добровольное управление риском","url":"https://www.nist.gov/itl/ai-risk-management-framework"},{"title":"C4 model: уровни и типы схем","url":"https://c4model.com/"}],"wordCount":1468},{"id":"ch-32","arc":8,"title":"Архитектурный совет: защитить целое, а не коллекцию технологий","briefing":"«Северный маршрут» прошёл от первого заказа до нескольких регионов, аналитики, ML и платформы. Совет должен выбрать следующий шаг. Защита архитектуры связывает обещание клиенту, механизм, отказ, стоимость и путь изменения в одну проверяемую историю.","goals":["Сначала сценарий качества, затем компонент","Цельная карта: факт, производная копия, действие","Бюджет отказа распределяется по зависимостям","Альтернативы должны быть жизнеспособны","Эволюционный план сохраняет работающий бизнес","Перенос знания в незнакомый бизнес"],"sections":[{"title":"Сначала сценарий качества, затем компонент","html":"\u003cp\u003eАрхитектурная защита начинается с того, что система должна сделать в конкретных условиях. «Быстро, безопасно и масштабируемо» нельзя проверить. Сценарий качества задаёт источник воздействия, само воздействие, окружение, затронутую часть, ожидаемую реакцию и измерение. Например: во время вечернего пика партнёр не отвечает двадцать секунд; оформление сохраняет принятый заказ, показывает неопределённость платежа и не списывает повторно при повторе пользователя.\u003c/p\u003e\u003cp\u003eТакой сценарий заставляет раскрыть механизм. Принятый заказ требует устойчивой записи, неопределённый платёж — состояния и сверки, отсутствие повторного списания — ключа операции и контракта провайдера. Нельзя удовлетворить сценарий одной надписью «Kafka» или «multi-region». Компонент становится частью аргумента только вместе с условиями, при которых он выполняет нужное свойство.\u003c/p\u003e\u003cp\u003eДля совета выбирают несколько наиболее важных сценариев, а не все возможные бедствия. Они отражают цель следующего периода: расширение региона, ограничение стоимости и безопасная работа помощника. Подход SEI к анализу архитектурных компромиссов полезен именно связью качества и решений. Учебная защита здесь не объявляется полноценной формальной ATAM-оценкой: она использует сценарное мышление без обещания заменить специализированную процедуру.\u003c/p\u003e"},{"title":"Цельная карта: факт, производная копия, действие","html":"\u003cp\u003eНа общей карте выделяют владельцев фактов. Заказ и его обещание находятся в транзакционном ядре, финансовый эффект — в журнале расчётов и внешней сверке. Поиск, аналитика и признаки ML являются производными представлениями. Они могут отставать и пересоздаваться в заданных пределах. Помощник читает разрешённые документы и предлагает действия, но не становится владельцем истины о деньгах или правах.\u003c/p\u003e\u003cp\u003eКаждая стрелка получает смысл: синхронная команда, событие, поток изменений или пакетный перенос. Для неё известны повторяемость, порядок, задержка и авторизация. Если событие доставлено повторно, получатель не должен создавать вторую бизнес-операцию. Если оно пришло поздно, проекция не должна бесконтрольно возвращать старый статус. Упрощённый рисунок допустим, если ограничения записаны рядом и важные пути раскрыты отдельными схемами.\u003c/p\u003e\u003cp\u003eЗатем проходят один заказ насквозь: создание, резерв, платёж, назначение, доставка, уведомление, отчёт и возможный возврат. В каждой точке задают, что пользователь уже считает обещанным и чем это подтверждено. Это обнаруживает разрывы между командами. Успешная локальная транзакция не означает завершённый внешний платёж, а обработанное событие не означает прочитанное клиентом уведомление. Архитектура должна называть такие границы без красивых двусмысленностей.\u003c/p\u003e"},{"title":"Бюджет отказа распределяется по зависимостям","html":"\u003cp\u003eПользовательский путь зависит от нескольких частей. При обязательной последовательной зависимости отказ любой из них может сорвать результат. Простое умножение доступностей применимо лишь при сильных предположениях о независимости; общая сеть, конфигурация и площадка создают коррелированные отказы. Поэтому совет рассматривает реальные общие причины, а не только арифметику отдельных SLA.\u003c/p\u003e\u003cp\u003eНа пути оформления оставляют только необходимое. Поиск может быть недоступен, но заказ по уже выбранному товару ещё оформляется. Прогноз опоздания устаревает, но приём заказов продолжается. Недоступность проверки права на возврат, напротив, не должна обходиться запасным разрешением. Деградация проектируется по смыслу: что можно упростить, что отложить и что обязано остановиться.\u003c/p\u003e\u003cp\u003eСценарий потери площадки связывает ёмкость, восстановление данных и ограждение старого писателя. Реплики без достаточной мощности не обеспечивают работу после переключения, резервная копия без проверенного восстановления не подтверждает RTO. Для каждого обещания приводят доказательство: нагрузочное испытание, репетиция, проверка инварианта или наблюдение. Если доказательства пока нет, его отсутствие фиксируют как риск и следующий эксперимент, а не скрывают за будущим временем.\u003c/p\u003e"},{"title":"Альтернативы должны быть жизнеспособны","html":"\u003cp\u003eЗащита теряет смысл, если выбранный вариант сравнивают с заведомо плохими. Для расширения региона разумны единое ядро с региональными производными копиями, отдельные владельцы заказов по региону или полноценная распределённая запись. Каждый вариант решает часть задач и создаёт цену. Единое ядро проще поддерживает финансовые инварианты, но зависит от связи. Региональное владение локализует операции, но усложняет перенос заказа и глобальные отчёты.\u003c/p\u003e\u003cp\u003eСравнение выполняют по одним сценариям и горизонту. Указывают задержку, доступность, сохранность, труд команды, стоимость эксплуатации и стоимость перехода. Числа учебные либо подтверждены собственным измерением; рыночные цены не выдумывают. Риск отличается от недостатка: дополнительная задержка известна, а непроверенное восстановление — неопределённость, которую можно уменьшить репетицией.\u003c/p\u003e\u003cp\u003eВыбор включает условие пересмотра. Если доля межрегиональных операций превысит предусмотренную границу, региональное владение может перестать быть выгодным. Если задержка связи остаётся приемлемой, сложная распределённая запись не нужна. Архитектор защищает соответствие текущим целям, а не вечность решения. Возможность обоснованно отказаться от технологии показывает понимание механизма лучше, чем максимальная полнота технического набора.\u003c/p\u003e"},{"title":"Эволюционный план сохраняет работающий бизнес","html":"\u003cp\u003eИтоговое предложение содержит не только конечную карту, но и последовательность переходов. Сначала измеряют неизвестное и создают наблюдение, затем расширяют контракты, переносят производные контуры, проверяют восстановление и лишь после этого меняют владение записью. Каждый шаг имеет результат, обратимость и критерий остановки. Так уменьшается размер непроверенного изменения.\u003c/p\u003e\u003cp\u003eДля «Северного маршрута» отдельный шаг — вывести агента в режим подготовки заявок, не включая финансовое исполнение. Другой — построить региональную поисковую проекцию. Эти шаги можно проверить независимо от переноса заказов. Если связать их в один большой запуск, провал сложно объяснить: качество поиска, права, сеть и миграция начнут меняться одновременно.\u003c/p\u003e\u003cp\u003eПлан также учитывает людей. У компонента есть владелец, дежурный путь и понятный контракт с платформой. Команда не получает новый сервис без ресурсов на его сопровождение. Документация и учения входят в завершение шага, а не откладываются на «после стабилизации». Архитектура становится производственной только тогда, когда её можно безопасно менять и восстанавливать не силами одного автора.\u003c/p\u003e"},{"title":"Перенос знания в незнакомый бизнес","html":"\u003cp\u003eПрофессиональный перенос начинается с инварианта, а не с названия технологии. В доставке запас товара ограничен; в продаже билетов ограничено место; в банковском переводе ограничен доступный баланс. Во всех трёх случаях есть конкурирующие действия, но условия отката и внешние эффе
