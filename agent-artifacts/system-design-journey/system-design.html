function marketOverview(){return (DATA.market||[]).length?`<details style="margin-bottom:30px"><summary>Карта бизнесов: куда переносится механизм</summary><p class="muted">Авторская учебная классификация. Узнавайте семейства систем по ядру задачи, затем переходите к подробному паспорту мира.</p><div class="market-scroll" tabindex="0" role="region" aria-label="Карта архитектурного рынка, прокручиваемая таблица"><table><thead><tr><th scope="col">Бизнес</th><th scope="col">Ядро задачи</th><th scope="col">Миры атласа</th></tr></thead><tbody>${DATA.market.map(m=>`<tr><th scope="row">${esc(m.title)}</th><td>${esc(m.kernel)}</td><td>${m.worlds.map(id=>`<a href="#world-${esc(id)}">${esc(DATA.worlds.find(w=>worldId(w)===id)?.title||id)}</a>`).join(' · ')}</td></tr>`).join('')}</tbody></table></div><p class="muted">B2B/B2C, размер компании и highload сами по себе не определяют архитектуру.</p></details>`:'';}function atlas(){return `<div class="hero"><div class="eyebrow">Атлас отраслей</div><h1>Восемь миров.<br>Разные правила истины.</h1><p class="lead">Переносите механизм, проверяйте условия. Деньги, остатки и медиапоток по-разному переживают дубликаты, задержки и потерю данных.</p></div>${marketOverview()}<div class="worlds">${DATA.worlds.map(w=>`<section class="world"><div class="eyebrow">${esc(worldId(w))}</div><h2>${esc(w.title)}</h2><p>${esc(w.briefing)}</p><a href="#world-${worldId(w)}">Исследовать мир →</a></section>`).join('')}</div>`;}function world(w){const id=worldId(w);return `<article class="prose" style="max-width:830px;margin:auto"><a href="#atlas">← Атлас миров</a><div class="eyebrow">Паспорт мира · ${esc(id)}</div><h1>${esc(w.title)}</h1><p class="lead">${esc(w.briefing)}</p>${w.entryScenario?`<div class="panel">${esc(w.entryScenario)}</div>`:''}${w.signature?`<dl class="panel">${Object.entries(w.signature).map(([k,v])=>`<dt><strong>${esc(({truth:'Источник истины',traffic:'Нагрузка',latency:'Задержка',risk:'Риск',cost:'Стоимость'})[k]||k)}</strong></dt><dd>${esc(v)}</dd>`).join('')}</dl>`:''}${(w.sections||[]).map(s=>`<h2>${esc(s.title)}</h2>${s.html}`).join('')}${['transfer','distinct'].map(k=>w[k]?`<h2>${k==='transfer'?'Что переносится':'Что отличает этот мир'}</h2><ul>${w[k].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'').join('')}${(w.compare||[]).map(x=>`<section class="panel"><h2>${esc(x.title)}</h2>${x.html}<a href="#world-${esc(x.world)}">Открыть связанный мир →</a></section>`).join('')}<h2>Экспедиции из истории продукта</h2>${DATA.chapters.filter(c=>c.expedition.world===id).map(c=>`<p><a href="#${c.id}">${esc(c.expedition.title)} · глава ${Number(c.id.slice(3))}</a></p>`).join('')}<h2>Источники</h2><ul>${(w.sources||[]).map(s=>`<li><a href="${esc(s.url)}">${esc(s.title)} ↗</a></li>`).join('')}</ul></article>`;}const glossary=[['Идемпотентность','Повтор одной логической операции не создаёт дополнительного эффекта. Граница ключа и срок хранения результата входят в гарантию.'],['Транзакция','Набор операций с общей границей фиксации. Изоляция определяет, какие конкурентные эффекты допустимы.'],['Источник истины','Система или правило, по которому разрешают противоречия данных в определённом домене.'],['Репликация','Передача изменений между копиями. Наличие копии само по себе не гарантирует свежесть и безопасное переключение.'],['Consistency','Согласованность наблюдений: какие значения и порядок операций разрешено видеть клиенту.'],['Индекс','Дополнительная структура доступа к данным: ускоряет определённые чтения ценой места и работы при записи.'],['Кэш','Производная копия для ускорения доступа. Её пригодность зависит от допустимой устарелости и способа обновления.'],['Outbox','Запись намерения отправить событие в одной транзакции с бизнес-изменением. Отправка и повтор требуют отдельного механизма.'],['Saga','Последовательность локальных транзакций с обработкой неуспеха и, где возможно, компенсациями.'],['Шардирование','Распределение разных частей данных по узлам по выбранному правилу. Ключ определяет локальность и перекос нагрузки.'],['Quorum','Правило участия достаточного набора узлов. Свойства зависят от протокола, пересечения наборов и модели отказов.'],['Fencing','Ограждение ресурса от действий устаревшего владельца записи. Проверяемый ресурсом монотонный токен — один из механизмов; гарантия зависит от того, где проверяется право записи.'],['SLO','Целевой уровень измеримого качества сервиса за определённое окно наблюдения.'],['Backpressure','Передача ограничения скорости вверх по потоку, чтобы не накапливать неограниченную работу.'],['RPO / RTO','Цели допустимой потери данных и времени восстановления в заданной модели отказов. RPO часто выражают временем, но допустимую потерю можно задавать и объёмом данных; RTO — время восстановления. Проверяются восстановлением, а не наличием копии.'],['OLTP / OLAP','Обработка операционных транзакций / аналитических запросов. Они предъявляют разные требования к структурам и нагрузке.'],['Event time','Время события в предметном мире; отличается от времени поступления и обработки.'],['RAG','Формирование ответа модели с извлечённым контекстом. Качество извлечения и права доступа остаются отдельными задачами.'],['Embedding','Векторное представление, обученное для сравнения объектов. Близость не является доказательством истинности.'],['TCO','Полная стоимость владения: ресурсы, лицензии, работа команды, поддержка и последствия отказов.'],['Control / data plane','Контур управления правилами и контур выполнения операций с пользовательскими данными.'],['Expand–migrate–contract','Сначала совместимое расширение, затем перенос данных и клиентов, затем удаление старого контракта.'],["DNS", "Система имён и записей о ресурсах. Разрешение имени, кэширование записей и соединение с сервером — разные этапы запроса."],["L4 / L7", "Балансировка на уровне транспортных соединений / на уровне прикладного протокола. Граница влияет на маршрутизацию, TLS, состояния и стоимость."],["MVCC", "Хранение нескольких логических версий данных для согласованных наблюдений конкурентных транзакций. Не отменяет блокировки и проверку инвариантов."],["WAL", "Журнал предзаписи: изменения фиксируются в журнале до соответствующей записи страниц по правилам СУБД. Режим подтверждения определяет гарантию сохранности."],["B-tree", "Сбалансированная индексная структура с упорядоченными ключами и переходами между страницами. Цена чтения зависит от запроса, селективности и доступа к самим данным."],["LSM", "Семейство структур с записью в память и отсортированные компоненты на диске, которые затем объединяются. Ускорение одних операций оплачивается дополнительной работой чтения, записи и compaction."],["Deadlock", "Цикл взаимного ожидания ресурсов. Одна из транзакций может быть прервана; повторять нужно согласованную целую операцию, а не случайный её фрагмент."],["CDC", "Получение потока изменений из источника данных. Нужны позиция, порядок, версии, обработка повторов и согласование с начальным снимком."],["CQRS", "Разделение моделей изменения и чтения. Не требует автоматически отдельных сервисов или хранения состояния только в событиях."],["Event sourcing", "Модель, где состояние восстанавливается из последовательности доменных событий. Требует версий, воспроизведения и контроля внешних эффектов."],["ETA", "Оценка времени прибытия. Это прогноз с неопределённостью; расстояние по прямой и время по дорожному маршруту не взаимозаменяемы."],["Matching", "Сопоставление кандидатов и задач с ограничениями и целевой функцией. Самый близкий кандидат не всегда даёт лучший общий результат."],["Fan-out", "Распространение одного изменения нескольким получателям. Число адресатов и момент подготовки результата определяют нагрузку."],["CRDT", "Тип данных или алгоритм слияния, обеспечивающий сходимость поддерживаемых изменений при своих предпосылках. Сходимость не доказывает бизнес-корректность итога."],["CDN", "Распределённая доставка контента через копии ближе к потребителям. Нужны права, правила кэширования и защита origin при промахах."],["Multipart upload", "Приём объекта по частям с отдельной сессией и завершением. У незавершённых частей есть стоимость, срок жизни и правила очистки."],["Tenant", "Организационный контекст клиента в общей системе. Данные, права и ресурсы должны сохранять эту границу на всех путях."],["Noisy neighbor", "Ухудшение сервиса одного клиента из-за использования общих ресурсов другим. Квоты и изоляция выбираются по конкретному узкому месту."],["JWT", "Формат токена с утверждениями. Подпись, срок, issuer/audience и права проверяются отдельно; токен не является автоматическим разрешением на любой объект."],["mTLS", "TLS с проверкой идентичности обеих сторон соединения. Не заменяет объектную авторизацию и бизнес-ограничения."],["Training-serving skew", "Различие данных или преобразований при обучении и обслуживании модели. Качество offline может не воспроизвестись в production."],["Drift", "Изменение распределений данных или связей с целевым результатом. Требует наблюдения и диагностики, а не обязательного автоматического переобучения при любом сигнале."],["Hybrid search", "Сочетание нескольких способов поиска, например лексического и векторного, с общими фильтрами и ранжированием. Качество надо измерять."],["Unit cost", "Стоимость определённого полезного результата при заданном качестве и горизонте. Число технических вызовов не всегда является правильным знаменателем."],["SBOM", "Перечень программных компонентов артефакта. Помогает учёту и расследованию, но сам по себе не гарантирует отсутствие уязвимостей."],["Provenance", "Сведения о происхождении и процессе получения артефакта. Их проверка помогает понять, что и как собрано, но не доказывает правильность всей бизнес-логики."]];function notes(){return `<div class="hero"><div class="eyebrow">Личное пространство</div><h1>Портфель решений</h1><p class="lead">Учебный прогресс и собственные мысли хранятся в этой среде. Экспорт помогает сохранить их отдельно.</p><button id="exportOpen">Экспортировать портфель JSON</button></div><h2>Закладки</h2>${DATA.chapters.filter(c=>state.bookmarks[c.id]).map(c=>`<p><a href="#${c.id}">${esc(c.title)}</a></p>`).join('')||'<p class="muted">Пока нет закладок.</p>'}<h2>Заметки</h2>${DATA.chapters.filter(c=>state.notes[c.id]?.personal||state.notes[c.id]?.exercise).map(c=>`<section class="panel"><h3><a href="#${c.id}">${esc(c.title)}</a></h3>${state.notes[c.id].personal?`<p style="white-space:pre-wrap">${esc(state.notes[c.id].personal)}</p>`:''}${state.notes[c.id].exercise?`<details><summary>Ответ на упражнение</summary><p style="white-space:pre-wrap">${esc(state.notes[c.id].exercise)}</p></details>`:''}</section>`).join('')||'<p class="muted">Заметки можно добавить в каждой главе.</p>'}`;}function portfolio(){let oldRaw={},warnings=['Старый курс имеет другую структуру. Его данные включены как raw, не сопоставлены новым главам и не изменены.'];for(const k of ['sd-course-v1','sd-course-v2'])try{let raw=localStorage.getItem(k);if(raw!==null)oldRaw[k]=raw;}catch(e){warnings.push('Не удалось прочитать старое хранилище.');}return {schema:'sd-journey-portfolio-v3',exportedAt:new Date().toISOString(),course:'Системы: путь архитектора',state,oldRaw,warnings};}function exportOpen(){ $('#exportText').value=JSON.stringify(portfolio(),null,2);$('#exportStatus').textContent='';openDialog('exportDialog');}$('#copyExport').onclick=async()=>{try{await navigator.clipboard.writeText($('#exportText').value);$('#exportStatus').textContent='JSON скопирован.';}catch(e){$('#exportText').focus();$('#exportText').select();$('#exportStatus').textContent='Выделен весь JSON. Нажмите Ctrl+C или ⌘C.';}};$('#downloadExport').onclick=()=>{if(window.webkit?.messageHandlers?.setting){$('#exportText').focus();$('#exportText').select();$('#exportStatus').textContent='В приложении сохраните JSON через системное меню копирования выделенного текста или кнопку «Копировать JSON».';return;}const url=URL.createObjectURL(new Blob([$('#exportText').value],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='systems-journey-portfolio.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};let currentChapter=null,positionTimer,ignoreScrollUntil=0,pendingPosition=null;function flushPosition(){clearTimeout(positionTimer);positionTimer=null;if(pendingPosition){state.positions[pendingPosition.id]=pendingPosition.pos;pendingPosition=null;save();return;}if(currentChapter&&Date.now()>=ignoreScrollUntil){state.positions[currentChapter.id]=window.scrollY;save();}}window.bookSavePosition=flushPosition;window.addEventListener('pagehide',flushPosition);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPosition();});function render(){flushPosition();ignoreScrollUntil=Date.now()+650;let hash=decodeURIComponent(location.hash.slice(1)||'home');const c=DATA.chapters.find(c=>c.id===hash),w=DATA.worlds.find(w=>'world-'+worldId(w)===hash);currentChapter=c||null;$('#main').innerHTML=c?chapter(c):w?world(w):hash==='atlas'?atlas():hash==='notes'?notes():hash==='glossary'?`<h1>Словарь механизмов</h1><p class="lead">Короткие определения для ориентации. Условия и границы гарантий разобраны в главах.</p><div class="glossary">${glossary.map(([t,d])=>`<div><h2>${t}</h2><p>${d}</p><a href="#" data-term="${esc(t.split(' / ')[0])}">Найти в главах →</a></div>`).join('')}</div>`:home();document.title=(c?c.title:w?w.title:'Системы: путь архитектора')+' · Путь архитектора';window.scrollTo(0,0);$('#main').focus({preventScroll:true});$('#exportOpen')?.addEventListener('click',exportOpen);document.querySelectorAll('[data-term]').forEach(a=>a.onclick=e=>{e.preventDefault();$('#searchInput').value=a.dataset.term;$('#searchInput').oninput();openDialog('searchDialog');});if(c)bindChapter(c);announce(c?`Открыта глава ${Number(c.id.slice(3))}: ${c.title}`:w?`Открыт мир ${w.title}`:'Открыт раздел');}function decisionFeedback(c){let i=state.decisions[c.id];if(!Number.isInteger(i))return;const o=c.decision.options[i];$('#decisionFeedback').innerHTML=`<div class="feedback"><h3>${esc(o.title)}</h3><p>${esc(o.consequence)}</p><p><strong>Цена и условия:</strong> ${esc(o.tradeoff)}</p><p><strong>Разбор условий:</strong> ${esc(c.decision.explanation)}</p></div>`;}function checkFeedback(c,i){const saved=state.checks[c.id]?.[i];if(!saved)return;const q=c.checkpoint[i];$('#checkFeedback'+i).innerHTML=`<div class="feedback"><strong>${saved.choice===q.answer?'Верно в заданных условиях.':'Стоит пересмотреть выбор.'}</strong><p>${esc(q.explanation)}</p><p>Ответ: ${esc(q.options[q.answer])}</p></div>`;}function bindChapter(c){$('#bookmark').onclick=()=>{state.bookmarks[c.id]=!state.bookmarks[c.id];save();$('#bookmark').textContent=state.bookmarks[c.id]?'★ В закладках':'☆ В закладки';$('#bookmark').setAttribute('aria-pressed',String(state.bookmarks[c.id]));};$('#resume').onclick=()=>{window.scrollTo({top:state.positions[c.id]||0,behavior:'smooth'});announce('Переход к сохранённой позиции чтения');};$('#markDone').onclick=()=>{state.done[c.id]=!state.done[c.id];save();$('#markDone').textContent=state.done[c.id]?'✓ Прочитано — снять отметку':'Отметить прочитанным';announce(state.done[c.id]?'Глава отмечена прочитанной':'Отметка снята');};document.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.scroll).scrollIntoView({behavior:'smooth'});});document.querySelectorAll('[data-note]').forEach(n=>n.oninput=()=>{state.notes[c.id]??={};state.notes[c.id][n.dataset.note]=n.value;save();$('#noteStatus').textContent=storageOK?'Заметки сохранены.':'Заметки в памяти вкладки.';});document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{state.decisions[c.id]=Number(b.dataset.decision);save();document.querySelectorAll('[data-decision]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b));});decisionFeedback(c);});decisionFeedback(c);document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.check),selected=$(`input[name="q${i}"]:checked`);if(!selected){$('#checkFeedback'+i).textContent='Сначала выберите вариант.';return;}state.checks[c.id]??={};state.checks[c.id][i]={choice:Number(selected.value),confirmed:true};save();checkFeedback(c,i);});c.checkpoint.forEach((q,i)=>checkFeedback(c,i));}window.addEventListener('scroll',()=>{if(!currentChapter||Date.now()<ignoreScrollUntil)return;const id=currentChapter.id,pos=window.scrollY;pendingPosition={id,pos};clearTimeout(positionTimer);positionTimer=setTimeout(flushPosition,250);},{passive:true});window.addEventListener('hashchange',render);render();
</script></body></html>
