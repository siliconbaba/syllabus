-weight=\"400\"\u003eВнутри области порядок уже подходит; id разрешает одинаковые времена.\u003c/text\u003e","caption":"Таблица изображает логический порядок ключей, а не физическую страницу B-tree. Равенства по первым двум полям выбирают область, следующие задают порядок. При другом запросе или распределении оптимальный индекс может отличаться."}],"decision":{"prompt":"Что делать с медленным списком оператора?","options":[{"title":"Исправить запрос и проверить составной индекс","consequence":"Сокращается работа источника истины без новой копии.","tradeoff":"Нужно исследование распределения и проверка влияния на запись."},{"title":"Добавить реплику чтения","consequence":"Можно изолировать часть нагрузки от основной базы.","tradeoff":"Плохой запрос остаётся дорогим; появляется задержка репликации и эксплуатация."},{"title":"Кэшировать готовый список","consequence":"Повторные чтения могут стать существенно дешевле.","tradeoff":"Нужны ключи, обновление, политика устаревания и защита прав; горячий постоянно меняющийся список может плохо кэшироваться."}],"recommended":0,"explanation":"В условии не доказано исчерпание мощности, зато видны лишние чтения и сортировка. Сначала уменьшаем исходную работу, затем оцениваем необходимость копий."},"exercise":{"prompt":"План показывает быстрый внутренний узел с loops=10000. Почему его нельзя игнорировать?","model":"\u003cp\u003eНужно оценить суммарную работу повторов и объём передаваемых строк. Малое время одного исполнения может доминировать после умножения; также проверяют, не является ли причиной ошибочная оценка внешнего набора.\u003c/p\u003e","rubric":["Учтена кратность","Найдена связь с внешним входом"]},"checkpoint":[{"question":"Seq Scan всегда означает…","options":["Только выбранный способ чтения, который может быть оптимальным","Отсутствие любого индекса в схеме","Ошибку планировщика при любой таблице"],"answer":0,"explanation":"Широкое чтение и небольшие таблицы часто выгоднее обслуживать последовательно."},{"question":"Что важно помнить об EXPLAIN ANALYZE?","options":["Он действительно исполняет исследуемый запрос","Он только оценивает запрос и никогда не меняет данные","Его cost всегда измерен в миллисекундах"],"answer":0,"explanation":"Для изменяющих команд это реальное исполнение; плановую стоимость и фактическое время различают."}],"sources":[{"title":"PostgreSQL 18: Using EXPLAIN","url":"https://www.postgresql.org/docs/18/using-explain.html"},{"title":"PostgreSQL 18: multicolumn indexes","url":"https://www.postgresql.org/docs/18/indexes-multicolumn.html"},{"title":"PostgreSQL 18: index-only scans","url":"https://www.postgresql.org/docs/18/indexes-index-only-scans.html"},{"title":"PostgreSQL 18: partial indexes","url":"https://www.postgresql.org/docs/18/indexes-partial.html"},{"title":"PostgreSQL 18: planner statistics","url":"https://www.postgresql.org/docs/18/planner-stats.html"},{"title":"PostgreSQL 18: routine vacuuming","url":"https://www.postgresql.org/docs/18/routine-vacuuming.html"},{"title":"PostgreSQL 18: BRIN","url":"https://www.postgresql.org/docs/18/brin.html"},{"title":"PostgreSQL 18: CREATE INDEX and concurrent builds","url":"https://www.postgresql.org/docs/18/sql-createindex.html"}],"wordCount":1682},{"id":"ch-06","arc":2,"title":"Несколько серверов: L4/L7, балансировка, сессии","briefing":"Запросы из главы 05 стали экономнее. Теперь команда хочет выпускать приложение без остановки приёма заказов и выдерживать падение одного экземпляра. Перед ней впервые появляются два приложения, общий вход и вопрос: куда исчезла пользовательская сессия?","goals":["Различать транспортную и прикладную балансировку","Понять алгоритмы распределения и проверки готовности","Разделить масштабирование вычислений и управление состоянием"],"sections":[{"title":"Добавить экземпляр — изменить маршрут","html":"\u003cp\u003eВертикальное масштабирование даёт одному узлу больше процессора или памяти. Горизонтальное добавляет экземпляры. У «Северного маршрута» два экземпляра приложения могут обслуживать независимые запросы, пока используют согласованный общий источник состояния. Балансировщик принимает трафик и выбирает подходящий экземпляр. Он не превращает две программы в одну и не объединяет их память. Если первый экземпляр хранит корзину только в локальном словаре, второй о ней не знает.\u003c/p\u003e\u003cp\u003eНа схеме появляются вход, приложение A, приложение B и база. Нельзя считать каждый новый прямоугольник бесплатной производительностью. Оба приложения могут конкурировать за тот же пул ресурсов PostgreSQL. Если каждое открывает до ста соединений, суммарный предел удваивается даже при прежней мощности базы. Поэтому масштабируют не только число процессов, но и бюджеты соединений, параллельности и фоновых работ.\u003c/p\u003e\u003cp\u003eЦель этого изменения — пережить остановку одного приложения и выполнять постепенные выпуски. Мы пока не закрываем отказ единственного балансировщика или базы. Для настоящей высокой доступности входа нужен резервируемый механизм или управляемый сервис с понятной моделью отказа. Количество приложений не равно количеству независимых путей до пользователя. На карте полезно выделить точки, без которых весь сценарий по-прежнему прекращается.\u003c/p\u003e"},{"title":"L4 и L7: что видит выбирающий узел","html":"\u003cp\u003eL4 — условное обозначение балансировки на транспортном уровне. Решение обычно привязано к соединению и сетевым признакам, таким как адреса и порты. Балансировщик может передавать зашифрованный поток, не разбирая HTTP. Тогда он не знает, обращается клиент к каталогу или оформлению. Долгоживущее соединение остаётся на выбранном пути, а множество запросов внутри него не обязательно распределяется по разным приложениям.\u003c/p\u003e\u003cp\u003eL7 работает с прикладным протоколом, в нашем примере HTTP. Он может выбирать upstream по имени хоста, пути и другим проверенным признакам, завершать TLS, ограничивать размер запроса и собирать прикладную статистику. Цена — обработка протокола, конфигурация доверия и дополнительные ресурсы. L7 не является автоматически «современнее и лучше»: для непрозрачного TCP-протокола или сквозного TLS пригоднее может быть транспортный вход.\u003c/p\u003e\u003cp\u003eРеализации отличаются: не всякий L4 является прокси с одинаковой схемой передачи, а не всякий L7 поддерживает одинаковые проверки и повторные попытки. Сравниваем конкретный продукт и режим. Для учебного сервиса используем HTTP reverse proxy и показываем две независимые связи: клиент — прокси и прокси — приложение. Это помогает понять таймауты, повторное использование соединений и тот факт, что ошибка внешнего соединения не определяет исход внутренней операции.\u003c/p\u003e"},{"title":"Распределение: круг, соединения и перекос","html":"\u003cp\u003eRound robin отправляет очередные назначения по кругу, при необходимости учитывая веса. Он прост и хорошо работает при достаточно похожих запросах и экземплярах. Но запрос каталога на десятки миллисекунд и тяжёлый экспорт на десятки секунд занимают ресурсы неодинаково. Равное количество назначений не гарантирует равную текущую загрузку. Наблюдать нужно не только число запросов, но активную работу, очередь и задержку.\u003c/p\u003e\u003cp\u003eLeast connections предпочитает узел с меньшим числом активных соединений в рамках своей реализации. Это может помочь, если длительность работ существенно различается, однако соединение не всегда равно одной единице вычисления. HTTP/2 мультиплексирует запросы, keep-alive удерживает соединения, а приложения имеют разные внутренние очереди. Алгоритм видит определённый сигнал и оптимизирует по нему, а не знает истинную стоимость каждого бизнес-действия.\u003c/p\u003e\u003cp\u003eХеширование адреса или ключа даёт устойчивое назначение и может улучшить локальность. Но популярный ключ создаёт горячий узел, а клиенты за одним NAT могут выглядеть как один адрес. Весами можно учесть неодинаковую мощность экземпляров, но плохо работающий узел с прежним весом продолжит получать трафик до обнаружения проблемы. Поэтому алгоритм выбора рассматривают вместе с измерением, исключением неисправных узлов и поведением при изменении состава группы.\u003c/p\u003e"},{"title":"Проверка здоровья и готовность к запросам","html":"\u003cp\u003eПроцесс может существовать, но не быть готовым принять трафик: загружается конфигурация, выполняется прогрев или отсутствует обязательная зависимость. Проверка живости отвечает на вопрос, следует ли перезапустить процесс. Проверка готовности — можно ли направлять ему новые запросы. Если смешать эти сигналы, временная проблема базы вызовет синхронные перезапуски всех приложений и усилит недоступность.\u003c/p\u003e\u003cp\u003eАктивная проверка периодически обращается к специальной точке. Пассивная учитывает ошибки настоящих запросов. В конкретных редакциях и продуктах поддержка активных проверок различается: нельзя автоматически приписывать любой конфигурации NGINX возможности другой редакции. Важно определить пороги исключения и возвращения узла, чтобы краткий сбой не вызывал непрерывное переключение. Слишком медленное обнаружение отправляет пользователей на неисправный узел; слишком нервное — постоянно меняет топологию.\u003c/p\u003e\u003cp\u003eПроверка готовности должна проверять минимально необходимое и быть дешёвой. Если каждый балансировщик каждую секунду запускает тяжёлый запрос ко всем зависимостям, сама диагностика создаёт нагрузку. При этом всегда отвечающий 200 обработчик, не связанный с возможностью обслужить заказ, даёт ложную уверенность. Для нашего приложения отделяем способность принимать HTTP от способности исполнять критический сценарий и объясняем, какой сигнал использует конкретный вход.\u003c/p\u003e"},{"title":"Сессия не должна случайно жить на сервере A","html":"\u003cp\u003eСессия связывает последовательные действия с установленной личностью и выбранным контекстом. Если её единственная копия находится в памяти приложения A, балансировка на B выглядит как внезапный выход пользователя. Sticky sessions пытаются возвращать клиента к тому же экземпляру. Это полезная оптимизация или переходный механизм, но не сохранность состояния: при падении A его память всё равно исчезнет.\u003c/p\u003e\u003cp\u003eСерверное хранилище сессий позволяет приложениям получать общий контекст по непрозрачному идентификатору. На старте таким хранилищем может быть PostgreSQL; Redis выбирают после анализа частоты, срока жизни и допустимого поведения при отказе. Корзина и аутентификационная сессия не обязаны иметь одинаковую долговечность. Потеря временного фильтра интерфейса неприятна, потеря принятого заказа недопустима, а утрата сессии может требовать повторного входа. Не следует складывать всё под словом «состояние» с одной политикой.\u003c/p\u003e\u003cp\u003eПодписанный клиентский токен уменьшает необходимость читать серверную сессию при каждом запросе, но создаёт другой компромисс: отзыв полномочий, срок действия, ротация ключей и размер переносимых сведений. Подпись защищает целостность, а не обязательно скрывает содержимое. Персональные данные нельзя помещать в токен без понимания, кто его сможет прочитать. В любом варианте авторизация конкретного заказа остаётся на сервере: устойчивый вход не превращает все объекты в доступные пользователю.\u003c/p\u003e"},{"title":"Выпуск, остановка и безопасные повторы","html":"\u003cp\u003eПеред остановкой экземпляр выводят из назначения новых запросов и дают текущим завершиться в ограниченный срок. Такой процесс называют draining. Затем закрывают соединения и завершают процесс. Но «не назначать новые» не всегда значит «все существующие соединения пусты»: keep-alive, HTTP/2 и долгие ответы требуют поведения конкретного прокси. Для выпуска нужны согласованные таймауты и проверка, что новый код совместим с общей схемой данных.\u003c/p\u003e\u003cp\u003eЕсли соединение с приложением оборвалось, балансировщик может попытаться другой узел только при допустимой семантике и настройках. Автоматический повтор операции создания опасен: первый узел мог уже зафиксировать заказ. RFC 9110 отдельно ограничивает повтор неидемпотентных запросов посредником. Настройка повторов — часть предметного контракта, а не скрытая галочка ускорения. Два приложения увеличили доступность вычислений, но не убрали неизвестный результат из главы 02.\u003c/p\u003e\u003cp\u003eВ первый выпуск с двумя экземплярами проверяем три сценария: остановка свободного узла, остановка узла с выполняющимся запросом и недоступность общей базы. В последнем случае оба приложения должны давать ограниченный понятный отказ, а не накапливать бесконечные очереди. Наблюдаем распределение запросов и нагрузку базы после исключения одного приложения. Оставшийся узел должен выдерживать согласованный рабочий профиль; иначе резервирование существует только на диаграмме.\u003c/p\u003e"}],"workedExample":{"title":"Второй экземпляр и исчезнувшая корзина","html":"\u003cp\u003eУ приложения A локальная корзина пользователя U42. Команда добавляет B и включает round robin. Первый запрос после входа попадает на A, второй — на B; корзина пуста, хотя оба процесса исправны. Ошибка не в алгоритме круга: он выполняет свой контракт. Неправильным было предположение, что локальная память является общим состоянием сервиса.\u003c/p\u003e\u003cp\u003eЕсть три пути. Временно включить привязку клиента к A: быстро, но отказ A теряет корзину. Перенести корзину в общее хранилище: появляется обращение к нему, зато любой экземпляр продолжает работу. Хранить корзину на клиенте с повторной серверной проверкой при оформлении: уменьшается серверное состояние, но нужно определить размер, синхронизацию устройств и защиту от подмены. Для учебного продукта выбираем общую сохраняемую корзину, потому что покупатель использует web и mobile.\u003c/p\u003e\u003cp\u003eПусть каждый экземпляр способен обслуживать согласованный профиль в 60 одновременных коротких запросов, а обычный пик требует 80. Суммарные 120 выглядят достаточными, но при отказе одного остаётся 60. Следовательно, конфигурация не выдерживает весь пик в режиме отказа. Можно увеличить мощность, добавить третий экземпляр или сознательно ограничить менее важные функции. Все числа учебные; важен расчёт по оставшейся мощности, а не по сумме исправных узлов.\u003c/p\u003e\u003cp\u003eПри постепенном выпуске выводим A из готовности, ждём завершения активной работы, обновляем и возвращаем. Общая база ещё должна обслуживать старый и новый код одновременно. Если новый обработчик требует столбец, которого старый выпуск не знает или уже удалил, балансировщик не спасёт. Сетевое распределение и совместимость изменений образуют разные части одного выпуска. Подробный протокол миграции изучим в главе 30.\u003c/p\u003e"},"expedition":{"world":"collaboration","title":"Экспедиция: совместная доска с долгими соединениями","html":"\u003cp\u003eУчебная доска для удалённых команд использует WebSocket, чтобы передавать изменения почти сразу. У доставки HTTP-запрос короткий, а здесь соединение может жить долго. Балансировщик назначает подключение конкретному приложению, и последующие сообщения идут по нему. Добавление нового экземпляра не переселяет автоматически уже открытые соединения. Поэтому число соединений и скорость сообщений становятся отдельными измерениями.\u003c/p\u003e\u003cp\u003eПереносится разделение локального процесса и устойчивого состояния. Если доска хранится только в памяти узла, его падение теряет изменения. Если изменения сохранены, клиент может переподключиться и восстановить позицию по протоколу. Но уведомление другим участникам требует межузлового распространения: пользователь на A не увидит событие, оставшееся только на B. Один общий HTTP-вход этой задачи не решает.\u003c/p\u003e\u003cp\u003eНовое — управление долгими связями при выпуске. Нельзя бесконечно ждать, пока все пользователи сами закроют доску. Нужны ограниченный период draining, команда переподключения и восстановление пропущенного по сохранённой версии или позиции. При этом переподключения должны быть разнесены, иначе плановый выпуск создаст волну нагрузки. Экспедиция показывает, почему балансировка — это распределение конкретного вида работы: короткий запрос, поток и долгоживущая сессия требуют разных ожиданий и протоколов восстановления.\u003c/p\u003e","transfer":["Общее состояние отдельно от локальной памяти","Расчёт мощности после отказа"],"distinct":["Долгоживущие соединения","Восстановление пропущенных изменений"]},"diagrams":[{"title":"Два приложения и общий предел","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-06-0-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eДва приложения и общий предел\u003c/text\u003e\u003crect x=\"30\" y=\"173\" width=\"155\" height=\"80\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"107.5\" y=\"219.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eКлиент\u003c/text\u003e\u003cline x1=\"185\" y1=\"213\" x2=\"245\" y2=\"213\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-06-0-arr)\"/\u003e\u003crect x=\"245\" y=\"173\" width=\"170\" height=\"80\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"330.0\" y=\"207.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eL7-вход\u003c/text\u003e\u003ctext x=\"330.0\" y=\"231.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eHTTP-маршрут\u003c/text\u003e\u003crect x=\"495\" y=\"77\" width=\"220\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"605.0\" y=\"118.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eПриложение A\u003c/text\u003e\u003crect x=\"495\" y=\"268\" width=\"220\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"605.0\" y=\"309.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eПриложение B\u003c/text\u003e\u003cline x1=\"415\" y1=\"213\" x2=\"455\" y2=\"213\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"455\" y1=\"112\" x2=\"455\" y2=\"303\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"455\" y1=\"112\" x2=\"495\" y2=\"112\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-06-0-arr)\"/\u003e\u003cline x1=\"455\" y1=\"303\" x2=\"495\" y2=\"303\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-06-0-arr)\"/\u003e\u003crect x=\"260\" y=\"355\" width=\"220\" height=\"65\" rx=\"12\" fill=\"#dff4e8\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"370.0\" y=\"393.5\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eОбщая PostgreSQL\u003c/text\u003e\u003cline x1=\"715\" y1=\"112\" x2=\"738\" y2=\"112\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"738\" y1=\"112\" x2=\"738\" y2=\"388\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"738\" y1=\"388\" x2=\"480\" y2=\"388\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-06-0-arr)\"/\u003e\u003cline x1=\"715\" y1=\"303\" x2=\"738\" y2=\"303\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"30\" y=\"91\" font-family=\"Arial, sans-serif\" font-size=\"19\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eДве копии вычисления\u003c/text\u003e\u003ctext x=\"30\" y=\"121\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eне две копии памяти\u003c/text\u003e\u003ctext x=\"30\" y=\"445\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eВход и база всё ещё общие зависимости; стрелки показывают обращения.\u003c/text\u003e","caption":"Вход распределяет HTTP, оба приложения используют одну базу. Линии не означают синхронную репликацию памяти. Отказ одного приложения можно пережить при достаточной остаточной мощности; отказ общих компонентов требует отдельных мер."},{"title":"Draining: не оборвать работу молча","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-06-1-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eDraining: не оборвать работу молча\u003c/text\u003e\u003ctext x=\"35\" y=\"80\" font-family=\"Arial, sans-serif\" font-size=\"20\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eЭкземпляр A: постепенная остановка\u003c/text\u003e\u003cline x1=\"70\" y1=\"220\" x2=\"700\" y2=\"220\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-06-1-arr)\"/\u003e\u003ccircle cx=\"90\" cy=\"220\" r=\"10\" fill=\"#dff4e8\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"90\" y=\"175\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eГотов\u003c/text\u003e\u003ctext x=\"90\" y=\"274\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eНовые + текущие\u003c/text\u003e\u003ccircle cx=\"285\" cy=\"220\" r=\"10\" fill=\"#fff1d5\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"285\" y=\"175\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eНе готов\u003c/text\u003e\u003ctext x=\"285\" y=\"274\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eТолько текущие\u003c/text\u003e\u003ccircle cx=\"495\" cy=\"220\" r=\"10\" fill=\"#fff1d5\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"495\" y=\"175\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eЗавершение\u003c/text\u003e\u003ctext x=\"495\" y=\"274\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eЛимит ожидания\u003c/text\u003e\u003ccircle cx=\"675\" cy=\"220\" r=\"10\" fill=\"#f7dfda\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"675\" y=\"175\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eСтоп\u003c/text\u003e\u003ctext x=\"675\" y=\"274\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eПроцесс закрыт\u003c/text\u003e\u003crect x=\"105\" y=\"330\" width=\"550\" height=\"65\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"380.0\" y=\"368.5\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eНовый трафик принимает B; база совместима с обеими версиями.\u003c/text\u003e\u003ctext x=\"35\" y=\"430\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eДолгие соединения и незавершённые запросы требуют отдельного протокола.\u003c/text\u003e","caption":"Время идёт слева направо. Узел сначала перестаёт получать новую работу, затем завершает текущую в пределах бюджета и останавливается. Схема не утверждает, что все протоколы автоматически освобождают существующие соединения: поведение зависит от прокси и приложения."}],"decision":{"prompt":"Как убрать зависимость сессии от экземпляра?","options":[{"title":"Общее серверное хранилище","consequence":"Любой экземпляр продолжает сессию по идентификатору.","tradeoff":"Появляется общая зависимость, для которой задают задержку, отказ и сохранность."},{"title":"Привязка клиента к экземпляру","consequence":"Быстро сохраняет локальность существующей реализации.","tradeoff":"Падение узла остаётся потерей локального состояния; возможен перекос нагрузки."},{"title":"Клиентский подписанный токен","consequence":"Проверка части контекста возможна без чтения сессии.","tradeoff":"Сложнее отзыв прав и ротация; подпись не скрывает данные."}],"recommended":0,"explanation":"Для web/mobile и текущей небольшой нагрузки общее хранилище даёт ясную семантику. Токен или привязка могут быть уместны при других требованиях, но не являются универсальным заменителем сохранности."},"exercise":{"prompt":"Два узла суммарно выдерживают пик. Что ещё проверить для отказоустойчивости?","model":"\u003cp\u003eВыдерживает ли оставшаяся мощность рабочий профиль после отказа, доступен ли сам вход, что происходит с общей базой и текущими запросами. Сумма мощности исправных экземпляров не описывает режим отказа.\u003c/p\u003e","rubric":["Оценена остаточная мощность","Указаны общие зависимости"]},"checkpoint":[{"question":"Sticky sessions гарантируют…","options":["Предпочтительное назначение по правилу, но не сохранность памяти узла","Наличие копии сессии на каждом приложении","Безопасность автоматического повтора POST"],"answer":0,"explanation":"Привязка маршрута не создаёт репликацию состояния."},{"question":"L7-балансировщик отличается тем, что…","options":["Может принимать решения по прикладной семантике поддерживаемого протокола","Всегда быстрее L4 на любом профиле","Устраняет необходимость авторизации приложения"],"answer":0,"explanation":"Работа с HTTP даёт дополнительные признаки и функции, но имеет стоимость и собственные границы."}],"sources":[{"title":"NGINX: HTTP load balancing","url":"https://nginx.org/en/docs/http/load_balancing.html"},{"title":"NGINX: upstream module, fail_timeout/max_fails","url":"https://nginx.org/en/docs/http/ngx_http_upstream_module.html"},{"title":"NGINX: stream upstream module","url":"https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html"},{"title":"NGINX: proxy_next_upstream","url":"https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_next_upstream"},{"title":"HAProxy: health checks","url":"https://www.haproxy.com/documentation/haproxy-configuration-tutorials/reliability/health-checks/"},{"title":"RFC 9110: HTTP Semantics, retry rules","url":"https://www.rfc-editor.org/rfc/rfc9110"}],"wordCount":1515},{"id":"ch-07","arc":2,"title":"Витрина против источника истины: кэш","briefing":"Два приложения обслуживают заказы, а SQL уже проверен. Рекламная витрина многократно читает одни и те же карточки, хотя они меняются редко. Команда предлагает Redis. Начнём не с продукта, а с вопроса: какую копию мы разрешаем показать и что произойдёт, когда её нет?","goals":["Понять cache-aside, write-through и write-behind","Разобрать гонку заполнения, устаревание и инвалидацию","Связать скорость кэша с корректностью, безопасностью и мощностью источника"],"sections":[{"title":"Кэш — договор об использовании копии","html":"\u003cp\u003eКэш хранит результат, который можно получить из другого источника дешевле по времени или стоимости. Это может быть готовый HTML, карточка товара, результат вычисления тарифа или страница базы в памяти. Наличие быстрого хранилища ещё не делает данные кэшем: если единственная принятая запись заказа находится в Redis и нигде не восстанавливается, перед нами источник состояния с отдельными требованиями сохранности. Роль определяет допустимое поведение при потере.\u003c/p\u003e\u003cp\u003eДля витрины «Северного маршрута» разрешаем короткую устарелость описания товара. При оформлении цена и наличие проверяются авторитетным путём. Поэтому устаревшая карточка может привести к понятному сообщению об изменившихся условиях, но не к молчаливой продаже по случайному значению. Нужно согласовать продуктовый опыт: слишком частые изменения цены после кнопки подрывают доверие, даже если бухгалтерская запись правильна. Допуск устарелости — часть обещания интерфейса.\u003c/p\u003e\u003cp\u003eЕсть локальный кэш внутри процесса и общий удалённый. Локальный не требует сетевого вызова, но каждый экземпляр хранит собственную копию и получает собственные устаревания. Общий уменьшает дублирование и облегчает единое управление ключами, но добавляет зависимость и сетевую задержку. Многоуровневая схема возможна, однако каждый уровень имеет отдельную политику обновления. Не стоит называть её бесплатным ускорением: команда платит памятью, сложностью согласования и возможностью получить неверную копию.\u003c/p\u003e"},{"title":"Cache-aside: сначала спросить копию","html":"\u003cp\u003eВ cache-aside приложение ищет ключ в кэше. При попадании возвращает найденное представление. При промахе читает источник, формирует результат, помещает его в кэш и отвечает. База не обязана знать о существовании этой копии. Такой рисунок удобен для чтения каталога: если кэш пуст, функциональность может продолжаться, хотя дороже. Но способность продолжать зависит от мощности источника, а не от названия паттерна.\u003c/p\u003e\u003cp\u003eКлюч описывает семантику результата. Для карточки это могут быть версия формата, товар, регион, язык и ценовой сегмент. Если забыть регион, покупатель увидит чужие условия; если забыть область доступа, приватные сведения могут попасть другому пользователю. Особенно опасно кэшировать ответ авторизованного обработчика только по URL. Прежде чем считать hit rate, нужно доказать, что совпадение ключа действительно означает взаимозаменяемость результатов.\u003c/p\u003e\u003cp\u003eЗначение также нуждается в формате и версии. Новое приложение не должно ошибочно разобрать старую запись после выпуска. В ключ можно включить версию представления и позволить старым ключам истечь. Цена — временное удвоение памяти и холодное заполнение нового пространства. Полное очищение перед каждым выпуском проще в реализации, но создаёт волну чтений и может обрушить базу. Жизненный цикл кэша уже связан с безопасностью изменений приложения.\u003c/p\u003e"},{"title":"Обновление: три разных обещания","html":"\u003cp\u003eПри cache-aside запись обычно сначала фиксируется в источнике, затем соответствующая копия удаляется или обновляется. Удаление упрощает дальнейшее заполнение, однако между фиксацией и удалением существует окно устаревания. Если удаление не дошло, старое значение останется до дополнительного механизма обновления или истечения срока. Транзакция PostgreSQL не включает обычную независимую команду Redis автоматически.\u003c/p\u003e\u003cp\u003eWrite-through проводит запись через слой, который обновляет источник и кэш по определённому протоколу. Это может дать управляемый путь, но само название не гарантирует атомарность двух систем. Нужно проверить порядок, подтверждение и поведение частичного отказа. Write-behind подтверждает изменение в быстром слое, а запись в основной источник выполняет позже. Тогда потеря буфера может стать потерей принятого состояния; нужны долговечная очередь, повтор и порядок. Это уже другой уровень обязательств, а не просто более быстрый cache-aside.\u003c/p\u003e\u003cp\u003eВажна гонка заполнения. Читатель прочитал старое значение из базы, писатель обновил базу и удалил ключ, затем медленный читатель записал старую копию обратно. Удаление после записи не спасло от устаревания. Варианты защиты включают версии значения, сериализацию заполнения с изменениями, событийное обновление с проверкой порядка или ограничение последствий сроком жизни. Выбор зависит от требуемой свежести. Честная схема должна показывать эту гонку, а не ограничиваться стрелкой «обновить кэш».\u003c/p\u003e"},{"title":"TTL, вытеснение и пустой ответ","html":"\u003cp\u003eTTL задаёт срок, после которого значение больше нельзя считать доступной актуальной записью кэша. Он ограничивает длительность хранения конкретного заполнения, но не гарантирует свежесть самого источника в момент заполнения и не делает несколько ключей согласованным снимком. Если процесс заново положил старое значение, его новый TTL может продлить проблему. Поэтому срок жизни — инструмент ограничения последствий, а не доказательство корректности протокола.\u003c/p\u003e\u003cp\u003eВытеснение отличается от истечения. При нехватке памяти кэш может удалить ещё не просроченные ключи по выбранной политике. LRU ориентируется на недавнее использование, LFU — на частоту; в конкретном Redis используются свои приближённые механизмы и настройки. При noeviction операции, требующие памяти, могут получать отказ. Команда должна знать, что произойдёт при заполнении, а не рассчитывать на бесконечную оперативную память. Счётчик заказов или сессия не должны случайно попасть под политику одноразовой витрины.\u003c/p\u003e\u003cp\u003eОтсутствие объекта иногда тоже кэшируют коротко — это negative caching. Оно защищает источник от повторных поисков несуществующего товара. Но если товар только что создан, отрицательная копия скроет его до обновления. Нельзя одинаково кэшировать «товар действительно отсутствует» и «источник временно не ответил»: второе не является предметным фактом. Иначе сетевой сбой превращается в ложное сообщение о пустом каталоге.\u003c/p\u003e"},{"title":"Провал кэша и лавина промахов","html":"\u003cp\u003eЕсли популярный ключ истёк, сотня запросов одновременно увидит промах и пойдёт в базу. Этот эффект называют stampede, или лавиной заполнения. Объединение одновременных запросов для одного ключа, single-flight, позволяет одному участнику получить данные, а остальным дождаться результата. Между процессами для этого нужен явный механизм с ограниченным ожиданием. Локальный single-flight уменьшает работу внутри каждого приложения, но не объединяет разные экземпляры.\u003c/p\u003e\u003cp\u003eСлучайное отклонение TTL разносит истечение множества ключей. Предварительное обновление горячих значений снижает шанс холодного пика. Stale-while-revalidate позволяет временно отдать ещё приемлемую старую копию и обновить её в фоне. Но «приемлемую» нужно определить по типу данных и возрасту. Для текста описания это может быть полезно, а для решения об отгрузке последнего товара — недопустимо. Продлевать устарелость без верхней границы опасно: временный режим способен стать постоянным.\u003c/p\u003e\u003cp\u003eПри полном отказе кэша все чтения могут пойти к источнику. Если база рассчитывалась только на обычные промахи, она перегрузится и оформление тоже остановится. Нужны ограничение параллельного обхода, приоритет критических операций и упрощённый ответ для некритической витрины. Кэш должен ускорять систему, а не скрывать, что без него критический контур немедленно падает. Сценарий пустого и недоступного кэша проверяют отдельно от красивого показателя попаданий.\u003c/p\u003e"},{"title":"Измерять полезность, а не только попадания","html":"\u003cp\u003eHit rate равен доле обращений, обслуженных кэшем, но он не описывает ценность каждого попадания. Если дешёвые карточки попадают часто, а редкий тяжёлый расчёт всегда промахивается, высокий процент не означает существенного уменьшения нагрузки. Нужны задержки по hit и miss, объём сохранённой работы, частота ошибок заполнения, память и возраст значений. Измерения связывают с конкретным типом ключа, иначе общий показатель скрывает проблемный сегмент.\u003c/p\u003e\u003cp\u003eСреднее время можно приблизительно разложить: доля попаданий умножается на стоимость hit, доля промахов — на стоимость полного miss. При этом miss включает проверку кэша, чтение источника и заполнение, а не только время базы. Примерная формула полезна для оценки, но не описывает очередь и хвосты во время массового истечения. Небольшая доля очень медленных промахов может определять пользовательский p99.\u003c/p\u003e\u003cp\u003eДля нашей витрины вводим отдельную метрику расхождений цены при оформлении. Она показывает не только техническое устаревание, но и реальный ущерб опыту. Если расхождения часты, уменьшаем TTL или меняем способ представления цены; если кэш экономит мало, допускаем отказ от него. Следующая глава сравнит Redis и Ignite уже на конкретных механизмах памяти и отказа. Но ни один продукт не отменит необходимость определить допустимую копию, ключ и путь восстановления.\u003c/p\u003e"}],"workedExample":{"title":"Горячая карточка и цена одной минуты","html":"\u003cp\u003eВ рекламный пик карточку P17 читают 1000 раз в секунду. Авторитетное чтение вместе с формированием ответа занимает условные 20 миллисекунд работы, hit удалённого кэша — 2. При 99 процентах попаданий идеализированная средняя оценка равна 0,99 × 2 + 0,01 × 22 = 2,2 миллисекунды, если полный miss стоит 22 миллисекунды. Это вычисление не прогноз реальной задержки: оно исключает очередь, сеть и стоимость одновременного заполнения.\u003c/p\u003e\u003cp\u003eПри TTL 60 секунд и синхронном истечении сотни запросов могут успеть отправиться в источник. Сначала вводим single-flight для ключа и ограничиваем количество параллельных заполнений. Затем добавляем небольшой разброс срока для разных ключей. Для описания разрешаем ограниченную старую копию во время обновления, а цену на финальном подтверждении читаем авторитетным путём. Каждому типу данных назначаем собственный договор свежести.\u003c/p\u003e\u003cp\u003eВ момент изменения цены писатель фиксирует новую запись и удаляет ключ. Медленный читатель, начавший раньше, пытается положить старую версию. Если в значении и протоколе есть проверяемая версия, можно не позволить более старому событию затереть новое. Без такого механизма команда честно ограничивает последствие TTL и принимает возможное расхождение витрины. Нельзя утверждать, что одно удаление полностью устранило гонку.\u003c/p\u003e\u003cp\u003eНаконец, отключаем Redis на стенде. Обход к источнику ограничен, каталог может показать упрощённое представление или временный отказ, а оформление сохраняет приоритет. Сравниваем нагрузку базы с её подтверждённым бюджетом. Если полный fallback не помещается, это не провал теста, который следует скрыть увеличением таймаута; это требование явного режима деградации. Результат решения — быстрое обычное чтение и предсказуемое поведение вне обычного режима.\u003c/p\u003e"},"expedition":{"world":"search","title":"Экспедиция: кэш результатов поиска","html":"\u003cp\u003eУ учебного сервиса поиска по объявлениям часто повторяются запросы «велосипед» и «детская коляска». Кажется, достаточно закэшировать список по строке запроса. Но результат зависит ещё от города, фильтров, сортировки, языка, прав и версии ранжирования. Неполный ключ смешивает разные вопросы. Персонализация дополнительно снижает повторное использование и увеличивает число значений.\u003c/p\u003e\u003cp\u003eПереносится договор о допустимой устарелости. Объявление может быть уже снято, но ещё присутствовать в поисковой копии. Открытие карточки должно корректно сообщить актуальное состояние; переход к сделке требует авторитетной проверки. Новое — стоимость разнообразия запросов: длинный хвост уникальных строк заполняет память значениями, которые никогда не прочитают повторно. Политика допуска в кэш может быть важнее агрессивного сохранения каждого результата.\u003c/p\u003e\u003cp\u003eЕщё одно отличие — влияние обновления модели ранжирования. Ключ с версией модели разделяет результаты старого и нового алгоритмов и делает сравнение объяснимым. Но при переключении всё пространство становится холодным, поэтому план выпуска включает прогрев или ограничение заполнения. Экспедиция учит видеть кэш как управление повторно используемой работой. Кэшировать имеет смысл не потому, что операция называется поиском, а потому, что достаточно одинаковых вопросов допускают достаточно одинаковые ответы.\u003c/p\u003e","transfer":["Семантически полный ключ","Авторитетная проверка перед обязательством"],"distinct":["Длинный хвост запросов","Версия ранжирования и персонализация"]},"diagrams":[{"title":"Cache-aside: два пути одного чтения","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-07-0-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eCache-aside: два пути одного чтения\u003c/text\u003e\u003crect x=\"30\" y=\"85\" width=\"185\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"122.5\" y=\"126.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eПриложение\u003c/text\u003e\u003cline x1=\"215\" y1=\"120\" x2=\"280\" y2=\"120\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-07-0-arr)\"/\u003e\u003crect x=\"280\" y=\"85\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"380.0\" y=\"114.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eGET key\u003c/text\u003e\u003ctext x=\"380.0\" y=\"138.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eКэш\u003c/text\u003e\u003cline x1=\"480\" y1=\"120\" x2=\"550\" y2=\"120\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-07-0-arr)\"/\u003e\u003crect x=\"550\" y=\"85\" width=\"180\" height=\"70\" rx=\"12\" fill=\"#dff4e8\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"640.0\" y=\"126.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eHit: ответ\u003c/text\u003e\u003cline x1=\"380\" y1=\"155\" x2=\"380\" y2=\"230\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-07-0-arr)\"/\u003e\u003ctext x=\"395\" y=\"197\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eMiss\u003c/text\u003e\u003crect x=\"280\" y=\"230\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"380.0\" y=\"259.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eЧтение источника\u003c/text\u003e\u003ctext x=\"380.0\" y=\"283.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003ePostgreSQL\u003c/text\u003e\u003cline x1=\"380\" y1=\"300\" x2=\"380\" y2=\"360\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-07-0-arr)\"/\u003e\u003crect x=\"280\" y=\"360\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"380.0\" y=\"398.5\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eSET key + TTL\u003c/text\u003e\u003cline x1=\"480\" y1=\"392\" x2=\"640\" y2=\"392\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-07-0-arr)\"/\u003e\u003cline x1=\"640\" y1=\"392\" x2=\"640\" y2=\"155\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003ctext x=\"30\" y=\"270\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eКлюч включает\u003c/text\u003e\u003ctext x=\"30\" y=\"300\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eрегион, язык,\u003c/text\u003e\u003ctext x=\"30\" y=\"330\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eверсию и права.\u003c/text\u003e\u003ctext x=\"28\" y=\"451\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eПотеря копии допустима; потеря авторитетного заказа — другая задача.\u003c/text\u003e","caption":"При попадании путь короткий. Промах добавляет чтение базы и заполнение, которое также может дать ошибку. Полный ключ обязан отличать невзаимозаменяемые ответы. Эта схема не описывает протокол конкурентного обновления — следующая показывает его отдельную гонку."},{"title":"Гонка заполнения после инвалидации","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-07-1-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eГонка заполнения после инвалидации\u003c/text\u003e\u003crect x=\"25\" y=\"65\" width=\"180\" height=\"50\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"115.0\" y=\"96.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eЧитатель\u003c/text\u003e\u003cline x1=\"115\" y1=\"115\" x2=\"115\" y2=\"385\" stroke=\"#8da4b4\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"/\u003e\u003crect x=\"290\" y=\"65\" width=\"180\" height=\"50\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"380.0\" y=\"96.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eБаза\u003c/text\u003e\u003cline x1=\"380\" y1=\"115\" x2=\"380\" y2=\"385\" stroke=\"#8da4b4\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"/\u003e\u003crect x=\"555\" y=\"65\" width=\"180\" height=\"50\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"645.0\" y=\"96.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eПисатель\u003c/text\u003e\u003cline x1=\"645\" y1=\"115\" x2=\"645\" y2=\"385\" stroke=\"#8da4b4\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"/\u003e\u003cline x1=\"115\" y1=\"158\" x2=\"380\" y2=\"158\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-07-1-arr)\"/\u003e\u003ctext x=\"142\" y=\"146\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eЧтение v1\u003c/text\u003e\u003cline x1=\"645\" y1=\"213\" x2=\"380\" y2=\"213\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-07-1-arr)\"/\u003e\u003ctext x=\"422\" y=\"201\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eЗапись v2\u003c/text\u003e\u003ctext x=\"450\" y=\"263\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eЗатем удалить key\u003c/text\u003e\u003cline x1=\"380\" y1=\"285\" x2=\"115\" y2=\"285\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-07-1-arr)\"/\u003e\u003ctext x=\"140\" y=\"273\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eСтарый ответ v1\u003c/text\u003e\u003crect x=\"35\" y=\"332\" width=\"320\" height=\"54\" rx=\"12\" fill=\"#f7dfda\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"195.0\" y=\"365.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eЧитатель: SET key = v1\u003c/text\u003e\u003ctext x=\"35\" y=\"422\" font-family=\"Arial, sans-serif\" font-size=\"19\" fill=\"#a43e32\" text-anchor=\"start\" font-weight=\"400\"\u003eКэш снова старый после удаления.\u003c/text\u003e\u003ctext x=\"35\" y=\"448\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eНужны версии/порядок или явное ограничение последствий TTL.\u003c/text\u003e","caption":"Читатель успел получить старую версию, но отложил заполнение. Писатель уже сохранил новую и удалил ключ; позднее старое заполнение вернуло устаревшую копию. На схеме кэш обозначен операциями, а не четвёртой линией, чтобы выделить порядок причин."}],"decision":{"prompt":"Как ускорить редактируемую витрину?","options":[{"title":"Cache-aside с TTL и защитой заполнения","consequence":"Повторные чтения обходят источник, потеря кэша допускает восстановление.","tradeoff":"Краткая устарелость и гонки требуют явного ограничения; fallback должен быть рассчитан."},{"title":"Без удалённого кэша, улучшить исходное чтение","consequence":"Меньше копий и проще свежесть.","tradeoff":"Источнику нужна достаточная мощность; возможно, он уже достиг разумного предела."},{"title":"Событийно обновляемая проекция витрины","consequence":"Представление строится заранее под чтение.","tradeoff":"Появляются доставка изменений, порядок, восстановление и наблюдение отставания."}],"recommended":0,"explanation":"Для повторяемых карточек с допустимой короткой устарелостью cache-aside даёт простую пользу. При строгой свежести или высокой изменчивости основания нужно пересмотреть."},"exercise":{"prompt":"Почему TTL не доказывает свежесть значения?","model":"\u003cp\u003eОн ограничивает использование конкретного заполнения, но заполнение могло получить старые данные или прийти после более нового изменения. Нужен анализ происхождения и порядка, а не только срока.\u003c/p\u003e","rubric":["Различены возраст записи кэша и свежесть факта","Приведена гонка заполнения"]},"checkpoint":[{"question":"Какой ответ можно отрицательно кэшировать как факт отсутствия?","options":["Подтверждённое отсутствие объекта с выбранным коротким сроком","Любой таймаут источника","Любую ошибку соединения с базой"],"answer":0,"explanation":"Недоступность источника не означает отсутствия объекта."},{"question":"Кэш исчез. Что определяет безопасность fallback?","options":["Мощность источника и ограничение обходной нагрузки","Только прежний hit rate","Само наличие TTL у ключей"],"answer":0,"explanation":"Полный поток промахов может многократно превысить обычную нагрузку источника."}],"sources":[{"title":"Redis: key eviction, policies and memory buffers","url":"https://redis.io/docs/latest/develop/reference/eviction/"},{"title":"Redis: EXPIRE semantics","url":"https://redis.io/docs/latest/commands/expire/"},{"title":"Redis: client-side caching and invalidation","url":"https://redis.io/docs/latest/develop/clients/client-side-caching/"},{"title":"RFC 5861: stale cache-control extensions","url":"https://www.rfc-editor.org/rfc/rfc5861"},{"title":"PostgreSQL 18: transaction isolation, source read semantics","url":"https://www.postgresql.org/docs/18/transaction-iso.html"}],"wordCount":1571},{"id":"ch-08","arc":2,"title":"Когда память распределена: Redis, Ignite, отказ и стоимость","briefing":"После главы 07 понятно, что именно кэширует витрина. Теперь её набор вырос, и команда сравнивает Redis с Apache Ignite. Нужен разбор устройства и границ гарантий: распределённая память бывает кэшем, вычислительной платформой и самостоятельным хранилищем, а одинаковый список функций ещё не означает взаимозаменяемость.","goals":["Сравнить Redis, Ignite 2 и Ignite 3 по модели данных и отказов","Разделить разделение данных, репликацию и долговечность","Посчитать память с копиями и понять цену восстановления"],"sections":[{"title":"Распределить данные и скопировать данные — разные действия","html":"\u003cp\u003eШардирование делит набор между узлами: один обслуживает часть ключей, другой — другую. Репликация создаёт дополнительные копии части или всего набора. Первое увеличивает доступную ёмкость и потенциальную параллельность, второе помогает пережить отказ и иногда масштабирует чтение. Если распределить все ключи без копий, падение одного узла оставит часть набора недоступной или потерянной. Если полностью скопировать всё на каждый узел, память каждого по-прежнему ограничивает полный набор.\u003c/p\u003e\u003cp\u003eВыбор узла связывает ключ с разделом и владельцем. Клиент может знать расположение или сначала обратиться к узлу, который перенаправит запрос. Изменение состава требует перемещения данных, обновления маршрута и обработки работы во время перехода. Rebalance — перераспределение — расходует сеть, процессор и ввод-вывод одновременно с пользовательским потоком. Добавить узел в заполненный кластер не значит мгновенно получить свободную мощность без переходного риска.\u003c/p\u003e\u003cp\u003eГорячий ключ остаётся горячим даже при сотне разделов, если одна популярная карточка обслуживается одним владельцем. Возможны локальные копии, реплики чтения или изменение представления, но каждое решение меняет свежесть и путь записи. Поэтому перед продуктовым сравнением записываем профиль: чтение по ключу или SQL, размер значения, доля обновлений, горячие объекты, допустимая потеря, поведение без памяти. Эти свойства лучше объясняют выбор, чем общий ярлык «in-memory».\u003c/p\u003e"},{"title":"Redis: структуры и атомарность без лишних обещаний","html":"\u003cp\u003eRedis предлагает доступ к строкам, хешам, множествам, упорядоченным множествам и другим структурам через команды. Для витрины можно хранить сериализованную карточку, для ограничителя — счётчик с аккуратно заданным сроком. Команды выполняют предметную работу ближе к данным, уменьшая число сетевых обменов. При этом нельзя считать любую команду одинаково дешёвой: операции с большими коллекциями или длительный скрипт способны задержать другой трафик соответствующего узла.\u003c/p\u003e\u003cp\u003eMULTI/EXEC группирует последовательность команд без вмешательства команд других клиентов в середине исполнения этой группы. WATCH позволяет обнаружить конкурентное изменение перед EXEC. Но Redis не предоставляет привычный откат уже исполненных команд при произвольной ошибке во время исполнения: ошибочный элемент не превращает все предыдущие результаты в несуществовавшие. Поэтому транзакцию PostgreSQL из главы 04 нельзя механически переписать в список Redis-команд и считать гарантии одинаковыми.\u003c/p\u003e\u003cp\u003eRedis Cluster распределяет пространство ключей по 16384 хеш-слотам. Это не число серверов: узлы владеют диапазонами слотов. Для многих многоключевых операций ключи должны находиться в одном слоте; hash tags позволяют намеренно совместить их. Но принудительная совместность большого семейства ключей может создать перекос. Перенос остатков склада в кластер требует анализа границы атомарности и отказа, даже если прототип с одним узлом работал быстро. Для текущего курса Redis пока обслуживает восстанавливаемые копии, а авторитетные заказы остаются в PostgreSQL.\u003c/p\u003e"},{"title":"Redis: диск и реплика не одна страховка","html":"\u003cp\u003eRDB сохраняет снимок набора, AOF — журнал изменений с выбранной политикой синхронизации. Снимок удобен для загрузки, но изменения после последнего снимка не становятся сохранёнными только из-за его наличия. AOF с периодической синхронизацией и синхронизацией каждой записи имеют разную цену и окно потери при сбое. Перезапись журнала и создание снимка требуют дополнительных ресурсов; фоновая работа не означает отсутствие влияния на память и задержки.\u003c/p\u003e\u003cp\u003eРепликация Redis по умолчанию асинхронная. Основной узел может подтвердить изменение до получения его репликой; при последующем отказе и переключении подтверждённое изменение может отсутствовать на выбранной копии. WAIT позволяет дождаться определённого числа подтверждений реплик, но не превращает систему в хранилище со строгой согласованностью при любом переключении. Нужно также знать политику сохранения, выбор новой основной копии и конкретный сценарий отказа.\u003c/p\u003e\u003cp\u003eSentinel помогает наблюдать и переключать основной узел в соответствующей топологии; Cluster добавляет распределение слотов и собственную координацию. Эти механизмы не заменяют резервную копию против ошибочного удаления. Для восстанавливаемой витрины потеря последней записи часто означает промах и повторное чтение. Для единственного финансового обязательства это уже другой класс риска. Одна и та же конфигурация не должна автоматически обслуживать обе роли только потому, что тест скорости показал хорошее число.\u003c/p\u003e"},{"title":"Ignite 2: data grid, affinity и выбранный режим","html":"\u003cp\u003eApache Ignite 2 объединяет распределённые данные, key-value API, SQL-доступ и вычисления рядом с данными. В partitioned cache ключи распределяются по разделам, у раздела есть основное размещение и настроенные backup-копии. Значение backups=1 означает одну дополнительную копию, а не одну копию всего. Affinity — правило совместного размещения связанных данных — позволяет держать заказ и нужные для расчёта сведения рядом, уменьшая сетевое перемещение при определённых операциях.\u003c/p\u003e\u003cp\u003eСлово cache в API Ignite 2 не доказывает, что содержимое является необязательной копией PostgreSQL. Возможны работа без дисковой сохранности, интеграция с внешним хранилищем и native persistence. При собственной сохранности данные разделов и журнал участвуют в восстановлении; выбранный режим WAL определяет, какие сбои переживает подтверждение. Например, гарантии при падении процесса и при потере питания нельзя смешивать. Это изменение роли хранилища, а не настройка косметического ускорения.\u003c/p\u003e\u003cp\u003eВ Ignite 2 режим ATOMIC не даёт общей транзакции для произвольного набора ключей; bulk-операции могут частично завершиться. TRANSACTIONAL включает транзакции key-value API с соответствующей ценой и правилами. Нельзя автоматически распространять эти гарантии на любую SQL-команду и любой движок версии 2: документация разделяет возможности API и режима. Если проект требует согласованного изменения нескольких ресурсов, в решении указывают точный режим, интерфейс и ограничения, а не пишут просто «Ignite поддерживает ACID».\u003c/p\u003e"},{"title":"Ignite 3: другая архитектура, не переименование","html":"\u003cp\u003eВ ветке Ignite 3 модель строится вокруг таблиц, distribution zones и storage profiles. Зона распределения определяет размещение и репликацию разделов, профиль — используемый движок хранения и его конфигурацию. Возможны постоянное и volatile-хранение; сама работа в памяти не сообщает, переживёт ли набор остановку кластера. Понятия и настройки Ignite 2 нельзя переносить по совпадению названий: переход требует проверки API, SQL, форматов и процедур миграции.\u003c/p\u003e\u003cp\u003eРазделы Ignite 3 реплицируются с использованием Raft-групп; для изменения требуется доступная согласующая группа по правилам конфигурации. Это иной механизм, чем асинхронное копирование Redis с последующим выбором реплики. Количество копий и состав голосующих участников нельзя угадывать по слову «реплика»: проверяют документацию выбранного выпуска и зоны. Подробно большинство, выбор лидера и поведение при сетевом разделении рассмотрим в главе 19. Сейчас достаточно понять: потеря связи может приводить к отказу записи ради сохранения выбранной гарантии.\u003c/p\u003e\u003cp\u003eВ Ignite 3 операции Table и SQL API выполняются в явных или неявных транзакциях. Документация отдельно описывает read-write и read-only режимы, блокировки и поведение при ошибках. При восстановимой ошибке повторяемая функция не должна выполнять необратимые внешние действия при каждой попытке. Даже распределённая транзакция внутри Ignite не включает произвольную отправку денег партнёру. Материал проверен по официальным страницам веток 2 и 3 на дату редакции; перед внедрением фиксируют точный релиз, потому что набор возможностей и эксплуатационные условия меняются.\u003c/p\u003e"},{"title":"Сравнивать по работе и считать полную память","html":"\u003cp\u003eДля чтения карточки по ключу Redis даёт простой прямой путь и знакомую многим командам эксплуатацию. Если нужен распределённый SQL, совместное размещение и вычисления рядом с большим набором, Ignite решает другой класс задач. PostgreSQL также может оставаться достаточным без отдельного слоя. Сравнение должно включать разработку, наблюдаемость, обновления, резервирование и людей, которые смогут восстановить систему ночью.\u003c/p\u003e\u003cp\u003eПамять считают не только по полезным байтам. Нужны ключи, служебные структуры, индексы, копии, фрагментация, буферы репликации, запас на переходы и фоновые операции. При потере узла оставшиеся принимают дополнительную работу; при восстановлении сеть занята переносом. Поэтому конфигурация, заполненная почти до предела в обычном режиме, может не пережить именно тот отказ, ради которого добавляли копии. Дисковая сохранность также требует бюджета журнала и проверки времени загрузки.\u003c/p\u003e\u003cp\u003eДля наглядности сведём разные контракты, не объявляя победителя. \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eКритерий\u003c/th\u003e\u003cth\u003eRedis\u003c/th\u003e\u003cth\u003eIgnite 2\u003c/th\u003e\u003cth\u003eIgnite 3\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eОсновной взгляд\u003c/td\u003e\u003ctd\u003eКлючи и структуры\u003c/td\u003e\u003ctd\u003eКэши/data grid, SQL и compute\u003c/td\u003e\u003ctd\u003eТаблицы, зоны, SQL и compute\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eРаспределение\u003c/td\u003e\u003ctd\u003eCluster: хеш-слоты\u003c/td\u003e\u003ctd\u003eРазделы и affinity\u003c/td\u003e\u003ctd\u003eРазделы зон\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eГраница записи\u003c/td\u003e\u003ctd\u003eКоманды, MULTI/EXEC; ограничения слотов\u003c/td\u003e\u003ctd\u003eЗависит от ATOMIC/TRANSACTIONAL и API\u003c/td\u003e\u003ctd\u003eЯвные/неявные транзакции API\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eСохранность\u003c/td\u003e\u003ctd\u003eRDB/AOF и их настройки\u003c/td\u003e\u003ctd\u003eNative persistence и режим WAL либо внешнее хранение\u003c/td\u003e\u003ctd\u003eВыбранный storage profile/engine\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/p\u003e\u003cp\u003eИтоговый эксперимент одинаков для кандидатов: рабочие данные, горячий ключ, потеря узла, заполнение памяти и восстановление. Если тест сравнивает голый GET с распределённым соединением таблиц, он сравнивает разные задачи. Для нашего текущего проекта нет основания переносить источник заказов в память. Достаточно управляемого кэша витрины с предсказуемым обходом; Ignite оставляем осмысленной альтернативой для будущих требований, а не обязательной ступенью взросления.\u003c/p\u003e"}],"workedExample":{"title":"Сколько стоит «двадцать гигабайт в памяти»","html":"\u003cp\u003eПолезные значения витрины занимают учебные 20 ГиБ. Измеренный на выбранном формате коэффициент ключей и служебных структур равен 1,6, значит, одна полная логическая копия требует около 32 ГиБ. Это измерение конкретной формы данных, а не универсальная константа Redis или Ignite. С одной дополнительной копией совокупный объём уже 64 ГиБ до резерва. Если оставляем 30 процентов ёмкости свободными, требуется примерно 64 / 0,7 = 91,4 ГиБ суммарно доступной памяти для этого бюджета. Затем отдельно учитываем компоненты, не вошедшие в измеренный коэффициент.\u003c/p\u003e\u003cp\u003eРаспределим данные по трём узлам. Среднее размещение не гарантирует равномерность: популярный ключ и неудачная affinity могут сосредоточить работу. При потере одного узла проверяем не только наличие второй копии, но и способность оставшихся обслужить повышенный поток. Во время возвращения узла идёт перенос разделов или синхронизация реплики. Если тестировали только устойчивое состояние, самое тяжёлое окно пропустили.\u003c/p\u003e\u003cp\u003eТеперь оценим смысл потери. В Redis для витрины исчезновение недавнего ключа восстанавливается чтением PostgreSQL. Перенос авторитетного резерва в ту же конфигурацию сделал бы потерю подтверждённого изменения недопустимой. Наличие AOF и реплики требует отдельной проверки режима и модели отказов; нельзя вывести сохранность из количества галочек.\u003c/p\u003e\u003cp\u003eДля Ignite 2 дополнительно проверяем backups, atomicity mode, persistence и WAL; для Ignite 3 — зону, профиль, реплики и протокол транзакции выбранного выпуска. Кандидат, который быстрее в обычном чтении, может потребовать больше работы эксплуатации или не пройти нужный сценарий восстановления. Выбираем Redis как восстанавливаемый слой текущей витрины, а не как замену всех хранилищ. Решение включает возможность отказаться от удалённого кэша, если стоимость эксплуатации превышает доказанную экономию.\u003c/p\u003e"},"expedition":{"world":"inventory","title":"Экспедиция: расчёт остатков по сети складов","html":"\u003cp\u003eУ учебного оптового сервиса тысячи складов и сложный расчёт доступного обещания: свободное наличие, резерв, ожидаемая поставка и ограничения перемещения. Запрос может требовать объединить много связанных записей. Здесь распределённая платформа с совместным размещением данных и вычислений выглядит интереснее простого кэша готовой карточки. Но нужно сначала решить, является расчёт приблизительной подсказкой или обязательством перед покупателем.\u003c/p\u003e\u003cp\u003eЕсли это предварительная витрина, можно допустить отставание и хранить вычисленное представление. Если это окончательное обещание, последующее резервирование должно защищать ограниченные ресурсы в своей авторитетной границе. Быстрое распределённое вычисление по копиям не создаёт резерв. Совместное размещение помогает уменьшить сеть, но выбранный ключ может сделать один крупный склад горячим и усложнить балансировку.\u003c/p\u003e\u003cp\u003eПереносится оценка памяти с копиями и проверка восстановления. Новое — география связей: какие данные должны быть рядом и какие соединения пойдут через сеть. Для такого профиля Ignite можно исследовать всерьёз с конкретной версией и тестом запроса. Redis также может хранить подготовленный результат, но это другой способ решить задачу, с иной свежестью и процессом пересчёта. Насмотренность — сравнить два законченных пути получения ответа, включая обновление и отказ, а не два названия в одинаковом столбце «быстро».\u003c/p\u003e","transfer":["Разделение подсказки и обязательства","Бюджет копий и переходных режимов"],"distinct":["Распределённые соединения","Affinity и горячий склад"]},"diagrams":[{"title":"Разделить набор и добавить копии","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-08-0-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eРазделить набор и добавить копии\u003c/text\u003e\u003ctext x=\"35\" y=\"78\" font-family=\"Arial, sans-serif\" font-size=\"20\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eОдин раздел P0: основное размещение + backup\u003c/text\u003e\u003crect x=\"35\" y=\"105\" width=\"190\" height=\"52\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#
