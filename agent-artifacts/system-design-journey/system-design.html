<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Системы: путь архитектора</title><style>
:root{--bg:#f3f1ea;--paper:#fffdf7;--ink:#18352f;--muted:#53685f;--line:#ced7cc;--accent:#19644c;--soft:#e3eddf;--gold:#a55a22}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 system-ui,sans-serif}body.dark{--bg:#14221f;--paper:#1b302a;--ink:#edf2e8;--muted:#bbcec1;--line:#3d574b;--accent:#9dd6af;--soft:#294338;--gold:#edbe89}a{color:var(--accent);text-underline-offset:4px}button,input,textarea{font:inherit}button,.button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:.55rem .85rem;cursor:pointer}button:hover,.button:hover{background:var(--soft)}:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.skip{position:absolute;top:-100px}.skip:focus{top:0;background:var(--paper);z-index:9}header{padding:16px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--paper)}.top{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:-.03em;flex:1;min-width:170px}.brand small{display:block;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}nav{display:flex;gap:12px;flex-wrap:wrap}nav a{font-size:14px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{font-size:14px}main{max-width:1200px;margin:auto;padding:36px 20px 90px}h1{font:650 clamp(2rem,5vw,3.8rem)/1.13 system-ui;letter-spacing:-.045em;margin:.3em 0 .5em}h2{font-size:1.6rem;line-height:1.3;letter-spacing:-.02em;margin:2em 0 .7em}h3{line-height:1.4}p{margin:.9em 0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:700}.lead{font-size:1.2rem;color:var(--muted);max-width:800px}.muted{color:var(--muted)}.hero{max-width:920px;padding:12px 0 32px}.stats{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}.stats strong{font-size:1.5rem;display:block}.stats span{font-size:13px;color:var(- </style></head><body><a class="skip" href="#main">К содержимому</a><header><div class="top"><div class="brand"><small>Северный маршрут · архитектурная история</small>Системы: путь архитектора</div><nav aria-label="Основная навигация"><a href="#home">Путь продукта</a><a href="#atlas">Атлас миров</a><a href="#glossary">Словарь</a><a href="#notes">Портфель</a><a href="index.html">В учебник ↗</a></nav><div class="tools"><button id="searchOpen">Поиск</button><button id="theme" aria-label="Сменить цветовую тему">Тема ◐</button></div></div></header><div id="warning" class="warning hidden" role="status"></div><main id="main" tabindex="-1"></main><div id="live" class="status" aria-live="polite"></div><dialog id="searchDialog" aria-labelledby="searchTitle"><h2 id="searchTitle">Поиск по всему пути</h2><input type="search" id="searchInput" aria-label="Поиск по тексту глав и миров" placeholder="Например: идемпотентность"><div id="searchResults" class="search-results"></div><button data-close="searchDialog">Закрыть</button></dialog><dialog id="exportDialog" aria-labelledby="exportTitle"><h2 id="exportTitle">Ваш портфель JSON</h2><p>Содержит заметки, решения и учебный прогресс. Скопируйте или скачайте файл.</p><textarea id="exportText" readonly aria-label="Содержимое портфеля JSON"></textarea><div class="navrow"><button id="copyExport">Копировать JSON</button><button id="downloadExport">Скачать JSON</button><button data-close="exportDialog">Закрыть</button></div><p id="exportStatus" role="status"></p></dialog><script>
'use strict';const DATA={"chapters":[{"id":"ch-01","arc":1,"title":"Первый заказ и карта системы","briefing":"«Северный маршрут» запускает доставку в одном регионе: небольшая команда, web и mobile, 500 заказов в сутки. Нужно открыть двери и не потерять смысл обещания клиенту. Все числа, инциденты и решения в истории учебные.","goals":["Отделить пользовательское обещание от набора технологий","Построить карту компонентов и границ ответственности","Превратить неопределённое требование в проверяемый сценарий"],"sections":[{"title":"Система начинается с обещания","html":"\u003cp\u003eПокупатель выбирает товары, видит окончательную цену и нажимает «Оформить». Для него система — возможность получить нужное в согласованное окно. Для разработчика это несколько процессов, сеть и база данных. Архитектура связывает два взгляда: описывает, какими механизмами техническая система сохраняет бизнес-обещание при изменении нагрузки, требований и условий работы. Назвать PostgreSQL, Kubernetes и Redis ещё не значит объяснить архитектуру. Нужно показать, где существует заказ, кто меняет его состояние и что произойдёт при оборванном соединении.\u003c/p\u003e\u003cp\u003eПервое действие команды — определить границу продукта. На старте сервис принимает заказ и передаёт его оператору склада. Собственный поиск по миллионам товаров, динамические маршруты и машинное обучение не входят в обещание первого выпуска. Это не запрет на развитие: ограниченная граница позволяет довести до рабочего состояния целый пользовательский путь. Нарисованная, но не обслуживаемая интеграция не становится возможностью продукта.\u003c/p\u003e\u003cp\u003eУ слова «успех» также должна появиться граница. Если экран показал номер, но запись существует только в памяти процесса, команда пока не обеспечила сохранность заказа. Если запись сохранена, но клиент получил таймаут, результат операции неизвестен клиенту, хотя известен серверу. Эти состояния различаются уже при 500 заказах в сутки. Масштаб меняет частоту проблем, а не делает корректность необязательной. Поэтому первый архитектурный вопрос звучит так: какое наблюдаемое событие подтверждает принятое обязательство и где останется его свидетельство?\u003c/p\u003e"},{"title":"Карта из компонентов и стрелок","html":"\u003cp\u003eНачальная карта содержит клиент, сервер приложения, PostgreSQL и оператора. Клиент отвечает за интерфейс и временное состояние формы. Сервер проверяет вход, исполняет правила заказа и обращается к хранилищу. База сохраняет согласованные записи. Оператор выполняет физический процесс, который нельзя завершить SQL-командой. Внешнюю платёжную систему пока заменяет оплата при получении: это осознанная граница первой версии, а не потерянный компонент.\u003c/p\u003e\u003cp\u003eСтрелка на карте должна означать конкретное взаимодействие. «Клиент → приложение» — запрос создать заказ с составом корзины и адресом. «Приложение → база» — транзакция записи заказа и его строк. «Оператор → приложение» — смена состояния после сборки. Подпись «данные» слишком широка: она скрывает, кто инициатор, может ли запрос повториться и ждёт ли отправитель ответа. На одной схеме полезно показывать развёртываемые процессы, на другой — последовательность одного сценария. Смешение уровней превращает карту в красивую, но бесполезную коллекцию значков.\u003c/p\u003e\u003cp\u003eКомпонент не равен отдельному сервису. Модули каталога, заказа и доставки могут жить внутри одного приложения, иметь явные интерфейсы и выпускаться вместе. При этом база находится в другом процессе и уже создаёт настоящую сетевую границу. Для небольшой команды модульный монолит уменьшает количество независимых отказов и сложность развёртывания. Разделять его позднее стоит по наблюдаемому конфликту требований, а не по числу существительных в предметной области.\u003c/p\u003e"},{"title":"Состояние, вычисление и источник истины","html":"\u003cp\u003eСостояние — сведения, которые нужны после завершения текущего запроса. Цена, применённая при оформлении, должна пережить изменение каталога. Адрес доставки должен сохраниться, даже если пользователь позже обновит профиль. Вычисление — действие над входом и состоянием: проверить ограничения, рассчитать итог, выбрать доступное окно. Смешение этих вещей рождает опасную надежду: «Мы всегда сможем пересчитать прошлый заказ». Пересчёт по сегодняшним правилам может дать другое обещание.\u003c/p\u003e\u003cp\u003eИсточник истины — место, чьё состояние используется для разрешения конкретного спора. Для принятого заказа на старте это PostgreSQL. Письмо клиенту и экран оператора являются представлениями этой записи. Источник истины не означает безошибочность информации: неправильно введённый адрес останется неправильным и в надёжной базе. Речь о том, какой факт система признаёт авторитетным после расхождения копий. Для физического остатка позднее может потребоваться отдельный процесс инвентаризации: цифровой счётчик не отменяет потерянную коробку.\u003c/p\u003e\u003cp\u003eТакое разделение помогает оценивать новые компоненты. Если кэш исчезнет, можно ли восстановить его из базы? Если да, его отказ должен ухудшить скорость, а не отменить заказ. Если журнал оператора — единственное свидетельство передачи курьеру, его уже нельзя считать необязательной диагностикой. Стоимость восстановления определяется смыслом данных, а не размером файла. Эта мысль станет основой разговоров о транзакциях, репликации и резервных копиях.\u003c/p\u003e"},{"title":"От сценария к измеримому качеству","html":"\u003cp\u003eФункциональное требование описывает действие: создать заказ, отменить его до сборки, показать статус. Требование качества задаёт условия исполнения: сколько запросов, какой объём данных, какая допустимая задержка, какие потери исключены. «Должно работать быстро» не помогает выбрать механизм. Полезнее записать учебную гипотезу: при согласованном профиле нагрузки 95 процентов запросов просмотра каталога завершаются быстрее 300 миллисекунд. Это не универсальная норма; значение должно иметь связь с интерфейсом и ожиданиями бизнеса.\u003c/p\u003e\u003cp\u003eСреднее время скрывает хвост распределения. Если 99 запросов завершились за 100 миллисекунд, а один за 10 секунд, среднее выглядит терпимо, но конкретный клиент долго не понимал результат оформления. Процентиль показывает границу для доли наблюдений, однако его надо сопровождать периодом, размером выборки и описанием ошибок. Исключить таймауты из статистики значит искусственно улучшить картину. Показатель создания заказа также нельзя смешивать с показателем статического изображения: они проверяют разные обязательства.\u003c/p\u003e\u003cp\u003eНадёжность начинается с модели отказов. В этой арке рассматриваются падение одного процесса, сетевой таймаут, повтор запроса и недоступность одного узла. Одновременная потеря всех площадок пока не закрыта архитектурой первого выпуска; это фиксируется как риск и последующая работа. Явная граница честнее заявления «система отказоустойчива». Для каждого риска назначают наблюдение, способ восстановления и человека или процесс, который запускает восстановление.\u003c/p\u003e"},{"title":"Нагрузка: числа как инструмент мысли","html":"\u003cp\u003e500 заказов в сутки дают около 0,006 создания заказа в секунду при равномерном распределении. Но равномерность здесь выдумана: реклама может привести десятки клиентов одновременно, каталог читают гораздо чаще, а один экран выполняет несколько запросов. Поэтому расчёт начинается с профиля: число активных покупателей в пике, частота действий, доля чтения и записи, размер ответа. Заказы в сутки полезны для бизнеса, но недостаточны для оценки сетевых соединений и очередей.\u003c/p\u003e\u003cp\u003eДопустим, в рекламный пик 200 пользователей открывают по три страницы за минуту. Это примерно 10 просмотров в секунду. Если каждый просмотр порождает восемь запросов, сервер видит около 80 запросов в секунду. При среднем нахождении запроса внутри системы 0,2 секунды среднее число одновременно обрабатываемых запросов близко к 16 в устойчивом режиме. Это применение закона Литтла: среднее число работ равно интенсивности поступления, умноженной на среднее время пребывания. Процентили в эту формулу подставлять нельзя.\u003c/p\u003e\u003cp\u003eРасчёт не доказывает производительность конкретного сервера. Он показывает порядок величин и места, где допущение влияет на вывод. Если время выросло из-за ожидания базы, одновременно занятых обработчиков станет больше без роста пользовательской активности. Добавление потоков может увеличить давление на базу. Архитектор использует числа, чтобы сформулировать проверяемую гипотезу для измерения, а не чтобы заменить измерение уверенной таблицей.\u003c/p\u003e"},{"title":"Решение, которое можно пересмотреть","html":"\u003cp\u003eУ команды будет одна серверная программа, одна основная PostgreSQL и автоматизированная резервная копия с проверкой восстановления. Это ещё не высокая доступность: при остановке базы оформление временно недоступно. Зато граница согласованности проста, выпуск можно отладить, а небольшой объём операций не требует распределённого хранения. Внутри приложения каталог не должен напрямую менять строки заказа: внутренние контракты сохраняют смысл модулей без сетевого усложнения.\u003c/p\u003e\u003cp\u003eПричину выбора фиксируют короткой записью решения: контекст, рассмотренные альтернативы, принятое решение, последствия и сигнал пересмотра. Сигналом может стать независимый темп развития команд, подтверждённый предел мощности или необходимость особой изоляции. Формулировка «перейти на микросервисы при росте» слишком размыта: непонятно, какой именно рост имеет значение. Число клиентов само по себе не показывает, какую границу надо разделить.\u003c/p\u003e\u003cp\u003eСразу нужен сквозной идентификатор запроса и номер заказа, связанный с ним в журналах. Поиск «клиент жалуется, что ничего не произошло» должен приводить к конкретному пути. Нельзя складывать в журнал полные адреса и секреты ради удобства отладки. Наблюдаемость — способность восстановить объяснение работы по ограниченным свидетельствам. Для первой главы достаточно связать вход запроса, исход записи и ответ, чтобы дальнейшие инциденты можно было разбирать по фактам.\u003c/p\u003e"}],"workedExample":{"title":"Открытие рекламной кампании","html":"\u003cp\u003eКоманда ожидает 500 заказов за день и предлагает сразу три сервиса: каталог, корзина и оформление. Сначала проверим, какую проблему решает разделение. Если все три сервиса обслуживает та же команда, выпускает одновременно и хранит на одной машине, независимость пока номинальная. Зато сетевые вызовы и обработка частичного успеха уже появились. Возвращаемся к карте сценария: для первого заказа требуется прочитать каталог, проверить ввод и атомарно записать заказ со строками. Это помещается в одно приложение и одну транзакцию.\u003c/p\u003e\u003cp\u003eТеперь отделим среднее от пика. Из 500 оформлений 150 могут прийти за десять минут после рассылки: 0,25 оформления в секунду. Для каталога предположим 40 просмотров на оформление, получаем около 10 просмотров в секунду именно в этом окне. Если фотография весит 300 килобайт, а страница содержит десять фотографий, передача изображений может доминировать над JSON заказа. Значит, прежде чем разделять бизнес-код, надо проверить статические ресурсы и сетевой бюджет страницы. Все коэффициенты — гипотезы, которые заменят наблюдения запуска.\u003c/p\u003e\u003cp\u003eВ проектном решении фиксируем три разных исхода. Запись не началась: пользователь может повторить действие. Запись откатилась: заказ не принят. Запись завершилась, ответ потерян: состояние неизвестно клиенту, требуется поиск результата по устойчивому идентификатору. Пока проектируем такое подтверждение как отдельный контракт, не обещая, что TCP или HTTP устранят неоднозначность.\u003c/p\u003e\u003cp\u003eКритерий готовности теперь конкретен: после искусственного завершения процесса принятый заказ находится в базе; ошибочный адрес даёт понятный отказ; оператор видит тот же номер и сумму. Нагрузочная проверка использует рекламный профиль, а восстановление базы проверяется отдельно от скорости. Такое решение небольшое по числу компонентов, но полноценное по содержанию: оно связывает пользовательский результат, механизм хранения, риск и способ проверки.\u003c/p\u003e"},"expedition":{"world":"saas","title":"Экспедиция: запись на обслуживание","html":"\u003cp\u003eВ другом учебном бизнесе небольшая мастерская принимает записи на ремонт оборудования. На первый взгляд это та же форма, база и список у оператора. Переносится метод: определить обещание, состояние и момент принятия. Однако заказ доставки фиксирует набор товаров, а запись мастерской обещает ограниченный ресурс — конкретный слот мастера. Два клиента могут выбрать одинаковое время, даже если интерфейс показал каждому свободное место. Значит, предметный инвариант меняется: для одного ресурса недопустимы пересекающиеся подтверждённые интервалы.\u003c/p\u003e\u003cp\u003eНе стоит переносить таблицы доставки буквально. У мастерской есть длительность работ, перенос визита и технический перерыв. Ей может быть достаточно модульного приложения, но проверку занятости надо выполнять при подтверждении, а не полагаться на картинку календаря. Отправка письма также не делает бронь действительной: письмо является уведомлением о результате записи.\u003c/p\u003e\u003cp\u003eНасмотренность возникает, когда одинаковая техническая карта перестаёт казаться одинаковой задачей. Из доставки мы забираем границу принятия, след результата и расчёт пика. Из нового бизнеса получаем временные интервалы и конфликт за ресурс. Если архитектор сразу предлагает универсальный «сервис сущностей», он скрывает главное правило бизнеса. Хорошая первая карта должна показать, где это правило будет защищено, даже если конкретный механизм мы изучим только в следующих главах.\u003c/p\u003e","transfer":["Граница принятия обязательства","Разделение источника истины и представлений"],"distinct":["Конфликты временных интервалов","Ресурс с календарём вместо физического товара"]},"diagrams":[{"title":"Первый контур: процессы и ответственность","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-01-0-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eПервый контур: процессы и ответственность\u003c/text\u003e\u003crect x=\"222\" y=\"80\" width=\"290\" height=\"260\" rx=\"12\" fill=\"#f5f9fc\" stroke=\"#8098ad\" stroke-width=\"2\" stroke-dasharray=\"8 5\"/\u003e\u003ctext x=\"244\" y=\"109\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eОдна серверная программа\u003c/text\u003e\u003crect x=\"28\" y=\"158\" width=\"160\" height=\"88\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"108.0\" y=\"196.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eWeb / mobile\u003c/text\u003e\u003ctext x=\"108.0\" y=\"220.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eФорма заказа\u003c/text\u003e\u003cline x1=\"188\" y1=\"202\" x2=\"246\" y2=\"202\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-01-0-arr)\"/\u003e\u003crect x=\"246\" y=\"140\" width=\"240\" height=\"120\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"366.0\" y=\"182.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eПриложение\u003c/text\u003e\u003ctext x=\"366.0\" y=\"206.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eКаталог · Заказы\u003c/text\u003e\u003ctext x=\"366.0\" y=\"230.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eДоставка\u003c/text\u003e\u003cline x1=\"486\" y1=\"200\" x2=\"550\" y2=\"200\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-01-0-arr)\"/\u003e\u003crect x=\"550\" y=\"158\" width=\"180\" height=\"88\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"640.0\" y=\"196.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003ePostgreSQL\u003c/text\u003e\u003ctext x=\"640.0\" y=\"220.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eЗаказ и строки\u003c/text\u003e\u003crect x=\"246\" y=\"356\" width=\"240\" height=\"64\" rx=\"12\" fill=\"#fff1d5\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"366.0\" y=\"394.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eОператор склада\u003c/text\u003e\u003cline x1=\"366\" y1=\"356\" x2=\"366\" y2=\"262\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-01-0-arr)\"/\u003e\u003ctext x=\"30\" y=\"310\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003e→ Вызов; рамка — один выпуск, не отдельные сервисы\u003c/text\u003e\u003ctext x=\"30\" y=\"445\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eИсточник истины заказа — PostgreSQL; оператор меняет статус через приложение.\u003c/text\u003e","caption":"Слева направо идёт запрос клиента; оператор обращается к тому же приложению снизу. Пунктир объединяет модули одного выпуска. База является отдельным процессом, а не частью локальной памяти. Внешние платежи в первом контуре отсутствуют по выбранной границе продукта."},{"title":"Одно обещание и несколько представлений","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-01-1-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eОдно обещание и несколько представлений\u003c/text\u003e\u003crect x=\"30\" y=\"85\" width=\"205\" height=\"86\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"132.5\" y=\"122.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eКорзина\u003c/text\u003e\u003ctext x=\"132.5\" y=\"146.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eИзменяемый интерес\u003c/text\u003e\u003cline x1=\"235\" y1=\"128\" x2=\"285\" y2=\"128\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-01-1-arr)\"/\u003e\u003crect x=\"285\" y=\"85\" width=\"210\" height=\"86\" rx=\"12\" fill=\"#dff4e8\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"390.0\" y=\"122.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eЗаказ принят\u003c/text\u003e\u003ctext x=\"390.0\" y=\"146.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eСохранённое обещание\u003c/text\u003e\u003cline x1=\"495\" y1=\"128\" x2=\"545\" y2=\"128\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-01-1-arr)\"/\u003e\u003crect x=\"545\" y=\"85\" width=\"185\" height=\"86\" rx=\"12\" fill=\"#fff1d5\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"637.5\" y=\"122.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eДоставка\u003c/text\u003e\u003ctext x=\"637.5\" y=\"146.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eФизический процесс\u003c/text\u003e\u003crect x=\"285\" y=\"232\" width=\"210\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"390.0\" y=\"273.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eПисьмо клиенту\u003c/text\u003e\u003crect x=\"285\" y=\"344\" width=\"210\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"390.0\" y=\"385.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eЭкран оператора\u003c/text\u003e\u003cline x1=\"390\" y1=\"171\" x2=\"390\" y2=\"232\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-01-1-arr)\"/\u003e\u003cline x1=\"500\" y1=\"128\" x2=\"520\" y2=\"128\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"520\" y1=\"128\" x2=\"520\" y2=\"378\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"520\" y1=\"378\" x2=\"495\" y2=\"378\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-01-1-arr)\"/\u003e\u003ctext x=\"32\" y=\"222\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eЗелёный: авторитетный факт\u003c/text\u003e\u003ctext x=\"32\" y=\"252\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eСиний: представление\u003c/text\u003e\u003ctext x=\"32\" y=\"282\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eЖёлтый: действие в мире\u003c/text\u003e\u003ctext x=\"30\" y=\"445\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eКопии помогают узнать результат; они не заменяют запись принятого заказа.\u003c/text\u003e","caption":"Корзина превращается в обязательство только при принятии заказа. Письмо и экран оператора строятся от принятого факта, а физическая доставка находится вне мгновенной записи базы. Цвета показывают роль, а не надёжность технологии."}],"decision":{"prompt":"Как открыть первый регион с небольшой командой?","options":[{"title":"Модульное приложение и PostgreSQL","consequence":"Сквозной заказ проходит в одном приложении, изменения данных объединяются транзакцией.","tradeoff":"Совместный выпуск; отказ приложения временно влияет на все функции."},{"title":"Отдельные сервисы каталога и заказов","consequence":"Каталог можно выпускать и масштабировать самостоятельно.","tradeoff":"Появляются сетевые контракты и самостоятельная эксплуатация; оправдано при разных командах или профилях."},{"title":"Готовая платформа заказов","consequence":"Сокращается объём собственного кода и время проверки спроса.","tradeoff":"Ограничения модели, интеграции, зависимость от поставщика и стоимость миграции."}],"recommended":0,"explanation":"Для заданного масштаба и команды простой контур уменьшает число необязательных границ. Пригодная готовая платформа также разумна, если покрывает предметные правила; выбор меняется после проверки ограничений."},"exercise":{"prompt":"Сформулируйте, что означает «заказ принят» при потере ответа.","model":"\u003cp\u003eПринятие связано с зафиксированной записью, а не с получением экрана. Клиенту нужен устойчивый способ найти результат. Если такого способа пока нет, это пробел контракта, а не доказательство отсутствия заказа.\u003c/p\u003e","rubric":["Указано авторитетное состояние","Различены запись и доставка ответа"]},"checkpoint":[{"question":"Что сильнее всего обосновывает отдельный сервис?","options":["Независимые требования к развитию или эксплуатации подтверждены наблюдениями","В предметной области появилось ещё одно существительное","Общее число таблиц превысило десять"],"answer":0,"explanation":"Разделение полезно, когда решает конкретный конфликт требований и окупает сетевую сложность."},{"question":"Что даёт расчёт среднего числа запросов?","options":["Проверяемую оценку порядка величин при указанных допущениях","Гарантию прохождения рекламного пика","Доказательство отсутствия хвостовых задержек"],"answer":0,"explanation":"Среднее помогает построить гипотезу; распределение нагрузки и фактическая мощность проверяются отдельно."}],"sources":[{"title":"System Design Primer: публичная карта тем","url":"https://github.com/donnemartin/system-design-primer"},{"title":"Karan Pratap Singh: System Design, публичная программа","url":"https://github.com/karanpratapsingh/system-design"},{"title":"CMU 15-445/645: Database Systems, программа 2024","url":"https://15445.courses.cs.cmu.edu/fall2024/"},{"title":"Educative: публичное описание building blocks","url":"https://www.educative.io/courses/grokking-modern-system-design-interview-for-engineers-managers"},{"title":"PostgreSQL 18: надёжность и WAL","url":"https://www.postgresql.org/docs/18/wal-intro.html"}],"wordCount":1639},{"id":"ch-02","arc":1,"title":"Путь запроса и первая граница доверия","briefing":"Первое приложение из главы 01 работает. В рекламе растёт мобильный трафик, а поддержка получает жалобы: «крутилось, потом пропало». Проследим запрос от имени сайта до сохранённого заказа и отделим сетевую доставку от права действовать.","goals":["Объяснить роль DNS, транспорта, TLS и HTTP","Найти границы доверия между клиентом, прокси и приложением","Различать отказ, задержку и неизвестный результат операции"],"sections":[{"title":"Имя сайта ещё не соединение","html":"\u003cp\u003eПокупатель открывает адрес сервиса. Браузеру нужен сетевой адрес узла, к которому можно подключиться. DNS — распределённая система имён — позволяет получить записи для имени. Рекурсивный резолвер ищет ответ и кэширует его на ограниченный срок. Важно не представлять это как обращение ко всем DNS-серверам при каждом заказе: часть ответа уже может находиться в кэше браузера, операционной системы или резолвера. Именно поэтому смена адреса не становится мгновенной для всех клиентов.\u003c/p\u003e\u003cp\u003eTTL — срок жизни записи в кэше — относится к повторному использованию DNS-ответа, а не к длительности существующего соединения. Уменьшение TTL заранее может помочь плановому переключению, но не закрывает все формы отказа и не переселяет открытые подключения. Если старый сервер уже выключен, часть клиентов всё ещё может пробовать старый адрес. Для перехода нужны период совместной работы и проверка фактического трафика.\u003c/p\u003e\u003cp\u003eДалее устанавливается транспортное соединение. В типичном пути HTTP/1.1 или HTTP/2 используется TCP: он предоставляет упорядоченный поток байтов и повторную передачу потерянных сегментов. HTTP/3 использует QUIC поверх UDP, поэтому формула «любой HTTP всегда TCP» неверна. В нашей первой реализации подробно разбираем TCP-путь. Ни DNS, ни транспорт не знают, является ли переданный JSON заказом, списанием или безвредным просмотром. Успех доставки байтов не равен успеху предметной операции.\u003c/p\u003e"},{"title":"TLS защищает канал, но не бизнес-правило","html":"\u003cp\u003eДо передачи заказа по открытому Интернету стороны устанавливают защищённый канал TLS. В обычном веб-сценарии клиент проверяет сертификат сервера, соответствие имени и доверенную цепочку, а стороны согласуют ключи. Это защищает конфиденциальность и целостность трафика между концами данного соединения при предусмотренных протоколом условиях. Злоумышленник в промежуточной сети не должен прочитать адрес доставки или незаметно заменить сумму. Но корректный TLS не доказывает, что сам покупатель имеет право видеть любой номер заказа.\u003c/p\u003e\u003cp\u003eВ нашем контуре TLS завершается на обратном прокси — сервере, принимающем внешний запрос и направляющем его приложению. Значит, существуют два участка: клиент — прокси и прокси — приложение. Защита первого не распространяется магически на второй. На карте отмечаем, передаётся ли внутренний запрос в частной сети, шифруется ли он и какие участники способны его прочитать. Выбор зависит от модели угроз, но скрывать этот участок под общей подписью HTTPS нельзя.\u003c/p\u003e\u003cp\u003eСертификаты имеют срок действия, ключи нуждаются в контроле доступа, а проверка сертификата может сломаться независимо от бизнес-кода. Отключить её ради «быстрого исправления» значит убрать проверку собеседника. Для диагностики различают ошибку разрешения имени, установления соединения, TLS и уже полученный HTTP-ответ. У каждой стадии собственные наблюдения и причины. Если приложение не видело запрос, поиск ошибки только в его SQL не даст результата.\u003c/p\u003e"},{"title":"HTTP сообщает намерение и результат","html":"\u003cp\u003eHTTP задаёт семантику запроса и ответа: метод, адрес ресурса, поля заголовков и содержимое. GET обычно используется для получения представления и является безопасным методом в смысле намерения клиента: он не должен запрашивать изменение состояния. Создание заказа через POST подходит нашей операции, но само имя метода не обеспечивает защиту от повторного создания. Сервер должен спроектировать её отдельно. Код 201 может сообщать о создании ресурса, а поле Location — указывать его адрес; ни один код не заменяет фактическую запись.\u003c/p\u003e\u003cp\u003eПолезно отделить ошибки формата, отсутствие аутентификации, отсутствие прав, конфликт состояния и временную недоступность. Если клиент передал отрицательное количество, бесконечный автоматический повтор бессмысленен. Если приложение занято, немедленные повторы всех клиентов способны сделать ситуацию хуже. Единый контракт ошибки содержит машинный код, безопасное объяснение и идентификатор для обращения в поддержку. Текст внутреннего исключения базы не предназначен покупателю.\u003c/p\u003e\u003cp\u003eВремя ожидания ограничивается на каждом участке. Таймаут клиента не является приказом базе откатить уже выполненную транзакцию. Отмена запроса может распространяться через приложение, но между отменой и фиксацией остаётся гонка. Поэтому после разрыва соединения возможны как отсутствие заказа, так и сохранённый заказ. В девятой главе появится полный протокол идемпотентности; сейчас необходимо удержать основную границу: отсутствие ответа не свидетельствует об отсутствии эффекта.\u003c/p\u003e"},{"title":"Клиент — недоверенная сторона","html":"\u003cp\u003eМобильное приложение принадлежит продукту, но выполняется на устройстве пользователя. Его код можно изучить, запросы — повторить, поля — заменить. Поэтому сервер заново проверяет структуру, диапазоны значений и предметные ограничения. Цена из формы не становится авторитетной ценой: сервер получает идентификаторы товаров и количество, определяет применимые цены, затем сохраняет согласованную сумму. Проверка только в интерфейсе улучшает удобство, но не защищает данные.\u003c/p\u003e\u003cp\u003eАутентификация отвечает на вопрос, кем представлен участник. Авторизация — разрешено ли ему конкретное действие над конкретным объектом. Наличие корректной сессии не даёт права читать заказ другого покупателя. В обработчике нужно сопоставить владельца заказа с установленной личностью или проверить явное служебное право. Если номер трудно угадать, это полезно для уменьшения случайного перебора, но не заменяет проверку доступа. Ссылка, пересланная знакомому, не должна обходить правило.\u003c/p\u003e\u003cp\u003eОтдельная граница возникает на прокси. Заголовок, заявляющий адрес клиента или его роль, нельзя принимать от любого отправителя. Приложение доверяет такой информации только от известного прокси, который очищает или корректно дополняет входные поля. Иначе пользователь может нарисовать себе внутренний адрес или служебную принадлежность. Граница доверия проходит не между «наш код» и «чужой код», а между сведениями с проверенным происхождением и произвольным вводом.\u003c/p\u003e"},{"title":"Время — бюджет всего пути","html":"\u003cp\u003eПусть интерфейс должен завершить оформление за несколько секунд в обычных условиях. Это общий бюджет, внутри которого помещаются сеть, очередь на прокси, ожидание обработчика, запросы к базе и сериализация ответа. Если каждый внутренний вызов получил весь внешний бюджет, последовательная цепочка легко выйдет за предел ожидания клиента. У дочерних операций должен оставаться только остаток времени. Нельзя также ждать соединение с базой бесконечно: очередь ожидания является частью задержки.\u003c/p\u003e\u003cp\u003eПовтор требует отдельного бюджета. Две попытки по две секунды плюс пауза — уже не двухсекундная операция. Паузы с увеличением интервала уменьшают давление, а случайное отклонение интервала не даёт клиентам повторять синхронно. Но безопасный повтор возможен только при подходящей семантике операции. Сетевой библиотеке неизвестно, создаёт ли конкретный POST новый заказ при каждом вызове. Автоматическое повторение без знания этой семантики переносит технический сбой в бизнес-ошибку.\u003c/p\u003e\u003cp\u003eДля наблюдаемости записываем время входа на прокси, время передачи приложению, длительность обработки и исход. Между процессами передаём идентификатор трассировки, не используя его как секрет или разрешение. Часы разных машин могут расходиться; длительности лучше измерять локальными монотонными часами, а порядок распределённых событий подтверждать связями запросов. Диаграмма пути показывает причинность, но сама по себе не доказывает точный временной порядок записей журналов.\u003c/p\u003e"},{"title":"Что диагностировать до изменения архитектуры","html":"\u003cp\u003eЖалобу «сайт тормозит» сначала раскладывают на стадии. Если не разрешается имя, приложение может быть совершенно здоровым. Если TLS установлен, но прокси не находит доступное приложение, клиент увидит ошибку шлюза. Если приложение ждёт свободное соединение базы, увеличение числа прокси не устранит узкое место. Каждая новая граница добавляет собственные ошибки, поэтому полезно сохранять небольшую карту реального пути и проверять её после изменений инфраструктуры.\u003c/p\u003e\u003cp\u003eВ нашем первом выпуске маршрут один: браузер или мобильный клиент, публичный прокси, приложение, база. На каждой границе ограничиваем размер запроса и время ожидания, проверяем происхождение служебных полей, очищаем секреты из журналов. Это не универсальный перечень безопасности: это конкретные действия против слишком большого ввода, зависшего ожидания и подменённой идентичности в выбранном контуре. Адрес доставки не должен появляться в URL, который затем попадёт в историю и журналы посредников.\u003c/p\u003e\u003cp\u003eСамый важный результат главы — способность воспроизвести путь одного запроса словами. Где определили адрес? Где проверили собеседника? Где установили пользователя? Где проверили право на заказ? Где выполнили предметное изменение? Где мог потеряться ответ? Когда эти вопросы имеют разные ответы, становится видно, почему нельзя лечить любой инцидент перезапуском базы или обещать безопасность одним значком замка в браузере.\u003c/p\u003e"}],"workedExample":{"title":"Заказ существует, экран показал ошибку","html":"\u003cp\u003eРассмотрим учебную трассу. В момент 0 клиент отправил POST. Через 70 миллисекунд запрос дошёл до прокси, ещё через 10 — до приложения. Проверка входа и прав заняла 15 миллисекунд, ожидание соединения базы — 800, транзакция — 120. Примерно через секунду запись была зафиксирована. Но сеть мобильного оператора разорвала соединение перед получением ответа. На экране нет номера, хотя заказ уже существует.\u003c/p\u003e\u003cp\u003eСначала проверим ошибочную гипотезу: «Если клиент не получил 201, транзакция не завершилась». Её опровергает последовательность. Доставка ответа находится после фиксации и зависит от другого участка системы. Откатить базу из-за каждого потерянного ответа также нельзя: сервер не всегда способен узнать, что клиент действительно получил последние байты, а физические действия могли уже начаться. Нужно отдельно проектировать узнавание результата.\u003c/p\u003e\u003cp\u003eТеперь поддержка ищет запрос по идентификатору. На прокси виден разрыв внешнего соединения, в приложении — успешное завершение записи, в базе — номер и сумма. Это три свидетельства разных событий, а не противоречащие друг другу журналы. Пользователю показывают возможность проверить созданные заказы; повторное оформление пока требует осторожности, а полноценный устойчивый ключ операции будет введён перед подключением платежей.\u003c/p\u003e\u003cp\u003eРазбор времени показывает ещё одну проблему: основную задержку дал не SQL, а очередь к пулу соединений. Увеличить время ожидания клиента можно как временную меру, но это не убирает очередь. Проверяем число одновременно занятых соединений, длительные транзакции и профиль нагрузки. Результат расследования содержит два независимых действия: исправить контракт неопределённого исхода и устранить причину ожидания. Одно не заменяет другое.\u003c/p\u003e"},"expedition":{"world":"money","title":"Экспедиция: перевод денег через нестабильную сеть","html":"\u003cp\u003eУ учебного финансового сервиса похожая трасса: приложение клиента отправляет перевод, сервер сохраняет проводки, ответ теряется. Но цена ошибочного повторения выше: два одинаковых перевода могут быть двумя отдельными намерениями или ошибочным дублем. Сравнить только сумму и получателя недостаточно. Поэтому протокол должен связывать технические попытки с устойчивым идентификатором одного бизнес-намерения и давать способ проверить его состояние.\u003c/p\u003e\u003cp\u003eПереносится различение транспорта и результата. TLS защищает участок связи, но не гарантирует правильность получателя, достаточность средств или отсутствие дубля. Авторизация должна проверять доступ к счёту, а не только наличие действительного токена. Таймаут по-прежнему означает неизвестность для вызывающей стороны. Увеличение числа повторов не делает перевод надёжнее, пока не определена семантика этих повторов.\u003c/p\u003e\u003cp\u003eНовое ограничение — учёт денежных обязательств и необходимость сверки. Даже если интерфейс временно недоступен, нельзя объяснять расхождение только сетевым кодом ошибки. Нужны авторитетная запись, история переходов и процедуры разбора. Мы пока не строим банковскую систему и не обещаем финансовую пригодность схемы доставки. Экспедиция показывает, как один и тот же сетевой механизм оказывается частью разных предметных гарантий и почему архитектор начинает с смысла операции.\u003c/p\u003e","transfer":["Таймаут не определяет предметный исход","Проверка прав выполняется сервером"],"distinct":["Перевод как учётное обязательство","Различение попытки и денежного намерения"]},"diagrams":[{"title":"Ответ потерян после фиксации","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-02-0-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eОтвет потерян после фиксации\u003c/text\u003e\u003crect x=\"30\" y=\"70\" width=\"140\" height=\"50\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"100.0\" y=\"101.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" " fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eПроверенный вход\u003c/text\u003e\u003cline x1=\"475\" y1=\"260\" x2=\"660\" y2=\"260\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-02-0-arr)\"/\u003e\u003ctext x=\"567.5\" y=\"250\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eТранзакция\u003c/text\u003e\u003cline x1=\"660\" y1=\"310\" x2=\"475\" y2=\"310\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-02-0-arr)\"/\u003e\u003ctext x=\"567.5\" y=\"300\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eCOMMIT\u003c/text\u003e\u003cline x1=\"475\" y1=\"352\" x2=\"285\" y2=\"352\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-02-0-arr)\"/\u003e\u003ctext x=\"380.0\" y=\"342\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eОтвет с номером\u003c/text\u003e\u003cline x1=\"285\" y1=\"385\" x2=\"100\" y2=\"385\" stroke=\"#be4b3b\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\"/\u003e\u003ctext x=\"30\" y=\"423\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eПунктир красный: ответ потерян; заказ после COMMIT существует.\u003c/text\u003e","caption":"Время направлено вниз. Четыре участника показывают разные сетевые участки. COMMIT предшествует потере внешнего ответа; поэтому таймаут клиента не доказывает откат. Схема не обещает точные интервалы, она показывает причинную последовательность."},{"title":"Две проверки на границе доверия","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-02-1-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eДве проверки на границе доверия\u003c/text\u003e\u003crect x=\"25\" y=\"77\" width=\"205\" height=\"318\" rx=\"12\" fill=\"#fff4ed\" stroke=\"#b86542\" stroke-width=\"2\" stroke-dasharray=\"8 5\"/\u003e\u003ctext x=\"45\" y=\"108\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eНедоверенный ввод\u003c/text\u003e\u003crect x=\"48\" y=\"147\" width=\"160\" height=\"90\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"128.0\" y=\"186.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eКлиент\u003c/text\u003e\u003ctext x=\"128.0\" y=\"210.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eЦена? Роль?\u003c/text\u003e\u003cline x1=\"208\" y1=\"192\" x2=\"285\" y2=\"192\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-02-1-arr)\"/\u003e\u003crect x=\"285\" y=\"147\" width=\"180\" height=\"90\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"375.0\" y=\"174.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eВход\u003c/text\u003e\u003ctext x=\"375.0\" y=\"198.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eTLS · размер\u003c/text\u003e\u003ctext x=\"375.0\" y=\"222.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eОчистка полей\u003c/text\u003e\u003cline x1=\"465\" y1=\"192\" x2=\"535\" y2=\"192\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-02-1-arr)\"/\u003e\u003crect x=\"535\" y=\"147\" width=\"200\" height=\"90\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"635.0\" y=\"174.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eПриложение\u003c/text\u003e\u003ctext x=\"635.0\" y=\"198.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eЛичность · права\u003c/text\u003e\u003ctext x=\"635.0\" y=\"222.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eПравила заказа\u003c/text\u003e\u003crect x=\"285\" y=\"299\" width=\"180\" height=\"70\" rx=\"12\" fill=\"#dff4e8\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"375.0\" y=\"340.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eКто собеседник?\u003c/text\u003e\u003crect x=\"535\" y=\"299\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#dff4e8\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"635.0\" y=\"340.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eМожно этот заказ?\u003c/text\u003e\u003cline x1=\"375\" y1=\"237\" x2=\"375\" y2=\"299\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-02-1-arr)\"/\u003e\u003cline x1=\"635\" y1=\"237\" x2=\"635\" y2=\"299\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-02-1-arr)\"/\u003e\u003ctext x=\"28\" y=\"435\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eTLS защищает участок. Авторизация проверяет действие над конкретным объектом.\u003c/text\u003e","caption":"Левый пунктир означает произвольный ввод, даже если клиентское приложение написано нашей командой. Вход проверяет канал и форму, приложение — личность, объект и предметные правила. Прокси доверяется только как известный участник, а не из-за произвольного заголовка."}],"decision":{"prompt":"Где завершать внешний TLS?","options":[{"title":"На управляемом прокси перед приложением","consequence":"Сертификаты и внешняя политика сосредоточены на входе.","tradeoff":"Нужно отдельно защитить внутренний участок и доверять только известному прокси."},{"title":"Непосредственно в каждом приложении","consequence":"Защищённый канал доходит до процесса обработки.","tradeoff":"Управление сертификатами распределено; балансировка и обновления требуют согласования."},{"title":"На прокси и повторно до приложения","consequence":"Оба участка шифруются и могут проверять собеседников.","tradeoff":"Больше настройки, сертификатов и точек диагностики; оправдано моделью угроз."}],"recommended":0,"explanation":"Для небольшого контура управляемый вход упрощает эксплуатацию. Внутренний канал и происхождение заголовков остаются самостоятельными условиями решения."},"exercise":{"prompt":"Клиент получил таймаут после POST. Назовите два возможных состояния базы.","model":"\u003cp\u003eТранзакция могла не начаться или откатиться; она также могла зафиксироваться до потери ответа. По одному таймауту выбирать состояние нельзя: нужно найти результат по устойчивому идентификатору.\u003c/p\u003e","rubric":["Признаны оба исхода","Указан способ узнать результат"]},"checkpoint":[{"question":"Проверенный TLS доказывает, что…","options":["Канал защищён между его конкретными концами при условиях протокола","Пользователь вправе читать любой заказ","Все внутренние участки автоматически зашифрованы"],"answer":0,"explanation":"TLS решает задачу защищённого канала; права на предметный объект проверяются отдельно."},{"question":"Клиент передал цену товара в JSON. Серверу следует…","options":["Проверить применимую цену по авторитетным данным","Довериться цене, если запрос пришёл по HTTPS","Принять значение при корректном числовом формате"],"answer":0,"explanation":"Формат и защищённая доставка не превращают клиентский ввод в источник истины."}],"sources":[{"title":"RFC 1034: Domain Names — Concepts and Facilities","url":"https://www.rfc-editor.org/rfc/rfc1034"},{"title":"RFC 9293: Transmission Control Protocol","url":"https://www.rfc-editor.org/rfc/rfc9293"},{"title":"RFC 8446: TLS 1.3","url":"https://www.rfc-editor.org/rfc/rfc8446"},{"title":"RFC 9110: HTTP Semantics","url":"https://www.rfc-editor.org/rfc/rfc9110"},{"title":"RFC 9114: HTTP/3","url":"https://www.rfc-editor.org/rfc/rfc9114"},{"title":"NGINX: proxy module and forwarded headers","url":"https://nginx.org/en/docs/http/ngx_http_proxy_module.html"}],"wordCount":1586},{"id":"ch-03","arc":1,"title":"Где живёт заказ: модель данных и хранение","briefing":"Путь запроса из главы 02 понятен. Теперь поддержка обнаружила: после изменения цены в каталоге старый заказ показывает новую сумму. Нужно определить, какие факты хранить, как связать их и почему запись на диск — самостоятельный механизм.","goals":["Различать предметную, логическую и физическую модель","Понять строки, страницы, индексы и журнал предзаписи","Выбрать границу нормализации и сохранения исторического факта"],"sections":[{"title":"Модель описывает различия, которые нельзя потерять","html":"\u003cp\u003eКорзина и заказ похожи набором товаров, но имеют разную семантику. Корзина выражает текущий интерес и может быть пересчитана. Принятый заказ фиксирует обязательство по конкретным условиям. Если хранить только ссылки на товары и каждый раз брать сегодняшнюю цену, прошлое меняется вместе с каталогом. Поэтому у строки заказа появляются количество, применённая цена, валюта, налоговые или скидочные атрибуты, необходимые для объяснения суммы. Это не случайное дублирование, а сохранение отдельного факта.\u003c/p\u003e\u003cp\u003eСначала составляют предметную модель: покупатель, заказ, строка заказа, товар, адрес доставки. Для каждой связи спрашивают о множественности и времени. У покупателя много заказов; у заказа несколько строк; товар может исчезнуть из активного каталога, но история заказа должна остаться объяснимой. Адрес профиля — изменяемая настройка, адрес принятого заказа — снимок договорённости. Одно название поля «адрес» не делает их одним объектом.\u003c/p\u003e\u003cp\u003eЗатем выбирают логическое представление: таблицы, ключи и ограничения. Физическая модель отвечает уже на другой вопрос: как эти записи расположены и обслуживаются хранилищем. Переходить сразу к физическим индексам рано, если команда не решила, разрешены ли две строки одного товара и может ли заказ менять валюту. Производительность неправильного факта не исправит его смысла. Прежде всего нужно уметь объяснить одну запись человеку, который расследует спор после изменения справочников.\u003c/p\u003e"},{"title":"Ключи, связи и ограничения","html":"\u003cp\u003eПервичный ключ устойчиво различает записи. Номер заказа, показываемый человеку, может иметь отдельный формат; технический идентификатор не обязан кодировать регион, дату и статус одновременно. Если вложить изменяемый бизнес-смысл в ключ, позднее изменение этого смысла становится миграцией ссылок. Внешний ключ связывает строку заказа с существующим заказом и предотвращает определённый класс потерянных ссылок. Но он не знает, что доставленный заказ нельзя снова сделать черновиком.\u003c/p\u003e\u003cp\u003eЧасть правил удобно выразить прямо в схеме: количество положительное, обязательное поле не отсутствует, внешний идентификатор уникален в своей области. CHECK проверяет условие строки; UNIQUE предотвращает дубли выбранного ключа; NOT NULL запрещает отсутствие значения. В PostgreSQL обычная уникальность и NULL требуют внимательного чтения семантики: нельзя считать неизвестное значение обычным одинаковым значением без явного выбора соответствующего ограничения. Межстрочные бизнес-правила не следует притворно выражать проверкой одной строки.\u003c/p\u003e\u003cp\u003eПриложение всё равно проверяет ввод ради понятной ошибки и предметного контекста. База служит последним барьером при конкурентных запросах, ошибках другого обработчика или служебной загрузке. Если ограничение существует только в одном экране, второй путь записи легко его обойдёт. При нарушении ограничения приложение должно перевести технический результат в предметный отказ. Наличие исключения ещё не объясняет клиенту, следует ли исправить ввод или попробовать снова.\u003c/p\u003e"},{"title":"Почему нормализация и снимок не противоречат друг другу","html":"\u003cp\u003eНормализация уменьшает зависимости, при которых изменение одного факта требует согласованно переписать множество строк. Если название склада хранится в каждой текущей товарной позиции, переименование создаёт риск рассогласования. Отдельная таблица склада и ссылка позволяют изменить один актуальный факт в одном месте. Соединение таблиц возвращает нужное представление. Это аргумент о целостности модели, а не религия минимального числа повторяющихся строк.\u003c/p\u003e\u003cp\u003eСнимок названия товара в заказе отвечает на другой вопрос: что было обещано в момент покупки. Он может отличаться от сегодняшнего справочника без ошибки. Поэтому полезно явно назвать поля product_id и product_name_at_purchase, чтобы читатель не принял разные временные смыслы за конкурирующие источники истины. Сумму тоже нельзя хранить как случайный кэш, если она является согласованным итогом применения правил. Нужно знать, какие составляющие позволяют объяснить её происхождение.\u003c/p\u003e\u003cp\u003eJSON-поле удобно для атрибутов с нестабильной структурой, например особых инструкций доставки. Но оно не снимает необходимость определить обязательность, версию формата и способ поиска. Если оператор регулярно фильтрует заказы по полю внутри JSON, это уже часть публичной модели запросов. Возможно, ему нужен отдельный типизированный столбец или индекс по выражению. Решение выбирают по смыслу и доступу; противопоставление «таблицы негибкие, документы гибкие» скрывает стоимость проверки и изменений в обоих подходах.\u003c/p\u003e"},{"title":"От строки до страницы","html":"\u003cp\u003eСервер базы не выполняет отдельный физический ввод-вывод для каждого бизнес-поля. Данные размещаются в страницах фиксированного размера; в стандартной сборке PostgreSQL это обычно 8 килобайт. Страница содержит служебный заголовок, указатели на элементы и сами версии строк, между которыми остаётся свободное место. Хранилище и операционная система кэшируют страницы, поэтому логическое чтение не всегда означает чтение с физического носителя. Разница между тёплым и холодным набором данных способна изменить время запроса сильнее небольшого изменения SQL.\u003c/p\u003e\u003cp\u003eТаблица PostgreSQL обычно хранится как heap: физический порядок не гарантирует удобную сортировку по номеру или дате. Индекс — отдельная структура, помогающая найти подходящие строки. За удобный доступ платят дополнительным местом и работой при изменении. Если индекс указывает на строку, это ещё не означает, что все нужные данные и информация о видимости находятся в нём. Детали конкретного плана рассмотрим в главе 05.\u003c/p\u003e\u003cp\u003eОбновление в системе с многоверсионностью создаёт новую версию строки, а старые версии некоторое время остаются нужны читателям или очистке. Поэтому число живых заказов не равно точному размеру файлов. Частые обновления, индексы, свободное место и обслуживание влияют на объём. Для планирования полезно отдельно оценивать логический размер записи и физический бюджет хранения. Умножение среднего JSON на число заказов является начальной оценкой, но не размером PostgreSQL на диске.\u003c/p\u003e"},{"title":"Как запись переживает падение процесса","html":"\u003cp\u003eПриложение изменяет данные в транзакции, а база должна сделать результат восстановимым. Журнал предзаписи, WAL, записывает сведения об изменениях до того, как соответствующие изменённые страницы данных могут быть надёжно записаны на носитель. При нормальной конфигурации долговечности подтверждение фиксации связано с сохранением необходимых записей журнала. После сбоя база может воспроизвести подтверждённые изменения, даже если отдельные страницы таблиц не успели попасть на диск. Это отделяет логическую фиксацию от немедленной записи всех затронутых файлов.\u003c/p\u003e\u003cp\u003eКонтрольная точка ограничивает объём восстановления и связана с переносом изменённых страниц в устойчивое хранение. WAL не является бессрочной полной историей бизнеса: старые сегменты могут быть переработаны, а техническая запись не заменяет объяснение причины смены статуса. Резервная копия также отличается от реплики: копия должна позволять восстановиться после ошибки, которая могла уже распространиться на все работающие экземпляры. Защита от падения процесса не равна защите от удаления заказа оператором.\u003c/p\u003e\u003cp\u003eГарантии зависят от настроек и оборудования. Отключённый fsync, асинхронное подтверждение фиксации, накопитель с ложным подтверждением записи или потеря всех доступных носителей меняют модель отказа. Для учебного старта сохраняем штатные настройки долговечности и проверяем восстановление. Нельзя обещать «никаких потерь» одним названием СУБД. Нужно назвать, какое подтверждение получено, что именно переживает выбранный сбой и какие резервные материалы останутся после него.\u003c/p\u003e"},{"title":"SQL и другие модели: вопрос доступа","html":"\u003cp\u003eРеляционная модель подходит нашему заказу, потому что есть связанные факты, ограничения и необходимость менять их согласованно. Это не утверждение, что SQL всегда быстрее или что любая NoSQL-база не поддерживает транзакции. Термин NoSQL объединяет разные семейства: ключ-значение, документы, широкие столбцы, графы. У них различаются доступ, индексация, распределение и границы атомарности. Сравнивать следует конкретные операции и гарантии конкретного продукта.\u003c/p\u003e\u003cp\u003eЕсли нужен документ заказа целиком по одному идентификатору, документное представление может быть естественным. Но общий остаток товара разделяется между множеством заказов, и помещение заказа в документ не решает конфликт за этот остаток. Если требуется обход цепочек знакомств, графовая модель выражает доступ иначе, чем десятки заранее подготовленных соединений. Если требуется дешёвое хранение крупных вложений, двоичный объект обычно выносят в объектное хранилище, оставляя в базе метаданные и связь.\u003c/p\u003e\u003cp\u003eДля «Северного маршрута» важнее сначала получить объяснимую модель, чем выбрать модный класс хранилища. В таблице архитектурного решения перечисляем способы чтения и записи, допустимую устарелость, границы согласованности и восстановление. Замена PostgreSQL другим продуктом должна отвечать на обнаруженное ограничение. Иначе команда переносит те же неясные правила в новый синтаксис и получает прежние ошибки с новой эксплуатационной нагрузкой.\u003c/p\u003e"}],"workedExample":{"title":"Сохранить сумму, не заморозив каталог","html":"\u003cp\u003eВ каталоге товар P17 стоит 250 рублей. Покупатель заказал две штуки, доставка стоит 100 рублей, скидка на товары — 10 процентов. Итог равен 2 × 250 × 0,9 + 100 = 550 рублей. В учебной модели денежные суммы храним в целых копейках и явно задаём валюту. Это избавляет от двоичной ошибки представления десятичных дробей, но не определяет правила округления скидки: их нужно назвать отдельно.\u003c/p\u003e\u003cp\u003eСоздаём запись orders с идентификатором, покупателем, состоянием, валютой, адресом-снимком и итогом 55000 копеек. В order_items сохраняем product_id=P17, quantity=2, unit_price=25000 и объяснимую величину применённой скидки. Ссылка на product_id помогает открыть актуальную карточку, а сохранённая цена позволяет объяснить прошлую покупку. Доставку представляем отдельной согласованной составляющей, чтобы позднее изменение тарифов не переписало сумму.\u003c/p\u003e\u003cp\u003eНа следующий день каталог меняет цену до 280 рублей. Запрос истории не пересчитывает заказ по новой цене. Он получает исторические строки и проверяет согласованность сохранённых составляющих. Если у компании разрешена последующая корректировка заказа, она должна быть отдельным предметным действием с понятной причиной, а не побочным эффектом соединения со справочником. Важно различить «показать актуальную стоимость повторной покупки» и «показать стоимость прошлого заказа».\u003c/p\u003e\u003cp\u003eНаконец, проверяем отказ: процесс завершился после фиксации транзакции. После восстановления заказ и строки присутствуют вместе. Если приложение сохраняло их разными независимыми операциями, могла бы остаться пустая шапка. Схема таблиц сама не объединяет несколько команд в одну транзакцию. В следующей главе выясним, как та же граница должна защищать одновременно и заказ, и ограниченный остаток.\u003c/p\u003e"},"expedition":{"world":"saas","title":"Экспедиция: договор аренды оборудования","html":"\u003cp\u003eУчебный сервис аренды хранит справочник оборудования и договоры. Актуальное название модели, дневной тариф и контакт клиента меняются. Подписанный договор должен оставаться объяснимым после этих изменений. Переносим различение актуального справочника и исторического снимка: договор хранит согласованный тариф, период, стороны и условия, а ссылка на оборудование помогает связать историю с текущим учётом.\u003c/p\u003e\u003cp\u003eНовое ограничение — физический экземпляр и период владения. Для доставки достаточно количества одинакового товара, а аренда часто обещает конкретный серийный номер на интервал дат. Поле «доступно=true» не выражает пересечение будущих броней. Нужна модель времени и правило недопустимого пересечения. Снимок договора также не заменяет события возврата, повреждения и изменения срока: это самостоятельные факты процесса.\u003c/p\u003e\u003cp\u003eПроверим границу хранения. Фотографии состояния оборудования выгоднее хранить как объекты, а в базе — идентификатор, владельца, время и связь с осмотром. Удаление файла и удаление строки не являются одной локальной SQL-транзакцией, поэтому появляется отдельный жизненный цикл. Мы ещё не выбираем распределённую координацию, но уже видим, что удачная модель делает будущую проблему видимой. Способ хранения определяется обещанием и путями доступа, а не желанием сделать все сущности одинаковыми.\u003c/p\u003e","transfer":["Исторический снимок условий","Явное различение справочника и обязательства"],"distinct":["Серийные экземпляры","Пересекающиеся периоды аренды"]},"diagrams":[{"title":"Снимок условий и живой каталог","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-03-0-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eСнимок условий и живой каталог\u003c/text\u003e\u003crect x=\"35\" y=\"80\" width=\"260\" height=\"130\" rx=\"12\" fill=\"#dff4e8\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"165.0\" y=\"115.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eorders\u003c/text\u003e\u003ctext x=\"165.0\" y=\"139.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eid · buyer_id\u003c/text\u003e\u003ctext x=\"165.0\" y=\"163.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eaddress_snapshot\u003c/text\u003e\u003ctext x=\"165.0\" y=\"187.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003etotal · currency\u003c/text\u003e\u003crect x=\"4
