38\" y=\"280\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eИсторический факт:\u003c/text\u003e\u003ctext x=\"38\" y=\"309\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eunit_price в строке заказа\u003c/text\u003e\u003ctext x=\"38\" y=\"346\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eАктуальный справочник:\u003c/text\u003e\u003ctext x=\"38\" y=\"375\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003ecurrent_price в products\u003c/text\u003e\u003ctext x=\"32\" y=\"438\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eСтрелки — внешние ссылки; актуальная цена не переписывает принятую.\u003c/text\u003e","caption":"Строки заказа ссылаются на шапку и товар, но хранят согласованные условия отдельно. N:1 означает много строк одного заказа. Историческое и актуальное значение относятся к разным фактам; их расхождение после переоценки допустимо."},{"title":"Два уровня хранения: страница и WAL","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-03-1-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eДва уровня хранения: страница и WAL\u003c/text\u003e\u003crect x=\"40\" y=\"80\" width=\"680\" height=\"175\" rx=\"12\" fill=\"#f4f8fb\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"57\" y=\"108\" font-family=\"Arial, sans-serif\" font-size=\"20\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eОдна страница PostgreSQL — обычно 8 КиБ\u003c/text\u003e\u003crect x=\"60\" y=\"140\" width=\"145\" height=\"85\" rx=\"0\" fill=\"#dce7f3\" stroke=\"#6a879e\" stroke-width=\"2\"/\u003e\u003ctext x=\"132.5\" y=\"187\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eЗаголовок\u003c/text\u003e\u003crect x=\"205\" y=\"140\" width=\"125\" height=\"85\" rx=\"0\" fill=\"#dff4e8\" stroke=\"#6a879e\" stroke-width=\"2\"/\u003e\u003ctext x=\"267.5\" y=\"187\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eУказатели\u003c/text\u003e\u003crect x=\"330\" y=\"140\" width=\"175\" height=\"85\" rx=\"0\" fill=\"#ffffff\" stroke=\"#6a879e\" stroke-width=\"2\"/\u003e\u003ctext x=\"417.5\" y=\"187\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eСвободно\u003c/text\u003e\u003crect x=\"505\" y=\"140\" width=\"195\" height=\"85\" rx=\"0\" fill=\"#fff1d5\" stroke=\"#6a879e\" stroke-width=\"2\"/\u003e\u003ctext x=\"602.5\" y=\"187\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eВерсии строк\u003c/text\u003e\u003crect x=\"40\" y=\"310\" width=\"190\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"135.0\" y=\"339.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eWAL\u003c/text\u003e\u003ctext x=\"135.0\" y=\"363.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eСначала журнал\u003c/text\u003e\u003cline x1=\"230\" y1=\"345\" x2=\"285\" y2=\"345\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-03-1-arr)\"/\u003e\u003crect x=\"285\" y=\"310\" width=\"190\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"380.0\" y=\"339.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eПодтверждение\u003c/text\u003e\u003ctext x=\"380.0\" y=\"363.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eПри штатном режиме\u003c/text\u003e\u003cline x1=\"475\" y1=\"345\" x2=\"530\" y2=\"345\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-03-1-arr)\"/\u003e\u003crect x=\"530\" y=\"310\" width=\"190\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"625.0\" y=\"339.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eСтраницы\u003c/text\u003e\u003ctext x=\"625.0\" y=\"363.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"400\"\u003eЗапись позже\u003c/text\u003e\u003ctext x=\"40\" y=\"430\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eВерх: размещение. Низ: логика долговечности, не точная шкала времени.\u003c/text\u003e","caption":"Верхняя полоса упрощает устройство страницы: реальные размеры областей меняются, а версии строк и указатели организованы служебными структурами. Нижняя цепочка показывает необходимость сохранить журнал до соответствующих страниц. Гарантии зависят от штатных настроек и устойчивого носителя."}],"decision":{"prompt":"Как хранить первый заказ?","options":[{"title":"Реляционные таблицы с историческими полями","consequence":"Связи и ограничения выражены явно, сумму можно объяснить.","tradeoff":"Нужны миграции схемы и аккуратные запросы истории."},{"title":"Один документ заказа в документной БД","consequence":"Удобно читать весь агрегат одним обращением.","tradeoff":"Общие остатки и междокументные правила требуют отдельного анализа гарантий."},{"title":"PostgreSQL с JSONB для изменчивых атрибутов","consequence":"Основные связи типизированы, редкие поля развиваются гибче.","tradeoff":"Валидация JSON, версии формата и запросы по вложенным полям остаются обязанностью команды."}],"recommended":0,"explanation":"Структура заказа и транзакционные связи известны, поэтому явные таблицы дают простую проверяемую основу. JSONB остаётся полезным для действительно изменчивых дополнений."},"exercise":{"prompt":"Название товара изменилось. Какие два значения можно показать в истории и зачем?","model":"\u003cp\u003eИсторическое название объясняет содержание принятого заказа; актуальное название помогает перейти в текущий каталог. Поля должны быть подписаны по смыслу, а не молча подменять друг друга.\u003c/p\u003e","rubric":["Различён временной смысл","Сохранено объяснение прошлого обязательства"]},"checkpoint":[{"question":"Почему историческая цена в строке заказа не обязательно ошибка нормализации?","options":["Она представляет другой факт — согласованную цену покупки","Любая копия поля автоматически ускоряет запрос","Исторические поля никогда не требуют проверки"],"answer":0,"explanation":"Важен смысл зависимости: текущая цена и цена покупки относятся к разным моментам и обязательствам."},{"question":"Что обеспечивает WAL при нормальной конфигурации долговечности?","options":["Возможность восстановить подтверждённые изменения после предусмотренного сбоя","Бесконечную историю причин бизнес-решений","Защиту от любого ошибочного удаления и потери всех носителей"],"answer":0,"explanation":"Журнал участвует в восстановлении; аудит, резервирование и защита от потери площадки решают другие задачи."}],"sources":[{"title":"PostgreSQL 18: constraints","url":"https://www.postgresql.org/docs/18/ddl-constraints.html"},{"title":"PostgreSQL 18: database page layout","url":"https://www.postgresql.org/docs/18/storage-page-layout.html"},{"title":"PostgreSQL 18: WAL","url":"https://www.postgresql.org/docs/18/wal-intro.html"},{"title":"PostgreSQL 18: JSON types","url":"https://www.postgresql.org/docs/18/datatype-json.html"},{"title":"PostgreSQL 18: numeric types","url":"https://www.postgresql.org/docs/18/datatype-numeric.html"},{"title":"CMU 15-445/645: публичная программа Database Systems","url":"https://15445.courses.cs.cmu.edu/fall2024/"}],"wordCount":1590},{"id":"ch-04","arc":1,"title":"Последний товар: транзакции и конкуренция","briefing":"Модель из главы 03 хранит историю правильно. Во время акции два покупателя заказали последнюю коробку. Каждый обработчик прочитал остаток 1, и оба сообщили успех. Разберём, почему правильные таблицы ещё не обеспечили правильное совместное выполнение.","goals":["Различать атомарность, изоляцию и предметный инвариант","Понять снимки MVCC, блокировки и сериализацию","Выбрать безопасный способ резервирования ограниченного ресурса"],"sections":[{"title":"Ошибка живёт между командами","html":"\u003cp\u003eПервый обработчик читает остаток: одна штука. Второй читает тот же остаток до завершения первого. Оба решают, что покупка возможна, создают заказы и уменьшают значение. Если оба записали рассчитанный на клиенте ноль, возникает потерянное обновление: итоговый счётчик выглядит допустимо, но приняты два обязательства. Если оба выполнили арифметическое уменьшение без проверки, остаток может стать отрицательным. Разные механизмы ошибки нарушают одно правило: нельзя подтвердить больше единиц, чем доступно для обещания.\u003c/p\u003e\u003cp\u003eЭто правило называют инвариантом — условием, которое должно сохраняться после допустимых операций. Его нужно сформулировать до выбора уровня изоляции. Для простого склада available ≥ 0, а успешное резервирование одной штуки обязано соответствовать ровно одному заказу. В более богатой модели физический остаток равен свободному плюс зарезервированному с учётом корректировок. Если не назвать инвариант, транзакция может быть технически корректной и сохранять неправильную предметную модель.\u003c/p\u003e\u003cp\u003eПроверка «прочитать, потом решить» безопасна только при механизме, связывающем проверку с записью. Однопоточный локальный обработчик не решает проблему, если приложение имеет второй процесс, служебную загрузку или повтор запроса. Блокировка в памяти одного экземпляра тоже не покрывает остальные пути. Защита должна находиться там, где сходятся все конкурентные изменения ресурса, либо координация должна быть явной и обязательной для каждого писателя.\u003c/p\u003e"},{"title":"Что обещает транзакция","html":"\u003cp\u003eТранзакция объединяет изменения в единицу фиксации. Если создание заказа и уменьшение остатка входят в одну транзакцию, они либо становятся принятыми вместе, либо откатываются. Атомарность предотвращает половинчатый результат. Долговечность относится к сохранению подтверждённого результата в выбранной модели отказов. Изоляция определяет допустимые взаимные наблюдения параллельных операций. Согласованность в знакомой аббревиатуре ACID не означает, что база сама знает все правила склада: схему и алгоритм по-прежнему проектирует команда.\u003c/p\u003e\u003cp\u003eТранзакция не должна удерживаться открытой, пока пользователь вводит код или внешний партнёр отвечает по сети. Это увеличивает время удержания ресурсов и создаёт риск длинных ожиданий. Кроме того, локальный откат PostgreSQL не отменит уже выполненную внешнюю оплату. В этой главе граница намеренно локальная: заказ, его строки и резерв находятся в одной базе. Межсистемные обязательства появятся позднее, с собственными механизмами согласования.\u003c/p\u003e\u003cp\u003eКороткая транзакция не означает одну SQL-команду. Можно прочитать несколько строк, проверить связанные правила и записать результат, если защита конкурентного доступа соответствует правилу. И наоборот, одна сложная команда не делает весь окружающий процесс атомарным. В архитектурном обсуждении полезно буквально провести рамку вокруг записей, которые фиксируются вместе, и подписать всё, что остаётся за ней. Эта рамка показывает настоящую гарантию лучше общего заявления «у нас ACID».\u003c/p\u003e"},{"title":"MVCC: читать прошлое, не блокируя каждую запись","html":"\u003cp\u003ePostgreSQL использует многоверсионное управление конкурентным доступом, MVCC. Читатель получает видимые ему версии строк по правилам снимка, а не обязательно самую новую незавершённую запись другого участника. Это позволяет обычному чтению и записи меньше мешать друг другу. Но многоверсионность не означает отсутствие блокировок и не превращает проверку остатка в защищённое резервирование. Два читателя вполне могут увидеть одну доступную штуку.\u003c/p\u003e\u003cp\u003eПри Read Committed отдельные команды получают снимки согласно правилам этого уровня. Если между двумя SELECT другая транзакция зафиксировала изменение, результаты могут различаться. Repeatable Read даёт более устойчивый снимок транзакции, но сам по себе не запрещает все аномалии межстрочных правил. Представим двух дежурных: каждый видит, что другой остаётся на смене, и снимает себя. Разные строки обновлены без прямого конфликта, а правило «хотя бы один дежурный» нарушено. Это пример write skew — перекоса записей.\u003c/p\u003e\u003cp\u003eSerializable стремится допустить только результаты, совместимые с последовательным исполнением транзакций, но может завершить одну из них ошибкой сериализации. Тогда приложение повторяет всю транзакцию с начала, а не последнюю команду на старых предположениях. Сериализуемость также не делает внешнюю отправку письма откатываемой. Выбор уровня изоляции — часть протокола приложения, включая обработку отказа и повтор, а не один переключатель, после которого конкурентность исчезает.\u003c/p\u003e"},{"title":"Три механизма защиты","html":"\u003cp\u003eДля простого счётчика полезно условное обновление: \u003ccode\u003eUPDATE stock SET available = available - 1 WHERE sku = 'P17' AND available \u0026gt;= 1 RETURNING available\u003c/code\u003e. Проверка и изменение выполняются в одной команде под правилами СУБД. Наличие возвращённой строки означает успешное резервирование в данной транзакции; отсутствие — отсутствие подходящего остатка. Заказ создают в той же транзакции, а успех возвращают после её фиксации. Нельзя сначала подтвердить заказ пользователю, а затем надеяться на обновление.\u003c/p\u003e\u003cp\u003eДругой механизм — пессимистическая блокировка: \u003ccode\u003eSELECT ... FOR UPDATE\u003c/code\u003e захватывает соответствующие строки перед предметным решением. Конкурентный писатель ждёт или получает предусмотренную ошибку. Это удобно, если решение зависит от нескольких полей одной известной группы строк. Но блокировка только существующей строки не равна блокировке любого возможного будущего набора. Для правил диапазона или отсутствия записей требуется отдельный анализ уровня изоляции и ограничений.\u003c/p\u003e\u003cp\u003eОптимистическая проверка версии добавляет условие \u003ccode\u003eWHERE version = ожидаемая_версия\u003c/code\u003e. Если изменено ноль строк, кто-то опередил нас; перечитываем и заново принимаем решение. Такой подход хорош при редких конфликтах и длинном пользовательском редактировании, когда держать транзакцию открытой нельзя. При высокой конкуренции возможны многочисленные повторы. У каждого механизма своя цена: ожидание, повтор или более узкая выразимость условия. Выбор определяется формой инварианта и частотой конфликта.\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eBEGIN;\nUPDATE stock\nSET available = available - :qty\nWHERE sku = :sku AND available \u0026gt;= :qty\nRETURNING available;\n-- Если возвращено 0 строк: ROLLBACK, отказ по наличию.\n-- Если строка есть: INSERT заказа и его строк в этой транзакции.\nCOMMIT;\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eЗдесь :qty и :sku — связанные параметры, а количество заранее проверено как положительное. Ветвление выполняет приложение по результату RETURNING. Псевдокомментарий INSERT скрывает только форму полей, а не границу: заказ и резерв фиксируются одной транзакцией. Ответ об успехе отправляют после COMMIT; ошибка COMMIT требует отдельной обработки.\u003c/p\u003e"},{"title":"Несколько товаров, порядок и тупик","html":"\u003cp\u003eКорзина содержит два товара A и B. Первая транзакция блокирует A, затем хочет B. Вторая уже удерживает B и хочет A. Возникает цикл ожидания — deadlock, или взаимная блокировка. База обнаруживает его и прерывает одну транзакцию. Это механизм выхода из тупика, а не свидетельство повреждения данных. Приложение должно уметь откатить операцию и при допустимых условиях повторить её целиком.\u003c/p\u003e\u003cp\u003eЕдиный порядок захвата, например сортировка SKU перед резервированием, уменьшает вероятность таких циклов. Однако порядок должен соблюдаться во всех путях, включая отмену, служебные операции и пакетную загрузку. Время транзакции также важно: чем дольше удерживаются строки, тем больше ожидающих запросов. Для популярных товаров длинная очередь может сделать интерфейс бесполезным при правильной целостности. Тогда нужны ограничения ожидания, понятный отказ или предметная очередь, а не просто ещё один сервер приложения.\u003c/p\u003e\u003cp\u003eЕсли одного товара не хватает, транзакция откатывает резерв остальных. Это локальная атомарность корзины, выбранная политикой продукта. Альтернатива — частичный заказ с явным согласованием клиента. База не решает, какой опыт лучше. Она позволяет корректно исполнить выбранное правило. Поэтому разработчик и владелец продукта должны одинаково понимать, означает ли «заказ принят» весь состав, доступную часть или предварительный запрос без гарантии наличия.\u003c/p\u003e"},{"title":"Резерв не равен физической коробке","html":"\u003cp\u003eПосле фиксации резерва товар ещё не уехал со склада. Резерв — цифровое обещание с жизненным циклом: создан, подтверждён сборкой, освобождён отменой или истечением срока. Если забыть освобождение, база останется согласованной математически, но продажи остановятся из-за вечных резервов. Если освобождение выполнить дважды, доступный остаток окажется завышен. Переход состояния должен проверять предыдущее состояние и действовать один раз в предметном смысле.\u003c/p\u003e\u003cp\u003eВремя истечения нельзя реализовать только клиентским таймером. Клиент может закрыться, а сервер — перезапуститься. Нужна сохранённая дата истечения и повторяемый фоновый процесс. Сам факт наступления даты также требует определить, кто выигрывает гонку между подтверждением сборки и освобождением. Оба пути должны использовать согласованную защиту записи. Фоновый процесс не становится безопасным только потому, что его называют техническим.\u003c/p\u003e\u003cp\u003eНаконец, транзакция защищает цифровую модель от конкурентных ошибок, но не от неверного пересчёта склада. Повреждённая или потерянная коробка требует инвентаризации и предметной корректировки. В журнале важно сохранить причину изменения остатка, связь с заказом и исполнителя. Если все отклонения списывать на «гонку», команда перестанет различать ошибки программы и расхождения физического мира. Хорошая архитектура делает обе причины наблюдаемыми, не обещая решить одну средствами другой.\u003c/p\u003e"}],"workedExample":{"title":"Два покупателя и одна коробка","html":"\u003cp\u003eВ stock для P17 значение available=1. Обработчики T1 и T2 начинают транзакции Read Committed и выполняют условное уменьшение. T1 первым получает возможность изменить строку, записывает 0 и получает строку в RETURNING. Он создаёт заказ O101 и фиксирует транзакцию. T2 ждёт конкурентное изменение, затем проверка условия для доступной актуальной строки не даёт подходящего остатка. Его команда возвращает ноль строк; заказ не создаётся, пользователь видит отказ по наличию.\u003c/p\u003e\u003cp\u003eЕсли T1 упал до фиксации, его изменения откатываются, и T2 может успешно зарезервировать единицу. Если T1 упал после фиксации, но до отправки ответа, резерв и O101 остаются. Это соединяет главы 02 и 04: конкурентная целостность обеспечена, а неопределённость ответа остаётся. Повтор T1 как нового намерения нельзя автоматически считать безопасным. Нам потребуется связь попыток с одним заказом; отрицательный остаток и дубль запроса — разные проблемы.\u003c/p\u003e\u003cp\u003eТеперь корзина включает P17 и P18. Оба ресурса обрабатываем в одном установленном порядке. Если P18 закончился, откат возвращает уменьшение P17. Оператор не увидит принятую пустую шапку. Проверка \u003ccode\u003eCHECK (available \u0026gt;= 0)\u003c/code\u003e служит дополнительным барьером, однако сама не связывает резерв с заказом. Если код уменьшил остаток и не создал заказ, ограничение не заметит потерянное обещание.\u003c/p\u003e\u003cp\u003eПроверяем решение двумя параллельными клиентами и искусственными остановками между стадиями. Ожидаем либо один зафиксированный заказ и остаток 0, либо отсутствие обоих эффектов при откате. Отдельно тестируем обработку deadlock и ошибок сериализации, если выбран соответствующий алгоритм. Не следует считать случайно успешный одиночный прогон доказательством: в проверке нужно управлять пересечением операций и наблюдать сохранение инварианта.\u003c/p\u003e"},"expedition":{"world":"inventory","title":"Экспедиция: места на концерт","html":"\u003cp\u003eУчебный билетный сервис продаёт конкретные кресла. Ограниченный ресурс напоминает товар, но каждая единица уникальна: место A12 нельзя заменить соседним без согласия покупателя. Поэтому естественная модель содержит состояние каждого места и защищённый переход «свободно → зарезервировано». Условное обновление по идентификатору и ожидаемому состоянию позволяет определить победителя конкурентной попытки.\u003c/p\u003e\u003cp\u003eПереносится атомарная граница: если группа покупает три соседних места и продукт обещает целый набор, резервируют их вместе либо не резервируют ни одного. Общий порядок захвата снижает риск взаимных блокировок. Истечение резерва должно конкурировать с подтверждением по тем же правилам. Таймер на экране является отображением серверного срока, а не полномочием освободить место в обход сохранённого состояния.\u003c/p\u003e\u003cp\u003eОтличие проявляется при очень горячем событии. Сотни тысяч желающих могут претендовать на небольшой набор кресел, и правильная блокировка базы превратится в длинное ожидание. Тогда предварительная очередь допуска регулирует число активных покупателей. Очередь не заменяет защиту места: два допущенных клиента всё ещё могут выбрать A12. Она управляет давлением на механизм целостности. Насмотренность здесь состоит в разделении двух целей: не продать одно место дважды и не дать миллиону ожиданий одновременно захватить ресурсы сервиса.\u003c/p\u003e","transfer":["Защищённый переход состояния","Атомарность набора ограниченных ресурсов"],"distinct":["Уникальные места","Очередь допуска при массовом одновременном спросе"]},"diagrams":[{"title":"Условное изменение разрешает гонку","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-04-0-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eУсловное изменение разрешает гонку\u003c/text\u003e\u003crect x=\"35\" y=\"72\" width=\"180\" height=\"50\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"125.0\" y=\"103.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eT1\u003c/text\u003e\u003cline x1=\"125\" y1=\"122\" x2=\"125\" y2=\"377\" stroke=\"#90a4b5\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"/\u003e\u003crect x=\"290\" y=\"72\" width=\"180\" height=\"50\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"380.0\" y=\"103.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003estock: P17\u003c/text\u003e\u003cline x1=\"380\" y1=\"122\" x2=\"380\" y2=\"377\" stroke=\"#90a4b5\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"/\u003e\u003crect x=\"545\" y=\"72\" width=\"180\" height=\"50\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"635.0\" y=\"103.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eT2\u003c/text\u003e\u003cline x1=\"635\" y1=\"122\" x2=\"635\" y2=\"377\" stroke=\"#90a4b5\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"/\u003e\u003cline x1=\"125\" y1=\"165\" x2=\"380\" y2=\"165\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-04-0-arr)\"/\u003e\u003ctext x=\"142\" y=\"152\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eUPDATE: 1 → 0\u003c/text\u003e\u003cline x1=\"635\" y1=\"215\" x2=\"380\" y2=\"215\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-04-0-arr)\"/\u003e\u003ctext x=\"424\" y=\"202\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eUPDATE: ждёт T1\u003c/text\u003e\u003cline x1=\"380\" y1=\"265\" x2=\"125\" y2=\"265\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-04-0-arr)\"/\u003e\u003ctext x=\"148\" y=\"252\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eT1 COMMIT\u003c/text\u003e\u003cline x1=\"380\" y1=\"325\" x2=\"635\" y2=\"325\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-04-0-arr)\"/\u003e\u003ctext x=\"422\" y=\"312\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eУсловие ложно\u003c/text\u003e\u003ctext x=\"40\" y=\"413\" font-family=\"Arial, sans-serif\" font-size=\"19\" fill=\"#23734b\" text-anchor=\"start\" font-weight=\"400\"\u003eЗелёный итог: 1 заказ, available=0.\u003c/text\u003e\u003ctext x=\"40\" y=\"442\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eT2 получает 0 строк; отдельно заказ не создаётся.\u003c/text\u003e","caption":"Время идёт вниз. T2 не принимает решение по самостоятельному старому чтению: его условное UPDATE соперничает за ту же строку. После фиксации T1 доступного остатка нет. Если T1 откатился бы, дальнейший исход T2 мог быть другим."},{"title":"Взаимная блокировка: цикл ожидания","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-04-1-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eВзаимная блокировка: цикл ожидания\u003c/text\u003e\u003crect x=\"50\" y=\"85\" width=\"240\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"170.0\" y=\"126.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eT1: удерживает A\u003c/text\u003e\u003crect x=\"470\" y=\"85\" width=\"240\" height=\"70\" rx=\"12\" fill=\"#eaf2fa\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"590.0\" y=\"126.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eT2: удерживает B\u003c/text\u003e\u003crect x=\"50\" y=\"267\" width=\"240\" height=\"70\" rx=\"12\" fill=\"#fff1d5\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"170.0\" y=\"308.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eНужно B\u003c/text\u003e\u003crect x=\"470\" y=\"267\" width=\"240\" height=\"70\" rx=\"12\" fill=\"#fff1d5\" stroke=\"#32729c\" stroke-width=\"2\"/\u003e\u003ctext x=\"590.0\" y=\"308.0\" font-family=\"Arial, sans-serif\" font-size=\"18\" fill=\"#16324a\" text-anchor=\"middle\" font-weight=\"600\"\u003eНужно A\u003c/text\u003e\u003cline x1=\"170\" y1=\"155\" x2=\"170\" y2=\"267\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-04-1-arr)\"/\u003e\u003cline x1=\"590\" y1=\"155\" x2=\"590\" y2=\"267\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-04-1-arr)\"/\u003e\u003cline x1=\"290\" y1=\"300\" x2=\"390\" y2=\"300\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"390\" y1=\"300\" x2=\"390\" y2=\"120\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"390\" y1=\"120\" x2=\"470\" y2=\"120\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-04-1-arr)\"/\u003e\u003cline x1=\"470\" y1=\"315\" x2=\"355\" y2=\"315\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"355\" y1=\"315\" x2=\"355\" y2=\"135\" stroke=\"#32729c\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"355\" y1=\"135\" x2=\"290\" y2=\"135\" stroke=\"#32729c\" stroke-width=\"2.5\" marker-end=\"url(#journey-ch-04-1-arr)\"/\u003e\u003ctext x=\"380\" y=\"213\" font-family=\"Arial, sans-serif\" font-size=\"20\" fill=\"#a43e32\" text-anchor=\"middle\" font-weight=\"700\"\u003eЦИКЛ\u003c/text\u003e\u003ctext x=\"35\" y=\"393\" font-family=\"Arial, sans-serif\" font-size=\"19\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eВыход: база прерывает одну транзакцию.\u003c/text\u003e\u003ctext x=\"35\" y=\"430\" font-family=\"Arial, sans-serif\" font-size=\"17\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"400\"\u003eПрофилактика: один порядок A → B во всех путях; повторы целиком.\u003c/text\u003e","caption":"T1 уже удерживает A и ждёт B; T2 удерживает B и ждёт A. Перекрёстные связи образуют цикл. База разрывает его отказом одного участника; согласованный порядок снижает риск, но не отменяет обязанность обрабатывать ошибки транзакции."}],"decision":{"prompt":"Чем защитить простой остаток в одной PostgreSQL?","options":[{"title":"Условное UPDATE в транзакции заказа","consequence":"Проверка наличия связана с уменьшением, неудача выражается нулём строк.","tradeoff":"Подходит для простого инварианта; остальные пути обязаны соблюдать те же правила."},{"title":"SELECT FOR UPDATE и предметная проверка","consequence":"Удобно принять решение по нескольким полям заблокированных строк.","tradeoff":"Дольше удерживаются блокировки; нужен общий порядок и обработка ожиданий."},{"title":"Serializable для более сложного правила","consequence":"База выявляет недопустимое совместное исполнение транзакций.","tradeoff":"Приложение должно повторять целые транзакции; внешние эффекты остаются за границей."}],"recommended":0,"explanation":"Для одного счётчика условное изменение наиболее прямо выражает правило. При межстрочном инварианте нужно заново выбрать защиту, а не растягивать этот рецепт."},"exercise":{"prompt":"Почему CHECK available\u003e=0 недостаточно для всего заказа?","model":"\u003cp\u003eОграничение не допускает отрицательное значение строки, но не гарантирует соответствие резерва принятому заказу и не предотвращает дубль бизнес-намерения. Связанные записи объединяют транзакцией и защищают согласованным протоколом.\u003c/p\u003e","rubric":["Различены локальное условие и связанный инвариант","Указана транзакционная граница"]},"checkpoint":[{"question":"Что делать после ошибки сериализации?","options":["Откатить и при допустимости повторить всю транзакцию с начала","Повторить только последнюю запись на прежних чтениях","Считать заказ принятым, потому что чтение было успешным"],"answer":0,"explanation":"Предпосылки решения могли измениться; повтор последней команды не восстанавливает их."},{"question":"Памятная блокировка одного процесса защищает остаток…","options":["Только от участников, использующих именно эту блокировку","От всех экземпляров приложения автоматически","От любого прямого SQL-изменения базы"],"answer":0,"explanation":"Локальная координация не покрывает независимые процессы и пути записи."}],"sources":[{"title":"PostgreSQL 18: transaction isolation","url":"https://www.postgresql.org/docs/18/transaction-iso.html"},{"title":"PostgreSQL 18: explicit locking","url":"https://www.postgresql.org/docs/18/explicit-locking.html"},{"title":"PostgreSQL 18: MVCC introduction","url":"https://www.postgresql.org/docs/18/mvcc-intro.html"},{"title":"PostgreSQL 18: UPDATE","url":"https://www.postgresql.org/docs/18/sql-update.html"},{"title":"PostgreSQL 18: constraints","url":"https://www.postgresql.org/docs/18/ddl-constraints.html"}],"wordCount":1667},{"id":"ch-05","arc":2,"title":"Почему всё замедлилось: запросы, индексы, планы","briefing":"Два заказа уже не отбирают последнюю коробку друг у друга. Но после накопления истории экран оператора стал ждать секунды. До добавления серверов нужно понять, какую работу база выполняет для одного экрана и почему она выбирает этот способ.","goals":["Читать план как дерево работы, а не как магический рейтинг","Связать форму запроса с индексом и объёмом данных","Различать плохой доступ, ошибочную оценку и ожидание ресурсов"],"sections":[{"title":"Медленный экран — ещё не медленная база","html":"\u003cp\u003eОператор открывает список новых заказов своего склада. Запрос кажется простым: фильтр по складу и статусу, сортировка по дате, первые 50 строк. Но экран может сначала получить список, затем отдельно запросить покупателя для каждой строки, затем доставку для каждого заказа. Такой рисунок называют N+1: один исходный запрос плюс множество зависимых. Даже быстрые команды суммарно дают большой сетевой и процессорный расход. Лечить только один из них индексом недостаточно.\u003c/p\u003e\u003cp\u003eСначала измеряем путь: очередь в приложении, ожидание пула соединений, исполнение SQL, передачу результата и сборку ответа. В базе различаем вычисление, ввод-вывод и ожидание блокировок. Запрос, большую часть времени ожидающий другую транзакцию, не станет радикально быстрее после замены последовательного чтения индексным. Нужны идентичные единицы наблюдения: полный запрос приложения и конкретные обращения базы внутри него.\u003c/p\u003e\u003cp\u003eФиксируем не только среднее время, но частоту и объём возвращаемых данных. Команда на 20 миллисекунд, выполняемая сто раз на экран, может быть важнее редкого отчёта на секунду. Статистика без параметров также скрывает перекос: маленький склад и центральный распределительный центр имеют разную селективность. В этой главе работаем на копии или безопасном стенде с репрезентативными данными; случайные десять строк не воспроизводят поведение накопленной истории.\u003c/p\u003e"},{"title":"Индекс — альтернативный путь к данным","html":"\u003cp\u003eB-tree хранит ключи в упорядоченной структуре, позволяющей найти диапазон без просмотра всех строк. Для запроса оператора кандидат — индекс \u003ccode\u003e(warehouse_id, status, created_at DESC, id DESC)\u003c/code\u003e. Равенства по складу и статусу задают подходящую область, порядок по времени и идентификатору позволяет идти к первым результатам. Последний идентификатор устраняет неоднозначность одинаковых времён. Это модель доступа к конкретному запросу, а не совет индексировать все столбцы.\u003c/p\u003e\u003cp\u003eИндекс не обязательно является самой таблицей. Найдя ссылки, база может обратиться к страницам heap, чтобы получить остальные поля и проверить видимость. При выборе значительной доли таблицы множество разрозненных обращений может быть дороже последовательного чтения. Поэтому Seq Scan не является автоматически ошибкой: для маленькой таблицы или широкого результата он часто разумен. Удобный индекс помогает пропустить работу, а не просто получить новый значок в плане.\u003c/p\u003e\u003cp\u003eПорядок составного ключа имеет значение. Индекс по складу, статусу и времени отличается от индекса только по времени. Современный PostgreSQL умеет дополнительные оптимизации, включая skip scan в подходящих случаях, поэтому абсолютное правило «без первого столбца индекс никогда не используется» слишком грубо. Но это не повод игнорировать основной профиль: чем точнее ведущие равенства и требуемый диапазон соответствуют ключу, тем предсказуемее сокращается чтение. Проверять следует реальный план выбранной версии.\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e-- Только учебный стенд: сначала измерение, затем кандидатный индекс.\nSELECT id, created_at, buyer_id\nFROM orders\nWHERE warehouse_id = 'W3' AND status = 'new'\nORDER BY created_at DESC, id DESC\nLIMIT 50;\n\nCREATE INDEX orders_work_queue\nON orders (warehouse_id, status, created_at DESC, id DESC);\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eДва ведущих равенства выбирают область склада и статуса. Следующие поля повторяют порядок выдачи, чтобы не сортировать весь подходящий набор ради первых 50 строк. Это кандидат для проверки плана, а не универсальная команда настройки. Создание индекса на рабочей базе требует отдельного плана: обычный CREATE INDEX влияет на конкурентную запись, а режим CONCURRENTLY имеет собственные условия и цену. В примере ничего выполнять не требуется.\u003c/p\u003e"},{"title":"План — дерево операторов и оценок","html":"\u003cp\u003eEXPLAIN показывает выбранный план: сканирование, соединения, сортировки, агрегаты. Читать его полезно от листьев к корню: откуда берутся строки, как они сокращаются или размножаются, что происходит перед выдачей результата. Стоимость в плане выражена в условных единицах модели, а не миллисекундах. Сравнение чисел помогает понять выбор планировщика, но не заменяет фактическое измерение на конкретном железе и состоянии кэша.\u003c/p\u003e\u003cp\u003eEXPLAIN ANALYZE исполняет запрос и добавляет фактические наблюдения. Для изменяющей команды это настоящее изменение, поэтому запускать её без понимания на production опасно. Для безопасного разбора используем SELECT на стенде или подготовленную транзакцию с учётом её побочных эффектов. Смотрим фактические строки, loops и время каждого узла. Если внутренний узел выполнялся тысячу раз, маленькая цена одного прохода может сложиться в главный расход.\u003c/p\u003e\u003cp\u003eБольшое расхождение estimated rows и actual rows подсказывает ошибку оценки распределения. Статистика может устареть или не отражать зависимость полей: например, статус «новый» чаще встречается у недавних заказов, а не равномерно по всей истории. Прежде чем запрещать планировщику какой-либо алгоритм, проверяем актуальность статистики, распределение параметров и саму форму запроса. Хорошее расследование объясняет, почему план казался выгодным и где предположение разошлось с данными.\u003c/p\u003e"},{"title":"Разные способы читать и соединять","html":"\u003cp\u003eIndex Scan находит подходящие записи через индекс и обращается к таблице. Bitmap-план сначала собирает подходящие позиции, затем читает нужные страницы в более удобном порядке. Index Only Scan способен получить нужные значения из индекса, но отсутствие обращений к heap зависит также от информации о видимости; наличие всех столбцов не является единственным условием. INCLUDE может добавить полезные поля в индекс, увеличив размер и стоимость обслуживания.\u003c/p\u003e\u003cp\u003eСоединение таблиц тоже выполняется разными алгоритмами. Nested Loop перебирает строки внешнего входа и ищет соответствия во внутреннем; это хорошо при малом внешнем наборе и быстром поиске, но плохо при неожиданно большом числе повторов. Hash Join строит хеш-структуру по одной стороне; ему нужна память, а переполнение ведёт к дополнительной работе. Merge Join использует согласованный порядок входов, но подготовка этого порядка тоже стоит ресурсов. Ни один алгоритм не лучший без условий.\u003c/p\u003e\u003cp\u003eСортировка может помещаться в памяти или использовать временные файлы. Увеличить память на операцию иногда полезно, но параллельные запросы и несколько узлов плана умножают совокупное потребление. Глобально поставить огромный лимит из-за одного отчёта — способ перенести проблему в нехватку памяти. Для экранного списка сначала проверяем, можно ли получить требуемый порядок прямо из подходящего индекса и ограничить объём раньше, чем сортировать большой промежуточный набор.\u003c/p\u003e"},{"title":"Цена индексов и жизнь таблицы","html":"\u003cp\u003eКаждый дополнительный индекс занимает место и участвует в обслуживании изменений. Запись заказа должна не только сохранить строку, но и поддержать соответствующие структуры. Обновление полей, входящих в индексы, может добавлять особенно заметную работу. Поэтому правило «индекс на каждое поле на всякий случай» расходует ресурсы ради неизвестных запросов. С другой стороны, внешний ключ на стороне ссылающихся строк не следует автоматически считать уже покрытым нужным индексом: конкретную схему надо проверить.\u003c/p\u003e\u003cp\u003eЧастичный индекс хранит только строки, удовлетворяющие условию, например незавершённые заказы. Это может значительно уменьшить объём горячего доступа, если большинство истории закрыто. Но запрос должен позволять планировщику доказать применимость условия; отличающиеся предикаты и подготовленные параметры требуют проверки. После перехода заказа в закрытое состояние индекс также обслуживается. Небольшой размер не означает бесплатность.\u003c/p\u003e\u003cp\u003eМноговерсионность оставляет старые версии строк, а VACUUM помогает освобождать их для повторного использования, когда они больше не нужны. Длинные транзакции могут задерживать очистку. Поэтому наблюдаем не только число заказов, но и обслуживание, рост таблиц, длительные снимки и частоту изменений. Производительность — свойство жизненного цикла данных. Однократное создание хорошего индекса не отменяет необходимость следить за тем, как таблица стареет и как меняются запросы продукта.\u003c/p\u003e"},{"title":"Пагинация и выбор работы","html":"\u003cp\u003eСписок с LIMIT 50 OFFSET 500000 не означает, что база бесплатно перепрыгнула полмиллиона результатов. Ей может потребоваться пройти и отбросить множество строк. Для последовательного просмотра полезна пагинация по ключу: клиент передаёт последнюю пару created_at и id, следующий запрос выбирает записи после этой границы в согласованном порядке. Это сокращает повторную работу, но меняет возможности интерфейса: прямой переход на произвольную «страницу 10000» уже не естественная операция.\u003c/p\u003e\u003cp\u003eПараллельные вставки и изменения требуют определить смысл списка. Хотим ли мы снимок на момент открытия или живую ленту? При живой ленте некоторые элементы могут сдвигаться между запросами. Уникальный дополнительный ключ делает порядок устойчивым для одинаковых времён, но не создаёт неизменный снимок всех страниц автоматически. Для оператора часто лучше показать новые поступления отдельно, чем пытаться удержать иллюзию статической книжной нумерации.\u003c/p\u003e\u003cp\u003eПосле исправления запроса измеряем тот же профиль нагрузки и проверяем цену записи. Если чтение ускорилось, но время оформления резко выросло из-за огромного набора индексов, общий результат может быть плохим. Кэш и реплики рассмотрим позже: они полезны, когда понятна исходная работа и допустима определённая свежесть. Размножение неудачного запроса по копиям может лишь сделать его дороже и труднее диагностировать.\u003c/p\u003e"}],"workedExample":{"title":"Пятьдесят заказов из миллиона","html":"\u003cp\u003eНа учебном стенде миллион заказов; 900 тысяч закрыты, 100 тысяч ещё участвуют в работе. Экран склада W3 выбирает новые заказы, сортирует их и берёт 50. Начальный план читает значительную часть таблицы и сортирует подходящий набор. Приложение затем выполняет ещё 50 запросов покупателей. Для расследования отделяем две проблемы: широкий доступ к заказам и N+1 при сборке ответа.\u003c/p\u003e\u003cp\u003eСначала проверяем количество подходящих строк и распределение по складам. Для W3 новых заказов 1200, но для центрального W1 — 60 тысяч. Сравниваем планы для обоих параметров, а не только для удобного маленького склада. Создаём кандидатный составной индекс, обновляем статистику и повторяем измерение. В хорошем плане чтение идёт от нужной области в нужном порядке и останавливается после достаточного количества строк. Это ожидаемый механизм улучшения, а не обещание конкретной миллисекунды.\u003c/p\u003e\u003cp\u003eЗатем заменяем 50 обращений к покупателям одним осмысленным соединением или пакетным чтением необходимых идентификаторов. Не добавляем в ответ все персональные данные: оператору достаточно разрешённого набора. Для пагинации используем последний created_at,id вместо большого OFFSET. Проверяем одинаковые времена, пустую следующую страницу и поступление новых заказов во время просмотра.\u003c/p\u003e\u003cp\u003eФинальная проверка включает профиль записи: оформление, смену статуса и закрытие заказов. Сравниваем размеры индексов и число прочитанных страниц при тёплом и более холодном кэше. Если улучшение есть только на повторном запуске маленького набора, не распространяем его на весь рабочий день. Запись решения содержит запрос, распределение данных, план до и после и границу применимости. Так следующий инженер сможет понять, почему индекс существует и при каком изменении продукта его пересмотреть.\u003c/p\u003e"},"expedition":{"world":"telemetry","title":"Экспедиция: журнал измерений датчиков","html":"\u003cp\u003eУ учебной сети холодильных установок миллионы измерений температуры. Частый вопрос — показания одного устройства за последний день; редкий — средняя температура по всем устройствам за год. Первый доступ похож на список заказов и подходит под упорядоченный ключ device_id,time. Второй читает большую долю данных, поэтому обещание «индекс ускорит всё» не работает. Может понадобиться агрегация или отдельный аналитический контур, который разберём позднее.\u003c/p\u003e\u003cp\u003eВременная корреляция физического расположения делает интересным BRIN — компактный индекс сводок по диапазонам страниц. Он не хранит подробный путь к каждой строке, как B-tree, и полезен при соответствующем распределении. Но поздние измерения и перемешивание данных меняют его эффективность. Название временного ряда само не доказывает пригодность определённого индекса: важно, как поступают и располагаются данные.\u003c/p\u003e\u003cp\u003eПереносится способ расследования: определить запрос, объём результата, селективность и реальный план. Новое — поток с длительным хранением, опоздавшими событиями и аналитикой по широким интервалам. Если отчёт регулярно читает почти всё, правильным решением может стать уменьшение самой работы через предварительную агрегацию, а не накопление индексов. Насмотренность — увидеть, когда вопрос продукта изменил класс доступа, хотя таблица по-прежнему состоит из простых строк.\u003c/p\u003e","transfer":["План как объяснение фактической работы","Индекс соответствует конкретному доступу"],"distinct":["Временная корреляция","Широкие аналитические интервалы"]},"diagrams":[{"title":"План как дерево проделанной работы","viewBox":"0 0 760 460","svg":"\u003cdefs\u003e\u003cmarker id=\"journey-ch-05-0-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#32729c\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003crect x=\"0\" y=\"0\" width=\"760\" height=\"460\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9e5ee\" stroke-width=\"2\"/\u003e\u003ctext x=\"26\" y=\"34\" font-family=\"Arial, sans-serif\" font-size=\"22\" fill=\"#16324a\" text-anchor=\"start\" font-weight=\"700\"\u003eПлан как дерево проделанной работы\u003c/text
