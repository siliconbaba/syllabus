x=\"44\" y=\"133\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eB: version 9\u003c/text\u003e\u003crect x=\"285\" y=\"80\" width=\"200\" height=\"90\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"299\" y=\"108\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eОптимизатор\u003c/text\u003e\u003ctext x=\"299\" y=\"133\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eплан X→B\u003c/text\u003e\u003crect x=\"540\" y=\"80\" width=\"190\" height=\"90\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"554\" y=\"108\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eТекущая база\u003c/text\u003e\u003ctext x=\"554\" y=\"133\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eB: version 10\u003c/text\u003e\u003cline x1=\"230\" y1=\"125\" x2=\"285\" y2=\"125\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"285.0,125.0 277.1,129.3 277.1,120.7\" fill=\"#51657a\"/\u003e\u003cline x1=\"485\" y1=\"125\" x2=\"540\" y2=\"125\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"540.0,125.0 532.1,129.3 532.1,120.7\" fill=\"#51657a\"/\u003e\u003crect x=\"280\" y=\"265\" width=\"290\" height=\"85\" rx=\"10\" fill=\"#fee2e2\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"294\" y=\"293\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eПроверка версии\u003c/text\u003e\u003ctext x=\"294\" y=\"318\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eожидали 9, видим 10\u003c/text\u003e\u003cline x1=\"635\" y1=\"170\" x2=\"490\" y2=\"265\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"490.0,265.0 494.2,257.1 499.0,264.3\" fill=\"#51657a\"/\u003e\u003ctext x=\"35\" y=\"245\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eПока считали план,\u003c/text\u003e\u003ctext x=\"35\" y=\"275\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eB принял другой заказ\u003c/text\u003e\u003ctext x=\"35\" y=\"410\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#b45309\" text-anchor=\"start\"\u003eКонфликт → пересчитать; прежнее назначение не перетирать\u003c/text\u003e","caption":"Изменение версии B между снимком и применением делает старое назначение недопустимым. Атомарная проверка отвергает план; математическое качество не даёт права отнять уже принятое обязательство."}],"decision":{"prompt":"Как назначать в первом городе?","options":[{"title":"Дорожные кандидаты и простая объяснимая эвристика","consequence":"Быстрый и контролируемый старт","tradeoff":"Может проигрывать совместному плану при плотном спросе"},{"title":"Короткие окна совместного matching","consequence":"Лучше учитывает общую матрицу вариантов","tradeoff":"Добавляет ожидание и сложность фиксации"},{"title":"Диспетчер с автоматической проверкой ограничений","consequence":"Человек учитывает редкие нюансы","tradeoff":"Стоимость, ограниченная масштабируемость и неоднородные решения"}],"recommended":0,"explanation":"Сначала нужны точные входы и безопасная фиксация. Затем сравниваем эвристику с короткими окнами по качеству и стабильности, сохраняя ручную обработку исключений."},"exercise":{"prompt":"Почему большой штраф за отсутствие холодильника хуже исключения ребра?","model":"\u003cp\u003eШтраф всё ещё допускает вариант, если остальные дороже. Жёсткое физическое ограничение должно запрещать назначение; оптимизация выбирает только среди допустимых пар.\u003c/p\u003e","rubric":["Разделены запрет и предпочтение","Указан риск численной оптимизации"]},"checkpoint":[{"question":"Что делать при конфликте версии ресурса после оптимизации?","options":["Проверить актуальное состояние и пересчитать затронутую часть","Применить план, потому что он оптимален","Удалить текущее назначение"],"answer":0,"explanation":"Оптимум относился к старому снимку и не даёт права перезаписать новые обязательства."},{"question":"Зачем цена переназначения в функции стоимости?","options":["Учитывать реальную потерю стабильности и исполнения","Гарантировать математический глобальный оптимум","Заменить авторизацию диспетчера"],"answer":0,"explanation":"Частые улучшения на снимках могут ухудшать исполнение в физическом мире."}],"sources":[{"title":"Яндекс, «Как мы распределяем заказы между водителями в Яндекс.Такси», 07.02.2019: исторический кейс matching","url":"https://habr.com/ru/companies/yandex/articles/439182/"},{"title":"Google OR-Tools, Assignment: официальное описание моделей","url":"https://developers.google.com/optimization/assignment"},{"title":"Google OR-Tools, Vehicle Routing: ограничения и маршруты","url":"https://developers.google.com/optimization/routing"}],"wordCount":1521},{"id":"ch-16","arc":4,"title":"Сообщить об изменении: realtime переживает разрыв связи","briefing":"Заказ назначен. Клиент хочет видеть движение, курьер — чат, диспетчер — совместно менять инструкцию. «Северный маршрут» выясняет, что открытый сокет не является ни историей, ни гарантией прочтения.","goals":["Разделять транспорт, устойчивую историю и уведомление","Проектировать reconnect, offline и уровни подтверждения","Выбирать семантику конкурентного редактирования"],"sections":[{"title":"Realtime — обещание задержки, а не отдельная истина","html":"\u003cp\u003eПользователь ожидает увидеть изменение быстро. Для этого можно периодически спрашивать сервер, держать HTTP-поток событий или двустороннее соединение. Polling прост и предсказуем, но частые пустые запросы расходуют сеть и батарею; редкие увеличивают задержку. Long polling удерживает запрос до изменения или тайм-аута. Выбор зависит от частоты событий, инфраструктуры, фонового режима устройства и допустимой задержки, а не от модности слова realtime.\u003c/p\u003e\u003cp\u003eServer-Sent Events, SSE, передаёт события от сервера клиенту по HTTP. Браузерный EventSource умеет переподключаться и передавать Last-Event-ID, но сервер должен сам иметь историю и правило продолжения. WebSocket задаёт двусторонний транспорт с обменом сообщениями. Он удобен для чата и интерактивного взаимодействия, однако не хранит события после разрыва, не даёт бизнес-дедупликацию и не подтверждает прочтение человеком. Эти свойства строятся выше транспортного протокола.\u003c/p\u003e\u003cp\u003eУ «Северного маршрута» авторитетный статус заказа сохраняется в базе и распространяется событиями. Realtime-канал ускоряет доставку уведомления об изменении. Если канал сломан, заказ не перестаёт существовать; клиент может перечитать состояние и продолжить с позиции. Такое разделение предотвращает опасную зависимость, когда единственная копия назначения живёт в памяти сервера соединений. Быстро доставить и надёжно сохранить — разные задачи, которые должны соединяться явным протоколом.\u003c/p\u003e"},{"title":"Соединение приходит к узлу, пользователь — к системе","html":"\u003cp\u003eШлюзы соединений держат тысячи открытых каналов. Балансировщик распределяет новые подключения; сообщение для конкретного пользователя должно попасть на тот узел, где находится его текущее соединение. Можно вести реестр подключений либо распространять события между шлюзами с фильтрацией. Реестр должен переживать смену узла и иметь срок актуальности: после сетевого обрыва запись может ещё указывать на мёртвое соединение. Это маршрут доставки, а не право доступа.\u003c/p\u003e\u003cp\u003eАвторизация проверяется при подписке на заказ или чат. Знание order_id не даёт право видеть его координаты и сообщения. Права меняются: курьер завершил работу, диспетчер перешёл в другой регион, токен отозван. Долгое соединение не должно замораживать прежние полномочия навсегда. Нужны обновление токена, проверка важных действий и механизм закрытия потерявших право подписок. Персональные координаты особенно плохо подходят широковещательной рассылке с надеждой на фильтрацию клиентом.\u003c/p\u003e\u003cp\u003eМедленный клиент создаёт backpressure: буфер отправки растёт быстрее, чем сеть принимает. Для координат можно схлопывать промежуточные точки и держать последнюю с версией. Для чата такое схлопывание потеряет текст, поэтому при превышении буфера соединение разрывают и предлагают продолжить из устойчивой истории. Разные типы событий требуют разных политик перегрузки. Один общий бесконечный буфер превращает слабую мобильную сеть в проблему памяти всего сервера.\u003c/p\u003e"},{"title":"Reconnect: догнать пропуск и не удвоить эффект","html":"\u003cp\u003eКлиент сохраняет последний применённый sequence внутри потока, например чата или заказа. После переподключения он сообщает позицию, а сервер отдаёт недостающее. Глобальная нумерация всей компании часто не нужна и создаёт лишнюю координацию. Порядок внутри чата и версия заказа обычно полезнее общего порядкового номера. event_id отличает повтор, а sequence помогает обнаружить пропуск; это разные роли идентификаторов.\u003c/p\u003e\u003cp\u003eЕсть тонкая гонка между snapshot и подпиской. Если сначала прочитать состояние, а потом открыть поток, событие между шагами можно потерять. Если сначала подписаться, затем читать, некоторые события могут прийти дважды. Надёжный протокол связывает снимок с позицией и продолжает после неё либо буферизует поток до применения снимка. Повтор безопаснее пропуска, когда версия и дедупликация спроектированы. Просто «перезагрузить экран после reconnect» не доказывает отсутствие гонки.\u003c/p\u003e\u003cp\u003eИстория ограничена сроком. Если клиент отсутствовал месяц, а события доступны неделю, сервер сообщает, что курсор слишком стар, и выдаёт новый snapshot с актуальной позицией. Он не делает вид, будто продолжение было полным. Для состояния заказа это приемлемо, для обязательной истории чата требуется другой срок хранения. Приёмка включает разрыв до и после применения события, смену шлюза, повтор последнего события и пропуск вне retention.\u003c/p\u003e"},{"title":"Чат и уведомление имеют разные подтверждения","html":"\u003cp\u003eСообщение чата проходит несколько уровней: принято API, устойчиво сохранено, доставлено устройству, отображено приложением, прочитано человеком по принятой продуктовой модели. Один транспортный ack не означает все эти уровни. Отметка «прочитано» также не доказывает понимание. Для договорённостей с операционными последствиями иногда нужен отдельный явный ответ, а не синий индикатор. Контракт интерфейса должен честно называть, что подтверждено.\u003c/p\u003e\u003cp\u003eМобильный клиент создаёт client_message_id до отправки и хранит исходящее сообщение локально. Повтор после потери ответа использует тот же идентификатор. Сервер применяет уникальность в рамках отправителя и чата, сохраняет сообщение и назначает последовательность. Клиент может оптимистично показать текст со статусом pending, затем связать его с серверной записью. Без этой связи reconnect породит две визуальные копии даже при единственном серверном сообщении.\u003c/p\u003e\u003cp\u003ePush, email и SMS обычно служат каналами привлечения внимания. Push может не прийти, прийти поздно или без разрешения пользователя не показываться; текст на экране блокировки имеет ограничения приватности. Поэтому уведомление «заказ изменился» должно открывать актуальное состояние, а не быть единственным носителем важного факта. Для критической доставки продукта определяют эскалацию и альтернативный контакт. Дедупликация уведомлений не должна скрывать отдельные значимые изменения только потому, что они относятся к одному заказу.\u003c/p\u003e"},{"title":"Offline и одновременное редактирование","html":"\u003cp\u003eКурьер в подвале может принять локальную заметку и отправить её позже. Но не всякая команда безопасна offline. Текстовый черновик можно накопить, а эксклюзивное назначение заказа требует проверки текущего права. Клиент должен отличать «сохранено на устройстве» от «подтверждено сервером». После восстановления он отправляет устойчивые команды и принимает возможный конфликт, а не объявляет старое намерение совершившимся фактом.\u003c/p\u003e\u003cp\u003eДля инструкции доставки два диспетчера могут редактировать одну версию. Простой вариант — optimistic concurrency: клиент отправляет ожидаемую версию или If-Match, сервер отклоняет изменение, если документ уже изменился. Это предотвращает молчаливую потерю и позволяет человеку объединить правки. Для редких конфликтов такой способ проще сложной совместной модели. Last-write-wins, победа последней записи, допустима лишь там, где потеря промежуточной правки приемлема; часы устройства не дают надёжного общего порядка.\u003c/p\u003e\u003cp\u003eOT (операционное преобразование) и CRDT (бесконфликтные реплицируемые типы данных) решают более сложное совместное редактирование через операции и правила согласования. CRDT проектируется так, чтобы допустимые конкурентные обновления сходились при оговорённых условиях доставки и объединения. Это не универсальное разрешение бизнес-конфликтов. Два одновременно поставленных флага могут технически сойтись, но «отменён» и «передан клиенту» требуют предметного решения. Даже текстовый редактор должен определить удаление, историю, права и поведение offline. Для инструкции одного заказа команда выбирает контроль версии, а для отдельного совместного документа рассматривает специализированную модель.\u003c/p\u003e"},{"title":"Присутствие — приблизительный сигнал","html":"\u003cp\u003eЗелёная точка online обычно означает недавнее наблюдение соединения, а не непрерывное внимание человека. Телефон может держать канал в фоне, приложение — не иметь фокуса, сеть — оборваться до истечения heartbeat. Для диспетчера полезнее различать «есть связь», «последняя активность» и «принял предложение», чем объединять их в один авторитетный статус. Особо чувствительные показатели активности не показывают всем участникам без продуктовой необходимости.\u003c/p\u003e\u003cp\u003eTyping-индикаторы и присутствие можно хранить временно и терять при отказе: их ценность быстро исчезает. Сообщение чата и подтверждение вручения требуют устойчивой записи. Такое разделение снижает стоимость и упрощает восстановление. Не нужно превращать каждый нажатый символ в бессрочный бизнес-журнал, но и нельзя полагаться на эфемерный канал для обязательного решения. Класс данных определяется смыслом и сроком полезности, а не тем, что всё передаётся одним WebSocket.\u003c/p\u003e"}],"workedExample":{"title":"Разбор: 18 секунд без связи","html":"\u003cp\u003eКлиент видит заказ версии 42 и поток с позицией 106. Во время обрыва на 18 секунд сервер сохраняет события 107 «курьер прибыл» и 108 «получатель уточнил подъезд». Соединение закрывается не сразу, старый шлюз ещё считает его живым. Новый шлюз после аутентификации получает курсор 106, проверяет право на заказ и отдаёт 107–108 из устойчивой истории. Клиент применяет версии, сохраняет позицию и отображает актуальную картину.\u003c/p\u003e\u003cp\u003eИз-за повторной передачи событие 108 приходит ещё раз. event_id и sequence позволяют пропустить повтор без повторного звука и второй записи в чате. При этом свежую координату с более высокой версией клиент применяет, даже если промежуточные точки были схлопнуты: координата представляет состояние, а не обязательную историю всех движений. Для сообщений чата пропуск позиции требует догрузки, потому что каждое сообщение содержательно. Разделение типов данных меняет правила восстановления.\u003c/p\u003e\u003cp\u003eКурьер offline отправил сообщение с client_message_id M17. Сервер сохранил его как chat_sequence 55, но ответ потерялся. После reconnect клиент повторяет M17. Уникальность возвращает существующее сообщение 55; локальный pending заменяется подтверждённой записью. Push клиенту мог уже уйти, но не считается доказательством прочтения. Если провайдер отправил push дважды, переход по обоим уведомлениям открывает ту же историю, а не создаёт новую операцию заказа.\u003c/p\u003e\u003cp\u003eПараллельно два диспетчера открыли инструкцию версии 8. Первый добавил «домофон 14», сервер создал версию 9. Второй прислал полный текст с версией 8 и заменой подъезда. Сервер отклоняет конфликт, показывает актуальный текст и позволяет объединить изменения. Автоматическая последняя запись потеряла бы домофон. Это редкий конфликт, поэтому CRDT пока не оправдан. Для приёмки команда проверяет разрыв на границе snapshot, старый курсор, переподключение на другой узел, отзыв права и заполнение буфера медленного клиента. Успехом служит восстановленная история и честные статусы, а не непрерывная зелёная лампочка сокета.\u003c/p\u003e"},"expedition":{"world":"collaboration","title":"Экспедиция: совместная редакция договора","html":"\u003cp\u003eВ редакторе договора несколько юристов одновременно меняют текст. Здесь конфликт не редкое исключение, а основной режим работы, поэтому контроль версии целого документа постоянно мешал бы людям. Специализированная модель операций, OT или CRDT, помогает согласовывать правки и поддерживать работу при кратких разрывах. Но продукт всё равно определяет смысл комментариев, предложенных изменений и окончательного утверждения.\u003c/p\u003e\u003cp\u003eТехническая сходимость текста не означает юридическое согласие. Один участник может удалить пункт, другой — добавить к нему условие; итоговая структура будет единой на всех устройствах, но её ещё нужно оценить. Утверждение относится к конкретной неизменяемой версии. Новая правка после утверждения создаёт новую редакцию и не наследует подпись автоматически. Права на просмотр, комментирование и изменение также различаются, а отзыв доступа должен работать для долгих соединений.\u003c/p\u003e\u003cp\u003eИз доставки переносятся устойчивая история, курсор, идентификаторы операций, reconnect и разграничение «доставлено» с «принято». Меняется частота конфликтов и цена потери авторства. Поэтому сложный механизм совместной работы здесь может окупаться, хотя для одного поля подъезда был избыточен. Общее правило выбора — не «всегда CRDT» и не «всегда блокировка», а соответствие модели реальному взаимодействию и способу разрешать смысловые противоречия.\u003c/p\u003e","transfer":["История и восстановление соединения","Разные уровни подтверждения"],"distinct":["Конкурентность как основной режим","Утверждение неизменяемой версии"]},"diagrams":[{"title":"Topology: reconnect может прийти на другой шлюз","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eRealtime ускоряет доставку устойчивого состояния\u003c/text\u003e\u003crect x=\"25\" y=\"175\" width=\"185\" height=\"85\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"39\" y=\"203\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eБаза и история\u003c/text\u003e\u003ctext x=\"39\" y=\"228\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eзаказ, чат, позиции\u003c/text\u003e\u003crect x=\"280\" y=\"70\" width=\"195\" height=\"85\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"294\" y=\"98\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eШлюз A\u003c/text\u003e\u003ctext x=\"294\" y=\"123\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eстарое соединение\u003c/text\u003e\u003crect x=\"280\" y=\"290\" width=\"195\" height=\"85\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"294\" y=\"318\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eШлюз B\u003c/text\u003e\u003ctext x=\"294\" y=\"343\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003ereconnect + курсор\u003c/text\u003e\u003crect x=\"550\" y=\"175\" width=\"185\" height=\"85\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"564\" y=\"203\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eКлиент\u003c/text\u003e\u003ctext x=\"564\" y=\"228\" font-family=\"system-ui,sans-serif\" font-size=\"15\" fill=\"#203047\" text-anchor=\"start\"\u003eпоследний seq 106\u003c/text\u003e\u003cline x1=\"210\" y1=\"192\" x2=\"280\" y2=\"112\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"280.0,112.0 278.0,120.8 271.6,115.1\" fill=\"#51657a\"/\u003e\u003cline x1=\"210\" y1=\"240\" x2=\"280\" y2=\"332\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"280.0,332.0 271.8,328.3 278.7,323.1\" fill=\"#51657a\"/\u003e\u003cline x1=\"475\" y1=\"112\" x2=\"550\" y2=\"197\" stroke=\"#d44b4b\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003cpolygon points=\"550.0,197.0 541.5,193.9 548.0,188.2\" fill=\"#d44b4b\"/\u003e\u003cline x1=\"475\" y1=\"332\" x2=\"550\" y2=\"237\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"550.0,237.0 548.5,245.9 541.7,240.5\" fill=\"#51657a\"/\u003e\u003ctext x=\"285\" y=\"220\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eСмена узла не меняет историю\u003c/text\u003e\u003ctext x=\"30\" y=\"420\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eАвторизация подписки и устойчивое продолжение нужны поверх транспорта\u003c/text\u003e","caption":"Красный пунктир — разорванный маршрут, зелёный смысл не предполагается автоматически: новый шлюз обязан проверить право и восстановить данные с позиции. Память старого соединения не является источником истины."},{"title":"Sequence: повтор отправки не создаёт второй текст","viewBox":"0 0 760 460","svg":"\u003ctext x=\"24\" y=\"30\" font-family=\"system-ui,sans-serif\" font-size=\"22\" fill=\"#203047\" text-anchor=\"start\"\u003eСообщение чата и подтверждения разных границ\u003c/text\u003e\u003crect x=\"20\" y=\"55\" width=\"160\" height=\"50\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"34\" y=\"83\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eКурьер\u003c/text\u003e\u003cline x1=\"100\" y1=\"110\" x2=\"100\" y2=\"410\" stroke=\"#51657a\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003crect x=\"300\" y=\"55\" width=\"160\" height=\"50\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"314\" y=\"83\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eСервер\u003c/text\u003e\u003cline x1=\"380\" y1=\"110\" x2=\"380\" y2=\"410\" stroke=\"#51657a\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003crect x=\"580\" y=\"55\" width=\"160\" height=\"50\" rx=\"10\" fill=\"#e9f2ff\" stroke=\"#64748b\" stroke-width=\"1.5\"/\u003e\u003ctext x=\"594\" y=\"83\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#203047\" text-anchor=\"start\"\u003eКлиент\u003c/text\u003e\u003cline x1=\"660\" y1=\"110\" x2=\"660\" y2=\"410\" stroke=\"#51657a\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003cline x1=\"100\" y1=\"145\" x2=\"380\" y2=\"145\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"380.0,145.0 372.1,149.3 372.1,140.7\" fill=\"#51657a\"/\u003e\u003ctext x=\"125\" y=\"134\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eM17: отправить\u003c/text\u003e\u003ctext x=\"390\" y=\"180\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eсохранено · seq 55\u003c/text\u003e\u003cline x1=\"380\" y1=\"215\" x2=\"100\" y2=\"215\" stroke=\"#d44b4b\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/\u003e\u003cpolygon points=\"100.0,215.0 107.9,210.7 107.9,219.3\" fill=\"#d44b4b\"/\u003e\u003ctext x=\"120\" y=\"203\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#b91c1c\" text-anchor=\"start\"\u003eответ потерян\u003c/text\u003e\u003cline x1=\"100\" y1=\"270\" x2=\"380\" y2=\"270\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"380.0,270.0 372.1,274.3 372.1,265.7\" fill=\"#51657a\"/\u003e\u003ctext x=\"120\" y=\"258\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eповтор M17\u003c/text\u003e\u003cline x1=\"380\" y1=\"320\" x2=\"660\" y2=\"320\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"660.0,320.0 652.1,324.3 652.1,315.7\" fill=\"#51657a\"/\u003e\u003ctext x=\"405\" y=\"308\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eдоставка seq 55\u003c/text\u003e\u003cline x1=\"660\" y1=\"375\" x2=\"380\" y2=\"375\" stroke=\"#51657a\" stroke-width=\"2\"/\u003e\u003cpolygon points=\"380.0,375.0 387.9,370.7 387.9,379.3\" fill=\"#51657a\"/\u003e\u003ctext x=\"410\" y=\"363\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#203047\" text-anchor=\"start\"\u003eприкладное «прочитано»\u003c/text\u003e","caption":"Client message M17 связывает локальный pending и устойчивую серверную запись 55. Повтор возвращает ту же запись. Доставка и прочтение — отдельные события; транспортное подтверждение не доказывает внимание человека."}],"decision":{"prompt":"Как доставлять первые realtime-обновления заказа?","options":[{"title":"SSE для статусов плюс обычные HTTP-команды","consequence":"Простой однонаправленный поток","tradeoff":"Нужны история, курсор и отдельный путь команд"},{"title":"WebSocket для статусов и чата","consequence":"Общий двусторонний канал","tradeoff":"Сложнее соединения, backpressure и восстановление"},{"title":"Опрос состояния с адаптивным интервалом","consequence":"Минимальная инфраструктура и понятный fallback","tradeoff":"Больше пустых запросов либо выше задержка"}],"recommended":0,"explanation":"Для статуса заказа SSE достаточно при поддержке инфраструктуры. Чат может обосновать WebSocket отдельно; fallback опросом остаётся полезным."},"exercise":{"prompt":"Почему Last-Event-ID не гарантирует полную историю?","model":"\u003cp\u003eЭто лишь позиция продолжения, которую клиент сообщает серверу. Сервер должен хранить события, сопоставлять позицию с потоком и обработать устаревший курсор; без этого нечего воспроизводить.\u003c/p\u003e","rubric":["Курсор отделён от хранения","Учтён retention"]},"checkpoint":[{"question":"WebSocket ack доказывает прочтение человеком?","options":["Нет, прочтение — отдельная прикладная семантика","Да, протокол обеспечивает это автоматически","Да, если соединение TLS"],"answer":0,"explanation":"Транспорт подтверждает свою границу, но не человеческое действие."},{"question":"Когда контроль версии целого документа разумнее CRDT?","options":["Редкие конфликты и допустимое ручное объединение","Частое совместное редактирование каждого абзаца с offline","Молчаливая потеря старой правки считается допустимой"],"answer":0,"explanation":"Механизм выбирают по частоте конкуренции и цене сложности, а не по наличию открытого сокета."}],"sources":[{"title":"IETF, RFC 6455, The WebSocket Protocol, декабрь 2011","url":"https://www.rfc-editor.org/rfc/rfc6455.html"},{"title":"WHATWG HTML Living Standard, Server-sent events; просмотрено 07.11.2026","url":"https://html.spec.whatwg.org/multipage/server-sent-events.html"},{"title":"IETF, RFC 9110, If-Match, 2022","url":"https://www.rfc-editor.org/rfc/rfc9110.html#name-if-match"},{"title":"Shapiro et al., INRIA, A comprehensive study of Convergent and Commutative Replicated Data Types, 2011","url":"https://pages.lip6.fr/Marc.Shapiro/papers/Comprehensive-CRDTs-RR7506-2011-01.pdf"}],"wordCount":1538},{"id":"ch-17","arc":5,"title":"У заказа две копии: чему именно доверять","briefing":"После realtime и уведомлений «Северный маршрут» добавляет резервную БД. Заказ подтверждён, но в следующем запросе исчезает. Теперь приложение зависит от истории нескольких копий.","goals":["Разделить сохранение и видимость","Какие обещания делает consistency","Синхронность оплачивается ожиданием"],"sections":[{"title":"Разделить сохранение и видимость","html":"\u003cp\u003eДо сих пор мы рассматривали базу заказов как одного собеседника: транзакция завершилась, следующий запрос видит результат. Репликация делает копии данных на нескольких серверах, но не превращает их в общую мгновенную память. Первичная реплика, primary, принимает изменения. Ведомая, standby, получает журнал или логические изменения и применяет их позже. Между записью на primary, отправкой, сохранением на standby и применением проходят отдельные этапы. Сообщение «данные дошли» поэтому недостаточно точно: куда дошли и переживут ли перезапуск?\u003c/p\u003e\u003cp\u003eЖурнал предзаписи WAL фиксирует изменения до соответствующей записи страниц данных. Физическая репликация PostgreSQL передаёт эту историю и воспроизводит её на совместимой копии. Это не повторение произвольного SQL: случайные значения и уже принятые решения не должны вычисляться заново. Логическая репликация передаёт изменения выбранных отношений и удобна для интеграции, но имеет собственные ограничения схемы и идентичности строк. Выбор определяется задачей, а не тем, что слово «логическая» звучит современнее.\u003c/p\u003e\u003cp\u003eДве оси независимы: сохранность подтверждённой записи и свежесть чтения. Страница на primary может быть надёжно сохранена, пока standby ещё показывает прошлое. Бизнес наблюдает не наличие двух серверов, а конкретную последовательность операций.\u003c/p\u003e"},{"title":"Какие обещания делает consistency","html":"\u003cp\u003eСогласованность, consistency, описывает допустимые наблюдения клиента. При eventual consistency копии сходятся после прекращения новых записей и восстановления обмена, если механизм разрешения конфликтов это обеспечивает. Она не задаёт срок схождения. Гарантия read-your-writes означает, что сессия читает собственное изменение. Монотонные чтения не позволяют этой сессии вернуться к более старой версии. Обе гарантии полезны для интерфейса заказа, но слабее линеаризуемости.\u003c/p\u003e\u003cp\u003eЛинеаризуемость требует представить операции над объектом как мгновенные в некоторой точке между началом и завершением, сохранив реальный порядок неперекрывающихся операций. Если подтверждение отмены завершилось до начала следующего чтения, такое чтение не должно возвращать неотменённый заказ. Это свойство наблюдаемого поведения; синхронная передача байтов сама по себе его не доказывает. Изоляция SQL-транзакций решает другую часть проблемы — взаимодействие нескольких операций внутри транзакций.\u003c/p\u003e\u003cp\u003eДля «Северного маршрута» поиск по каталогу допускает небольшой лаг, а решение повторно списать деньги — нет. Назначать одну модель всем запросам дорого и часто бессмысленно. Нужно отметить операции, где устаревшая информация приводит к обратимому неудобству, и операции, где она меняет деньги, остатки или право исполнителя действовать.\u003c/p\u003e"},{"title":"Синхронность оплачивается ожиданием","html":"\u003cp\u003eАсинхронная репликация подтверждает запись без обязательного ожидания удалённой копии. Она снижает задержку и позволяет primary работать при недоступной standby, но аварийное повышение отстающей реплики может потерять часть уже подтверждённых записей. В нормальной работе это не «ненадёжная база»: это конкретное соглашение о том, какой отказ допускает потерю.\u003c/p\u003e\u003cp\u003eСинхронный режим добавляет точку ожидания. В PostgreSQL важно различать подтверждение получения, сохранения WAL и применения: режим remote_apply нужен, когда подтверждение должно дождаться видимости на синхронной standby. При обычном ожидании удалённого сброса журнала данные могут быть долговечны, но ещё не доступны запросу. При этом произвольная другая реплика всё равно может отставать. Конфигурация ожидания и маршрутизация чтений должны рассматриваться вместе.\u003c/p\u003e\u003cp\u003eПлата не только в среднем времени сети. Медленная запись на удалённый диск увеличивает хвост задержки commit. Если обязательная standby недоступна, завершение записи может ждать. Автоматическое отключение синхронности восстанавливает доступность, но меняет обещание о потере данных; это изменение режима должно быть видно дежурному и бизнесу. Дополнительные копии не устраняют необходимость назвать поведение при сетевом разделении.\u003c/p\u003e"},{"title":"Маршрутизация чтений — часть протокола","html":"\u003cp\u003eКоманда не обязана отправлять все чтения на primary. После изменения можно вернуть клиенту версию заказа или позицию журнала. Следующий запрос направляется на реплику, которая уже достигла нужного барьера, либо ждёт ограниченное время и переключается на primary. Барьер относится к правильной линии истории: после failover просто сравнивать случайные номера разных эпох опасно. Иногда гораздо проще закрепить критическое чтение за primary в новой транзакции и читать список рекомендаций из standby.\u003c/p\u003e\u003cp\u003eВременная липкость, например пять секунд после записи, помогает интерфейсу, но не является строгой гарантией. При необычно большом лаге пяти секунд не хватит. Точно так же HTTP-кэш может вернуть старый статус даже при идеально согласованной базе. Договор read-your-writes проходит через API, кэш, балансировщик и БД; нарушение на одном участке разрушает обещание целиком.\u003c/p\u003e\u003cp\u003eДлинные аналитические чтения на hot standby иногда конфликтуют с воспроизведением изменений. Возможны отмена запроса, задержка применения или дополнительное удержание старых версий на primary при соответствующей настройке обратной связи. Полученная «бесплатная отчётная база» имеет цену в задержке, накоплении истории и операционном управлении. Поэтому резерв для восстановления и ресурс для тяжёлых отчётов не следует молча считать одной ролью.\u003c/p\u003e"},{"title":"Failover меняет владельца истории","html":"\u003cp\u003eFailover — перевод обслуживания на другую копию после отказа. Он состоит из обнаружения проблемы, запрета старому владельцу записывать, выбора достаточно свежего кандидата, повышения его роли и обновления маршрутов. Проверка TCP-порта не доказывает смерть сервера: тот может быть доступен части клиентов. Если старая и новая primary одновременно принимают независимые записи, возникает split brain, расхождение истории, которое обычная физическая репликация автоматически не склеит.\u003c/p\u003e\u003cp\u003eПосле повышения нужно решить судьбу старой primary. Её нельзя просто вернуть за балансировщик. Сначала доказывают прекращение записи, затем восстанавливают совместимость с выбранной историей — например, пересоздают реплику или применяют подходящий механизм возврата. Потерянные неподтверждённые транзакции и записи, подтверждённые только старым сервером, различаются. Для последних может потребоваться бизнес-сверка платежей и заказов.\u003c/p\u003e\u003cp\u003eРепликация не является резервным копированием. Ошибочное удаление тоже быстро размножается. Нужны независимые копии и восстановление на момент до ошибки. Метрики должны различать получение WAL, его долговечность, применение и возраст последней бизнес-записи. Один зелёный график «replica connected» не отвечает ни на вопрос о потере, ни на вопрос о свежести.\u003c/p\u003e"},{"title":"Наблюдать историю клиента, а не только сервер","html":"\u003cp\u003eДля разбора инцидента полезно восстановить цепочку одного заказа: когда клиент отправил команду, когда получил подтверждение, какую версию вернул API и какую копию читал следующий запрос. В распределённой трассировке сохраняют идентификатор операции и роль БД, не раскрывая содержимое платёжных данных. Серверные часы помогают связать события, но не являются доказательством причинного порядка при большом рассогласовании. Версии и идентификаторы запросов здесь надёжнее красивого общего графика.\u003c/p\u003e\u003cp\u003eЛаг измеряют по нескольким направлениям. Разница позиций журнала показывает объём недоставленной истории, но байты не переводятся в секунды без знания скорости генерации. Временная метка последней применённой записи может выглядеть старой просто потому, что новых записей не было. Поэтому синтетическое контрольное событие или реальное время последнего изменения интерпретируют вместе с активностью источника. Тревога должна отличать бездействие от остановки обмена.\u003c/p\u003e\u003cp\u003eПрактический контракт для экрана заказа можно записать так: успешный ответ содержит order_id и version; детализация этой сессии возвращает не меньшую версию либо явный временный отказ. Для общего списка допускается маркированный лаг. Такой контракт проверяется автоматическим сценарием с намеренно задержанной standby и старым кэшем. Он не обещает, что любое устройство мгновенно увидит всё, но делает поведение понятным и проверяемым.\u003c/p\u003e\u003cp\u003eНаконец, резервирование соединений на primary защищает этот критический путь. Если все чтения после записи при всплеске одновременно переключатся на него, корректная политика свежести неожиданно станет причиной перегрузки. Нужно измерять аварийный сценарий маршрутизации вместе с обычным, а не оценивать каждый сервер изолированно.\u003c/p\u003e"}],"workedExample":{"title":"Подтверждённый заказ пропал из экрана","html":"\u003cp\u003eУчебная нагрузка выросла до 120 заказов в секунду. В 12:00:00 primary сохраняет заказ 731 и возвращает подтверждение. Standby получает журнал через 80 миллисекунд, сохраняет его через 110 и применяет через 420. Запрос списка в 12:00:00.200 попадает на standby: заказа там ещё нет. Деньги не исчезли, но пользователь повторяет оформление, потому что интерфейс нарушил его ожидание причинности.\u003c/p\u003e\u003cp\u003eПервое исправление — вернуть идентификатор и показать подтверждение непосредственно из ответа команды. Второе — определить политику чтения детализации. Для этой сессии читаем primary; для общей истории разрешаем standby с проверкой версии. Повтор команды использует прежний ключ идемпотентности, поэтому расхождение экрана не порождает второй заказ. Эти меры решают разные проблемы и дополняют друг друга.\u003c/p\u003e\u003cp\u003eТеперь primary аварийно выключается через 60 миллисекунд после подтверждения. Асинхронная standby ещё не получила журнал. При её повышении 731 отсутствует. Если платёж уже выполнен внешним провайдером, удалять свидетельство о нём нельзя: сверка находит операцию по ключу и переводит её в восстановление заказа либо возврат. Для критического подтверждения команда выбирает ожидание удалённой долговечной записи в другой зоне. Это увеличивает задержку, но уменьшает область возможной потери при отказе одного узла.\u003c/p\u003e\u003cp\u003eНулевую потерю нельзя обещать без оговорок. Две копии на одной площадке не защищают от её разрушения; общий административный аккаунт может удалить обе. Для закрытия риска нужны размещение, независимость доступа и проверенный сценарий восстановления. На испытании измеряют не только секунды переключения: после него ищут каждый подтверждённый заказ по журналу клиентских результатов и сверяют внешние списания. Именно такой тест связывает техническую репликацию с реальным обещанием сервиса.\u003c/p\u003e"},"expedition":{"world":"money","title":"Банковская выписка и доступный остаток","html":"\u003cp\u003eВ другом бизнесе мобильный банк показывает длинную выписку и одновременно разрешает перевод. Для выписки допустима задержка появления свежей строки с явным сообщением об обработке. Решение о доступном остатке должно учитывать уже принятые резервирования. Если его читать из отстающей копии и затем списывать независимо, два устройства могут получить право потратить одни и те же деньги.\u003c/p\u003e\u003cp\u003eПоэтому путь перевода обращается к авторитетному состоянию и выполняет проверку вместе с изменением атомарно. Реплика может обслуживать просмотр истории, но её показания не становятся разрешением операции. Здесь полезно разделить бухгалтерский баланс, доступный остаток и пользовательскую проекцию: это разные сущности, даже если экран рисует одну сумму.\u003c/p\u003e\u003cp\u003eПри аварии база и платёжная сеть восстанавливаются в разное время. Недоступный ответ не доказывает отсутствие перевода. Система использует неизменяемый идентификатор операции и сверку, а интерфейс показывает неопределённый статус. Смена primary не должна автоматически отправлять платёж второй раз. По сравнению с доставкой цена ошибочного подтверждения выше, поэтому банк может пожертвовать приёмом новых переводов на изолированной площадке, сохранив чтение старой выписки. Переносится разделение свежести и сохранности; меняется допустимая цена остановки и необходимость юридически значимой сверки.\u003c/p\u003e","transfer":["Различать пользовательскую проекцию и авторитетную команду","Проверять цепочку подтверждения и чтения"],"distinct":["Денежный реестр и внешняя расчётная система требуют отдельной сверки"]},"diagrams":[{"title":"Путь журнала и путь чтения","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003crect x=\"30\" y=\"50\" width=\"210\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"92.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eAPI заказа\u003c/text\u003e\u003crect x=\"290\" y=\"50\" width=\"210\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"304\" y=\"92.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003ePrimary\u003c/text\u003e\u003crect x=\"290\" y=\"250\" width=\"210\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"304\" y=\"292.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eStandby\u003c/text\u003e\u003crect x=\"30\" y=\"250\" width=\"210\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"292.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eЭкран истории\u003c/text\u003e\u003cpath d=\"M240 85 L290 85\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M395 120 L395 250\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"420\" y=\"185\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eWAL\u003c/text\u003e\u003cpath d=\"M290 285 L240 285\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"30\" y=\"385\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eСохранить журнал ≠ применить журнал\u003c/text\u003e\u003ctext x=\"30\" y=\"420\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eКэш и маршрутизатор тоже влияют на свежесть\u003c/text\u003e","caption":"Топология показывает отдельные пути: API записывает в primary, WAL передаётся в standby, экран может читать standby. Между сохранением и применением журнала есть лаг. Схема не обещает линеаризуемость произвольного чтения."},{"title":"Временная линия видимости","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003ctext x=\"35\" y=\"40\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eОдин commit, три разных момента\u003c/text\u003e\u003cpath d=\"M70 125 L700 125\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M70 280 L700 280\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"25\" y=\"100\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003ePrimary\u003c/text\u003e\u003ctext x=\"25\" y=\"255\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eStandby\u003c/text\u003e\u003cpath d=\"M150 70 L150 340\" fill=\"none\" stroke=\"#708aa4\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/\u003e\u003ctext x=\"95\" y=\"365\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003ecommit\u003c/text\u003e\u003cpath d=\"M340 70 L340 340\" fill=\"none\" stroke=\"#708aa4\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/\u003e\u003ctext x=\"285\" y=\"365\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eWAL durable\u003c/text\u003e\u003cpath d=\"M610 70 L610 340\" fill=\"none\" stroke=\"#708aa4\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/\u003e\u003ctext x=\"555\" y=\"365\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eapply\u003c/text\u003e\u003ccircle cx=\"150\" cy=\"125\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ccircle cx=\"340\" cy=\"280\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ccircle cx=\"610\" cy=\"280\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003cpath d=\"M150 125 L340 280\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"210\" y=\"190\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eпередача\u003c/text\u003e\u003ctext x=\"400\" y=\"245\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eещё старое чтение\u003c/text\u003e\u003ctext x=\"35\" y=\"420\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eОтвет commit может предшествовать видимости на standby\u003c/text\u003e","caption":"Временная линия различает commit primary, долговечный WAL standby и применение. Чтение между вторым и третьим моментом может быть старым. Реальная точка подтверждения зависит от режима synchronous_commit и выбранной синхронной реплики."}],"decision":{"prompt":"Как обслуживать подтверждённый заказ?","options":[{"title":"Все чтения на primary","consequence":"Простая причинная связность в текущем владельце истории","tradeoff":"Меньше разгрузка; failover всё равно требует безопасного выбора"},{"title":"Критическое чтение на primary, остальные на standby","consequence":"Экран подтверждения свежий, списки масштабируются","tradeoff":"Нужна классификация запросов и контроль лага"},{"title":"Чтения через барьер версии","consequence":"Можно использовать свежую standby без фиксированной задержки","tradeoff":"Сложнее клиентский контракт и обработка смены эпох"}],"recommended":1,"explanation":"Для текущей команды смешанная маршрутизация даёт понятную гарантию без преждевременного сложного протокола барьеров."},"exercise":{"prompt":"Назовите две независимые причины, почему заказ не виден после успешного commit.","model":"\u003cp\u003eЭто может быть неприменённый WAL на standby или старая запись в API-кэше. При аварийном повышении отстающей копии возможна уже потеря записи, а не временная невидимость.\u003c/p\u003e","rubric":["Различены лаг и потеря","Назван слой вне БД"]},"checkpoint":[{"question":"Standby сохранила WAL, но не применила. Что доказано?","options":["Запись обязательно видна любому читателю","Журнал переживёт предусмотренный отказ диска/ОС согласно подтверждению, но чтение может отставать","Достигнута сериализуемость всех клиентов"],"answer":1,"explanation":"Долговечность журнала и применение — разные стадии; точная устойчивость зависит от подтверждаемого хранения."},{"question":"Почему резервная копия нужна при наличии трёх реплик?","options":["Чтобы исправить любую сетевую задержку","Потому что ошибочное удаление может распространиться на все реплики","Потому что три реплики никогда не могут принимать чтения"],"answer":1,"explanation":"Репликация копирует и корректные, и ошибочные изменения; нужен независимый путь к прошлому состоянию."}],"sources":[{"title":"PostgreSQL 18: Log-Shipping Standby Servers","url":"https://www.postgresql.org/docs/18/warm-standby.html"},{"title":"PostgreSQL 18: High Availability","url":"https://www.postgresql.org/docs/18/high-availability.html"}],"wordCount":1504},{"id":"ch-18","arc":5,"title":"Один регион стал тесен: где проходит граница данных","briefing":"Реплики помогли чтениям и отказам, но все записи заказов по-прежнему проходят через один primary. «Северный маршрут» открывает второй регион и впервые обсуждает разделение самого набора данных.","goals":["Реплика и шард отвечают на разные вопросы","Ключ распределения выбирает будущие транзакции","Перекос бывает в данных и во времени"],"sections":[{"title":"Реплика и шард отвечают на разные вопросы","html":"\u003cp\u003eРеплика содержит копию выбранных данных; шард содержит только часть общего набора. Добавить ведомые копии одного primary не означает разделить его поток записи. Шардирование распределяет владение: например, заказы северного региона обслуживает одна группа реплик, центрального — другая. Внутри каждого шарда по-прежнему нужны транзакции, журнал, резервирование и безопасное переключение. Две оси — разделение и копирование — образуют матрицу, а не два конкурирующих продукта.\u003c/p\u003e\u003cp\u003eСлово partition тоже неоднозначно. Секционирование таблицы в PostgreSQL позволяет разделить её на части по диапазону, списку или хешу, упрощая отбор и обслуживание. Само по себе оно не создаёт независимые серверы и не переносит транзакцию в распределённую среду. Сетевое partition, напротив, означает нарушение связи. В архитектурном документе нужно явно уточнять смысл, иначе «переживаем partition» может обозначать совершенно разные свойства.\u003c/p\u003e\u003cp\u003eДо шардирования команда проверяет более дешёвые ограничения: неудачный запрос, лишний индекс, длительную транзакцию, предел соединений, недостаток дисковой полосы. Каждый новый шард умножает задачи сопровождения. Но если нагрузка действительно упирается в независимый масштаб записи и объём, одно только улучшение запросов перестаёт менять порядок величины.\u003c/p\u003e"},{"title":"Ключ распределения выбирает будущие транзакции","html":"\u003cp\u003eКлюч шарда определяет, по какому признаку размещается запись и куда приложение отправит запрос. Хороший ключ одновременно распределяет объём, распределяет работу и сохраняет локальность частых операций. Эти цели конфликтуют. Хеш order_id даёт ровное распределение заказов, но список всех заказов организации приходится собирать со многих узлов. tenant_id сохраняет локальность клиента, однако один крупный клиент может занять половину системы.\u003c/p\u003e\u003cp\u003eРегион кажется естественным для доставки, пока покупатель, склад и курьер находятся рядом. Затем организация открывает филиалы, заказ переадресуют, и изменяемое поле неожиданно становится физическим адресом записи. Лучше различать бизнес-регион доставки и стабильный home_region, выбранный при создании. Переезд данных тогда становится отдельной управляемой операцией, а не побочным эффектом изменения адреса.\u003c/p\u003e\u003cp\u003eНельзя проектировать только таблицу orders. Если остаток и резерв должны изменяться атомарно, надо выяснить, где живут складская позиция, заказ и журнал резервов. Иногда границей служит склад, иногда организация, иногда нужен отдельный авторитетный сервис остатков. Шардирование меняет доступность совместной транзакции: локальное ограничение уникальности не становится глобальным оттого, что одинаковая схема установлена на каждом узле.\u003c/p\u003e"},{"title":"Перекос бывает в данных и во времени","html":"\u003cp\u003eРавный объём диска не означает равную нагрузку. Одна популярная распродажа создаёт горячий ключ склада, а новый диапазон времени принимает почти все свежие заказы. Диапазонное разбиение по возрастающему идентификатору удобно для чтения недавней истории, но может направлять весь поток вставок в последний диапазон. Хеширование рассеивает вставки, зато ухудшает диапазонные запросы и локальность.\u003c/p\u003e\u003cp\u003eСоль в ключе, например tenant_id плюс один из шестнадцати бакетов, дробит горячего клиента. Но запросу по клиенту теперь нужно собрать шестнадцать частей. Ещё важнее, что операция над единственным счётчиком доступного товара не ускоряется простым добавлением соли: её инвариант остаётся общим. Можно выделить квоты по складам или заранее распределить права продажи, но это уже изменение модели доступного остатка, а не косметика ключа.\u003c/p\u003e\u003cp\u003eНаблюдать нужно частоту операций, время удержания блокировок, байты чтения и записи, размер данных и хвост задержки по каждому шарду. Среднее CPU всего кластера прячет узкое место. На этапе проектирования команда проигрывает не только средний день, но и событие, где один клиент, один товар или одна минута концентрируют большую часть работы.\u003c/p\u003e"},{"title":"Маршрутизатор хранит карту владения","html":"\u003cp\u003eПриложению нужна функция, переводящая ключ в владельца. Жёсткое деление hash(key) modulo N просто, но изменение N перемещает большую часть данных. Виртуальные бакеты отделяют логическое разбиение от числа физических серверов: сначала выбирается один из множества бакетов, затем каталог сообщает, на каком шарде он находится. Это облегчает перенос порциями, однако каталог становится частью протокола согласованности.\u003c/p\u003e\u003cp\u003eМаршрутизатор может кэшировать карту, поэтому сервер обязан распознавать устаревшую эпоху владения. Иначе старый клиент продолжит писать на прежний шард после переноса. Ответ перенаправления или повтор с актуальной картой допустим, но повторяет команду с прежним ключом идемпотентности. Само перенаправление не гарантирует, что предыдущая попытка ничего не сделала.\u003c/p\u003e\u003cp\u003eГлобальная выдача разбивается на локальные запросы с последующим слиянием. Для страницы последних заказов нужна устойчивая сортировка, например время плюс уникальный идентификатор, и понятное поведение, если один шард недоступен. Частичный список не равен пустому списку. Пользовательский контракт должен отличать «заказов нет» от «один регион сейчас не ответил», особенно в операторском интерфейсе.\u003c/p\u003e"},{"title":"Rebalance — миграция с конкурентной записью","html":"\u003cp\u003eПеребалансировка переносит владение данными на фоне живой работы. Наивная последовательность «скопировать, поменять адрес, удалить» теряет изменения, пришедшие во время копирования. Корректный план фиксирует начальную точку истории, делает снимок, догоняет изменения из журнала и затем устанавливает границу переключения. На коротком этапе можно запретить записи в бакет, дождаться догоняющего применения и атомарно сменить владельца в каталоге.\u003c/p\u003e\u003cp\u003eАльтернатива с двойной записью выглядит непрерывной, но создаёт частичные успехи: старый узел ответил, новый нет. Без журнала, разрешения конфликтов и определённого единственного авторитета она ухудшает ситуацию. Для небольшой команды краткая контролируемая пауза одного бакета часто безопаснее сложного протокола активной записи в обе стороны.\u003c/p\u003e\u003cp\u003eОткат имеет границу. Пока новый владелец не принял новых команд, можно вернуть старую карту. После этого старый шард уже не обязательно содержит полную историю. Нужен обратный перенос изменений либо движение вперёд с исправлением. Удалять старые данные следует только после сверки количества, контрольных выборок, бизнес-инвариантов и истечения согласованного окна возврата. Сверка одной суммы строк не обнаруживает обмен двух ошибочных записей.\u003c/p\u003e"},{"title":"Стоимость распределённого запроса","html":"\u003cp\u003eЗапрос к одному шарду имеет одну точку задержки. Запрос к двадцати шардам ждёт несколько ответов и часто определяется самым медленным. Вероятность встретить хотя бы один медленный узел растёт с шириной веера. Поэтому даже маленькая локальная доля длинных ответов превращается в заметный хвост общего запроса. Дополнительная параллельность уменьшает среднее время не бесконечно: она занимает соединения и усиливает конкуренцию в пике.\u003c/p\u003e\u003cp\u003eДля агрегатов можно передавать наверх частичные суммы, количество и другие объединяемые состояния вместо всех строк. Среднее требует суммы и числа, а не среднего локальных средних. Для точного количества уникальных клиентов простого сложения уже недостаточно, если клиент встречается на нескольких шардах. Приближённый алгоритм допустим лишь с известной ошибкой и подходящей метрикой; финансовая сверка обычно требует точности.\u003c/p\u003e\u003cp\u003eПагинация тоже становится договором. Смещение OFFSET после изменения данных может пропустить или повторить заказы. Курсор с ключом сортировки устойчивее, но при независимых шардах надо определить снимок и обработку поздних записей. Для оперативной ленты можно разрешить небольшие изменения порядка; для выгрузки закрытого периода выбирают фиксированный срез. Один универсальный endpoint редко удачно обслуживает обе задачи.\u003c/p\u003e\u003cp\u003eШардирование поэтому не должно автоматически превращать каждую бизнес-операцию в распределённую. Часто лучше хранить авторитетную сущность локально, публиковать изменения и строить специальную проекцию для общего чтения. Цена — задержка проекции и её восстановление, зато критическая транзакция остаётся маленькой. Решение выбирают по допустимому поведению, а не по стремлению нарисовать одинаковые стрелки ко всем базам.\u003c/p\u003e"}],"workedExample":{"title":"Как разделить 90 миллионов заказов без потери резерва","html":"\u003cp\u003eВ учебном сценарии есть 90 миллионов исторических заказов и три региона. Север создаёт 55% новых заказов, центр — 35%, восток — 10%. Деление «один регион — один сервер» неравномерно уже при запуске. Команда выбирает 256 логических бакетов внутри стабильного home_region и размещает их на четырёх физических группах. Число бакетов не является обещанием производительности; это удобная гранулярность управления.\u003c/p\u003e\u003cp\u003eПервые запросы показывают скрытую цену: организация с филиалами хочет общую историю. Вместо распределённой транзакции для каждого чтения создаётся отдельная поисковая проекция с допустимым лагом. Изменение заказа всё равно маршрутизируется к его авторитетному бакету. Резервирование товара остаётся на владельце склада; заказ хранит идентификатор резерва и проходит ранее разобранную сагу. Это осознанная граница инварианта, а не вера в атомарность двух БД.\u003c/p\u003e\u003cp\u003eДля перемещения бакета 42 копируем 180 тысяч заказов, запоминая начальную позицию журнала. Пока идёт копирование, заказы продолжают меняться. Затем применяем хвост изменений, вводим короткую паузу только для 42, дожидаемся нулевого отставания и публикуем эпоху владения 8 вместо 7. Старый сервер отклоняет команды эпохи 7 с указанием нового владельца. Отложенный клиент повторяет запрос со своим прежним operation_id.\u003c/p\u003e\u003cp\u003eПосле открытия записи на новом узле сравниваем не только 180 тысяч строк, но и суммы резервов, допустимые переходы статусов и выборки крайних изменений. Данные прежнего владельца остаются недоступными для команд, но сохраняются для расследования. Если новый шард ломается через минуту, возвращать карту вслепую нельзя: за эту минуту появились новые подтверждения. Приёмочный тест специально вводит такой отказ и проверяет, что система предпочитает явную недоступность некорректному «успешному откату».\u003c/p\u003e"},"expedition":{"world":"inventory","title":"Маркетплейс билетов: горячий концерт","html":"\u003cp\u003eВ билетном сервисе шардирование по мероприятию собирает места и резервы вместе. Для небольших концертов это удобно: продажа двух соседних мест выполняется локально. Но начало продаж одного стадиона создаёт горячий объект. Деление покупателей по хешу не помогает, поскольку они конкурируют за общий набор мест, а не за свои профили.\u003c/p\u003e\u003cp\u003eРазделение мест по секторам распределяет независимые продажи. Покупка мест из разных секторов становится составной операцией с временными резервами и сроком подтверждения. Система может честно ограничить корзину одним сектором либо поддержать сагу с освобождением уже взятых мест при неуспехе. Выбор зависит от продукта: идеальная свобода корзины имеет измеримую цену в сложности и времени удержания ресурса.\u003c/p\u003e\u003cp\u003eВиртуальная очередь снижает конкуренцию и защищает авторитетный контур, но не увеличивает физическое число мест. Предварительная выдача квот агентам продаж распределяет работу ценой риска неиспользованного остатка у одного агента, пока другой испытывает дефицит. Здесь особенно видно, что горячий ключ часто выражает реальный общий ресурс. Переносимый навык — искать границу инварианта перед выбором хеша. Новое ограничение — геометрия мест и кратковременная экстремальная концентрация спроса, которых не было у равномерной истории заказов.\u003c/p\u003e","transfer":["Выбирать ключ по операциям и инвариантам","Отделять логические бакеты от серверов"],"distinct":["Соседство мест и пик начала продаж меняют подход к резервированию"]},"diagrams":[{"title":"Бакеты и реплики — разные оси","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003crect x=\"25\" y=\"25\" width=\"210\" height=\"60\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"39\" y=\"62.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eКлюч заказа\u003c/text\u003e\u003crect x=\"280\" y=\"25\" width=\"220\" height=\"60\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"62.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eКаталог бакетов\u003c/text\u003e\u003cpath d=\"M235 55 L280 55\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"30\" y=\"190\" width=\"200\" height=\"130\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"262.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eШард A\u003c/text\u003e\u003ctext x=\"48\" y=\"282\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e0…63\u003c/text\u003e\u003cpath d=\"M390 85 L130 190\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"30\" y=\"350\" width=\"200\" height=\"60\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"387.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eКопия шарда\u003c/text\u003e\u003crect x=\"280\" y=\"190\" width=\"200\" height=\"130\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"262.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eШард B\u003c/text\u003e\u003ctext x=\"298\" y=\"282\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e64…127\u003c/text\u003e\u003cpath d=\"M390 85 L380 190\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"280\" y=\"350\" width=\"200\" height=\"60\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"387.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eКопия шарда\u003c/text\u003e\u003crect x=\"530\" y=\"190\" width=\"200\" height=\"130\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"262.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eШард C\u003c/text\u003e\u003ctext x=\"548\" y=\"282\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e128…255\u003c/text\u003e\u003cpath d=\"M390 85 L630 190\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"530\" y=\"350\" width=\"200\" height=\"60\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"387.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eКопия шарда\u003c/text\u003e\u003ctext x=\"25\" y=\"445\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eШард делит набор; реплика копирует часть набора\u003c/text\u003e","caption":"Ключ сначала определяет логический бакет, каталог указывает физический шард. Каждый шард имеет собственную копию. Показанные диапазоны — учебное размещение; равное число бакетов не гарантирует равную нагрузку."},{"title":"Снимок, догоняние, переключение","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003ctext x=\"30\" y=\"40\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eПеренос бакета 42: граница владения\u003c/text\u003e\u003ctext x=\"25\" y=\"95\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eСтарый\u003c/text\u003e\u003cpath d=\"M140 110 L710 110\" fill=\"none\" stroke=\"#708aa4\" stroke-width=\"3\"/\u003e\u003ctext x=\"25\" y=\"225\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eНовый\u003c/text\u003e\u003cpath d=\"M140 240 L710 240\" fill=\"none\" stroke=\"#708aa4\" stroke-width=\"3\"/\u003e\u003ctext x=\"25\" y=\"355\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eКаталог\u003c/text\u003e\u003cpath d=\"M140 370 L710 370\" fill=\"none\" stroke=\"#708aa4\" stroke-width=\"3\"/\u003e\u003crect x=\"150\" y=\"75\" width=\"180\" height=\"55\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"164\" y=\"109.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eЗапись epoch 7\u003c/text\u003e\u003cpath d=\"M210 130 L310 210\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"245\" y=\"175\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eснимок + хвост\u003c/text\u003e\u003crect x=\"350\" y=\"205\" width=\"145\" height=\"55\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"364\" y=\"239.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eДогоняем\u003c/text\u003e\u003cpath d=\"M500 110 L500 380\" fill=\"none\" stroke=\"#f5c677\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/\u003e\u003ctext x=\"455\" y=\"65\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eпауза\u003c/text\u003e\u003crect x=\"530\" y=\"205\" width=\"175\" height=\"55\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"239.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eЗапись epoch 8\u003c/text\u003e\u003ccircle cx=\"500\" cy=\"370\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ctext x=\"300\" y=\"420\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eСмена каталога только после догоняющего применения\u003c/text\u003e","caption":"Последовательность переноса: старый владелец пишет в эпохе 7, новый получает снимок и хвост, затем краткая пауза фиксирует границу. Каталог переводит бакет в эпоху 8; старый владелец больше не принимает команды. После новых записей простой возврат карты небезопасен."}],"decision":{"prompt":"Какая первая граница разделения подходит сервису?","options":[{"title":"Регион с виртуальными бакетами","consequence":"Локальные операции доставки остаются рядом","tradeoff":"Нужен стабильный home_region и работа с перекосом"},{"title":"Хеш идентификатора заказа","consequence":"Ровнее распределение независимых команд","tradeoff":"История клиента и складские операции пересекают шарды"},{"title":"Пока увеличить один primary","consequence":"Сохраняется простая атомарность","tradeoff":"Есть предел масштаба и зависимость от размера узла"}],"recommended":0,"explanation":"Региональная локальность полезна текущему бизнесу, а бакеты дают возможность исправлять неравномерность без изменения публичного идентификатора."},"exercise":{"prompt":"Почему переключение карты после копирования не завершает миграцию?","model":"\u003cp\u003eПока копировались строки, старый владелец принимал изменения. Нужно догнать журнал и установить единственную границу записи; после новых команд на целевом узле откат требует переноса их истории.\u003c/p\u003e","rubric":["Указана конкурентная запись","Есть эпоха владения","Описана граница отката"]},"checkpoint":[{"question":"У всех шардов одинаково занят диск, один отвечает медленно. Что проверить первым?","options":["Частоту и стоимость операций на горячем шарде","Только суммарный объём RAM","Число колонок в названии ключа"],"answer":0,"explanation":"Распределение объёма не равно распределению работы."},{"question":"Даёт ли локальный UNIQUE(email) глобальную уникальность?","options":["Да, если схема одинакова","Нет, если одинаковый email может попасть на разные независимые шарды","Да, если включена асинхронная репликация"],"answer":1,"explanation":"Глобальный инвариант требует соответствующей маршрутизации или координации."}],"sources":[{"title":"PostgreSQL 18: Table Partitioning","url":"https://www.postgresql.org/docs/18/ddl-partitioning.html"},{"title":"CockroachDB: Distribution Layer","url":"https://www.cockroachlabs.com/docs/stable/architecture/distribution-layer"}],"wordCount":1467},{"id":"ch-19","arc":5,"title":"Кто имеет право записывать: договор о единственном владельце","briefing":"После шардирования каталог знает владельцев бакетов. Но сеть разделилась: старая группа считает владельцем север, новая — центр. Нужен механизм, который определяет право изменить историю, а не только быстро переносит байты.","goals":["Почему тайм-аут не является доказательством смерти","Raft: журнал, эпохи и выборы","Кворум — не просто формула R плюс W"],"sections":[{"title":"Почему тайм-аут не является доказательством смерти","html":"\u003cp\u003eПредставим primary, которая перестала отвечать координатору, но продолжает принимать запросы от местных приложений. Через пять секунд координатор решает повысить другую копию. Для него старая машина неотличима от выключенной. Для местного клиента она совершенно жива. В асинхронной сети невозможно по одному тайм-ауту надёжно различить медленный ответ и отказ. Поэтому безопасное переключение строят не на убеждении, что старый узел умер, а на ограничении его полномочий.\u003c/p\u003e\u003cp\u003eКонсенсус позволяет нескольким участникам договориться об одной последовательности решений при заявленной модели отказов. В рассматриваемом случае серверы могут падать и восстанавливаться, сообщения задерживаться или теряться; злонамеренные участники и поддельные сообщения не входят в обычную модель Raft. Устойчивое локальное хранение и корректная реализация тоже являются условиями. Протокол не исправит одновременно повреждённые диски всех реплик.\u003c/p\u003e\u003cp\u003eСогласие нужно не для каждого информационного экрана. Оно нужно там, где несовместимые решения нельзя принять одновременно: кто лидер, кому принадлежит бакет, какая команда занимает следующее место в журнале. Сокращение числа таких решений уменьшает задержку и область отказа. Реплики каталога и реплики заказов могут использовать отдельные группы согласования, но связь между их эпохами должна быть явной.\u003c/p\u003e"},{"title":"Raft: журнал, эпохи и выборы","html":"\u003cp\u003eВ Raft время управления делится на сроки, term. Лидер принимает команды, добавляет записи в журнал и реплицирует их. Запись содержит индекс и term; участники сверяют общую историю, а конфликтующий неподтверждённый хвост может быть заменён. Подтверждённые решения должны сохраняться при смене лидера. Согласованная последовательность затем применяется к детерминированной машине состояний — например, карте владельцев бакетов.\u003c/p\u003e\u003cp\u003eВыборы требуют большинства голосов, и участник не отдаёт два голоса разным кандидатам в одном term. Но одного этого правила мало: кандидат должен иметь достаточно актуальный журнал. Правила фиксации также важны: лидер не может произвольно объявить старую запись зафиксированной только потому, что посчитал копии. Ограничение фиксации записей текущего срока и перенос подтверждения на предшествующую историю удерживают доказательство безопасности при смене лидеров.\u003c/p\u003e\u003cp\u003eКлиентский тайм-аут не означает, что запись не зафиксирована. Команда могла попасть в журнал, а ответ потеряться. Значит, консенсус не отменяет идемпотентность на API. И наоборот, идемпотентный ключ не выбирает безопасного лидера. Один механизм защищает повтор команды, другой — единство авторитетной истории.\u003c/p\u003e"},{"title":"Кворум — не просто формула R плюс W","html":"\u003cp\u003eВ группе из пяти голосующих участников большинство составляет три. Два большинства пересекаются хотя бы в одном участнике, поэтому корректный протокол может передавать знание о принятых решениях. Это свойство множеств становится полезной гарантией только вместе с правилами голосования, версиями, устойчивой записью и обработкой конфликтов. Фраза «читаем два, пишем два из трёх» сама по себе не доказывает линеаризуемость.\u003c/p\u003e\u003cp\u003eНапример, чтение может выбрать максимальный timestamp, созданный ошибающимися часами, а незавершённая запись — попасть на часть реплик. Пересечение формально есть, но наблюдаемая история зависит от read repair, разрешения версий, конкурентных операций и правил возврата ответа. Слабые, или sloppy, кворумы могут включать временные замены, которые не образуют ожидаемого пересечения владельцев ключа. Числа без протокола скрывают самую важную часть рассуждения.\u003c/p\u003e\u003cp\u003eДаже чтение у лидера не автоматически линеаризуемо. Изолированный старый лидер может продолжать считать себя лидером. Нужен способ подтвердить актуальное лидерство и соответствующую границу применённого журнала либо корректная lease с явными предположениями о времени. Изменение состава группы тоже требует безопасного перехода: произвольная одновременная замена большинства уничтожает пересечение между старой и новой конфигурацией.\u003c/p\u003e"},{"title":"Fencing: старый работник должен потерять право","html":"\u003cp\u003eLease — ограниченное по времени разрешение владеть ресурсом — удобно для выбора единственного фонового исполнителя. Но процесс может остановиться на паузе сборщика мусора, потерять lease и позже продолжить работу. Если проверка была сделана до паузы, старый исполнитель всё равно отправит запись. Повторная проверка непосредственно перед записью тоже оставляет окно между проверкой и действием.\u003c/p\u003e\u003cp\u003eFencing token, токен ограждения, — монотонно возрастающий номер полномочия. Каждый новый владелец получает больший номер. Сам защищаемый ресурс атомарно запоминает последний принятый номер и отклоняет меньшие. Если работник 41 проснулся после того, как ресурс принял 42, его запись отвергается, даже если он уверен, что всё ещё главный. Токен должен проверяться там, где происходит необратимый эффект, а не только в координаторе.\u003c/p\u003e\u003cp\u003eЕсли внешняя платёжная система не понимает токены, локальная lease не создаёт такой гарантии. Нужны поддерживаемая идемпотентность, авторитетный посредник или другое ограничение эффекта. Токен также не заменяет идентификатор операции: один текущий владелец может повторить собственную команду. Для бакета «Северного маршрута» эпоха владения работает как fencing только если прежний сервер действительно не может принять команду старой эпохи.\u003c/p\u003e"},{"title":"CAP и PACELC относятся к конкретному поведению","html":"\u003cp\u003eCAP связывает линеаризуемую согласованность и доступность в условиях сетевого разделения. В формальном смысле доступность означает ответ на каждую операцию, адресованную неотказавшему узлу; быстрый ответ «сервис недоступен» не выполняет это требование. Если две изолированные части обе принимают несовместимые записи одного объекта, нельзя одновременно сохранить единый реальный порядок этих записей. Продукт выбирает, какие операции остановить или какую согласованность ослабить.\u003c/p\u003e\u003cp\u003eЭто не правило «выбери любые две буквы навсегда». Разделение сети не является опцией, которую можно отключить договором. Разные операции одной системы могут вести себя по-разному: приём нового платежа прекращается, чтение каталога продолжается из старой копии, локальный черновик сохраняется на устройстве. Для каждой операции надо назвать, какой ответ допустим и как будет происходить восстановление.\u003c/p\u003e\u003cp\u003ePACELC дополнительно напоминает: даже без разделения есть обмен между задержкой и согласованностью. Межрегиональное подтверждение увеличивает путь сигнала в обычном режиме. Система может предлагать разные режимы чтения, но каждый режим должен иметь понятный контракт. Рассуждение заканчивается не наклейкой CP или AP, а таблицей операций, топологией размещения и тестом отказа, где наблюдается фактический результат.\u003c/p\u003e"},{"title":"Механизм продукта не равен названию алгоритма","html":"\u003cp\u003eCockroachDB использует Raft для репликации диапазонов данных, но SQL-транзакция может затрагивать несколько таких диапазонов. Согласование журнала одной группы не является полным объяснением распределённой транзакции, выбора времени чтения и проверки конкурентных записей. Полезно разделять слой хранения, репликацию диапазона и транзакционный слой. Иначе фраза «там Raft» создаёт необоснованную уверенность относительно любого SQL-запроса.\u003c/p\u003e\u003cp\u003eТак же важно отличать управляющего лидера от владельца каждого ключа и от процесса приложения. Один узел может одновременно быть лидером для одних диапазонов и ведомым для других. После изменения размещения лидеры и данные могут перемещаться независимо. Задержка клиентской операции зависит от того, куда она попала, какие группы затронула и где лежат нужные копии. Обещание алгоритма нужно сопоставлять с реальной топологией продукта.\u003c/p\u003e\u003cp\u003eПроверка безопасности и проверка прогресса имеют разные сценарии. Чтобы проверить безопасность, создают разделение и удостоверяются, что несовместимые подтверждения не появились. Чтобы проверить прогресс, оставляют допустимое большинство и измеряют, когда система снова завершает операции. Безопасная система может временно ничего не подтверждать; быстрая система может подтверждать ошибочную историю. Эти результаты нельзя смешивать в одной метрике доступности.\u003c/p\u003e\u003cp\u003eДля проектного решения команда записывает предположения: участники не византийские, устойчивое хранение выполняет договор, большинство связно достаточно долго, клиентские повторы имеют идентификаторы. Затем связывает каждое предположение с наблюдением или эксплуатационной процедурой. Так абстрактный протокол становится ограниченным инженерным обещанием, которое можно пересмотреть при смене инфраструктуры.\u003c/p\u003e"}],"workedExample":{"title":"Пять голосов и один проснувшийся диспетчер","html":"\u003cp\u003eКаталог бакетов размещён на пяти участниках: три в северной зоне, два в центральной. При разрыве связи северная часть имеет большинство и может выбрать лидера, центральная не может менять владение. Это сохраняет безопасность, но потеря всей северной зоны оставляет только два голоса и останавливает каталог. Пять серверов оказались защитой от двух независимых узловых отказов, но не от выбранного зонального отказа. Размещение голосов — часть обещания доступности.\u003c/p\u003e\u003cp\u003eКоманда меняет размещение на три независимые зоны: два, два и один голос. При потере любой одной зоны остаётся не меньше трёх. При этом решение требует связи между зонами, что увеличивает задержку. Даже такая схема не гарантирует прогресс при произвольной дальнейшей потере связи, а безопасность не означает бесконечную работоспособность без большинства.\u003c/p\u003e\u003cp\u003eТеперь фоновый диспетчер A получает token 91 и начинает назначение курьера. Он зависает. Координатор после истечения lease выдаёт B token 92. B записывает назначение в хранилище, которое атомарно обновляет максимальный токен и состояние заказа. Когда A оживает, его запрос с 91 отклоняется. Если бы хранилище просто проверяло «lease была выдана», обе записи могли бы пройти.\u003c/p\u003e\u003cp\u003eОстаётся повтор B: ответ на назначение потерялся. B повторяет запрос с token 92 и operation_id assign-731. Токен по-прежнему допустим, но уникальный operation_id возвращает результат прежнего назначения. Вместе механизмы закрывают две разные гонки. Приёмочный сценарий останавливает процесс после получения полномочия, выдаёт новое и возобновляет старое. Такой тест гораздо сильнее обычного отключения питания, потому что воспроизводит живого, уверенного в себе устаревшего владельца.\u003c/p\u003e"},"expedition":{"world":"collaboration","t
