*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.65}button,input,textarea{font:inherit}button,a,input,textarea,summary{touch-action:manipulation}button{cursor:pointer}button,a,input,textarea,summary{outline-offset:4px}a{color:var(--accent)}button{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}button:hover{border-color:var(--accent)}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:650}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px max(18px,env(safe-area-inset-right)) 12px max(18px,env(safe-area-inset-left));background:var(--surface);border-bottom:1px solid var(--line)}header strong{flex:1;font-size:15px}header a{font-size:14px}#menu{display:none}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1480px;margin:auto}nav{padding:26px 18px;position:sticky;top:70px;height:calc(100dvh - 70px);overflow:auto;border-right:1px solid var(--line)}nav input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}nav ol{list-style:none;padding:0}nav li{margin:7px 0}nav button{width:100%;text-align:left;border-color:transparent;background:transparent;font-size:14px;line-height:1.4}nav button[aria-current=page]{background:var(--soft);border-color:var(--accent)}nav small{display:block;color:var(--muted)}main{min-width:0;padding:38px clamp(20px,5vw,72px) 90px;max-width:1080px}h1,h2,h3{line-height:1.2;letter-spacing:-.025em}h1{font-size:clamp(32px,5vw,53px);max-width:850px;margin:14px 0 22px}h2{font-size:28px;margin:38px 0 20px}h3{font-size:22px;margin:28px 0 16px}p{margin:0 0 18px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:750}.lead{font-size:21px;color:var(--muted)}.meta{display:flex;gap:9px;flex-wrap:wrap}.pill{font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:30px}.card{background:var(--surface);border:1px solid var(--line);padding:24px;border-radius:16px;box-shadow:var(--shadow);margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid .card{margin:0}.muted{color:var(--muted)}.small{font-size:14px}.rule{border-left:3px solid var(--accent);padding:12px 20px;background:var(--soft);border-radius:0 10px 10px 0;margin:24px 0}.lesson{padding-top:12px;border-top:1px solid var(--line);margin-top:26px}.lesson p,.lesson li{max-width:78ch}.lesson table{border-collapse:collapse;width:100%;font-size:15px;display:block;overflow:auto}.lesson th,.lesson td{border:1px solid var(--line);padding:10px;text-align:left;min-width:120px}.lesson blockquote{margin:20px 0;padding:12px 20px;border-left:3px solid var(--accent);background:var(--soft)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}code{font-size:.9em;overflow-wrap:anywhere}details{background:var(--surface);border:1px solid var(--line);padding:16px 20px;border-radius:12px;margin:16px 0}summary{cursor:pointer;font-weight:650}details>div{margin-top:18px}textarea{display:block;width:100%;min-height:200px;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:15px;border-radius:10px;resize:vertical;margin:10px 0}.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0}.check input{margin-top:6px;width:20px;height:20px;flex-shrink:0}fieldset{border:0;padding:0;margin:0}legend{font-weight:650;margin-bottom:12px}.option{display:flex;gap:12px;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:10px;cursor:pointer}.option input{margin-top:6px;flex-shrink:0}.feedback{padding:15px;margin-top:14px;background:var(--soft);border-radius:10px}.error{color:var(--warning)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.actions button{flex-grow:0}.progress{height:7px;background:var(--line);border-radius:10px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--accent)}.calc label{display:block;margin:13px 0;font-size:14px}.calc input{display:block;width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px}.result{font-size:18px;font-weight:650;padding:16px 0}.sources li{margin:10px 0;overflow-wrap:anywhere}.print-only{display:none}[hidden]{display:none!important}#storageStatus{font-size:13px;color:var(--warning)}.day{display:flex;gap:18px;border-bottom:1px solid var(--line);padding:14px 0}.day b{min-width:65px}.day:last-child{border:0}.next{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:24px;margin-top:40px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

<script>
'use strict';
const COURSE=[{"id": "sd-01", "title": "От бизнес-обещания к измеримой системе", "minutes": 120, "intro": "120 минут: 40 теория и заметки, 20 разобранный пример, 40 самостоятельная работа, 20 проверка. Результат — паспорт требований, который позволяет принимать архитектурные решения и проверять готовность релиза. Все компании, нагрузки и инциденты в курсе вымышлены; российский контекст используется для узнаваемых рабочих ситуаций.", "lessons": [{"title": "1. Сначала сценарий и ущерб, затем технология", "body": "\u003cp>На встрече в банке «Север» звучит задача: «Сделать быстрые переводы для малого бизнеса». Слово «быстрый» скрывает несколько разных обещаний. Быстро показать форму, быстро принять распоряжение и быстро завершить перевод — три самостоятельных пользовательских результата. Если смешать их, команда отчитается об ответе API за 200 мс, а предприниматель будет ждать поступления денег полчаса. Начинайте проектирование с одного наблюдаемого действия пользователя и определения успеха: кто делает что, что он видит, какое изменение бизнеса подтверждает завершение.\u003c/p>\u003cp>Составьте короткую карту: инициатор → критическое действие → источник истины → внешние зависимости → подтверждение пользователю. Для перевода источник истины о принятом распоряжении может находиться в вашем сервисе, а о расчёте — во внешней системе. Эти факты нельзя заменять одним флагом success. Сразу задайте инварианты: одно распоряжение не вызывает два списания; сумма не меняется между подтверждением и исполнением; каждый незавершённый перевод можно найти и довести до определённого состояния. Инвариант описывает то, что нельзя нарушить даже при отказе.\u003c/p>\u003cp>Роль руководителя здесь предметная: собрать представителя бизнеса, владельца учёта, технического лидера и эксплуатации; добиться общего определения готовности. Получившееся определение становится основой scope, тестов и Go/No-Go. Вопрос «кто подтвердит выполнение инварианта и каким наблюдением?» полезнее преждевременного выбора брокера.\u003c/p>"}, {"title": "2. NFR как проверяемый сценарий качества", "body": "\u003cp>Нефункциональное требование, NFR, задаёт качество поведения системы при конкретных условиях. Формула: стимул, среда, ожидаемая реакция, измеритель. «Высокая доступность» непроверяема. «При отказе одного экземпляра API в пиковом профиле система принимает корректные распоряжения с долей технических ошибок менее 0,1% за окно испытания; повтор не создаёт нового списания» — уже основа испытания. Числа в этом примере учебные: реальные значения согласуют с ценой ошибки и возможностями зависимостей.\u003c/p>\u003cp>Заведите отдельно SLI — измеритель, SLO — его целевое значение и окно, SLA — договорное обязательство, если оно есть. Для сценария перевода полезны доля технически успешно принятых корректных распоряжений, время подтверждения приёма и доля распоряжений, получивших конечный статус вовремя. Бизнес-отказы, например недостаток средств, не следует автоматически считать техническими ошибками. Но зависший ответ, при котором клиент не понимает результат, нельзя исключать только потому, что сервер вернул HTTP 200.\u003c/p>\u003cp>В знаменателе метрики важны фильтры и точка наблюдения. Сервер видит только дошедшие запросы; мобильный клиент видит часть сетевых сбоев. Для каждого SLO запишите измеритель, владельца данных, исключения и действие при нарушении. Подход к пользовательским SLI и согласованию SLO подробно разобран в \u003ca href=\"https://sre.google/workbook/implementing-slos/\">Google SRE Workbook\u003c/a>. В нашем проекте добавьте к нему управленческую строку: какое обещание релиза опирается на этот показатель.\u003c/p>"}, {"title": "3. Нагрузка: посчитать разные потоки", "body": "\u003cp>Маркетплейс «Ряд» ожидает 300 тысяч заказов за сутки. Средний поток создания заказов: 300 000 / 86 400 ≈ 3,47 запроса в секунду. Из аналитики похожей кампании команда предполагает пик в 20 раз выше: около 70 запросов в секунду. Это гипотеза, а не свойство всех маркетплейсов. Если перед каждым заказом пользователь открывает каталог 30 раз, поток чтений имеет другой масштаб: около 2 100 запросов в секунду в сопоставимом пике. Если один заказ создаёт 8 событий, поток событий — ещё одна отдельная нагрузка.\u003c/p>\u003cp>Профиль теста должен содержать распределение операций, размеры ответов, долю повторов, горячие товары и длительность всплеска. Равномерные 70 запросов в секунду по миллиону товаров и 70 запросов по одному остатку создают разные блокировки. Скидка на один популярный телефон может превратить одну строку остатков в главный предел системы. Уточняйте корреляцию: массовая отправка уведомлений способна синхронно вернуть покупателей в приложение.\u003c/p>\u003cp>Дальше оцените данные. 300 тысяч заказов × 4 КБ полезных записей ≈ 1,2 ГБ в сутки, около 438 ГБ в год до индексов, журналов, реплик и резервных копий. Множители нужно получить из модели хранения и замера, а не объявить универсальными. Эти оценки отвечают на вопросы о сроке хранения, тестовом наборе и времени переноса. Метод перехода от абстрактной схемы к проверяемым ресурсным предположениям полезно сверить с \u003ca href=\"https://sre.google/workbook/non-abstract-design/\">Non-Abstract Large System Design\u003c/a>.\u003c/p>"}, {"title": "4. Задержка, параллельность и ложная точность", "body": "\u003cp>RPS показывает поток, concurrency — число одновременно выполняющихся операций, latency — время одной операции. При устойчивом потоке можно применять закон Литтла: среднее число операций в системе L = λ × W. При 70 запросах в секунду и среднем времени 0,4 секунды получается около 28 запросов в работе. Если зависимость замедлится до четырёх секунд, поток тот же, но одновременно занятых операций уже около 280. Пулы соединений и память заканчиваются раньше, чем процессор достигает 100%. Формула использует согласованные средние для одного участка и устойчивого режима, а не произвольные процентили.\u003c/p>\u003cp>Среднее время скрывает хвост. p95 = 800 мс означает, что примерно 95% наблюдений не превысили этот порог в выбранной выборке; оставшиеся могут занимать секунды. Нельзя складывать p99 отдельных сервисов и называть результат точным p99 всей цепочки: зависимости задержек и разные выборки меняют распределение. Для предварительного бюджета выделите этапам лимиты, затем измерьте путь целиком, включая сеть клиента.\u003c/p>\u003cp>Пусть бюджет приёма заказа — одна секунда. После сети и проверки доступа остаётся 600 мс на бизнес-операцию. Последовательные вызовы склада и оплаты могут не поместиться; потребуется изменить сценарий, например отдельно принять заказ в обработку. Это меняет обещание пользователю, статусы и работу поддержки. Руководитель фиксирует продуктовый компромисс, а не просто просит разработчиков «оптимизировать».\u003c/p>"}, {"title": "5. Паспорт требований и решение о следующем шаге", "body": "\u003cp>Оформите одну страницу: пользовательский сценарий, границы MVP, три инварианта, измеримые SLO, профиль нагрузки, ограничения и неизвестные. Каждое неизвестное получает срок проверки и владельца. Пример: «Партнёр не подтвердил лимит запросов; до пятницы интеграционный лидер получает письменное значение и проводит тест в согласованном окружении». Без такой строки оценка срока содержит скрытую ставку на чужую систему.\u003c/p>\u003cp>Разделяйте требование и предположение. «Данные расчёта хранить установленный срок» требует предметного уточнения с владельцем данных; «все события будут по 1 КБ» проверяется замером. Российская банковская среда добавляет организационные условия: доступность тестовых контуров партнёра, окна регламентных работ, требования службы безопасности, согласование внешних интеграций. Это входные ограничения проекта; конкретные юридические обязательства подтверждают профильные специалисты по актуальным правилам.\u003c/p>\u003cp>На ревью задайте три вопроса. Какой эксперимент способен опровергнуть выбранную архитектуру? Какой отказ причинит наибольший бизнес-ущерб? Какое решение можно отложить до измерения? Если нагрузка умеренная, а риск — двойное списание, начинать с шардирования неразумно. Первым результатом проекта станет доказательство корректной обработки повторов и неопределённого исхода. Такой порядок снижает риск раньше, чем команда инвестирует в масштабирование.\u003c/p>"}], "practice": {"minutes": 40, "task": "\u003cp>За 40 минут подготовьте паспорт сервиса заказов «Ряд»: 300 000 заказов/сутки, 30 чтений каталога на заказ, предполагаемый пик ×20, 8 событий на заказ, 4 КБ полезных данных на заказ. Бизнес требует «заказ за секунду», оплата отвечает иногда за 3 секунды. Опишите два разных обещания клиенту; посчитайте потоки; задайте три инварианта и три измеримых NFR; укажите пять неизвестных и первый эксперимент.\u003c/p>", "rubric": ["Разделены приём заказа, оплата и окончательное подтверждение.", "Получены ≈3,47/70 RPS заказов, ≈2100 RPS чтений в пике, ≈560 событий/с; коэффициенты обозначены предположениями.", "Есть точка измерения, окно и профиль нагрузки у каждого NFR.", "Есть сценарий отказа оплаты и способ показать промежуточное состояние.", "Первый эксперимент проверяет критическое неизвестное, а не внешний вид схемы."], "model": "\u003cp>Пример решения: обещать приём корректного заказа в обработку за секунду, а оплату показывать отдельным статусом. Если деньги нужны до резервирования, это отдельная развилка, которую должен согласовать бизнес. Нельзя вернуть «оплачен», имея только запись о приёме.\u003c/p>\u003cp>Нагрузка: 300000/86400 ≈ 3,47 RPS заказов; учебный пик ≈69,4; каталог ≈2083 чтений/с; события ≈556/с. Хранение полезных данных ≈1,2 ГБ/день, остальные составляющие измеряются отдельно. Инварианты: резерв не отрицательный; одно намерение оплаты не создаёт двух списаний; каждый принятый заказ получает конечный статус либо попадает в контролируемый разбор.\u003c/p>\u003cp>Неизвестны реальный пик, распределение по товарам, лимит оплаты, допустимое время обработки и размер записей с индексами. Первый эксперимент — пройти повтор и потерю ответа оплаты на тестовом стенде, одновременно измерив время восстановления статуса. Вторая работа — нагрузочный профиль с горячим товаром. У критериев готовности должны быть владельцы из продукта, команды и эксплуатации.\u003c/p>"}, "quiz": [{"question": "Приём перевода укладывается в 200 мс. Партнёр завершает расчёт пакетами раз в 30 минут. Бизнес просит конечный статус за 2 минуты. Что вынести на согласование?", "options": ["Перенести измерение SLO на HTTP-приём: технически система тогда выполнит 2 минуты", "Разделить приём и завершение; изменить интеграцию, scope или обещание с владельцами зависимости", "Увеличить внутренний timeout до 30 минут, оставив обещание клиенту 2 минуты"], "answer": 1, "explanation": "Требование относится к полезному завершению, а не к быстроте приёма. Пакетная зависимость ограничивает обещание. Смена измерителя скрывает проблему, а timeout не ускоряет партнёра: нужен согласованный компромисс или иной механизм расчёта."}, {"question": "Поток 100 RPS, среднее время обработки выросло с 0,2 до 2 секунд. Что произойдёт при устойчивом режиме?", "options": ["RPS автоматически станет 1000", "Память не изменится, ведь поток прежний", "Среднее число операций в работе вырастет с 20 до 200"], "answer": 2, "explanation": "По закону Литтла L = λW. Рост занятой параллельности может исчерпать ресурсы."}, {"question": "Как использовать число «одна БД выдерживает 10 000 записей/с»?", "options": ["Как неподтверждённую гипотезу, зависящую от запросов, данных и ресурсов", "Как основание отказаться от теста", "Как обязательный норматив"], "answer": 0, "explanation": "Универсальной производительности БД нет; решение проверяют на целевом профиле."}], "sources": [{"title": "Google SRE Workbook: Implementing SLOs", "url": "https://sre.google/workbook/implementing-slos/"}, {"title": "Google SRE Workbook: Non-Abstract Large System Design", "url": "https://sre.google/workbook/non-abstract-design/"}], "recall": "Какие архитектурные риски вы уже обсуждаете с командой? Назовите один способ проверки."}, {"id": "sd-02", "title": "Границы системы, владение и цена распределения", "minutes": 120, "intro": "120 минут: 40 теория и заметки, 20 разобранный пример, 40 самостоятельная работа, 20 проверка. Результат — схема границ, таблица владельцев и ADR с двумя жизнеспособными вариантами.", "lessons": [{"title": "1. Рисовать для решения, а не для красоты", "body": "\u003cp>В банке «Север» сервис заявок кредитует малый бизнес. На первом рисунке нужны предприниматель, сотрудник сопровождения, система заявок, скоринг, учёт и внешний источник сведений. Это контекст: кто взаимодействует с нашей системой и кто владеет результатами. Если сразу рисовать десятки pod, архитектурное ревью потеряет вопрос «кто подтверждает выдачу». На втором уровне покажите мобильный клиент, API, обработчик заявки, хранилище и интеграционные адаптеры. Уровни не надо смешивать.\u003c/p>\u003cp>В \u003ca href=\"https://c4model.com/\">C4\u003c/a> container означает отдельно запускаемую или развёртываемую программную единицу либо хранилище, а не обязательно Docker-контейнер. Используйте эту систему уровней, чтобы бизнес и инженеры читали разные масштабы одной модели. На каждой связи подпишите назначение и способ взаимодействия: «передать распоряжение, синхронно», «сообщить о завершении, асинхронно». Подпись «REST» без смысла сообщения мало помогает обсуждать риски.\u003c/p>\u003cp>Хорошая схема отвечает на четыре вопроса: где хранится истина, где проходит граница доверия, что произойдёт при отказе связи и какая команда отвечает за восстановление. Отдельно покажите внешние системы, которые не контролируете. Именно их лимиты, окна доступности и совместимость часто определяют график проекта. Рисунок — рабочий инструмент обнаружения зависимостей, а не доказательство, что архитектура уже выбрана.\u003c/p>"}, {"title": "2. Монолит, модульный монолит, сервисы", "body": "\u003cp>Монолит — прежде всего единица поставки: несколько функций выпускаются одним приложением. В нём может быть несколько модулей, репозиториев или хранилищ. Если границы модулей контролируются, такой вариант может дать локальные транзакции и понятный релиз без дорогой сетевой координации. Микросервисы выделяют независимые единицы поставки и владения; их независимость ещё нужно обеспечить контрактами, данными, тестами и эксплуатацией. Десять процессов с общими таблицами и обязательным совместным релизом остаются сильно связанными.\u003c/p>\u003cp>Для вымышленного регионального перевозчика с двумя командами модульный монолит может быть рациональным стартом: заказы, маршруты и расчёт тарифа разделены в коде, изменения таблиц контролируются владельцами. Если расчёт маршрутов потребляет много CPU и меняется независимо, появляется конкретное основание вынести именно его. Если причина миграции звучит «так современнее», спросите измеримую цель: снизить время ожидания релиза, изолировать отказ или масштабировать конкретный поток.\u003c/p>\u003cp>Наблюдения о цене распределённых систем и осторожном старте есть у \u003ca href=\"https://martinfowler.com/bliki/MonolithFirst.html\">Мартина Фаулера\u003c/a>. Это эвристика, а не правило «до пяти команд всегда монолит». Размер организации сам по себе не доказывает правильную архитектуру. Руководителю важно сравнить варианты при имеющихся навыках, сроках и требованиях: выигрыш одного потока может не окупить новые дежурства и интеграционную сложность.\u003c/p>"}, {"title": "3. Граница проходит по инвариантам и изменениям", "body": "\u003cp>У маркетплейса есть каталог товара, предложение продавца, остаток склада и заказ покупателя. В интерфейсе всё выглядит одной карточкой, но правила изменения разные. Каталог описывает модель телефона; предложение задаёт цену конкретного продавца; склад владеет доступным количеством; заказ фиксирует условия конкретной покупки. Разделение «по экрану приложения» заставит одну команду владеть разными правилами и перегрузит её интеграциями. Разделение «по таблице» создаст слишком мелкие сетевые вызовы.\u003c/p>\u003cp>Ищите совместно меняющиеся правила и инварианты. Если резерв товара и уменьшение доступного количества должны происходить атомарно, держите эту операцию в одной согласованной границе либо явно проектируйте протокол между владельцами. Общая база не запрещает модульность, но произвольная запись в чужие таблицы разрушает контракт. Важнее физической отдельности правило: кто имеет право менять данные и кто гарантирует их смысл.\u003c/p>\u003cp>Проверьте границу на трёх будущих изменениях: новый способ оплаты, частичная отмена заказа и резерв на нескольких складах. Какие команды и контракты затронуты? Если любое изменение требует восьми совместных релизов, обещание независимости пока не выполнено. Добавьте таблицу: сущность, источник истины, владелец, интерфейс изменения, потребители копий, допускаемое отставание. Она превращает архитектуру в карту ответственности для планирования и инцидентов.\u003c/p>"}, {"title": "4. Независимость оплачивается эксплуатацией", "body": "\u003cp>Предположим, монолит разбили на пять сервисов. Сборки стали короче, но заказ теперь зависит от четырёх последовательных сетевых вызовов. У каждого появились версии контрактов, таймауты, повторы и отдельные дашборды. При отказе склада неясно, отвечает ли заказчик сервиса, платформа или складская команда. Техническая декомпозиция без владельца дежурства создаёт время простоя, которое раньше скрывал один владелец приложения.\u003c/p>\u003cp>Выберите один реальный отказ и пройдите его: сервис заказа принял оплату, склад не ответил, мобильный клиент повторяет запрос. Как найти цепочку? Нужны идентификатор операции, связность логов и трассировки, видимое состояние бизнес-процесса, правила эскалации. Наличие Kubernetes само по себе не решает ни один из этих вопросов. В определении готовности сервиса должны появиться наблюдаемость, ограничение нагрузки, процедура восстановления и совместимость версий.\u003c/p>\u003cp>Команды тоже становятся зависимостями. Синхронная интеграция в критическом пути означает необходимость согласовать SLO и режим поддержки владельца. Независимый деплой без независимой эксплуатации даёт ограниченный выигрыш. В описании \u003ca href=\"https://martinfowler.com/articles/microservices.html\">microservices\u003c/a> полезно обратить внимание на организацию вокруг бизнес-возможностей; наш управленческий вывод — закреплять ответственность за жизненный цикл вместе с кодом. У сервиса с одним разработчиком и без замены риск может оказаться выше, чем у общего приложения.\u003c/p>"}, {"title": "5. ADR: выбор с условиями пересмотра", "body": "\u003cp>ADR — короткая запись значимого решения. Для руководителя достаточно контекста, вариантов, критериев, выбора, последствий и условия пересмотра. «Выбрали микросервисы для масштабируемости» не помогает будущей команде. Лучше: «Расчёт маршрута выделяем в отдельный процесс, потому что он требует CPU, меняется еженедельно и не участвует в транзакции приёма заказа. Заказы и оплату пока оставляем в модульном приложении. Новая зависимость ограничена таймаутом и имеет заранее вычисленный запасной тариф».\u003c/p>\u003cp>Сравнивайте два работающих варианта по одним критериям. Например, стоимость изменения, предел нагрузки, согласованность, восстановление, компетенции и время вывода. Не превращайте матрицу в арифметику с придуманными точными баллами: важен аргумент, почему один критерий сейчас перевешивает другой. Укажите, что нужно доказать до необратимых затрат. Прототип должен иметь вопрос и критерий остановки, иначе он становится ещё одним продуктом.\u003c/p>\u003cp>Пример условия пересмотра: если нагрузочный тест показывает насыщение общего пула при целевом профиле, вынесение расчёта запускается в следующей волне; если проблема решается ограничением параллельности, миграция откладывается. В roadmap запланируйте адаптер, наблюдаемость, совместимость, пилот и проверку восстановления. Выделение сервиса завершено, когда новая граница работает при реальном отказе и команда умеет ей управлять, а не когда создан новый репозиторий.\u003c/p>\u003cp>\u003cb>Связь с платформой.\u003c/b> Развёртывать сервис независимо можно только при доступных средах, квотах, правах и поддерживаемом пути выпуска. Отметьте, какие зависимости принадлежат продуктовой команде, а какие внутренней платформе. В модуле «Платформа как продукт» вы превратите эту границу в контракт и измерите время ожидания.\u003c/p>"}], "practice": {"minutes": 40, "task": "\u003cp>За 40 минут выберите архитектуру для перевозчика «Маршрут»: две продуктовые команды, один релиз раз в две недели, расчёт маршрута забирает 70% CPU, приём заказа требует согласованного резерва машины. До сезона восемь недель. Нарисуйте контекст и контейнеры; сравните модульный монолит с выделением расчёта; подготовьте ADR и таблицу владельцев четырёх видов данных. В середине практики добавьте условие: платформенная команда доступна только через месяц.\u003c/p>", "rubric": ["Схема различает бизнес-системы и единицы развёртывания.", "Резерв машины имеет одного владельца и понятную границу атомарности.", "Выбор объяснён измеримой проблемой CPU, а не модой.", "Учтена недоступность платформенной команды и план запасного решения.", "Есть критерий пересмотра, наблюдаемость и проверка отказа расчёта."], "model": "\u003cp>Допустимый выбор: сохранить приём заказов и резерв машины в модульном монолите, сначала ограничить параллельность расчёта и измерить изоляцию ресурсов; при подтверждённом влиянии вынести расчёт маршрутов через устойчивый контракт. Восемь недель и позднее подключение платформы делают полную декомпозицию рискованной.\u003c/p>\u003cp>Источник истины о заказе — модуль заказов, о резерве — модуль парка, о тарифных правилах — владелец тарифов, о геоданных — выбранный справочник. Расчёт возвращает предложение с версией исходных данных; принятие заказа заново проверяет доступность машины. Внешний результат не должен самостоятельно менять резерв.\u003c/p>\u003cp>ADR фиксирует цену: новый процесс требует лимита времени, версионирования, дежурства и fallback. Критерий пилота — расчёт под целевой нагрузкой не нарушает приём заказов при падении одного экземпляра. Обратимый маршрут — флаг возврата к прежнему обработчику при совместимых входах. Если fallback даёт неточный тариф, бизнес заранее определяет допустимость и подтверждение клиентом.\u003c/p>"}, "quiz": [{"question": "Расчёт маршрута расходует 70% CPU, меняется независимо; две команды, но общий контур данных. Какое решение лучше обосновано до 12-недельного пилота?", "options": ["Выделить весь домен немедленно: независимый CPU автоматически означает независимые данные", "Оставить всё без исследования: монолит всегда дешевле для двух команд", "Измерить изолируемую вычислительную границу; сравнить worker/модуль и сервис по контракту, данным и сопровождению"], "answer": 2, "explanation": "Наблюдение поддерживает гипотезу изоляции расчёта, но не доказывает необходимость полного разделения домена. Отдельный worker может снять ресурсный риск без распределённой транзакции. Решение зависит от контракта и организационной цены."}, {"question": "Пять сервисов меняют общие таблицы и всегда выпускаются вместе. Что следует проверить?", "options": ["Только язык программирования", "Действительную независимость владения данными и контрактов", "Только количество pod"], "answer": 1, "explanation": "Отдельные процессы не гарантируют независимых изменений; связь может оставаться в общей схеме и релизном порядке."}, {"question": "Что означает container в C4?", "options": ["Любой прямоугольник на рисунке", "Запускаемая/развёртываемая программная единица либо хранилище на соответствующем уровне модели", "Только Docker-контейнер"], "answer": 1, "explanation": "C4 использует архитектурное понятие контейнера, которое шире технологии контейнеризации."}], "sources": [{"title": "C4 model", "url": "https://c4model.com/"}, {"title": "Martin Fowler: Monolith First", "url": "https://martinfowler.com/bliki/MonolithFirst.html"}, {"title": "James Lewis, Martin Fowler: Microservices", "url": "https://martinfowler.com/articles/microservices.html"}], "recall": "Воспроизведите измеримый NFR и отличие SLO от SLA."}, {"id": "sd-03", "title": "Данные, конкуренция и распределённые операции", "minutes": 120, "intro": "120 минут: 40 теория и заметки, 20 разобранный пример, 40 самостоятельная работа, 20 проверка. Результат — инварианты, границы транзакций, состояния операции и план сверки.", "lessons": [{"title": "1. Модель данных начинается с инварианта", "body": "\u003cp>На складе «Ряда» остался один телефон. Два покупателя одновременно видят доступность и нажимают купить. Если приложение отдельно прочитает количество, проверит его и потом запишет новое значение, оба запроса могут успешно зарезервировать товар. Наличие реляционной базы и слова ACID в презентации не доказывают корректность бизнес-алгоритма. Нужно определить инвариант: сумма действующих резервов не превышает доступный остаток в выбранной складской границе.\u003c/p>\u003cp>Один из вариантов — атомарное условное изменение: уменьшить доступность только если она больше нуля, затем проверить факт изменения. Другой — заблокировать нужную строку внутри короткой транзакции, пересчитать и записать. Выбор зависит от модели остатков, конкуренции и требований. Руководителю достаточно понимать проверяемое свойство: две конкурирующие операции не должны обе получить последний экземпляр. Включите такой сценарий в приёмку, а не только последовательный happy path.\u003c/p>\u003cp>Денежные значения требуют валюты, правил округления и подходящего точного представления; бинарная плавающая точка без согласованных правил может создавать ошибки сравнения. Для заказа полезно хранить снимок цены и условий покупки, а не каждый раз читать текущую карточку. Источник истины о факте продажи отличается от источника истины о сегодняшнем предложении. Это небольшое различие определяет, можно ли воспроизвести спорную операцию через три месяца.\u003c/p>"}, {"title": "2. Изоляция — обещание при одновременной работе", "body": "\u003cp>Транзакция объединяет операции в одно атомарное изменение внутри поддерживаемой границы. Изоляция определяет, как параллельные транзакции влияют на наблюдения и результат. В PostgreSQL Read Committed — стандартный уровень по умолчанию; разные запросы одной транзакции могут видеть разные зафиксированные состояния. Serializable стремится обеспечить результат, эквивалентный последовательному выполнению, и может отклонить одну транзакцию: приложение должно повторить её целиком. Точные гарантии зависят от СУБД и уровня, а не от слова SQL.\u003c/p>\u003cp>Представьте правило: на смене обязательно остаётся хотя бы один диспетчер. Два диспетчера одновременно видят, что второй ещё работает, и оба завершают смену. Это нарушение инварианта при корректной записи разных строк. Блокировка одной строки «себя» не защищает общее правило. Подходы: сериализуемое выполнение с обработкой конфликтов, блокировка общего ресурса смены либо изменение модели операции. Предложение инженера нужно проверять именно на таком пересечении.\u003c/p>\u003cp>Менеджер не выбирает уровень изоляции в одиночку. Он требует от технического решения доказательства для критического инварианта и учитывает последствия: конфликты и повторные попытки, ожидание блокировки, хвост задержек, deadlock, увеличение длительности теста. Для точных свойств читайте \u003ca href=\"https://www.postgresql.org/docs/current/transaction-iso.html\">документацию PostgreSQL об изоляции\u003c/a>; для механизмов ожидания и блокировок — \u003ca href=\"https://www.postgresql.org/docs/current/explicit-locking.html\">Explicit Locking\u003c/a>. Не переносите детали одной СУБД на все базы автоматически.\u003c/p>"}, {"title": "3. Репликация, резервная копия и шардирование решают разное", "body": "\u003cp>Реплика хранит копию данных и может использоваться для доступности или части чтений. Асинхронное копирование допускает отставание: пользователь только создал заказ, читает историю с реплики и не видит его. Возможные решения — читать после записи из primary, передавать маркер версии или показывать статус из подтверждённого ответа. Конкретный механизм выбирает команда, но допустимость временной «пропажи» заказа определяет продукт.\u003c/p>\u003cp>Синхронная репликация меняет цену подтверждения записи и поведение при потере связи. Она не означает автоматически нулевую потерю данных при любых настройках и любых переключениях. Нужно знать, какие узлы подтверждают запись и как выбирается новый primary. Документация \u003ca href=\"https://www.postgresql.org/docs/current/warm-standby.html\">PostgreSQL о standby\u003c/a> помогает проверить свойства конкретного режима. Резервная копия решает восстановление после удаления и повреждения; реплика может быстро повторить ошибочное удаление, поэтому одно другое не заменяет.\u003c/p>\u003cp>Шардирование делит набор данных между узлами. Ключ customer_id удобно локализует историю клиента, но перевод между клиентами может пересечь шарды. Ключ warehouse_id локализует остатки склада, но большая московская площадка становится горячим шардом. Цена включает изменение маршрутизации, перенос данных, cross-shard операции и эксплуатацию. Если узкое место — один горячий товар, простое увеличение числа шардов не обязательно разделит этот товар. До решения о шардировании проверьте индексы, запросы, блокировки и реальную нагрузку.\u003c/p>"}, {"title": "4. Сага — процесс с компенсациями и промежуточной правдой", "body": "\u003cp>Заказ требует резерва товара, оплаты и организации доставки. Локальная транзакция одной базы не делает атомарными три независимые системы. Сага связывает локальные шаги и при необходимости запускает компенсирующие бизнес-действия: снять резерв, инициировать возврат, отменить заявку доставки. Компенсация не стирает прошлое. Оплата могла породить комиссию, а отправленная машина — уже понесённые расходы. Для каждого шага уточняйте обратимость, срок и ответственного за спорные случаи.\u003c/p>\u003cp>Выберите явные состояния: created, stock_reserved, payment_pending, paid, delivery_pending, completed, compensation_pending, cancelled, manual_review. Названия условны; смысл — показать допустимые переходы и кто имеет право их выполнять. Таймаут оплаты переводит операцию в неопределённое состояние, пока не получен достоверный результат, а не автоматически в «не оплачено». Позднее подтверждение может прийти после запуска отмены; таблица переходов должна описывать эту гонку.\u003c/p>\u003cp>У оркестрации есть видимый координатор процесса, у хореографии — реакции сервисов на события. Первый вариант упрощает понимание длинного процесса, но требует надёжного координатора; второй уменьшает центральную связку, но усложняет восстановление общей картины. \u003ca href=\"https://microservices.io/patterns/data/saga.html\">Описание паттерна Saga\u003c/a> задаёт базовый механизм. В нашем учебном заказе разумно начать с явной машины состояний, поскольку поддержке нужно объяснять текущий шаг и запускать контролируемое восстановление.\u003c/p>"}, {"title": "5. Сверка — часть корректности, а не ручной хвост", "body": "\u003cp>Даже хорошо спроектированная система должна обнаруживать расхождения. Сверка сопоставляет ожидаемые факты из надёжных источников: распоряжение принято, деньги проведены, заказ подтверждён. Это не просто сравнение числа строк за сутки. Нужно общее соответствие по бизнес-идентификатору, сумме, валюте, состоянию и допустимому времени запаздывания. Иначе два потерянных заказа и два дубля дадут одинаковые итоги.\u003c/p>\u003cp>Для «Севера» определите реестр незавершённых переводов. Через согласованное время без конечного статуса они попадают в проверку; повторное действие выполняется идемпотентно; оператор видит историю переходов и основание решения. У ручного восстановления должны быть права доступа, аудит и защита от параллельного автоматического восстановления. Команда измеряет возраст старейшей проблемной операции и время устранения, а не только количество HTTP-ошибок.\u003c/p>\u003cp>В плане проекта сверка, операционный экран и сценарии восстановления — самостоятельные результаты. Если их оставить «после MVP», первая потеря ответа превратит разработчиков в круглосуточную ручную поддержку. Приёмка включает инъекцию сбоя между шагами, поздний ответ, дубликат и повторное восстановление. Для управленческого решения полезно записать максимально допустимое число операций в разборе, срок закрытия и владельца риска. Выпуск с временным ручным процессом возможен, если его пропускная способность и ответственность доказаны.\u003c/p>"}, {"title": "CAP и 2PC: границы теорем и протоколов", "body": "\u003cp>CAP рассматривает невозможность одновременно гарантировать линейризуемую согласованность и доступность каждого запроса к неотказавшему узлу при сетевом разделении в заданной модели. Линейризуемость означает, что операции выглядят как совершившиеся атомарно в некотором порядке, согласованном с реальным временем. Это не требование, чтобы физические копии памяти каждую наносекунду были одинаковы. Доступность в CAP тоже не равна вашему месячному SLO 99,9%. Формула «выбираем любые два из трёх» без модели сбоя плохо помогает проектировать реальную систему.\u003c/p>\u003cp>Представьте два склада с потерянной связью и одним общим неделимым резервом. Если обе стороны продолжают независимо обещать последний товар, общее правило может нарушиться. Если только владелец права записи подтверждает резерв, часть клиентов ждёт или получает отказ. Для витрины можно согласовать устаревший ответ; для списания нельзя незаметно подменить гарантию. Решение принимается по конкретной операции, инварианту и допустимому поведению во время разделения. После восстановления связи также нужен протокол разрешения накопленных фактов.\u003c/p>\u003cp>Двухфазный commit,2PC, координирует подготовку участников и финальное решение общей транзакции. Это реальный применяемый механизм, а не «устаревшая вещь, которой никто не пользуется». PostgreSQL поддерживает prepared transactions для внешних менеджеров транзакций. Цена включает удержание ресурсов в подготовленном состоянии и восстановление решения при сбоях координатора. Участники должны поддерживать протокол; произвольный HTTP-партнёр не становится участником XA от желания команды.\u003c/p>\u003cp>Сага вместо 2PC меняет гарантию: промежуточные результаты видимы, а компенсация является бизнес-действием, которое тоже может не завершиться. Поэтому нельзя советовать сагу для любого распределённого изменения без анализа допустимости промежуточного состояния. На ревью сформулируйте альтернативы: удержать критичный инвариант в одной локальной транзакции, использовать поддерживаемый распределённый протокол или изменить бизнес-процесс с явным состоянием ожидания. Сравнивайте последствия по надёжности, задержке и возможности эксплуатации.\u003c/p>"}], "practice": {"minutes": 40, "task": "\u003cp>За 40 минут спроектируйте заказ последнего телефона: резерв склада, списание у платёжного партнёра, доставка. Оплата завершилась, но ответ потерялся; через минуту клиент повторил запрос, через две минуты пришёл callback. Опишите инварианты, локальные транзакции, таблицу состояний, компенсации и сверку. Дополнительное условие: возврат денег иногда выполняется сутки.\u003c/p>", "rubric": ["Защищён последний остаток при параллельных запросах.", "Таймаут не приравнен к отказу оплаты.", "Повтор клиента связан с прежней операцией.", "Компенсация имеет собственное состояние и повторяемое восстановление.", "Есть сверка по бизнес-ключу и владельцы ручного разбора."], "model": "\u003cp>Заказ создаётся с устойчивым order_id и идентификатором намерения оплаты. Склад атомарно создаёт резерв при наличии доступного остатка. Внешняя оплата получает стабильный идентификатор; при потере ответа заказ остаётся payment_pending, повтор не создаёт новую оплату. Callback и опрос статуса сходятся в один разрешённый переход состояния.\u003c/p>\u003cp>При невозможной доставке запускается компенсация: резерв освобождается, возврат получает отдельный refund_id и состояние refund_pending. Заказ нельзя показывать как «деньги возвращены» до подтверждения. Если возврат занимает сутки, пользователь видит ожидаемый срок, а поддержка — операцию и её возраст.\u003c/p>\u003cp>Сверка сравнивает подтверждённые оплаты с заказами и возвратами по идентификатору, сумме и валюте, учитывая допустимое запаздывание. Гонка callback и отмены разрешается атомарным переходом версии состояния; конфликт перечитывает факты. Ручной разбор имеет владельца и аудит. Приёмка повторяет сбой после каждого внешнего эффекта.\u003c/p>"}, "quiz": [{"question": "После timeout оплаты есть локальное намерение, но партнёр не поддерживает ни поиск по ID, ни идемпотентность. Что согласовать до выпуска?", "options": ["Локальную дедупликацию запросов: она гарантирует отсутствие второго списания у партнёра", "Границу неопределённости, ограничение повторов и протокол расследования; автономный безопасный повтор не доказан", "Ровно один повтор после 60 секунд: ожидание делает его безопасным"], "answer": 1, "explanation": "Локальный ID защищает только локальную границу. Без поддержки партнёра неизвестный внешний эффект нельзя безопасно повторить одним ожиданием. Нужны изменение договора/интеграции либо согласованный ограниченный процесс с разбором неопределённости."}, {"question": "Можно ли считать реплику заменой резервной копии?", "options": ["Нет: ошибочное удаление может реплицироваться, требуется восстановление из независимой истории", "Да, данные ведь дублируются", "Да, если реплика в другом городе"], "answer": 0, "explanation": "Репликация и резервное копирование защищают от разных сценариев."}, {"question": "Сага выполнила компенсацию оплаты. Что это означает?", "options": ["История физически стёрта", "Все внешние эффекты обязательно исчезли", "Выполнено отдельное бизнес-действие, которое имеет собственные риски и результат"], "answer": 2, "explanation": "Возврат и отмена — новые операции; они могут занимать время и тоже отказывать."}], "sources": [{"title": "PostgreSQL: Transaction Isolation", "url": "https://www.postgresql.org/docs/current/transaction-iso.html"}, {"title": "PostgreSQL: Explicit Locking", "url": "https://www.postgresql.org/docs/current/explicit-locking.html"}, {"title": "PostgreSQL: Log-Shipping Standby Servers", "url": "https://www.postgresql.org/docs/current/warm-standby.html"}, {"title": "Chris Richardson: Saga", "url": "https://microservices.io/patterns/data/saga.html"}, {"title": "Gilbert & Lynch: Perspectives on the CAP Theorem", "url": "https://groups.csail.mit.edu/tds/papers/Gilbert/Brewer2.pdf"}, {"title": "PostgreSQL: Two-Phase Transactions", "url": "https://www.postgresql.org/docs/current/two-phase.html"}], "recall": "Как граница владения данными влияет на независимость релизов?"}, {"id": "sd-04", "title": "API и интеграции: контракт при сбоях и разных версиях", "minutes": 120, "intro": "120 минут: 40 теория и заметки, 20 разобранный пример, 40 самостоятельная работа, 20 проверка. Результат — контракт операции с семантикой повторов, ошибок, сроков и совместимости.", "lessons": [{"title": "1. Контракт — больше, чем JSON", "body": "\u003cp>Логистический партнёр принимает заявку доставки. В OpenAPI перечислены адрес, телефон и сумма, но не сказано, считается ли ответ подтверждением доставки, постановкой в очередь или только приёмом документа. Команды интегрировались по формату, а бизнес-процесс остался неопределённым. Хороший контракт задаёт смысл операции, обязательные предусловия, идентификаторы, состояния, ошибки, время ожидания, ограничения, безопасность и правила эволюции.\u003c/p>\u003cp>Опишите, что гарантируется после успешного ответа. Например: «Заявка сохранена с delivery_id; назначение курьера происходит отдельно. Повтор с тем же ключом не создаёт вторую заявку». Опишите, что означает отказ: некорректный адрес можно исправить; временную недоступность допустимо повторить по политике; отсутствие ответа требует выяснения статуса. Уникальный request_id для трассировки и устойчивый бизнес-идентификатор решают разные задачи: первый помогает найти запрос, второй связывает попытки одного намерения.\u003c/p>\u003cp>Для руководителя контракт — единица зависимости. Пока две команды не договорились о семантике ошибки и повторе, интеграционный риск открыт, даже если swagger уже опубликован. В Definition of Ready интеграционной задачи включите примеры успешного ответа, бизнес-отказа, технического отказа и неопределённого исхода. Контракт нужно проверить с реальным потребителем, а не только с генератором документации.\u003c/p>"}, {"title": "2. HTTP, REST и gRPC без технологических мифов", "body": "\u003cp>HTTP определяет семантику методов и ответов; REST — архитектурный стиль, а JSON — формат представления. Это разные уровни. Идемпотентность метода в \u003ca href=\"https://datatracker.ietf.org/doc/html/rfc9110\">RFC 9110\u003c/a> означает одинаковый предполагаемый эффект повторных одинаковых запросов, а не обязанность возвращать побайтно одинаковый ответ. POST сам по себе не делает создание безопасным для повтора; такое свойство можно добавить прикладным контрактом.\u003c/p>\u003cp>gRPC использует описания сервисов и сообщений, обычно Protocol Buffers, и удобен для строго описанного взаимодействия и потоков. Но скорость зависит от payload, реализации, сети и нагрузки: обещание «всегда в десять раз быстрее REST» некорректно. HTTP API тоже может иметь строгую спецификацию, генерацию клиентов и контрактные тесты. Выбор должен соответствовать существующей платформе, потребителям, средствам диагностики и ограничениям партнёра.\u003c/p>\u003cp>Представьте внешнюю интеграцию небольшого перевозчика и внутренний поток телеметрии. Для перевозчика читаемые HTTP-запросы и простой sandbox могут оказаться важнее компактности. Для интенсивного внутреннего потока с поддерживаемыми клиентами полезны другие свойства протокола. Руководитель задаёт критерии: стоимость подключения, диагностика сбоя ночью, поддержка версий, требования сети, умение команды. Изменение транспорта редко исправляет неясные бизнес-статусы или дубли операций.\u003c/p>"}, {"title": "3. Идемпотентность начинается с намерения", "body": "\u003cp>Клиент отправил создание доставки, сервер сохранил заявку, ответ потерялся. При повторе без устойчивого ключа создаются две доставки. Клиент должен повторить то же намерение с тем же ключом, а сервер — атомарно связать ключ с операцией. Ключ обычно ограничивают владельцем/арендатором и типом операции. Пришедший параллельно дубль не должен пройти окно между проверкой ключа и записью результата.\u003c/p>\u003cp>Задайте поведение для одинакового ключа с разными параметрами: это конфликт использования ключа, а не новая доставка. Срок хранения дедупликации должен покрывать поддерживаемое окно повторов, задержки очередей и восстановление клиентов. Если ключ удаляется через час, а клиент возвращается через сутки, прежняя гарантия больше не действует. Не скрывайте ограничение: контракт должен объяснять срок и способ выяснить результат старой операции.\u003c/p>\u003cp>Одна кнопка может выражать разные намерения: «повторить потерявшийся запрос» и «заказать ещё раз» требуют разных ключей. Поэтому вычисление ключа только из тела запроса опасно: два легитимных одинаковых заказа станут одним. Подход к caller-provided tokens разобран в \u003ca href=\"https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/\">Amazon Builders’ Library\u003c/a>. В учебном контракте «Ряда» ключ назначается при создании намерения, сохраняется клиентом до известного результата и передаётся через все повторные попытки.\u003c/p>"}, {"title": "4. Бюджет времени и повторов", "body": "\u003cp>Повтор помогает при кратком сбое, но усиливает перегрузку. Если пять уровней цепочки каждый делают три попытки на каждую неудачу, в худшем сочетании нижний уровень может получить до 3⁵ = 243 обращений вместо одного. Уточняйте, считаются ли «три» общим числом попыток или тремя повторами после первой. Политика должна быть согласована по цепочке, иметь общий deadline и ограниченный бюджет.\u003c/p>\u003cp>Таймаут соединения, таймаут отдельной операции и общий deadline — разные ограничения. Если мобильный клиент готов ждать секунду, внутренний вызов не должен бесконечно продолжать работу после её истечения без бизнес-основания. Для долгой операции лучше вернуть идентификатор обработки и предоставить статус. Используйте backoff — увеличение паузы, jitter — случайное рассеивание повторов, ограничение числа попыток и уважение сигналов перегрузки. Механизмы подробно рассматривает \u003ca href=\"https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/\">Builders’ Library о retries\u003c/a>.\u003c/p>\u003cp>Повторяйте только операции, для которых известна безопасность повторного эффекта, и только ошибки, которые политика считает временными. При перегрузке нужны ограничение параллельности и отказ части нагрузки, иначе очередь ожидания бесконтрольно растёт. Circuit breaker временно прекращает обращения к проблемной зависимости по определённым условиям; его восстановление и пороги тоже нужно испытать. Для PM практический результат — таблица «ошибка → действие → предел времени → видимый статус → владелец». В ней исчезают обещания «когда-нибудь само повторится».\u003c/p>"}, {"title": "5. Совместимость и контрактные проверки", "body": "\u003cp>Мобильные клиенты обновляются не одновременно. Добавление необязательного поля часто проще удаления, но само по себе не гарантирует совместимость: строгий десериализатор может отвергать неизвестные поля, а новый enum — ломать старый экран. Изменение значения поля, единиц измерения или смысла статуса способно быть ломающим при прежней JSON-схеме. Поэтому у версии есть структурная и семантическая стороны.\u003c/p>\u003cp>Составьте матрицу: старый клиент — новый сервер, новый клиент — старый сервер, старый потребитель — новые события. Определите окно поддержки, телеметрию использования, порядок включения и условие удаления старого поведения. Для внешнего партнёра согласуйте срок уведомления и проверку в sandbox; для мобильных клиентов измеряйте распространение версий. Календарная дата без факта использования не доказывает, что старый контракт больше не нужен.\u003c/p>\u003cp>Контрактный тест проверяет, что поставщик и потребитель понимают согласованные сообщения. Он не заменяет end-to-end сценарий бизнес-операции, нагрузочный тест или испытание отказа. В плане интеграции нужны успешный путь, типовые ошибки, истечение deadline, повтор с тем же ключом, конфликт параметров, поздний ответ и старая версия клиента. Критерий готовности: команда может показать ожидаемое поведение при каждом случае и назвать способ обнаружения нарушения в production. Это делает зависимость обозримой ещё до общего стенда.\u003c/p>"}, {"title": "Путь запроса и скрытые сетевые зависимости", "body": "\u003cp>Мобильный запрос проходит несколько независимых границ: разрешение имени, установление защищённого соединения, балансировку, шлюз и приложение. Для расследования полезно отличать невозможность разрешить имя, ошибку сертификата, отказ соединения и тайм-аут после отправки тела. В последнем случае сервер мог успеть выполнить операцию. Ни HTTP, ни TLS сами по себе не решают семантику повторного платежа.\u003c/p>\u003cp>Балансировщик распределяет трафик только между считающимися готовыми экземплярами. Во время релиза часть соединений ещё относится к старым процессам. Нужны прекращение приёма новой работы, корректное завершение активной и совместимость двух версий. Изменение DNS не мгновенно переносит каждого клиента: существуют кэши и долгоживущие соединения. Поэтому план переключения должен учитывать период сосуществования маршрутов.\u003c/p>\u003cp>Шлюз может выполнять аутентификацию, квоты и маршрутизацию; бизнес-сервис отвечает за права на конкретный объект и инварианты. Не помещайте всю бизнес-логику в шлюз лишь ради единой точки: это создаст общий релизный узел и усложнит владельцев. Для прокси и сервисов согласуйте временной бюджет: клиентский deadline, внутренние лимиты и повторы не должны противоречить друг другу.\u003c/p>\u003cp>Для учебной проверки опишите три сбоя: запрос не дошёл, запрос дошёл без ответа, ответ дошёл, но клиент не сохранил результат. В каждом случае определите, можно ли повторить с тем же идентификатором и где получить конечный статус. Такой разбор полезнее общего требования «настроить retry3».\u003c/p>"}], "practice": {"minutes": 40, "task": "\u003cp>За 40 минут составьте контракт CreateDelivery для партнёра «Вектор»: приём до 700 мс, курьер назначается до 10 минут, клиент может повторить запрос через сутки. Опишите запрос, успешный ответ, статусы, ключ намерения, три вида ошибок, дедупликацию, общий deadline и совместимость. Затем обработайте условие: партнёр вернул 500 после фактического создания заявки.\u003c/p>", "rubric": ["Успех приёма отделён от назначения курьера.", "Ключ стабилен для одного намерения, конфликт параметров определён.", "Срок дедупликации согласован с суточным повтором.", "500 не используется как доказательство отсутствия эффекта.", "Есть статусный интерфейс, ограничение повторов и проверка старых клиентов."], "model": "\u003cp>Запрос содержит intent_id, order_id и параметры доставки; область ключа включает клиента партнёра и тип операции. Сервер атомарно создаёт delivery_id и запись намерения. Успешный ответ подтверждает приём, а не назначение. GET статуса возвращает pending, assigned, rejected и согласованную историю; повтор того же намерения возвращает связанную операцию.\u003c/p>\u003cp>Контракт требует хранения дедупликации дольше поддерживаемого окна суточных повторов с согласованным запасом; фактическую длительность выбирают после оценки задержек восстановления. Тот же ключ с другим адресом — конфликт. 500 после создания оставляет неопределённый исход: клиент выясняет статус по intent_id либо безопасно повторяет его, а не создаёт новый ключ.\u003c/p>\u003cp>Deadline ограничивает ожидание приёма; назначение наблюдается отдельно. Временные ошибки допускают ограниченные повторы с backoff и jitter; бизнес-ошибки требуют исправления данных. Матрица версий и контрактные тесты дополняются реальным сценарием потери ответа. В операционном SLA фиксируется эскалация заявки без назначения через 10 минут.\u003c/p>"}, "quiz": [{"question": "Идемпотентные ключи хранятся 24 часа, мобильный клиент после офлайна повторяет платёж через 48 часов. Что изменить?", "options": ["Согласовать срок повтора и долговечный бизнес-ID/проверку результата, поскольку TTL-кэша недостаточно", "Продлить HTTP timeout: это сохранит запись ключа", "Разрешить новый ключ после 24 часов и считать это продолжением прежнего платежа"], "answer": 0, "explanation": "Срок дедупликации является частью контракта. Если клиент вправе повторить позже, истёкший кэш не доказывает отсутствие прежнего эффекта. Нужны согласованное окно и надёжная идентичность операции; HTTP timeout не управляет этой историей."}, {"question": "Почему три попытки на каждом из пяти уровней опасны?", "options": ["Они обязательно дают только три обращения внизу", "В худшем случае число обращений к нижнему уровню умножается до 243", "Повторы никогда не помогают"], "answer": 1, "explanation": "Независимые бюджеты повторов могут мультипликативно усилить нагрузку; нужна согласованная политика."}, {"question": "Добавили новое значение enum без изменения типа поля. Это всегда совместимо?", "options": ["Нет, старый потребитель может не понимать новый смысл и отвергнуть сообщение", "Да, если сервер успешно собрался", "Да, формат строки сохранён"], "answer": 0, "explanation": "Совместимость включает поведение потребителей и семантику, а не только JSON-тип."}], "sources": [{"title": "RFC 9110: HTTP Semantics", "url": "https://datatracker.ietf.org/doc/html/rfc9110"}, {"title": "Amazon Builders’ Library: Making retries safe with idempotent APIs", "url": "https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/"}, {"title": "Amazon Builders’ Library: Timeouts, retries, and backoff with jitter", "url": "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"}, {"title": "IETF RFC9110: HTTP Semantics", "url": "https://www.rfc-editor.org/rfc/rfc9110.html"}], "recall": "Почему timeout не означает неуспех? Как защитить повтор?"}, {"id": "sd-05", "title": "События и Kafka: управлять временем и повторной обработкой", "minutes": 120, "intro": "120 минут: 40 теория и заметки, 20 разобранный пример, 40 самостоятельная работа, 20 проверка. Результат — контракт события, схема доставки, бюджет задержки и план восстановления потребителя.", "lessons": [{"title": "1. Асинхронность меняет обещание", "body": "\u003cp>Маркетплейс принял заказ и публикует OrderAccepted. Склад, бонусы и уведомления обрабатывают событие независимо. Заказ больше не обязан ждать отправки SMS, и отказ уведомлений не блокирует покупку. Но принятие сообщения брокером не означает, что склад уже зарезервировал товар. Клиентское обещание должно соответствовать шагу: «принят в обработку» не равно «товар гарантирован». Асинхронность перемещает часть времени из HTTP-ответа в видимую очередь работы.\u003c/p>\u003cp>Различайте команду и событие. ReserveStock выражает запрос конкретному владельцу выполнить действие; StockReserved сообщает уже случившийся факт. Команда может быть отклонена. Событие тоже нуждается в понятной семантике: что именно завершено, в какой границе и какой версией правил. Если сообщение называется OrderCompleted, но означает только вставку строки, потребители построят ложные процессы.\u003c/p>\u003cp>Полезный конверт события содержит event_id, тип и версию, время факта, бизнес-ключ, идентификатор причинной операции и payload. Время получения не заменяет время события. В российских интеграциях особенно заметны ночные пакетные загрузки и окна партнёров: сообщение, пришедшее утром, может описывать вчерашний факт. Условия свежести и корректировки истории должны быть частью требований, иначе бухгалтерская сверка и пользовательская история начнут расходиться.\u003c/p>"}, {"title": "2. Партиции, ключ и порядок", "body": "\u003cp>Kafka хранит записи в журнале, разделённом на партиции. Порядок задаётся внутри одной партиции; общего порядка всего топика не следует предполагать. В обычной consumer group партиция назначается одному потребителю одновременно, поэтому число партиций ограничивает полезную параллельность чтения этого типа. Разные группы могут независимо читать один поток: склад и аналитика имеют собственные позиции.\u003c/p>\u003cp>Выбор ключа — выбор области порядка. order_id держит события одного заказа вместе при согласованном распределении; warehouse_id может сосредоточить весь поток крупного склада в горячей партиции. Если одна партиция перегружена одним ключом, добавление потребителей не ускоряет именно этот ключ. Увеличение числа партиций также требует анализа маршрутизации и сохранения порядка по ключу во время перехода. Это изменение production-потока, а не безобидная настройка.\u003c/p>\u003cp>Нарисуйте последовательность OrderAccepted → StockReserved → PaymentConfirmed. Если события производят разные системы, один и тот же ключ сам по себе не создаёт причинный порядок между независимыми источниками. Потребителю может понадобиться версия агрегата, проверка разрешённого перехода и ожидание отсутствующего факта. Базовые механизмы журнала, групп и доставки проверяйте по \u003ca href=\"https://kafka.apache.org/41/design/design/\">документации Apache Kafka\u003c/a>. В нашем курсе управленческий вопрос — какие бизнес-операции требуют порядка и сколько это стоит в параллельности.\u003c/p>"}, {"title": "3. At-least-once и граница exactly-once", "body": "\u003cp>Потребитель прочитал событие и изменил свою базу, затем упал до фиксации позиции чтения. После запуска он читает событие снова. Если фиксировать позицию раньше изменения базы, падение между действиями может потерять работу. Это классическая развилка между дублями и потерей при несогласованных эффектах. Для бизнес-процесса часто выбирают повторную доставку с безопасной дедупликацией обработки.\u003c/p>\u003cp>Дедупликацию нельзя выполнять отдельной неатомарной проверкой «видел ли event_id». Два конкурентных обработчика могут одновременно не найти запись. В реляционной базе запись об обработанном событии и бизнес-изменение можно поместить в одну локальную транзакцию с уникальным ключом. Повтор после commit распознаётся; падение до commit не оставляет половины эффекта. Если эффект — отправка внешнего платежа, локальная таблица сама по себе его не делает атомарным: требуется контракт внешней идемпотентной операции или протокол восстановления.\u003c/p>\u003cp>Идемпотентный producer и транзакции Kafka дают определённые гарантии в поддерживаемых сценариях, в частности внутри Kafka-процессинга при правильной настройке чтения и записи. Они не превращают автоматически списание во внешней платёжной системе в ровно один эффект. Этот предел подчёркивает \u003ca href=\"https://docs.confluent.io/kafka/design/delivery-semantics.html\">документация Confluent о delivery semantics\u003c/a>. На ревью спросите: «Ровно один раз где именно, при каком падении и с каким внешним эффектом?» Ответ должен назвать границу гарантии.\u003c/p>"}, {"title": "4. Outbox закрывает разрыв базы и публикации", "body": "\u003cp>Сервис сохранил заказ и должен сообщить об этом складу. Если сначала выполнить commit базы, затем отправить событие, падение между действиями оставит заказ без сообщения. Если сначала опубликовать, затем сохранить, потребитель может обработать событие о несуществующем заказе. Две успешные строки кода не образуют общей транзакции между независимыми системами.\u003c/p>\u003cp>Transactional outbox сохраняет изменение заказа и запись для публикации в одной локальной транзакции. Отдельный relay читает outbox и передаёт событие брокеру. Если relay отправил событие и упал до отметки об отправке, он отправит его повторно: потребитель всё равно должен выдерживать дубль. Outbox устраняет конкретный разрыв атомарности, а не все классы ошибок. Ключевые свойства паттерна описаны у \u003ca href=\"https://microservices.io/patterns/data/transactional-outbox.html\">Криса Ричардсона\u003c/a>.\u003c/p>\u003cp>Добавьте в план эксплуатацию relay: возраст старейшей непереданной записи, скорость публикации, размер таблицы, очистку и восстановление. Заказ может считаться принятым, пока событие ещё лежит в outbox, но конечный результат будет задержан. Поэтому end-to-end SLI должен охватывать весь путь. При смене схемы payload старые записи outbox также должны оставаться публикуемыми. Иначе безопасная миграция кода неожиданно остановит хвост вчерашних заказов. Проверьте этот сценарий до релиза новой версии.\u003c/p>"}, {"title": "5. Lag, replay и ядовитое сообщение", "body": "\u003cp>Lag — отставание потребителя от опубликованного потока. Количество сообщений без возраста может вводить в заблуждение: миллион лёгких событий обработается быстрее тысячи тяжёлых. Измеряйте скорость входа λ, скорость обработки μ и возраст старейшего ожидающего факта. Если λ = 800 событий/с, а μ = 600, очередь растёт на 200/с: за десять минут прибавится 120 тысяч. Брокер смягчает всплеск, но не исправляет постоянный дефицит производительности.\u003c/p>\u003cp>После восстановления μ = 1400 при продолжающемся входе 800 оставляет 600 событий/с для сокращения долга. 120 тысяч событий уйдут примерно за 200 секунд при неизменном профиле и достаточных ресурсах. Если команды обещают «догнать за минуту», расчёт сразу показывает противоречие. Приёмка должна включать восстановление после простоя, а не только стабильный режим без очереди.\u003c/p>\u003cp>Ядовитое сообщение стабильно ломает обработчик. Бесконечный retry блокирует прогресс; DLQ или карантин позволяют продолжить обработку, но создают управляемый долг. Нужно сохранить исходное сообщение, причину, владельца, срок и безопасную процедуру возврата. Если порядок критичен, пропуск одного события может сделать следующие некорректными — политика зависит от домена. Replay полезен для пересчёта аналитики, но повтор финансового эффекта опасен. Перед переигрыванием определите диапазон, версию кода, идемпотентность, отключение необратимых внешних действий и критерий сверки результата.\u003c/p>"}], "practice": {"minutes": 40, "task": "\u003cp>За 40 минут спроектируйте поток OrderAccepted → склад/бонусы/уведомления: вход 800 событий/с, потребитель склада обрабатывает 600 событий/с десять минут, затем 1400. Обоснуйте ключ партиции, семантику события, outbox, дедупликацию и SLI свежести. Рассчитайте отставание и время восстановления. Добавьте сбой: один event_id постоянно вызывает ошибку, а для одного заказа события пришли в неожиданном порядке.\u003c/p>", "rubric": ["Определено, что OrderAccepted гарантирует и чего ещё не подтверждает.", "Ключ поддерживает нужную область порядка; горячий ключ рассмотрен.", "Outbox и дедупликация описаны с границами атомарности.", "Получены 120000 событий отставания и ≈200 секунд догона.", "DLQ/replay имеют владельца, контроль внешних эффектов и политику порядка."], "model": "\u003cp>OrderAccepted подтверждает сохранение заказа, а не резерв склада. Заказ и outbox записываются одной транзакцией; relay публикует event_id и order_id, допустимы повторные публикации. Группы склада, бонусов и уведомлений читают независимо. Ключ order_id выбран для порядка одного заказа; обработчик проверяет версию состояния и не полагается на глобальный порядок.\u003c/p>\u003cp>Склад фиксирует event_id и резерв в одной локальной транзакции; повтор не создаёт новый резерв. При внешнем эффекте требуется отдельный устойчивый идентификатор операции. Начальный рост: (800−600) × 600 = 120000 сообщений. После восстановления чистая скорость догона 1400−800 = 600/с; время ≈200 секунд без учёта изменения профиля и накладных расходов.\u003c/p>\u003cp>SLI — доля заказов с подтверждённым резервом в согласованное время, плюс возраст старейшего неразобранного заказа. Ядовитое сообщение изолируется по политике домена; если продолжение нарушает порядок агрегата, карантин затрагивает соответствующий заказ. Replay ограничен диапазоном и проверкой дедупликации; реальные внешние выплаты не повторяются без согласованного протокола.\u003c/p>"}, "quiz": [{"question": "Consumer записывает в БД баллы и event_id одной транзакцией, а offset коммитит после неё. Он упал после commit БД. Как продолжить?", "options": ["Ручная отмена баллов обязательна, так как offset не зафиксирован", "Сначала принудительно перескочить offset, не читая сообщение", "Повторно прочитать: уникальный event_id и атомарная запись эффекта распознают уже выполненную работу"], "answer": 2, "explanation": "Доставка повторится, но локальный эффект можно сохранить однократным при правильной транзакции и уникальности. Это не общая гарантия для внешних SMS или платежей. Перескок offset без проверки способен скрыть незавершённые изменения."}, {"question": "При входе 800/с обработчик делает 1400/с. С какой скоростью сокращается накопленный lag?", "options": ["1400 событий/с", "600 событий/с", "2200 событий/с"], "answer": 1, "explanation": "Из производительности нужно вычесть продолжающийся вход: 1400−800 = 600."}, {"question": "Что доказывает transactional outbox?", "options": ["Что все потребители уже завершили работу", "Что заказ и намерение публикации записаны атомарно в одной локальной транзакции", "Что событие никогда не продублируется"], "answer": 1, "explanation": "Relay может публиковать повторно; потребителям нужна безопасная обработка дублей."}, {"question": "Можно ли назвать внешний платёж exactly-once только потому, что включены транзакции Kafka?", "options": ["Да, это глобальная гарантия", "Нет, нужна гарантия на границе внешнего эффекта", "Да, если у сообщения есть timestamp"], "answer": 1, "explanation": "Гарантия конкретной платформы не покрывает автоматически независимую внешнюю систему."}], "sources": [{"title": "Apache Kafka: Design", "url": "https://kafka.apache.org/41/design/design/"}, {"title": "Confluent: Kafka Message Delivery Guarantees", "url": "https://docs.confluent.io/kafka/design/delivery-semantics.html"}, {"title": "Chris Richardson: Transactional outbox", "url": "https://microservices.io/patterns/data/transactional-outbox.html"}], "recall": "Какие условия делают повтор API безопасным и как долго они действуют?"}, {"id": "sd-06", "title": "Масштабирование: найти предел до покупки серверов", "minutes": 120, "intro": "Научитесь различать дефицит вычислений, ожидание зависимостей и конкуренцию за один ресурс. Результат — проверяемый план подготовки маркетплейса к акции.", "lessons": [{"title": "Где система проводит время", "body": "\u003cp>Маркетплейс «Ряд» готовит распродажу. В обычный день API отвечает за 180 мс, под нагрузкой p99 достигает восьми секунд. Команда предлагает удвоить число pod в OpenShift. Это разумная гипотеза только после ответа: где запросы проводят эти секунды? Если они ждут один заблокированный остаток в PostgreSQL, новые экземпляры увеличат число конкурентов. Если каждый экземпляр открывает 50 соединений, рост с 10 до 30 pod увеличит потенциальный пул с 500 до 1500 соединений и способен добить базу.\u003c/p>\u003cp>Разделяйте четыре наблюдения: частота поступления, завершённый throughput, время ответа и занятые ресурсы. Поступает 1000 запросов/с, завершается 600 — очередь растёт на 400/с, даже если HTTP-сервер пока не отказывает. Через минуту это 24 тысячи ожидающих запросов. Задержка создаёт новые повторы, а повторы — дополнительную нагрузку. Поэтому производительность следует проверять совместно с политикой тайм-аутов, лимитами очередей и повторов.\u003c/p>\u003cp>Начните с пользовательского пути и trace: шлюз, авторизация, бизнес-сервис, база, партнёр. Метрики покажут масштаб проблемы, trace — участок ожидания конкретного запроса, лог — обстоятельства события. Сопоставляйте их по correlation ID, версии и сегменту трафика. Не включайте ФИО, токены и полные платёжные данные в trace attributes. Sampling трасс означает, что отсутствие найденной трассы не доказывает отсутствия ошибки.\u003c/p>\u003cp>В архитектурном обсуждении руководитель требует последовательность: наблюдение, объяснение механизма, изменение, ожидаемая метрика и условия опровержения. «Добавим Redis и станет быстрее» не содержит ни причины, ни проверки. «Уберём повторное чтение неизменяемых атрибутов товара, сократим чтения БД на 60% в данном профиле, замерим p99 и miss rate» — проверяемая гипотеза.\u003c/p>"}, {"title": "Запросы к данным: индекс, модель чтения и цена записи", "body": "\u003cp>Реляционная база не обязана быть медленной, а NoSQL не гарантирует масштабируемость конкретной операции. Начинайте с access patterns: найти заказ по ID, показать последние заказы организации, посчитать закрытие дня, обновить один горячий остаток. Для каждого укажите объём просматриваемых данных, частоту, допустимую свежесть и гарантию записи. Один универсальный запрос «всё со всеми JOIN» редко одинаково хорошо обслуживает эти задачи.\u003c/p>\u003cp>Индекс помогает найти нужную часть данных, но занимает место и обновляется при записи. Составной индекс выбирают по реальным предикатам и сортировке, а не добавляют к каждой колонке на всякий случай. Уникальное ограничение также может защищать бизнес-ключ от конкурентных дублей. На ревью попросите план выполнения и замеры на репрезентативных данных; конкретный синтаксис EXPLAIN менеджеру знать необязательно.\u003c/p>\u003cp>Аналитический отчёт за год способен вытеснить рабочие данные из памяти и конкурировать с оформлением заказа. Вынесенная read model или отдельное аналитическое хранилище разгружает критический путь, но имеет lag, свой pipeline и проверку полноты. CQRS разделяет модели команд и чтения; оно не требует автоматически event sourcing. Event sourcing хранит последовательность доменных событий как основу восстановления состояния и добавляет задачи версионирования, снимков и воспроизведения.\u003c/p>\u003cp>Для нового отчёта выберите честное обещание свежести. «Данные с задержкой до 15 минут» позволяет асинхронную модель; «текущий доступный остаток для резерва» требует другого механизма. Влияние на поставку: меняются зависимые команды, критерии сверки и способ тестирования отложенного результата.\u003c/p>"}, {"title": "Кэш: ускорение ценой отдельной модели корректности", "body": "\u003cp>В cache-aside приложение сначала ищет объект в кэше, при промахе читает источник и кладёт результат. Кэш удобно строить для каталога, но опасно превращать его в единственное основание денежного решения. Показанная цена может быть предварительной; окончательная сумма подтверждается в транзакционном контуре с правилом фиксации цены. Остаток на витрине может отставать, а возможность резервирования проверяется у владельца остатка.\u003c/p>\u003cp>TTL ограничивает срок хранения значения в кэше, но не является доказательством согласованности. Пока читатель держит старый результат, писатель может обновить базу и удалить ключ; читатель затем запишет старую версию обратно. Для критичных данных обсуждают версии, правила записи и проверку источника. Инвалидация событием тоже может опоздать или повториться. Нужны допустимый возраст данных и способ восстановления при пропущенном событии.\u003c/p>\u003cp>Hit rate 95% выглядит отлично: из 20 тысяч чтений/с в базу идут 1000. При полной потере кэша поток в БД может стать 20 тысяч/с. Это отказ системы, если её предел 2000. Предусмотрите прогрев, ограничение параллельных загрузок одного ключа, случайное распределение TTL, выдачу допустимо устаревших данных и отсечение второстепенных запросов. Stale-while-revalidate означает явное согласие выдать старое значение, а не бесплатное ускорение.\u003c/p>\u003cp>Один горячий товар может создать hot key. Простое увеличение числа шардов кэша не распределяет обращения к одному ключу автоматически. Нужны локальные копии, объединение одинаковых запросов или изменение модели чтения. Для каждой меры укажите последствия: расход памяти, устаревание, сложность инвалидации. Закончите обсуждение кэша вопросом: что увидит пользователь при его полном исчезновении?\u003c/p>"}, {"title": "Масштабирование и пределы параллелизма", "body": "\u003cp>Вертикальное масштабирование добавляет ресурсы экземпляру; горизонтальное — экземпляры. Горизонтальное проще для stateless API, когда сессия и рабочие данные не привязаны к одному процессу. Но балансировщик не распределит уже открытую тяжёлую операцию, а локальное состояние потеряется при пересоздании pod. Readiness должна отражать готовность принимать трафик, graceful shutdown — позволять закончить или корректно передать работу.\u003c/p>\u003cp>Автомасштабирование реагирует с задержкой: сбор метрик, решение контроллера, выделение узла, скачивание образа, старт и прогрев приложения. Если акция начинается одновременно для всех, масштабирование после роста CPU может опоздать. Измерьте время до реальной готовности и подготовьте ёмкость заранее. Сигналом может быть не только CPU: возраст сообщений, in-flight запросы и насыщение пула часто ближе к проблеме. При этом метрика должна позволять добавленным экземплярам действительно устранить ограничение.\u003c/p>\u003cp>Шардинг делит данные между владельцами, а репликация создаёт копии. Шардинг может снять предел записи, но усложняет транзакции, перенос данных и запросы между шардами. Ключ tenant_id удобен для изоляции клиентов, однако один крупный клиент может перегрузить один шард. Не объявляйте шардинг обязательным из-за большого общего объёма: сначала проверьте индексы, характер запросов, архивирование и фактическую ёмкость.\u003c/p>\u003cp>Два дата-центра с равной долей трафика не означают готовности к потере одного. Если каждый при общем пике загружен на 50% своей предельной мощности, после переключения выживший окажется на 100%, без запаса на повторы и восстановление. Проверьте весь путь: API, база, сеть, брокер и лимиты внешнего партнёра. Удвоить только API недостаточно.\u003c/p>"}, {"title": "Нагрузочный эксперимент как управленческий контракт", "body": "\u003cp>Тест должен воспроизводить причинный механизм риска. Для распродажи это доля горячих товаров, состав корзины, ответы партнёра и длительность всплеска. Тест на равномерном наборе случайных ID не подтверждает отсутствие конкуренции за популярный остаток. Набор данных должен иметь реалистичную кардинальность и индексы; миллион одинаковых строк создаёт другую нагрузку, чем рабочая база.\u003c/p>\u003cp>План включает baseline, ступенчатый рост, устойчивый пик, длительный прогон и отказ компонента. На каждой ступени фиксируются goodput — полезные завершённые операции, p95/p99, ошибки, возраст очереди и насыщение ресурсов. Не считайте технически успешным заказ, который HTTP принял, но который потерялся дальше. Отдельно проверяйте правильность сумм и остатков.\u003c/p>\u003cp>Согласуйте стоп-условия до запуска: например, потеря инварианта, устойчивый рост backlog или технические ошибки выше учебного порога. У теста должен быть владелец остановки и безопасная изолированная среда. Испытание в production требует отдельного ограниченного плана, согласованного в организации; это не обязательный шаг учебного кейса.\u003c/p>\u003cp>Измерение на тестовом стенде не переносится линейно на production, если отличаются CPU, диск, сеть или объём данных. Вместо «тест пройден» напишите: какой профиль выдержан, какой ресурс ограничивает, какие различия среды остались и какую угрозу они создают для срока акции. Это превращает отчёт в основание для решения о запуске.\u003c/p>"}, {"title": "Разобранный пример: кэш исчез в начале акции", "body": "\u003cp>Учебные вводные: каталог получает 12 000 чтений/с, hit rate 90%, БД выдерживает 2400 чтений/с при согласованной задержке. При обычной работе в БД идут 1200 чтений/с. После сброса кэша туда попытаются попасть все 12 тысяч: пятикратное превышение измеренного предела. Добавление API не увеличивает этот предел.\u003c/p>\u003cp>Вариант А — запас БД на весь cold-start. Он прост по логике, но может быть дорог или недостижим до акции. Вариант Б — предзагрузка популярных данных, ограниченный miss-path и разрешённая для каталога старая копия. Он дешевле по ресурсам, но требует
