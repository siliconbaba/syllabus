ия.\u003c/p\u003e\u003cp\u003eПосле завершения исходник остаётся private и получает статус uploaded. Обработчик проверяет реальный контейнер, длительность и контрольную сумму, затем запускает превью и ограниченный набор воспроизводимых вариантов. Для внутреннего рассмотрения претензии не нужны десять разрешений. Сэкономленный вариант обработки — обоснованное продуктовое решение, а не ухудшение надёжности. Если одна задача упала, её повтор использует тот же ключ результата версии pipeline-3.\u003c/p\u003e\u003cp\u003eМетаданные переводятся в ready только после необходимых выходов. Если процесс упал после записи файла, но до обновления БД, повтор находит готовый выход и завершает переход. Если БД уже ready, но временно недоступно хранилище, API показывает проблему чтения, не создаёт новую претензию. Периодическая сверка находит объекты без метаданных и зависшие сессии; удаление выполняется после защитного срока, чтобы не уничтожить ещё обрабатываемый объект.\u003c/p\u003e\u003cp\u003eДля учебного публичного ролика с битрейтом 3 мегабита в секунду десять тысяч зрителей создают около 30 гигабит в секунду суммарной выдачи до накладных расходов. CDN уменьшает нагрузку на origin, но не отменяет стоимость доставки зрителям. У претензии другой риск: важно не раздать частное видео чужому клиенту. Поэтому тесты проверяют истечение подписанного доступа, смену организации, закрытый прямой путь к origin и отсутствие утечки через общий cache key. Удаление претензии должно охватывать исходник, варианты, превью, метаданные и срок вытеснения копий из доставки.\u003c/p\u003e"},"expedition":{"world":"media","title":"Видеоплатформа и архив судебных документов","html":"\u003cp\u003eУ крупной видеоплатформы основная экономическая нагрузка может приходиться на доставку и кодирование популярных роликов, а не на таблицу пользователей. Требуются прогноз популярности, очередь транскодирования, несколько CDN и выбор набора качеств. Публикации инженеров конкретных видеосервисов полезны как свидетельство решений в определённый момент, но не являются полной текущей архитектурой всей компании. В нашем вымышленном сервисе масштабы меньше, поэтому сложный собственный медиастек преждевременен.\u003c/p\u003e\u003cp\u003eАрхив судебных документов тоже хранит большие объекты и метаданные, но нуждается в другом результате. Для него важнее целостность оригинала, история доступа, срок хранения и возможность доказать, какая именно версия была представлена. Превью PDF может быть расходной производной копией, а оригинал — неизменяемым свидетельством. Массовое адаптивное видео и низкая live-задержка здесь почти не нужны.\u003c/p\u003e\u003cp\u003eПереносятся управляемая загрузка, карантин, неизменяемые ключи, сверка двух хранилищ и авторизация чтения. Меняется политика преобразования: пережатие допустимо для удобного просмотра, но не должно незаметно подменять оригинал доказательства. Это показывает, почему object storage — общий строительный элемент, а не готовая предметная архитектура. Ценность байтов определяет конвейер, сроки и то, что считается успешной публикацией.\u003c/p\u003e\u003cp\u003eОтдельный реальный пример: в публикации Алексея Шпагина из команды VK от 24 февраля 2026 года описан путь контента через загрузку, преобразование, хранение и доставку. Автор отдельно обсуждает основной медиаконвейер, параллельные дополнительные обработки и собственный плеер. Для CDN приведён вариант выдачи ссылки сразу на конкретный кэш-сервер с резервной ссылкой на центральную площадку. Это свидетельство решения команды на дату статьи, а не утверждение о полной или неизменной архитектуре VK Видео. Практический урок для нашего меньшего сервиса — рассматривать плеер, распределение байтов и обработку вместе: серверный успех не равен хорошему просмотру. Копировать конкретную топологию большого сервиса без его масштаба, инструментов и операционной команды не требуется.\u003c/p\u003e","transfer":["Разделять байты и метаданные","Публиковать только проверенный набор производных версий"],"distinct":["Архив требует доказуемого оригинала, платформа — эффективной массовой доставки"]},"diagrams":[{"title":"Контрольный путь и путь байтов","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003crect x=\"30\" y=\"50\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"89.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eМобильный клиент\u003c/text\u003e\u003crect x=\"280\" y=\"50\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"89.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eAPI / upload_id\u003c/text\u003e\u003crect x=\"530\" y=\"50\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"89.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eObject storage\u003c/text\u003e\u003cpath d=\"M230 82 L280 82\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M480 82 L530 82\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M130 115 L130 205\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M130 205 L630 205\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M630 205 L630 115\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"225\" y=\"190\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eбайты напрямую: части 1…15\u003c/text\u003e\u003crect x=\"280\" y=\"300\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"339.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eПроверка / encode\u003c/text\u003e\u003cpath d=\"M630 205 L630 330\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M630 330 L480 330\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"30\" y=\"300\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"339.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eМетаданные ready\u003c/text\u003e\u003cpath d=\"M280 330 L230 330\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"30\" y=\"425\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eГотовность публикуется после проверки, не после слова клиента\u003c/text\u003e","caption":"API выдаёт сессию и ограниченные права, а большие байты идут от клиента непосредственно в объектное хранилище частями. Обработка проверяет исходник и производные версии; метаданные становятся ready только после обязательных шагов. Между БД и bucket нет подразумеваемой общей транзакции."},{"title":"Варианты качества и сегментная доставка","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003crect x=\"30\" y=\"60\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"102.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eOrigin: версии\u003c/text\u003e\u003crect x=\"280\" y=\"60\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"102.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eCDN edge\u003c/text\u003e\u003crect x=\"530\" y=\"60\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"102.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eПлеер\u003c/text\u003e\u003cpath d=\"M230 95 L280 95\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003cpath d=\"M480 95 L530 95\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"35\" y=\"205\" width=\"140\" height=\"45\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"49\" y=\"234.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e360p\u003c/text\u003e\u003cpath d=\"M190 227 L510 227\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ccircle cx=\"250\" cy=\"227\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ccircle cx=\"340\" cy=\"227\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ccircle cx=\"430\" cy=\"227\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003crect x=\"35\" y=\"270\" width=\"140\" height=\"45\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"49\" y=\"299.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e720p\u003c/text\u003e\u003cpath d=\"M190 292 L510 292\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ccircle cx=\"250\" cy=\"292\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ccircle cx=\"340\" cy=\"292\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ccircle cx=\"430\" cy=\"292\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003crect x=\"35\" y=\"335\" width=\"140\" height=\"45\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"49\" y=\"364.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003e1080p\u003c/text\u003e\u003cpath d=\"M190 357 L510 357\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ccircle cx=\"250\" cy=\"357\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ccircle cx=\"340\" cy=\"357\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ccircle cx=\"430\" cy=\"357\" r=\"7\" fill=\"#64d8c4\"/\u003e\u003ctext x=\"535\" y=\"240\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eманифест\u003c/text\u003e\u003ctext x=\"535\" y=\"280\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eвыбор качества\u003c/text\u003e\u003ctext x=\"30\" y=\"425\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eНеизменяемые сегменты; доступ проверяется и на границе CDN\u003c/text\u003e","caption":"Каждая горизонтальная линия представляет вариант качества, точки — последовательные сегменты. Манифест позволяет плееру выбирать вариант. CDN кэширует неизменяемые байты; авторизация и cache key должны сохранять приватность независимо от попадания в кэш."}],"decision":{"prompt":"Как запустить загрузку доказательств?","options":[{"title":"Проксировать через API заказа","consequence":"Проще единая точка авторизации для маленьких файлов","tradeoff":"Долгие соединения и трафик конкурируют с заказами"},{"title":"Прямой multipart с серверной сессией и карантином","consequence":"Повтор частей и независимый путь байтов","tradeoff":"Нужны проверка завершения, уборка и согласование метаданных"},{"title":"Готовый управляемый медиасервис","consequence":"Быстро появляются обработка и воспроизведение","tradeoff":"Стоимость, интеграция прав, локализация и зависимость от провайдера"}],"recommended":1,"explanation":"Для приватных коротких доказательств достаточно контролируемого object-storage конвейера; сложный live можно вынести в управляемый сервис отдельно."},"exercise":{"prompt":"Что делать при падении после создания превью, но до записи ready?","model":"\u003cp\u003eПовтор задачи ищет выход по исходнику и версии конвейера, проверяет его и завершает условный переход. Не создаёт второй объект с новым случайным ключом на каждой попытке.\u003c/p\u003e","rubric":["Есть устойчивый ключ результата","Разделены файл и метаданные","Переход идемпотентен"]},"checkpoint":[{"question":"Почему ETag нельзя всегда считать MD5 файла?","options":["Он имеет зависящую от режима семантику, особенно при multipart","Потому что любой checksum бесполезен","Потому что объектное хранилище не хранит байты"],"answer":0,"explanation":"Нужно использовать документированную проверку целостности выбранного режима."},{"question":"Что подтверждает HTTP 200 на live-манифесте?","options":["Отсутствие зависаний у всех зрителей","Только успешное получение данного ответа, не качество воспроизведения","Гарантированную запись всего эфира"],"answer":1,"explanation":"Пользовательский результат измеряется отдельно от успешности одного ресурса."}],"sources":[{"title":"Amazon S3: Multipart upload overview","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html"},{"title":"Amazon S3: Checking object integrity","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html"},{"title":"Amazon CloudFront: Serving video","url":"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/on-demand-video.html"},{"title":"RFC 8216: HTTP Live Streaming, 2017","url":"https://www.rfc-editor.org/rfc/rfc8216"},{"title":"Алексей Шпагин, VK: Технологии в основе VK Видео, 24 февраля 2026","url":"https://habr.com/ru/companies/vk/articles/1000000/"}],"wordCount":1594},{"id":"ch-24","arc":6,"title":"Компания стала платформой для других: граница арендатора","briefing":"Партнёры хотят собственные кабинеты, документы и правила согласования поверх доставки. «Северный маршрут» превращает внутренний продукт в SaaS. Теперь ошибочное чтение чужой строки опаснее медленного запроса.","goals":["Tenant — единица изоляции, а не просто клиент","Три модели размещения и их цена","Noisy neighbor и квоты"],"sections":[{"title":"Tenant — единица изоляции, а не просто клиент","html":"\u003cp\u003eSoftware as a service, SaaS, предоставляет программный продукт как управляемый сервис нескольким организациям. Tenant, арендатор, — область данных, настроек, квот и административных полномочий. Пользователь может состоять в нескольких организациях с разными ролями. Поэтому user_id не заменяет tenant_id, а выбранная организация не должна браться из произвольного поля запроса без проверки членства.\u003c/p\u003e\u003cp\u003eКонтекст арендатора устанавливается после аутентификации и проходит через API, фоновые задачи, поиск, кэш, объекты и аудит. Частая ошибка — хорошо защитить основную таблицу, но забыть, что ключ кэша содержит только order_id или что экспорт запускается фоновым работником без области клиента. Изоляция должна сохраняться и в побочных путях. Прямой доступ по идентификатору всегда проверяет право на объект, даже если список до этого был отфильтрован.\u003c/p\u003e\u003cp\u003eОтдельно различаются control plane, управляющий контур, и data plane, контур пользовательских данных. Первый создаёт арендатора, назначает тариф и конфигурацию; второй выполняет его заказы и процессы. Компрометация управляющего контура может затронуть много клиентов сразу, поэтому его полномочия и доступ к данным не следует делать неограниченными по удобству. Платформа начинается с явных областей власти, а не со смены логотипа в интерфейсе.\u003c/p\u003e"},{"title":"Три модели размещения и их цена","html":"\u003cp\u003eОбщая схема с tenant_id в каждой строке экономно использует ресурсы и упрощает массовые обновления, но требует надёжной изоляции запросов. Отдельная схема или база на арендатора упрощает часть операций экспорта и восстановления, но умножает миграции, соединения и эксплуатационные объекты. Отдельный кластер даёт сильнее изоляцию ресурсов и вариантов размещения, однако дороже и сложнее управляется. Ни одна модель автоматически не доказывает отсутствие утечки через приложение.\u003c/p\u003e\u003cp\u003ePostgreSQL row-level security, RLS, позволяет применять политики доступа к строкам. Это дополнительная защита, если роль приложения и контекст настроены корректно. Владелец таблицы обычно обходит политики, а superuser и роли BYPASSRLS имеют особые полномочия; FORCE ROW LEVEL SECURITY меняет поведение владельца, но не превращает всесильную роль в безопасную. Пул соединений требует особенно аккуратного сброса контекста между запросами разных арендаторов.\u003c/p\u003e\u003cp\u003eВнешние ключи и уникальность часто должны включать tenant_id, чтобы ссылка не связывала чужой объект, а номер документа был уникален в нужной области. При этом ошибки ограничений могут раскрывать информацию о существовании чужих данных. Изоляция — свойство полного пути запроса и ответов, поэтому её проверяют отрицательными сценариями, а не только успешной загрузкой своего кабинета.\u003c/p\u003e"},{"title":"Noisy neighbor и квоты","html":"\u003cp\u003eNoisy neighbor, шумный сосед, возникает, когда один арендатор занимает общий ресурс и ухудшает работу остальных. Это может быть CPU, соединения БД, очередь экспорта, место объектов, транскодирование или квота внешнего API. Общий лимит сервиса защищает инфраструктуру, но не гарантирует справедливость: крупный клиент может занять его целиком. Нужны квоты и планировщик, который учитывает классы работ и арендаторов.\u003c/p\u003e\u003cp\u003eRate limit ограничивает скорость запросов, concurrency limit — число одновременно выполняющихся работ, storage quota — накопленный объём. Эти ограничения не взаимозаменяемы: десять тяжёлых экспортов в минуту могут быть опаснее тысячи коротких чтений. Для фоновых задач полезны отдельные очереди или взвешенное распределение мощности. Большому клиенту можно выделить отдельный пул, сохранив общий контракт продукта.\u003c/p\u003e\u003cp\u003eОбещание тарифа должно соответствовать измеряемой единице: заказы, активные пользователи, хранение или вычислительные минуты. Если дорогое видео не учитывается в цене, один необычный клиент разрушит экономику общего сервиса. Но отключать уже принятые важные процессы при достижении счётчика тоже нельзя молча: правила ограничения, уведомления и завершения принятых обязательств определяются заранее. Архитектура выполняет договор, который продукт способен объяснить.\u003c/p\u003e"},{"title":"Workflow хранит процесс дольше запроса","html":"\u003cp\u003eПартнёр хочет согласование претензии: оператор загрузил документ, руководитель утвердил, финансист разрешил возврат. Workflow, рабочий процесс, — длительная последовательность состояний, событий и ожиданий. Он не является длинной открытой SQL-транзакцией. Система сохраняет состояние, ожидает человека или таймер и продолжает с устойчивого шага. Каждый переход проверяет текущую версию процесса и полномочие участника.\u003c/p\u003e\u003cp\u003eНастраиваемость лучше начинать с ограниченных правил: допустимые роли, пороги сумм, сроки и наборы переходов. Произвольные клиентские скрипты расширяют поверхность отказа и безопасности, требуют песочницы, квот и управления версиями. Универсальный BPM-движок может быть оправдан, но сам не создаёт корректный бизнес-процесс. Два одновременно нажатых утверждения должны иметь определённый результат, а не зависеть от скорости браузеров.\u003c/p\u003e\u003cp\u003eИзменение шаблона не должно незаметно менять смысл уже запущенных согласований. Экземпляр привязан к версии определения. Миграция активных процессов — отдельная операция с правилами для незавершённых шагов. Возврат денег остаётся идемпотентной внешней командой: отмена workflow не откатывает автоматически то, что уже выполнено платёжным провайдером. Здесь возвращаются границы саги из предыдущей арки.\u003c/p\u003e"},{"title":"Документы, аудит и восстановление одного клиента","html":"\u003cp\u003eДокумент имеет бизнес-идентичность и версии содержимого. В БД хранятся метаданные, авторство, состояние утверждения и ссылка на неизменяемый объект. Подпись или утверждение относится к конкретной версии и её содержимому, а не к изменяемой ссылке «последний файл». Предпросмотр и распознавание текста создают производные данные с теми же правилами изоляции и удаления.\u003c/p\u003e\u003cp\u003eАудит отвечает, кто, в чьей области и на каком основании изменил состояние. Полезны actor, tenant, действие, объект, версия, время, correlation_id и результат. Обычный debug-log не заменяет аудит: он может быть выборочным, содержать секреты и быстро удаляться. Требуемая неизменяемость зависит от модели угроз. Если администратор может переписать и данные, и аудит, утверждение «запись невозможно подменить» ложно без независимых мер контроля.\u003c/p\u003e\u003cp\u003eВосстановить одного клиента из общей резервной копии сложнее, чем восстановить весь кластер. Нельзя откатить общую БД на вчера и потерять новые заказы остальных. Нужны изолированное восстановление копии, выборка данных нужного арендатора, согласование ссылок, объектов и событий, затем контролируемый импорт. Экспорт и удаление клиента тоже проходят по всем проекциям, а не только по главной таблице. Эти операции следует спроектировать до первого обещания индивидуального восстановления.\u003c/p\u003e"},{"title":"Проверка изоляции как предметного свойства","html":"\u003cp\u003eСамый полезный тест арендаторов использует два клиента с намеренно совпадающими локальными идентификаторами, одинаковыми именами файлов и разными правами. Проверяют чтение, изменение, поиск, экспорт, уведомления и восстановление через одного и того же работника пула. Такой сценарий быстро обнаруживает места, где разработчик считал идентификатор глобальным или забыл очистить контекст соединения. Положительный тест одного клиента этих ошибок не показывает.\u003c/p\u003e\u003cp\u003eДля административной поддержки предусматривают ограниченное делегирование. Сотруднику платформы может понадобиться посмотреть состояние процесса без права скачать содержимое документа. Временное расширение доступа имеет основание, срок и аудит. Общий пароль администратора разрушает возможность объяснить, кто именно выполнил действие. Автоматические сервисные аккаунты также получают минимальный набор операций, а не универсальное право действовать от имени любого клиента.\u003c/p\u003e\u003cp\u003eУдаление арендатора проходит этапы: запрет новых операций, завершение или отмена активных процессов по правилам, экспорт при необходимости, очистка проекций и объектов, обработка резервных копий согласно политике. Немедленно переписать все исторические резервные копии иногда технически невозможно; тогда договор должен честно описывать срок их истечения и защиту от повторного появления удалённых данных после восстановления. Tombstone или реестр удалений может применяться при восстановлении перед открытием доступа.\u003c/p\u003e\u003cp\u003eКлючевая идея — изоляция не является одной настройкой. Она выражается набором инвариантов, которые сохраняются при обычном запросе, повторе, фоновой обработке и аварии. Именно эти инварианты затем переходят в контракт платформы, документацию эксплуатации и архитектурный обзор, а не остаются устной договорённостью небольшой команды.\u003c/p\u003e"}],"workedExample":{"title":"Два клиента и общий номер претензии","html":"\u003cp\u003eВ учебной платформе организации «СеверТорг» и «Ладога» обе используют номер претензии 1042. Разработчик делает кэш по ключу claim:1042, и ответ первой организации получает вторая. SQL при этом был правильно отфильтрован. Исправление включает tenant_id в ключ, проверку прав при чтении, безопасную инвалидацию старых записей и тест двух одновременных организаций. Это пример сквозной изоляции, которую нельзя поручить одному RLS.\u003c/p\u003e\u003cp\u003eДля 400 небольших арендаторов команда оставляет общую схему с составными ключами и ограниченными ролями. Два крупных клиента получают отдельные рабочие пулы для экспорта. Отдельные базы пока не нужны, но каталог размещения проектируется так, чтобы позже перенести выбранного арендатора без изменения публичных идентификаторов. Квоты учитывают одновременно выполняющиеся выгрузки и объём медиа, а не только число HTTP-запросов.\u003c/p\u003e\u003cp\u003eШаблон претензии версии 3 требует руководителя при сумме выше 50 тысяч рублей. Пока процесс ждёт, клиент публикует версию 4 с порогом 30 тысяч. Уже запущенный экземпляр остаётся на версии 3, если нет явно утверждённой миграции. При нажатии «утвердить» сервер проверяет tenant, роль, версию документа и ожидаемую версию состояния. Второй параллельный запрос получает уже зафиксированный результат либо конфликт версии; он не создаёт второй возврат.\u003c/p\u003e\u003cp\u003eАудит связывает согласование с документом digest D и платёжной операцией refund-731. Если документ заменили, прежнее утверждение не переносится автоматически на новые байты. При запросе восстановления одной организации команда поднимает резервную копию в изолированном окружении и сверяет связи документов, процессов и объектов. Прежде чем открыть импорт, она решает судьбу внешних возвратов, уже выполненных после точки копии. Восстановление строк не должно повторить деньги. Так SaaS объединяет ранее изученные темы: области ключей, неизменяемые объекты, длительные процессы и сверку необратимых эффектов.\u003c/p\u003e"},"expedition":{"world":"saas","title":"CRM, документооборот и медицинская сеть","html":"\u003cp\u003eВ CRM общая схема может хорошо обслуживать тысячи небольших компаний с похожими карточками и полями. Главные риски — утечка контактов, шумный сосед и слишком свободная настройка. В системе документооборота к этому добавляются версии, сроки хранения и доказательство утверждения. Одинаковый tenant_id не делает эти продукты одинаковыми: предметные инварианты различаются.\u003c/p\u003e\u003cp\u003eМедицинская сеть может потребовать особое размещение данных, ограничение административного доступа и разделение полномочий между филиалами. Тогда отдельный контур арендатора бывает оправдан даже при малой нагрузке. Выбор определяется требованиями к данным и эксплуатации, а не только числом строк. Конкретные юридические требования зависят от юрисдикции и должны проверяться отдельно; этот пример показывает инженерную форму ограничения, не задаёт норм права.\u003c/p\u003e\u003cp\u003eДля «Северного маршрута» полезна гибридная модель: общий продукт и управляющий контур, но возможность выделить ресурсы или хранилище отдельному клиенту. Цена гибкости — единый каталог размещения, автоматизированные миграции и отсутствие предположения, что все tenant живут в одной базе. Переносится сквозная идентичность и версия процесса. Новое — договор между организацией и платформой: кто администрирует, кто видит аудит, как экспортируются данные и какие функции доступны при аварии общего управляющего контура.\u003c/p\u003e","transfer":["Проводить tenant-контекст через все проекции","Версионировать определения и утверждённые документы"],"distinct":["Отраслевые ограничения могут потребовать выделения даже без большого объёма"]},"diagrams":[{"title":"Изоляция — сквозное свойство","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003ctext x=\"30\" y=\"40\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eTenant-контекст проходит через все проекции\u003c/text\u003e\u003crect x=\"280\" y=\"70\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"109.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eAPI: tenant + role\u003c/text\u003e\u003crect x=\"30\" y=\"250\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"292.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eБД + RLS\u003c/text\u003e\u003cpath d=\"M380 135 L130 250\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"280\" y=\"250\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"294\" y=\"292.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eКэш\u003c/text\u003e\u003cpath d=\"M380 135 L380 250\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"530\" y=\"250\" width=\"200\" height=\"70\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"292.0\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eПоиск / объекты\u003c/text\u003e\u003cpath d=\"M380 135 L630 250\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"30\" y=\"380\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eСоставной ключ: tenant_id + локальный идентификатор\u003c/text\u003e\u003ctext x=\"30\" y=\"425\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"18\"\u003eФоновые задачи и экспорт проверяют ту же область\u003c/text\u003e","caption":"Проверенный tenant-контекст передаётся из API в БД, кэш, поиск и объекты. Политика RLS защищает строки только внутри БД; она не защищает забытый tenant_id в ключе кэша или фоновом экспорте. Идентификатор клиента из запроса не считается доверенным сам по себе."},{"title":"Версия процесса, документа и возврата","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" fill=\"#101d2c\"/\u003e\u003crect x=\"30\" y=\"60\" width=\"210\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"99.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eШаблон v3\u003c/text\u003e\u003crect x=\"285\" y=\"60\" width=\"210\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"299\" y=\"99.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eЭкземпляр #731\u003c/text\u003e\u003cpath d=\"M240 93 L285 93\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"530\" y=\"60\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"99.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eДокумент D\u003c/text\u003e\u003cpath d=\"M495 93 L530 93\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"30\" y=\"260\" width=\"210\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"44\" y=\"299.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eШаблон v4\u003c/text\u003e\u003cpath d=\"M135 125 L135 260\" fill=\"none\" stroke=\"#f5c677\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/\u003e\u003crect x=\"285\" y=\"260\" width=\"210\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"299\" y=\"299.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eУтверждение v3\u003c/text\u003e\u003cpath d=\"M390 125 L390 260\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003crect x=\"530\" y=\"260\" width=\"200\" height=\"65\" rx=\"12\" fill=\"#203950\" stroke=\"#82b7d6\" stroke-width=\"2\"/\u003e\u003ctext x=\"544\" y=\"299.5\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003erefund-731\u003c/text\u003e\u003cpath d=\"M495 293 L530 293\" fill=\"none\" stroke=\"#64d8c4\" stroke-width=\"3\"/\u003e\u003ctext x=\"30\" y=\"390\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"19\"\u003eНовый шаблон не переписывает активный процесс\u003c/text\u003e\u003ctext x=\"30\" y=\"430\" fill=\"#e8eef8\" font-family=\"sans-serif\" font-size=\"17\"\u003eУтверждение связано с точной версией документа и эффектом\u003c/text\u003e","caption":"Активный экземпляр привязан к шаблону v3 и конкретному содержимому документа D. Появление v4 не меняет этот экземпляр автоматически. Утверждение запускает идемпотентный возврат refund-731; восстановление процесса не должно повторять внешний денежный эффект."}],"decision":{"prompt":"Как разместить первых B2B-арендаторов?","options":[{"title":"Общая схема с RLS и составными ключами","consequence":"Экономный старт и единые обновления","tradeoff":"Нужны строгие роли, контекст, тесты изоляции и план восстановления одного клиента"},{"title":"Отдельная база каждому","consequence":"Удобнее часть операций экспорта и изоляции","tradeoff":"Много миграций, соединений и затрат сопровождения"},{"title":"Общая модель плюс выделение крупных клиентов","consequence":"Можно сочетать экономию и изоляцию нагрузки","tradeoff":"Каталог размещения и автоматизация сложнее"}],"recommended":0,"explanation":"При 400 похожих небольших клиентах общая схема оправдана, если её изоляция сквозная; выделенные пулы не требуют немедленно выделять каждому БД."},"exercise":{"prompt":"Назовите четыре места, где забытый tenant_id приводит к утечке.","model":"\u003cp\u003eКлюч кэша, фильтр поискового индекса, фоновый экспорт и путь авторизации объекта. Также проверяем аудит, составные ссылки, соединения в пуле и адресатов уведомлений.\u003c/p\u003e","rubric":["Есть слои вне SQL","Tenant проверяется, а не доверяется клиенту","Есть фоновые операции"]},"checkpoint":[{"question":"Изменился шаблон согласования. Что делать с активным экземпляром?","options":["Молча применить новые правила ко всем","Сохранить версию или выполнить явную управляемую миграцию","Удалить историю процесса"],"answer":1,"explanation":"Иначе смысл уже принятых решений меняется задним числом."},{"question":"Гарантирует ли RLS изоляцию кэша?","options":["Да, любая запись автоматически защищена политикой БД","Нет, кэш и фоновые пути требуют собственного tenant-контекста и проверки прав","Да, если ключ короткий"],"answer":1,"explanation":"Политика строк применяется внутри БД, а не к любому производному хранилищу."}],"sources":[{"title":"PostgreSQL 18: Row Security Policies","url":"https://www.postgresql.org/docs/18/ddl-rowsecurity.html"},{"title":"AWS SaaS Lens: Tenant isolation","url":"https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/tenant-isolation.html"},{"title":"Temporal: Workflow execution","url":"https://docs.temporal.io/workflow-execution"}],"wordCount":1515},{"id":"ch-25","arc":7,"title":"Предсказать опоздание: модель входит в живую систему","briefing":"После главы о SaaS у «Северного маршрута» есть изолированные данные арендаторов, журнал событий и аналитический контур. Диспетчер хочет заранее видеть риск опоздания, пока ещё можно помочь. Все числа и ситуации главы учебные.","goals":["Сначала определить момент решения","Из события получается обучающий пример","Один смысл признака в двух контурах","Оценка: разные ошибки стоят по-разному","Доставка модели и отказ без остановки заказов","Дрейф и ответственность после запуска"],"sections":[{"title":"Сначала определить момент решения","html":"\u003cp\u003eМашинное обучение, или ML, строит функцию по примерам, вместо того чтобы описывать каждый случай правилом. Для заказа входом могут быть очередь склада, расстояние, погода и возраст назначения, выходом — вероятность опоздания. Здесь модель не составляет маршрут и не подтверждает доставку: она оценивает риск для уже существующего процесса. Архитектурный вопрос начинается с момента применения. Предсказание при создании заказа и предсказание через пять минут после назначения курьера имеют разные доступные сведения, разные сроки полезности и разные целевые переменные.\u003c/p\u003e\u003cp\u003eКоманда выбирает задачу: каждые пять минут среди ещё не завершённых заказов находить те, которые прибудут более чем на пятнадцать минут позже обещанного конца интервала. Диспетчер может связаться со складом или клиентом. Если до конца интервала осталось тридцать секунд, точное предупреждение почти бесполезно. Поэтому качество оценивают вместе с временем упреждения. Изменение обещанного интервала после предупреждения не должно автоматически превращать вчерашнее опоздание в своевременную доставку: исходное обещание сохраняют отдельно.\u003c/p\u003e\u003cp\u003eПеред сложной моделью создают базовую линию: предупреждать, если оставшегося времени меньше расчётного времени пути плюс очередь склада. Она дешёвая, объяснимая и задаёт нижнюю границу полезности. Если новый ML улучшает только красивую метрику, но не решение диспетчера, внедрение пока не оправдано.\u003c/p\u003e"},{"title":"Из события получается обучающий пример","html":"\u003cp\u003eПризнак — измеримая характеристика, доступная в момент предсказания. Метка — позднее известный исход, с которым сравнивают предсказание. Для строки на 12:00 меткой станет факт доставки, возникший, например, в 13:20. Ошибка возникает, если при подготовке данных взять последнюю запись заказа, где уже заполнены фактическое время прибытия и финальный склад. Такая утечка будущего делает проверку убедительной, но неповторимой в работе.\u003c/p\u003e\u003cp\u003eНужна сборка «как было известно тогда». У событий хранят время бизнес-события и время появления в системе. При запоздалой телеметрии это разные часы. Если координата курьера относится к 11:59, но поступила в 12:03, онлайн-предсказание на 12:00 её не знало. Учебная выборка должна воспроизвести доступность, иначе снова возникнет утечка. Для воспроизводимости сохраняют версии SQL, словарей и срезов данных, правила исключения отменённых заказов и определение исходного обещания.\u003c/p\u003e\u003cp\u003eРазделение train, validation и test делают по времени: учатся на прошлом, выбирают параметры на следующем окне, проверяют один раз на более позднем. Случайное разбиение строк одного заказа между частями создаёт скрытое знакомство с исходом. Для нового региона добавляют отдельную проверку переноса: календарное разделение само по себе не доказывает качество там, где прежде не было данных.\u003c/p\u003e"},{"title":"Один смысл признака в двух контурах","html":"\u003cp\u003eОбучение обычно читает большие исторические таблицы, а обслуживание предсказаний — небольшие свежие значения. Различие между ними называют training/serving skew: модель училась на одном определении, а получила другое. Например, историческая «длина очереди» включает отменённые задания, онлайн-счётчик исключает их. Даже одинаковое имя поля не обеспечивает одинаковую семантику. Контракт признака задаёт единицу, окно, обработку пропусков, допустимый возраст, источник и версию вычисления.\u003c/p\u003e\u003cp\u003eДля «числа назначений склада за последние тридцать минут» важны границы окна, часовой пояс, дедупликация и задержка событий. Счётчик можно обновлять из потока, но восстановление после сбоя должно дать тот же результат, что повторная обработка исходных событий. Иначе новая версия онлайн-хранилища изменит предсказания без изменения модели. Команда тестирует несколько эталонных временных историй двумя реализациями и сравнивает значения.\u003c/p\u003e\u003cp\u003eFeature store — управляемое хранилище признаков — помогает организовать определения и выдачу, однако не исправляет неверный смысл автоматически. Небольшой системе достаточно таблицы свежих агрегатов и версионируемого общего кода. У каждого ответа модели записывают версию признаков, возраст входов и причину запасного режима. Отсутствующая координата не превращается молча в нулевое расстояние: такое значение выглядит уверенным и систематически занижает риск.\u003c/p\u003e"},{"title":"Оценка: разные ошибки стоят по-разному","html":"\u003cp\u003eПусть положительный класс означает опоздание. Precision показывает долю настоящих опозданий среди предупреждений, recall — долю обнаруженных опозданий среди всех фактических. Повышение порога обычно уменьшает количество предупреждений и меняет обе величины. Accuracy неудобна при редких опозданиях: предсказание «всё вовремя» выглядит хорошим, оставляя диспетчера без помощи. Нужна также калибровка: среди заказов с оценкой 0,7 примерно семь из десяти должны опоздать на сопоставимом распределении.\u003c/p\u003e\u003cp\u003eМетрики считают отдельно по региону, складу, типу доставки, новым курьерам, времени суток и доступности координат. Общий результат может улучшиться благодаря крупному спокойному региону, скрыв ухудшение небольшого сложного. Для каждого сегмента показывают размер выборки и интервал неопределённости; три успешных примера не подтверждают надёжность. Сегментация не означает разрешение использовать чувствительные сведения: доступность данных и допустимость их применения рассматривают отдельно.\u003c/p\u003e\u003cp\u003eПредсказание не равно причинному эффекту. Если после предупреждения диспетчер спас заказ, первоначально верное предупреждение получит отрицательную метку. Полезность системы проверяют контролируемым пилотом: сравнивают сопоставимые группы с заранее оговорёнными ограничениями, нагрузкой на людей и показателями доставки. Нельзя объявлять экономию, просто умножив число предупреждений на условную цену опоздания. Сначала нужно измерить, какие действия действительно изменили исход.\u003c/p\u003e"},{"title":"Доставка модели и отказ без остановки заказов","html":"\u003cp\u003eОбучение создаёт артефакт: параметры модели, преобразования входов, описание данных и результаты оценки. Реестр моделей связывает эти части с версией кода. Выпуск новой версии проходит теневой режим: старая версия влияет на экран, новая считает рядом без воздействия. Затем небольшой поток получает новую модель; по каждой группе сравнивают задержку, ошибки, нагрузку диспетчера и позднее качество. Теневое сравнение не заменяет оценку поведения пользователей, потому что они ещё не видели новые подсказки.\u003c/p\u003e\u003cp\u003eСинхронный вызов на критическом пути оформления заказа добавил бы зависимость от ML. В нашей задаче результат может обновляться фоном. API заказа не ждёт обучения и не перестаёт принимать заказы, когда прогноз недоступен. При превышении срока свежести интерфейс показывает «прогноз устарел», а диспетчер использует базовое правило. Таймаут ограничивает расход ресурсов; повторный вызов не должен вызывать лавину при деградации вычислителей.\u003c/p\u003e\u003cp\u003eОткат требует совместимости модели с контрактом признаков. Вернуть старый файл недостаточно, если вчера удалили нужный ему вход. Поэтому некоторое время поддерживают обе версии признаков и проверяют запасную модель на текущих данных. На предсказании хранят идентификатор версии и время вычисления, чтобы позднее сопоставить ошибку не с сегодняшней системой, а с реально работавшей.\u003c/p\u003e"},{"title":"Дрейф и ответственность после запуска","html":"\u003cp\u003eДрейф данных означает изменение распределения входов: например, выросла доля заказов без координат. Дрейф связи признаков с исходом означает, что прежние зависимости перестали работать: новый склад обрабатывает очередь иначе. Первый можно увидеть быстро, второй требует достоверных меток. Рост среднего расстояния ещё не доказывает ухудшение модели. Сигнал мониторинга запускает исследование, а не автоматическое переобучение и выпуск.\u003c/p\u003e\u003cp\u003eНаблюдение разделяют на здоровье сервиса, качество данных, качество прогноза и бизнес-эффект. Сервис может отвечать быстро, получая пустые признаки. Модель может оставаться точной, но перегружать диспетчера предупреждениями. Метки приходят с задержкой, поэтому на панели есть дата последней достаточно полной когорты. Неполные исходы текущего часа нельзя напрямую сравнивать с завершённой вчерашней сменой.\u003c/p\u003e\u003cp\u003eНазначают владельца определения опоздания, владельца источников и человека, принимающего выпуск. При инциденте сохраняют обезличенный воспроизводимый пример и останавливают воздействие, если нет уверенности в качестве. Персональные координаты не нужны каждому исследователю: агрегация и ограниченный доступ сокращают риск. ML-контур становится ещё одним продуктовым компонентом со сроками хранения и процедурами удаления, а не исключением из правил данных.\u003c/p\u003e"}],"workedExample":{"title":"Двести предупреждений и ограниченная смена","html":"\u003cp\u003eНа учебной неделе проверено 10 000 завершённых заказов, из них 1 000 опоздали. При пороге 0,4 модель выдала 1 600 предупреждений, 700 оказались настоящими опозданиями. Precision равна 700 / 1 600, то есть 43,75%, recall — 70%. При пороге 0,7 она выдала 600 предупреждений и обнаружила 420 опозданий: precision 70%, recall 42%. Второй вариант не является безусловно лучшим: он оставляет больше опозданий незамеченными.\u003c/p\u003e\u003cp\u003eДиспетчерская способна содержательно проверить 120 предупреждений в день. За семь дней первая настройка требует около 229 проверок в день, вторая — около 86. Простой высокий порог укладывается в ресурс, однако в регионе с нестабильной связью оценки систематически ниже. Команда сравнивает сегменты: у заказов со свежей координатой recall 55%, у остальных 18%. Нельзя прикрыть эту разницу общей цифрой. Для второго сегмента включают отдельное простое правило и маркируют недостаток данных.\u003c/p\u003e\u003cp\u003eЗатем проверяют упреждение. Из 420 обнаруженных случаев 150 предупреждены менее чем за две минуты до конца интервала; диспетчер обычно не успевает вмешаться. Практический охват ограничивается 270 случаями, хотя формальный recall остаётся прежним. Меняют момент вычисления и цель пилота: интересуют предупреждения минимум за пятнадцать минут, которые человек может обработать. Это приводит к другому выбору признаков и к отказу от поздних высокоточных сигналов как основного продукта.\u003c/p\u003e\u003cp\u003eВ пилоте часть сопоставимых смен получает подсказки. Автоматическое перераспределение заказов отключено, чтобы не смешивать эффект модели и новый алгоритм назначения. Записывают просмотр, действие и исход. Успешность определяют по доставке и нагрузке, отдельно учитывая отмены. Для аварии предусмотрена кнопка отключения подсказок, не затрагивающая приём заказов. Результат пилота может оправдать модель, оставить только базовое правило или показать, что прежде нужно исправить телеметрию.\u003c/p\u003e"},"expedition":{"world":"inventory","title":"Экспедиция: риск исчерпания запасов","html":"\u003cp\u003eВ аптечном складе ML предсказывает вероятность исчерпания позиции в ближайшие сутки. Из доставки переносится разделение момента прогноза и будущей метки. Продажи после полудня нельзя использовать в прогнозе, сделанном утром. Но появляется новая трудность: нулевые продажи после исчерпания не означают нулевой спрос. Наблюдение ограничено доступным запасом; модель, обученная без этой поправки, может считать самые дефицитные товары невостребованными.\u003c/p\u003e\u003cp\u003eКоманда начинает с прозрачного правила запаса на средний спрос и срок пополнения. Модель используется для ранжирования проверки закупщиком. Оценку разделяют по сезонным товарам, новым позициям и поставщикам с разными сроками доставки. Метрика ошибки прогноза количества дополняется долей реально предотвращённых дефицитов, но причинный эффект требует пилота: закупка сама меняет будущую доступность. Необработанные рекомендации не равны потерянной выручке.\u003c/p\u003e\u003cp\u003eГлавное отличие — действие расходует деньги и может создать избыток товара с ограниченным сроком годности. Поэтому прогноз не отправляет заказ поставщику напрямую. Детерминированные ограничения проверяют бюджет, минимальную партию, срок годности и разрешённого поставщика, а человек утверждает закупку в рамках полномочий. При недоступности модели остаётся базовая политика. Архитектор переносит жизненный цикл и дисциплину данных, но заново определяет метку, цену ошибки и допустимый автоматизм.\u003c/p\u003e","transfer":["Временная доступность признаков","Раздельная оценка качества и воздействия"],"distinct":["Наблюдаемый спрос ограничен наличием","Рекомендация может создавать запас и расходы"]},"diagrams":[{"title":"Два контура и одна семантика признаков","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" rx=\"16\" fill=\"#081b2b\"/\u003e\u003crect x=\"40\" y=\"65\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"185.0\" y=\"106.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eСобытия заказов\u003c/text\u003e\u003crect x=\"430\" y=\"65\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"575.0\" y=\"106.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eИсторический срез\u003c/text\u003e\u003crect x=\"40\" y=\"285\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"185.0\" y=\"326.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eСвежие признаки\u003c/text\u003e\u003crect x=\"430\" y=\"285\" width=\"290\" height=\"70\" rx=\"12\" fill=\"#14324b\" stroke=\"#60a5fa\" stroke-width=\"2\"/\u003e\u003ctext x=\"575.0\" y=\"326.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"19\" fill=\"#dbeafe\"\u003eМодель и диспетчер\u003c/text\u003e\u003cpath d=\"M330 100 L430 100\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"430,100 420.3,105.3 420.3,94.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"90.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eсрез во времени\u003c/text\u003e\u003cpath d=\"M185 135 L185 285\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"185,285 179.7,275.3 190.3,275.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"185.0\" y=\"200.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eагрегация\u003c/text\u003e\u003cpath d=\"M575 135 L575 285\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"575,285 569.7,275.3 580.3,275.3\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"575.0\" y=\"200.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eобучение\u003c/text\u003e\u003cpath d=\"M330 320 L430 320\" stroke=\"#67e8f9\" stroke-width=\"2\" fill=\"none\"/\u003e\u003cpolygon points=\"430,320 420.3,325.3 420.3,314.7\" fill=\"#67e8f9\"/\u003e\u003ctext x=\"380.0\" y=\"310.0\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#dbeafe\"\u003eвыдача\u003c/text\u003e\u003ctext x=\"380\" y=\"430\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"17\" fill=\"#dbeafe\"\u003eОформление не ждёт прогноза\u003c/text\u003e","caption":"Топология показывает отдельные пути обучения и обслуживания. Они обязаны разделять смысл признаков, но не обязательно одно физическое хранилище. Недоступность прогноза не останавливает запись заказа."},{"title":"Что было известно в 12:00","viewBox":"0 0 760 460","svg":"\u003crect width=\"760\" height=\"460\" rx=\"16\" fill=\"#081b2b\"/\u003e\u003crect x=\"40.0\" y=\"65\" width=\"166.0\" height=\"55\"
